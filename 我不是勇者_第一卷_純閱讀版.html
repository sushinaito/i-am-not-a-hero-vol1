有半條魔力迴路可以被共鳴的「空值」軒人能夠下去。可此刻底下的傳動大輪正在失控暴走，震得整根主樑與檢修平台劇烈顫抖，金屬結構發出令人牙酸的哀鳴。人若是懸吊在晃動不止的鐵架下方作業，只要平台再猛地偏移一點，身體便會直接被捲進輪軸裡。\n\n軒人剛抓起腰後的絕緣長撬棍，身旁的真崎夜一已向前踏出一步。他扯下左手的黑皮手套塞進口袋，單膝重重跪落於檢修平台邊緣那片厚實的真實陰影裡。\n\n「下面輪子轉得太快，我抓不住拉桿。」夜一抬起灰色的雙眼，語速冷靜而極快，「但我可以把這段主樑跟平台釘死，給你三十秒不會亂晃的落點。你敢下去拔嗎？」\n\n軒人拍了拍腰帶兩側的雙重承重鐵環，掂了掂掌中微涼的絕緣長撬棍：\n\n「只要上面不亂晃，我敢。」\n\n「好。動作快，別讓我撐太久。」\n\n話音未落，夜一的左掌重重壓進了平台邊緣的陰影之中。\n\n嗡。\n\n濃得化不開的漆黑影釘自陰影裡驟然爆發，沿著真實鋼樑的輪廓疾射而出，宛如鐵鑄的暗楔般深深咬進震顫的主樑節點與平台支腳。劇烈顛簸的鐵架發出一聲沉悶的低響，原本不斷往西側滑移的狂暴震顫，竟在眨眼間被壓平了八成，窄台下方那根紅色拉桿的位置隨即穩了下來。\n\n夜一咬緊牙關，左手腕蒼白皮膚下的漆黑紋路繃得微微泛青，額角瞬間沁出一層冷汗，卻沒吐出半句多餘的字。\n\nEraser快步來到平台邊緣，借著燈光朝下迅速掃過拉桿根部的結構，抬頭朝軒人報出細節：\n\n「拉桿左邊有一片半圓形的生鏽鐵卡扣壓著。要先往上挑開卡扣，拉桿才能往外拔。」\n\n「記住了。挑開左邊卡扣，再往外拔。」\n\n軒人向岸上工程班打出俐落的手勢。四名工程隊員立刻合力拉緊繫在他腰帶兩側的雙重安全腰索。軒人沒有逞勇直接跳落，而是坐上平台邊緣，確認雙索已確實承接住全身重量、雙肘貼緊腰側避開受傷的右肩後，順著滑輪穩穩垂降到了主架下方。\n\n轟隆翻湧的黑色河水就在靴底兩公尺處咆哮。\n\n高速狂轉的巨型傳動大輪與粗鐵連桿幾乎擦著額角掠過，掀起的滾燙機油熱風撲面而來，嗆得鼻腔發辣，飛濺的細碎鐵屑打在臉頰上陣陣生疼。齒輪咬合與連桿撞擊的銳響就在耳膜邊炸開，連牙關都跟著微微發麻。四周足以令尋常術師與技師瞬間迴路逆流昏厥的高壓魔力亂流，穿過軒人沒有半條魔力迴路的「空值」軀體時卻無法激起絲毫共鳴；在這座狂暴的魔力風眼裡，他只會感受到物理上的熱風與震動，雙手依然能穩如磐石地握住絕緣長撬棍，準備挑開生鏽卡扣、拔出紅色離合拉桿並塞入最後一枚硬木楔。\n\n唯有頭頂的鋼樑穩若定錨，連一絲晃動也沒有。夜一正用盡全力替他死死釘住這短短三十秒的空間。\n\n軒人屏息盯死往復抽送的鐵連桿，在心底默數節拍。\n\n一拍、兩拍——\n\n就在粗壯連桿向下掠過凹槽、前方閃出窄窄空隙的那一瞬間，軒人手腕一送，將絕緣長撬棍的扁頭精準探進拉桿左側，雙手抵緊鐵架立柱找準支點，沉腰發力向上猛撬。\n\n鏗。\n\n鏽死在凹槽裡的半圓形鐵卡扣發出銳響，被撬棍強行頂開，向上跳起了一截。\n\n連桿的下一輪迴掃已在頭頂帶出破風聲。軒人不等氣息換完，左手順勢換握撬棍中段，將棍身卡入L形拉桿的彎折處，壓低腰身，將全身體重連同左臂力道一併向外猛推——受傷的右肩沒有勉強發力，全憑撬棍的槓桿與雙重腰索的張力向外施勁。\n\n咯吱——喀嚓、匡啷。\n\n沉重而清脆的齒輪脫鉤聲撕開了滾燙的熱風。\n\n紅色離合拉桿猛地向外滑出一整截。下一秒，整座主鐵架驀然一輕；底座下那組瘋狂拖曳鋼索的巨型傳動大輪徹底脫離咬合，在空洞的鐵腹中發出尖銳嘯聲，進入毫無阻力的空轉。壓在主樑、檢修平台與岸邊石墩上的駭人前衝拉力，瞬間卸得乾乾淨淨。\n\n軒人沒有急著喊人收繩。趁著身體還懸在觸手可及的高度，他立刻騰出左手，從腰袋裡摸出最後一枚硬木楔子——先前在備品室門外已經用掉兩枚，這是身上僅剩的最後一枚。\n\n他摸準方才挑開的鐵卡扣底部縫隙，將硬木楔子死死塞入卡緊，反手用撬棍尾端連敲兩下砸實，再順手抽下腰間短皮帶，繞著支架與拉桿紮了個緊密的死結，徹底封死拉桿因餘震彈回的可能。\n\n「拉桿拔到底了，卡扣也用最後一枚木楔卡死了。拉我上去。」\n\n岸上絞盤飛快轉動，穩穩將軒人拉回檢修平台。\n\n他靴底剛踏實鐵板，單膝跪在平台邊緣的夜一便立刻抽回了按進陰影裡的左手。那五根手指僵直失血，蒼白得彷彿剛從冰水裡抽出來一般，指節正抑制不住地細微發抖。夜一扶著膝蓋起身，眼神卻平靜無波，彷彿剛才承受的負荷與自己毫無干係，只是默不作聲地將凍得發青的左手插回外套口袋：\n\n「主樑已經不會再偏了。接下來的事，交給你們。」\n\n## ２\n\n趁著工程班進行最後一次鋼索覆檢的空檔，對岸的榊主任步上離河畔最近的高台，舉起傳聲器朝平台上的兩人開口：\n\n「不破軒人，Eraser。現在十三名受困者都已安全上岸，主架的傳動輪軸也已經卸開。你們此刻仍然可以選擇撤回岸上，改採原定的『外部炸藥切斷方案』。」\n\n軒人抬起頭，隔著翻湧的河水望向對岸的街區。\n\n暮色已經垂落。水街與灰鐵巷一帶的魔導路燈熄滅了大半，只有幾名留守的工程員正抱著厚木板加固堤防。隨著外圍三組卸除水閘供能，河道水位比一小時前明顯退落了不少。\n\n「如果現在改用炸藥切斷方案，水街和灰鐵巷那邊會怎麼樣？」軒人對著傳聲器問。\n\n榊主任沒有粉飾，聲音依然平直而務實：\n\n「人都不會有事。但為了確保支爐的殘留指令不再順著石造基座爬進城裡，我們必須把河堤內側連著蓄水廊的三排舊地基一併爆破。停水、封橋與居民安置的時間會拉長到半年以上，水街臨河的那兩排老房子也保不住。事後總站會負責重建，不會讓這條街的居民無家可歸——這是最壞情況下的底線。」\n\n軒人聽完，沒有代任何人下決定，只是側過頭看向身旁的Eraser。\n\nEraser沒有望向對岸的屋舍，也沒有因為眾人奔波了一整天就賭氣說非上不可。她先抬起自己的右手，五指緩緩張開又收攏，逐一確認每個指節的靈活度，接著低頭看了一眼領口那枚銀色五瓣花扣。\n\n中央的白珠依舊純白澄澈，早上改裝完成的獨立魔力環沒有半點發熱。\n\n「剛才等你們換支撐、拔離合拉桿的時候，我沒有動用能力，不算在九十秒裡面。」她抬起臉，平靜地對著傳聲器說，「我的右手現在很穩。只要主控鐵箱打開之後，裡面的線路跟舊圖冊上畫的一樣，我就能做完。」\n\n傳聲器裡傳來千歲的聲音：\n\n「記住，九十秒只是理論上限，不是叫妳非撐滿九十秒不可。打開箱子後先看能不能分成三段，每做完一段就停下來核對讀數。就算中途叫停退回來，也不算誰違約。」\n\n軒人也低頭看了看自己的雙手與雙腿。\n\n左手虎口雖纏著紗布，握緊扳手與壓下隔板扣柄的力道卻還綽綽有餘；右肩只要不去硬提重物就不會讓拉傷惡化；左膝蓋磨破了皮，蹲起依然俐落；靴跟裡還留著兩顆氣罐，而腰袋裡最後一枚硬木楔子，此刻正牢牢卡在腳下的離合拉桿裡。當他把能做的事與做不到的事一條條劃清界線之後，心頭反倒不再有昨日那股混濁的焦躁。\n\n「我可以走到主控鐵箱旁邊，能開蓋、能壓隔板。重物交給外面的滑輪吊，不讓右肩去扛。」軒人說。\n\nEraser輕輕點頭：「我想過去打開看看。如果裡面的接點跟圖紙不符，我們就馬上退回來。」\n\n對岸的榊主任沉默了兩秒，乾脆地應道：\n\n「批准。外圍撤離路線與救援艇原地待命。內外任何一組只要出現異常，我會立刻下令中止。」\n\n軒人重新挎起舊分離匣的寬背帶。Eraser走到他左手邊，伸出右手替他將微微歪斜的匣身扶正：\n\n「剛才螺絲只差半圈的時候，謝謝你馬上停下來了。」\n\n軒人望向那塊已被工程班重新校平的窄鐵台：「本來就該停。」\n\n「該停，還是可以說謝謝。」\n\n軒人有些不好意思地摸了摸鼻尖，將左肩的背帶往自己身側收緊些許，替她騰出更寬敞的落腳處。兩人並肩重新踏上主鐵架，走回主控鐵箱旁。\n\n## ３\n\n軒人先俯身往窄台下方看了一眼。方才塞進紅色離合拉桿鐵卡扣底部的最後一枚硬木楔子與短皮帶依舊咬得牢不可動，底下空轉的巨型輪軸沒有把半點拉扯傳上主架。\n\n確認無誤後，他這才直起身，用左手握住扳手，逐一卸下六角檢修小鐵蓋上剩餘的四顆螺絲。\n\nEraser站在他的左前方，以右手穩穩托住鬆脫的鐵蓋，免得它滑進底下的輪軸之間。\n\n小鐵蓋掀開的瞬間，箱內沒有刺眼強光，也沒有彈出任何險惡的機關。\n\n厚重的黑鐵腹腔內，整齊排列著三組古工坊制式的黃銅接點，左右兩側還掛著昔日供技師掃灰用的小銅刷；而在接點正中央的防潮厚玻璃罩裡，靜靜封存著一卷歷經三百年光澤暗沉、字跡與孔位卻依舊清晰可辨的黃銅打孔壓痕記錄帶。\n\n軒人舉起防風鯨油燈湊近玻璃罩。\n\n溫暖微黃的火光映上暗沉的銅面，清晰照出了三百年前幾名技師留下的層層壓痕：有人在最初的供暖區域代號上用力劃下兩道深槓，補壓了一行『西側地陷，管路中斷』；緊接著下方則刻著一列極為工整的字句：『支爐轉入最低維持功率，保留自動巡檢，待地面接應人員抵達後辦理停爐移交』。\n\n而在最末那格標著『移交簽收人』的方框裡，銅面平整光滑，半個字也沒有。\n\n記錄帶旁連著一枚仍靠微弱殘餘動力驅動的機械鋼印。就在兩人凝視玻璃罩的當下，那枚鋼印極輕微地「喀噠」落下了一次，在空白簽收格的邊緣又添上一道淺淺的新刻痕：**『交接未完成・維持運轉』**。\n\n整整三百年間，這枚盲目的鋼印就這樣日復一日地在黃銅帶上反覆落下，壓出同一句沒有回音的等待，等著一個再也沒走下台階的人。\n\n軒人望著那片空白的簽收欄，胸口無聲地沉了下去。\n\n「原來當年造這座爐子的人，並不是為了困住誰才設下不肯停機的指令。」軒人低聲道。\n\n「嗯。」Eraser隔著厚玻璃凝望那卷黯淡的黃銅帶，「他們知道外面的路斷了，只想把爐火留在不會炸開的最低出力，等上面的人下來交接。只是負責下來簽字的那個人，後來再也沒有回來過。」\n\n就像舊鐘塔底下那些無人領取的雨傘與八音盒一樣。\n\n有些東西遲遲不肯停下，並非懷著什麼毀滅世界的惡意，不過是三百年前的一場地陷，讓那個說好要回來關門的人迷了路。\n\n軒人從工具袋裡取出總站配發的感光留影板，貼近厚玻璃對準那段黃銅記錄帶按下快門，小心收進胸前的防水袋裡：\n\n「這段紀錄我們拍下來帶出去交給總站歸檔。至於還沒辦完的停爐交接——今天我們幫他辦完。」\n\n他將舊分離匣底部的卡扣牢牢鎖上窄台的實體鐵環，抽出匣內三條主長線，依照舊圖冊上的幾何標記，精準接入主控鐵箱內部的三組黃銅接點。\n\n舊分離匣立刻將箱內原本糾纏不清的迴路，清清楚楚地分理到三個獨立插槽裡：\n\n第一槽，是「管幻影的線」，連著整座車間裡所有的虛影與防衛機關；\n第二槽，是「連向城裡的管線」，通往水街與東石橋底下的舊石槽；\n最深處的第三槽，則是「底下不肯熄的主火種」，只要壓力驟降便會強行重新點火。\n\n「先把管幻影的線抹掉，周圍這些車間虛影和吊籃就會全部消失。」Eraser盯著三個插槽說，「我們腳下踩著的主鐵架是真的，但旁邊那些半透明的鐵板就都不能再碰了。」\n\n「接著切斷連向城裡的管線，最後徹底熄滅底下不肯熄的主火種。」軒人左手握緊舊分離匣側面的三枚精鋼隔板扣柄，低頭再次確認她胸前短導線的快拆扣，「有這座幾乎齊肩的厚重黑鐵箱擋著，對岸的人只會以為我們是在用舊分離匣關爐子，看不見妳的手。每抹掉一個插槽，我就立刻壓下對應的隔板鎖死，絕不讓消掉的火倒灌回來。」\n\n這時，遠處河岸舊調壓所的方向傳來兩聲清亮的哨音。兩名沾滿泥水的總站技師從暗渠口翻出，朝高台上的榊主任高高揮動綠旗。\n\n傳聲器裡隨即響起榊主任沉穩明確的指令：\n\n「外圍三組底下石槽全部封死確認。」\n「三組上層銅管關閉確認。」\n「鐵架底座全部拆開，下方施工人員全數撤出安全線外。內側可以開始。」\n\n千歲的聲音緊接著傳來，沒有半點催逼，只有始終如一的冷靜：\n\n「軒人，那個角度看得到她的花扣白珠嗎？」\n\n軒人將防風鯨油燈掛上窄台左前方的鐵鉤，暖黃燈光正好照亮Eraser的領口：「看得很清楚。」\n\n「Eraser，現在右手感覺怎麼樣？」\n\n「手指能完全張開，不麻也不痛。左手固定著沒動。」\n\n「好，身體維持讀數很穩定。我這邊開始計時，剛才在二號廊用掉的三秒已經扣掉了，現在剩八十七秒。」\n\nEraser輕輕應了一聲。\n\n伸出手前，她最後抬起眼，望向不遠處值班席上那個仍在重複抬手看錶的工匠虛影，又望了一眼入口處那個仍在向空氣索要通行牌的值班員。\n\n「這一次停下來，他們就不會再出來了。」她輕聲說。\n\n軒人沒有說什麼寬慰的空話。那些留在水氣裡的殘影聽不見新的回答，也無法像她一樣走出地底，去買打折的起司麵包、去挑一條深藍色的髮帶。\n\n「他們已經加了三百年的班了。」軒人握緊冰冷的隔板扣柄，聲音放得很輕，「至於工坊裡那些真正值得記住的事，妳已經記在腦子裡帶出來了。」\n\nEraser垂下眼望著自己的右手指尖，微微點了點頭：\n\n「說得也是。」\n\n她深吸一口氣，抬起右手，將指腹穩穩按上第一層插槽——那條「管幻影的線」的起筆接點。\n\n## ４\n\n滋——\n\n一道純白如雪的光痕順著Eraser的指尖流進了主控鐵箱。\n\n車間裡最先褪去的，是聲音。\n\n叮叮噹噹翻動工具的雜響、礦石吊籃擦過軌道的軋聲、廣播裡一遍又一遍催促無關人員離場的重複通告，從最外圍的值班室開始，如退潮般被迅速抽離。\n\n懸於半空的虛影車廂沒有爆炸，只是安靜地散去了輪廓。值班席上那個緊握操縱桿長達三百年的模糊人影，在河風裡化作細碎的白點飄散，只餘下那雙真實而乾硬的舊手套，依然孤零零地平放在空無一人的鐵椅中央。\n\n傳聲器裡隱約夾進一聲對岸觀察哨向總站的急報——遠岸的哨兵望見暮色中的主控鐵箱後方接連湧出純白光流、車間虛影隨之大片崩散，只當是那只三百年前的古物『舊分離匣』啟動了淨化程序，絲毫無人察覺在齊肩高的黑鐵箱背後，真正止住這座古爐的，不過是少女的一隻右手。\n\nEraser的右手穩穩覆在第一槽上，手背肌膚底下的細密紋路亮起柔和白光，呼吸均勻綿長，固定著的左手穩穩垂在身側，未曾抬起半分。\n\n傳聲器裡傳來千歲冷靜的報數：「十九秒。第一層讀數歸零，隔開。」\n\n軒人左手果斷壓下第一枚精鋼扣柄。\n\n喀嚓。\n\n第一片絕緣隔板重重插落槽底，將外層接點徹底封死。\n\n「第一段完成。」軒人報出進度。\n\nEraser收回右手，向右平移幾公分，五指按上第二層插槽——「連向城裡的管線」。\n\n嗡——\n\n整座主控鐵箱彷彿被地底潛伏的龐然巨物猛地向下一扯。厚重黑鐵發出低沉刺耳的震鳴，腳下窄台劇烈顛簸，滾燙白霧自底座接縫噴湧而出。早有防備的軒人雙腳分立、靴底死死抵住主架鉚釘，腰間雙索瞬間繃成直線，穩住了重心。\n\n白光灌入第二層插槽。四周與水街、東石橋重疊的虛假廊道與暗紅蒸汽管，在同一剎那寸寸裂開，碎作漫天白雪。\n\n河谷真正的夜色、毫無遮蔽的湍急河水、對岸架起高出力魔導探照燈與防風魔導提燈的真實堤岸，一口氣全數撲進視野之中。清冽涼爽的秋夜河風終於毫無阻礙地灌上窄台，吹起Eraser頰邊淡粉色的碎髮。她沒有分心騰手，軒人立刻伸出左手輕輕幫她撥開擋在眼前的髮絲，隨即把掌心按回第二枚扣柄上。\n\n主控鐵箱底下，失去外圍阻力的巨型傳動輪軸空轉得越發尖銳；但因方才在夜一釘死主樑的三十秒裡，那根紅色離合拉桿已被軒人徹底抽離、又用最後一枚硬木楔鎖死了卡扣，狂暴的空轉沒有對主架造成半點牽扯。\n\n「四十六秒！中間那層到底了，扣隔板！」千歲的聲音自傳聲器裡響起。\n\n軒人毫不遲疑地壓下第二枚精鋼扣柄。\n\n喀嚓。\n\n第二片隔板重重落鎖。所有外接管線與借來的通道徹底斷絕，兩人此刻就站在河心三座真實石墩撐起的斑駁舊鐵架上，四周再無半塊虛假的地板。\n\nEraser的右手撤離第二層插槽時，指尖幾不可察地輕顫了一下。\n\n軒人立刻垂眼看向她領口的花扣——白珠依舊純白，尚未變色。\n\n「手還能繼續嗎？」他的聲音壓得很穩。\n\n「能繼續。」Eraser答道。\n\n只剩最深處的第三層插槽了。\n\n那條「底下不肯熄的主火種」彷彿察覺所有外圍通道俱斷，槽底深處的暗紅刻紋驟然暴閃，發狂般試圖繞過隔板重新點燃。滾燙熱浪迎面撲來，烤得軒人連睫毛都發了乾。\n\nEraser沒有退後半步，伸出右手，將五指直接按上了第三層最深處的起筆原點。\n\n匡、匡、匡。\n\n主控鐵箱頂部那塊黃銅狀態翻牌突然失控般劇烈翻撞起來，黑鐵腹腔深處擠出斷斷續續、如同齒輪卡死般的古老提示音：\n\n『交接未確認……不得停機……維持最低爐壓……』\n\n純白光痕沿著深處的暗紅刻紋，一分一毫地硬壓進去。每一秒都繃得像拉至極限的弓弦。汗珠沿著軒人的額角滑落，左手虎口再次崩開的鮮血滲透紗布，濕黏地貼上了冰冷的精鋼扣柄。\n\n第六十秒。\n\n箱底積蓄了三百年的最後一股高溫反衝沿著插槽猛然頂上。Eraser的肩膀往前一震，軒人立刻以左前臂死死抵住舊分離匣的邊框穩住機身，手掌卻極力克制著，沒有去碰觸她正在施術的右手。\n\n啪。\n\n一聲極輕、卻在兩人耳畔清晰無比的脆響。\n\n在Eraser白皙的右手背上，順著既有的迴路紋理，赫然裂開了一道細微的紅痕。\n\n軒人的呼吸才剛收緊，Eraser便遵守約定，搶在他開口前清清楚楚地報出了狀況：\n\n「手痛。不是左腕，是右手背裂開了一點。」\n\n「我看見了。白珠還沒變色。」軒人一眨不眨地緊盯著她領口的花扣，同時對著傳聲器大聲回報，「千歲姊，她右手背出了道細裂，白珠還是白的。」\n\n傳聲器另一端的千歲沒有要她勉強撐下去，只盯著讀數表飛快報數：\n\n「六十八秒。最後那道主火種已經斷了八成，接點沒有漏電。再看五秒，只要白珠外圈一發黃，不管斷沒斷完都立刻拉開。」\n\n七十秒。\n\n七十一秒。\n\n七十二秒。\n\n主控鐵箱深處猛地迸出一聲「錚」的崩響——那是緊繃了三百年的主發條徹底斷裂的聲音。整座黑鐵方箱向前劇烈一震，軒人左膝猛地一沉，腰間安全索隨即繃緊接住兩人的重量；他沾滿血汗的左手卻始終死死扣在第三枚隔板扣柄上，一步未退。\n\n就在第七十四秒跳動的同一剎那——\n\n防風鯨油燈的微光映照下，Eraser領口那枚五瓣花扣中央的白珠最外緣，浮現出了一抹極淡的鵝黃。\n\n「變色了，停手！」\n\n軒人的聲音剛落，Eraser的五指沒有半拍遲疑，乾脆地彈離插槽；而在同一瞬間，軒人將左臂僅剩的全部力氣都壓上了最後一片精鋼隔板。\n\n喀嚓。\n\n三片絕緣隔板全數鎖死。\n\n剛被白光抹去起筆點的最後一道暗紅火紋，被第三片隔板徹底斬斷退路，撞上冷鋼後再也沒能合攏。鐵箱腹中最後一枚小齒輪孤零零地空轉兩圈，緩緩靜止。箱頂那塊不停翻撞的黃銅狀態翻牌失去了支撐，「啪」地一聲翻倒，露出了完全空白的背面。\n\n玻璃罩裡那枚敲了三百年的機械鋼印，也終於懸停在了半空，再沒有落下來。\n\n## ５\n\n喧囂徹底退盡之後，軒人最先聽見的，是自己粗重而微顫的呼吸聲。\n\n緊接著，是腳下嘩啦流淌的真實河水聲。\n\n秋夜的風很涼，帶著濕潤泥土與水草的氣味。原來這條大河一直都在這裡安靜地流著，只是過去三百年間，它的水聲始終被那座不肯停下的舊支爐壓在了底下。\n\nEraser將右手垂回身側，五指因方才的熱負荷而微微蜷曲，暫時無法完全張開。她低頭看著已不再發熱的花扣，以左手尚能活動的兩根手指配合下巴，親手按開了胸前短導線的快拆扣，將維持自身運轉的獨立魔力環完好地留在領口。\n\n「右手不能再用了。」她轉過臉對軒人說，「不過身上沒有不舒服，自己走得動。」\n\n「知道了，右手一點都不用再動了。」\n\n傳聲器裡傳來千歲長長吐出一口氣的聲音，語速比剛才快了幾分：\n\n「最後一道重啟連接確認切斷，支爐核心讀數徹底歸零，沒有往任何一條新管線倒灌。這次抹消用了七十四秒，加上前面的三秒一共七十七秒，沒有超過九十秒紅線。不過她的右手背已經有熱損傷了，絕對不准再碰任何術式，馬上帶人回來。」\n\n軒人望著眼前這座終於沉寂下來的黑鐵方箱。三片精鋼隔板牢牢鎖在槽位裡，箱內的紅光已徹底熄滅，不見半點殘光。\n\nEraser站在他身側，靜靜凝視那塊翻到空白面的黃銅牌片刻：\n\n「這次真的停了。」\n\n「嗯，停了。」\n\n軒人鬆開握著扣柄的左手，這才發覺掌心幾乎被冷汗與虎口滲出的血黏在鐵柄上。他原本想將鎖在窄台上的舊分離匣提起來帶走，才剛往上提起一點，便感覺到匣底的三片隔板已與主控鐵箱內的黃銅接點死死咬合——若此刻強行拔出，剛才隔開的三段死迴路極可能重新碰接。\n\n軒人立刻收手，對著傳聲器回報狀況。\n\n千歲只回了一句話：「匣子留著。」\n\n「那三根主長線要不要拆——」\n\n「長線也留著，只要把連著她花扣的那根短線拆下來就行。整隻匣子就留在上面當永久隔板，等明天水流平緩了，總站自然會派人慢慢封存。人先給我回來。」\n\n軒人望著那只冒險從沉沒舊工坊帶出、昨晚又徹夜修繕的舊分離匣，這一回沒有半分猶豫。他乾脆地取來備用短繩，將匣子緊緊繫牢在窄台上免得滑落河中，隨即轉身替Eraser扣妥岸上遞來的第二條安全腰索。\n\n「走平台回去，還是坐滑輪吊椅？」軒人問她。\n\nEraser低頭看了看自己的雙腳：「走平台就行，我的腳沒有受傷。只是右手握不住扶手繩。」\n\n「那我們把兩條腰索並在一起，妳走我前面半步，岸上收繩，我在後面扶著妳的腰帶環。」\n\n兩人順著真實的工字樑一步一步往回走。\n\n當半透明的虛影車廂與假地板全數散去，眼前的路反倒比來時明晰得多。哪裡是鉚釘、哪裡是鋼樑、哪裡是河面，清清楚楚，再也不必提防踩下去會跌進三百年前的另一處角落。\n\n行至中段那根剛換過支撐的副樑前，真崎夜一仍站在外側護欄旁等他們。他左臂的黑紋已經褪去，雙手靜靜插在外套口袋裡：\n\n「這一段現在靠的是下面的實心鋼索，不用再靠我的影子了。直接走過來吧。」\n\n軒人點頭致意，陪著Eraser平穩走過副樑，踏上通往岸邊的實體鐵階梯。\n\n階梯底下，救援木艇的船夫一直將船頭頂在石墩旁等候，兩名救援員立在船首伸出了手。\n\nEraser先走下最後一級台階，卻在跨上船板前停住腳步，轉身安靜地等著軒人。\n\n軒人原本出於習慣，差點脫口說出「妳先上船坐好不用等我」，可望進她在暮色餘暉裡靜靜凝視自己的眼眸，他將那句話嚥了回去，邁步走到她身旁，與她同一拍踏上了救援艇的木板。\n\n船身隨著兩人的重量微沉，隨即被平緩的河水溫柔托住。船夫撐起長木篙，木艇緩緩駛離了主鐵架的陰影。\n\n軒人坐在船艙長椅上，回頭望向河心那座支撐了三百年的舊支爐主架。\n\n褪去暗紅濃霧與虛影之後，留在河面上的不過是一副鏽跡斑斑、用了太久也壞了太久的普通鐵架。主控鐵箱頂端那塊空白的黃銅翻牌靜靜立在晚風裡，再也不會替任何人催促下一班交接了。\n\n木艇靠岸時，天際最後一道橘紅色的晚霞恰好灑落在灰鐵巷的屋頂上。\n\n榊主任站在岸邊的登記桌後，桌上的點名冊被河風拂得微微翻動，紙角壓著一顆拆下來的六角螺帽。\n\n軒人與Eraser走上河岸，救援員替兩人解開腰間安全索，引領他們來到登記桌前。\n\n「不破軒人。」榊主任提筆，念出內側作業欄的第一個名字。\n\n「在。」軒人應道。\n\n榊主任低頭望向最後一欄，念出了那個今天早晨由她自己親手填下的名字：\n\n「Eraser。」\n\n少女立在溫暖的岸邊燈火裡，望向對面正拄著手杖朝自己微笑的千歲，清脆而清晰地答道：\n\n「在這裡。」\n\n——第十章完——\n", "mtime": 1795001671.7568276}, {"filename": "11_第十一章_明天也營業.md", "content": "", "mtime": 1795003123.215756}]
</script>

<script>
(() => {
  const chapters = JSON.parse(document.getElementById('chapters-data').textContent);
  let currentIdx = parseInt(localStorage.getItem('readonly_last_chapter') || '0', 10);
  if (isNaN(currentIdx) || currentIdx < 0 || currentIdx >= chapters.length) currentIdx = 0;

  const elSidebar = document.getElementById('sidebar');
  const elChapterList = document.getElementById('chapter-list');
  const elCurrentTitle = document.getElementById('current-chapter-title');
  const elWordCount = document.getElementById('word-count-display');
  const elTotalStats = document.getElementById('total-volume-stats');
  const elArticle = document.getElementById('reader-article');
  const elReaderPane = document.getElementById('reader-pane');
  const elNavFooter = document.getElementById('chapter-nav-footer');
  const elProgressBar = document.getElementById('progress-bar');
  const elSettingsPanel = document.getElementById('settings-panel');

  function countCJK(str) {
    const m = str.match(/[\u4e00-\u9fff]/g);
    return m ? m.length : 0;
  }

  function escapeHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function getChapterTitle(md, fallbackFilename) {
    const lines = md.split(/\r?\n/);
    for (const line of lines) {
      if (line.startsWith('# ')) {
        const t = line.replace(/^#\s+/, '').trim();
        if (t !== '《我不是勇者》') return t;
      }
    }
    return fallbackFilename.replace(/\.md$/, '');
  }

  function getSections(md) {
    const secs = [];
    const lines = md.split(/\r?\n/);
    lines.forEach((line, idx) => {
      if (line.startsWith('## ')) {
        const title = line.replace(/^##\s+/, '').trim();
        if (!title.startsWith('第一卷')) {
          secs.push({ title, lineIndex: idx });
        }
      }
    });
    return secs;
  }

  function renderMarkdown(md) {
    const lines = md.split(/\r?\n/);
    let html = '';
    lines.forEach((rawLine, lineIdx) => {
      const line = rawLine.trim();
      if (!line) return;
      if (line.startsWith('# ')) {
        const text = escapeHtml(line.replace(/^#\s+/, ''));
        if (text === '《我不是勇者》') return;
        html += `<h1 data-line="${lineIdx}">${text}</h1>`;
      } else if (line.startsWith('## ')) {
        const text = escapeHtml(line.replace(/^##\s+/, ''));
        if (text.startsWith('第一卷')) return;
        html += `<h2 id="sec-line-${lineIdx}" data-line="${lineIdx}">§ ${text}</h2>`;
      } else if (line === '---' || line === '＊　　　＊　　　＊' || line === '* * *') {
        html += `<hr data-line="${lineIdx}">`;
      } else {
        const formatted = escapeHtml(line).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
        html += `<p data-line="${lineIdx}">${formatted}</p>`;
      }
    });
    return html;
  }

  function renderSidebar() {
    elChapterList.innerHTML = '';
    let totalCJK = 0;
    chapters.forEach((ch, idx) => {
      const cjk = countCJK(ch.content);
      totalCJK += cjk;
      const title = getChapterTitle(ch.content, ch.filename);
      const secs = getSections(ch.content);

      const item = document.createElement('div');
      item.className = 'chapter-item' + (idx === currentIdx ? ' active' : '');
      item.innerHTML = `
        <div class="chapter-item-title">${escapeHtml(title)}</div>
        <div class="chapter-item-meta">
          <span>第 ${idx + 1} 章</span>
          <span>${cjk.toLocaleString()} 字</span>
        </div>
      `;

      if (secs.length > 0) {
        const secWrap = document.createElement('div');
        secWrap.className = 'section-anchors';
        secs.forEach(s => {
          const pill = document.createElement('span');
          pill.className = 'sec-pill';
          pill.textContent = '§ ' + s.title;
          pill.addEventListener('click', (ev) => {
            ev.stopPropagation();
            if (currentIdx !== idx) loadChapter(idx, true);
            const targetEl = document.getElementById('sec-line-' + s.lineIndex);
            if (targetEl) targetEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
          });
          secWrap.appendChild(pill);
        });
        item.appendChild(secWrap);
      }

      item.addEventListener('click', () => {
        loadChapter(idx, true);
        if (window.innerWidth <= 768) elSidebar.classList.add('collapsed');
      });
      elChapterList.appendChild(item);
    });
    elTotalStats.textContent = `全卷共 ${chapters.length} 章 ｜ 總計 ${totalCJK.toLocaleString()} 中文字`;
  }

  function loadChapter(idx, resetScroll = true) {
    currentIdx = idx;
    localStorage.setItem('readonly_last_chapter', String(currentIdx));
    const ch = chapters[currentIdx];
    const title = getChapterTitle(ch.content, ch.filename);
    const cjk = countCJK(ch.content);

    elCurrentTitle.textContent = title;
    elWordCount.textContent = `本章 ${cjk.toLocaleString()} 字`;
    elArticle.innerHTML = renderMarkdown(ch.content);

    Array.from(elChapterList.children).forEach((el, i) => {
      el.classList.toggle('active', i === currentIdx);
    });

    elNavFooter.innerHTML = '';
    if (currentIdx > 0) {
      const prevTitle = getChapterTitle(chapters[currentIdx - 1].content, chapters[currentIdx - 1].filename);
      const prevCard = document.createElement('div');
      prevCard.className = 'nav-card';
      prevCard.innerHTML = `<div class="nav-card-label">← 上一章</div><div class="nav-card-title">${escapeHtml(prevTitle)}</div>`;
      prevCard.onclick = () => loadChapter(currentIdx - 1, true);
      elNavFooter.appendChild(prevCard);
    }
    if (currentIdx < chapters.length - 1) {
      const nextTitle = getChapterTitle(chapters[currentIdx + 1].content, chapters[currentIdx + 1].filename);
      const nextCard = document.createElement('div');
      nextCard.className = 'nav-card';
      nextCard.style.textAlign = 'right';
      nextCard.innerHTML = `<div class="nav-card-label">下一章 →</div><div class="nav-card-title">${escapeHtml(nextTitle)}</div>`;
      nextCard.onclick = () => loadChapter(currentIdx + 1, true);
      elNavFooter.appendChild(nextCard);
    }

    if (resetScroll) elReaderPane.scrollTop = 0;
  }

  document.getElementById('btn-toggle-sidebar').addEventListener('click', () => {
    elSidebar.classList.toggle('collapsed');
  });

  elReaderPane.addEventListener('scroll', () => {
    const maxScroll = elReaderPane.scrollHeight - elReaderPane.clientHeight;
    const pct = maxScroll > 0 ? (elReaderPane.scrollTop / maxScroll) * 100 : 0;
    elProgressBar.style.width = pct.toFixed(1) + '%';
  });

  // Global Search
  const elGlobalSearch = document.getElementById('global-search');
  const elSearchResults = document.getElementById('search-results');
  elGlobalSearch.addEventListener('input', () => {
    const q = elGlobalSearch.value.trim();
    if (!q) {
      elSearchResults.style.display = 'none';
      return;
    }
    elSearchResults.innerHTML = '';
    let hits = 0;
    chapters.forEach((ch, cIdx) => {
      const lines = ch.content.split(/\r?\n/);
      const title = getChapterTitle(ch.content, ch.filename);
      lines.forEach((line, lIdx) => {
        if (line.includes(q) && hits < 50) {
          hits++;
          const div = document.createElement('div');
          div.className = 'search-hit';
          const snippet = escapeHtml(line.length > 60 ? line.slice(0, 60) + '...' : line)
            .replace(new RegExp(escapeHtml(q), 'g'), `<mark>${escapeHtml(q)}</mark>`);
          div.innerHTML = `<div class="search-hit-chap">${escapeHtml(title)}</div><div>${snippet}</div>`;
          div.onclick = () => {
            loadChapter(cIdx, false);
            const targetP = elArticle.querySelector(`[data-line="${lIdx}"]`);
            if (targetP) {
              targetP.scrollIntoView({ behavior: 'smooth', block: 'center' });
              targetP.style.backgroundColor = 'rgba(235, 180, 40, 0.35)';
              setTimeout(() => { targetP.style.backgroundColor = ''; }, 2000);
            }
          };
          elSearchResults.appendChild(div);
        }
      });
    });
    elSearchResults.style.display = hits > 0 ? 'block' : 'none';
  });

  // Settings
  document.getElementById('btn-settings').addEventListener('click', (e) => {
    e.stopPropagation();
    elSettingsPanel.classList.toggle('open');
  });

  document.addEventListener('click', (e) => {
    if (!elSettingsPanel.contains(e.target) && e.target.id !== 'btn-settings') {
      elSettingsPanel.classList.remove('open');
    }
  });

  document.querySelectorAll('[data-set-theme]').forEach(sw => {
    sw.addEventListener('click', () => {
      const t = sw.getAttribute('data-set-theme');
      document.body.setAttribute('data-theme', t);
      document.querySelectorAll('[data-set-theme]').forEach(s => s.classList.toggle('active', s === sw));
    });
  });

  document.querySelectorAll('[data-set-font]').forEach(btn => {
    btn.addEventListener('click', () => {
      const f = btn.getAttribute('data-set-font');
      if (f === 'serif') document.documentElement.style.setProperty('--reader-font', '"Songti TC", "Noto Serif TC", "PMingLiU", "SimSun", serif');
      if (f === 'sans') document.documentElement.style.setProperty('--reader-font', '"Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif');
      if (f === 'kai') document.documentElement.style.setProperty('--reader-font', '"Kaiti TC", "DFKai-SB", "BiauKai", serif');
    });
  });

  document.getElementById('rng-font-size').addEventListener('input', (e) => {
    const v = e.target.value + 'px';
    document.getElementById('lbl-font-size').textContent = v;
    document.documentElement.style.setProperty('--font-size', v);
  });

  document.getElementById('rng-line-height').addEventListener('input', (e) => {
    const v = e.target.value;
    document.getElementById('lbl-line-height').textContent = v;
    document.documentElement.style.setProperty('--line-height', v);
  });

  document.querySelectorAll('[data-set-width]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.documentElement.style.setProperty('--page-max-width', btn.getAttribute('data-set-width'));
    });
  });

  document.getElementById('chk-indent').addEventListener('change', (e) => {
    document.documentElement.style.setProperty('--para-indent', e.target.checked ? '2em' : '0em');
  });

  renderSidebar();
  loadChapter(currentIdx, true);

  // Real-time auto-update polling when hosted on GitHub Pages / HTTP(S)
  if (location.protocol === 'http:' || location.protocol === 'https:') {
    let currentHash = chapters.map(c => c.content.length + ':' + c.mtime).join('|');
    const toast = document.createElement('div');
    toast.style.cssText = 'position:fixed;bottom:20px;right:20px;background:var(--accent-color);color:#fff;padding:8px 14px;border-radius:999px;font-size:12px;box-shadow:var(--shadow-md);opacity:0;transition:opacity 0.3s ease;pointer-events:none;z-index:9999;';
    toast.textContent = '✨ 已自動同步最新內文';
    document.body.appendChild(toast);

    setInterval(async () => {
      try {
        const res = await fetch('./chapters.json?t=' + Date.now(), { cache: 'no-store' });
        if (!res.ok) return;
        const data = await res.json();
        if (!data || !Array.isArray(data.chapters)) return;
        const newHash = data.chapters.map(c => c.content.length + ':' + c.mtime).join('|');
        if (newHash !== currentHash) {
          currentHash = newHash;
          const savedScroll = elReaderPane.scrollTop;
          chapters.length = 0;
          data.chapters.forEach(c => chapters.push(c));
          if (currentIdx >= chapters.length) currentIdx = chapters.length - 1;
          renderSidebar();
          loadChapter(currentIdx, false);
          elReaderPane.scrollTop = savedScroll;
          toast.style.opacity = '1';
          setTimeout(() => { toast.style.opacity = '0'; }, 3000);
        }
      } catch (_) {}
    }, 15000);
  }
})();
</script>
</body>
</html>
