<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>《我不是勇者》第一卷：無風迴廊盡頭的少女</title>
<style>
  :root {
    --bg-primary: #f7f3e8;
    --bg-secondary: #efe9d8;
    --bg-elevated: #fdfbf6;
    --text-primary: #26221e;
    --text-secondary: #6e655c;
    --text-muted: #9c9286;
    --border-color: #dfd6c3;
    --accent-color: #8c3f2b;
    --accent-hover: #702f1e;
    --accent-soft: rgba(140, 63, 43, 0.08);
    --shadow-sm: 0 2px 8px rgba(38, 34, 30, 0.06);
    --shadow-md: 0 8px 28px rgba(38, 34, 30, 0.1);
    --reader-font: "Songti TC", "Noto Serif TC", "PMingLiU", "SimSun", serif;
    --ui-font: -apple-system, BlinkMacSystemFont, "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif;
    --font-size: 19px;
    --line-height: 2.05;
    --page-max-width: 760px;
    --para-indent: 2em;
  }

  [data-theme="light"] {
    --bg-primary: #f8f9fa;
    --bg-secondary: #eef0f3;
    --bg-elevated: #ffffff;
    --text-primary: #1e2125;
    --text-secondary: #5c6470;
    --text-muted: #8c95a2;
    --border-color: #e1e4e8;
    --accent-color: #2b579a;
    --accent-hover: #1e3f73;
    --accent-soft: rgba(43, 87, 154, 0.08);
  }

  [data-theme="dark"] {
    --bg-primary: #14161a;
    --bg-secondary: #1c1f26;
    --bg-elevated: #22262f;
    --text-primary: #d9d6cf;
    --text-secondary: #98948c;
    --text-muted: #66635d;
    --border-color: #2e333d;
    --accent-color: #d4845a;
    --accent-hover: #e3966e;
    --accent-soft: rgba(212, 132, 90, 0.12);
    --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
    --shadow-md: 0 8px 28px rgba(0, 0, 0, 0.45);
  }

  [data-theme="green"] {
    --bg-primary: #e8f0e6;
    --bg-secondary: #dbe6d8;
    --bg-elevated: #f2f7f1;
    --text-primary: #1f2b21;
    --text-secondary: #526354;
    --text-muted: #7b8e7d;
    --border-color: #c8d8c5;
    --accent-color: #2d6a4f;
    --accent-hover: #1b4332;
    --accent-soft: rgba(45, 106, 79, 0.1);
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg-primary);
    color: var(--text-primary);
    font-family: var(--ui-font);
    overflow: hidden;
    transition: background-color 0.25s ease, color 0.25s ease;
  }

  #progress-bar {
    position: fixed;
    top: 0;
    left: 0;
    height: 3px;
    background: var(--accent-color);
    width: 0%;
    z-index: 1000;
    transition: width 0.1s ease;
  }

  .app-shell {
    display: flex;
    flex-direction: column;
    height: 100vh;
    width: 100vw;
  }

  .topbar {
    height: 54px;
    background: var(--bg-elevated);
    border-bottom: 1px solid var(--border-color);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 18px;
    gap: 12px;
    z-index: 100;
    box-shadow: var(--shadow-sm);
    flex-shrink: 0;
  }

  .topbar-left, .topbar-right {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    border-radius: 6px;
    border: 1px solid var(--border-color);
    background: var(--bg-elevated);
    color: var(--text-primary);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s ease;
    user-select: none;
    white-space: nowrap;
  }

  .btn:hover {
    background: var(--bg-secondary);
    border-color: var(--text-muted);
  }

  .chapter-badge {
    font-family: var(--reader-font);
    font-size: 15px;
    font-weight: 700;
    color: var(--text-primary);
    max-width: 420px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .word-count-pill {
    font-size: 12px;
    color: var(--text-secondary);
    background: var(--bg-secondary);
    padding: 4px 10px;
    border-radius: 999px;
    border: 1px solid var(--border-color);
    white-space: nowrap;
  }

  .workspace {
    display: flex;
    flex: 1;
    overflow: hidden;
    position: relative;
  }

  .sidebar {
    width: 290px;
    background: var(--bg-secondary);
    border-right: 1px solid var(--border-color);
    display: flex;
    flex-direction: column;
    transition: margin-left 0.25s ease;
    flex-shrink: 0;
    z-index: 50;
  }

  .sidebar.collapsed {
    margin-left: -290px;
  }

  .sidebar-header {
    padding: 18px 16px 14px 16px;
    border-bottom: 1px solid var(--border-color);
  }

  .book-title {
    font-family: var(--reader-font);
    font-size: 18px;
    font-weight: 700;
    margin: 0 0 4px 0;
    color: var(--text-primary);
  }

  .book-subtitle {
    font-size: 12px;
    color: var(--text-secondary);
    margin: 0 0 12px 0;
  }

  .search-box {
    width: 100%;
    padding: 8px 10px;
    border-radius: 6px;
    border: 1px solid var(--border-color);
    background: var(--bg-elevated);
    color: var(--text-primary);
    font-size: 13px;
    outline: none;
  }

  .search-box:focus {
    border-color: var(--accent-color);
  }

  .chapter-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
  }

  .chapter-item {
    padding: 11px 12px;
    border-radius: 8px;
    cursor: pointer;
    margin-bottom: 4px;
    transition: all 0.15s ease;
    border: 1px solid transparent;
  }

  .chapter-item:hover {
    background: var(--bg-elevated);
  }

  .chapter-item.active {
    background: var(--bg-elevated);
    border-color: var(--accent-color);
    box-shadow: var(--shadow-sm);
  }

  .chapter-item-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-primary);
    margin-bottom: 4px;
  }

  .chapter-item.active .chapter-item-title {
    color: var(--accent-color);
  }

  .chapter-item-meta {
    font-size: 11px;
    color: var(--text-muted);
    display: flex;
    justify-content: space-between;
  }

  .section-anchors {
    margin-top: 6px;
    padding-left: 8px;
    border-left: 2px solid var(--border-color);
    display: none;
    flex-wrap: wrap;
    gap: 4px;
  }

  .chapter-item.active .section-anchors {
    display: flex;
  }

  .sec-pill {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 4px;
    background: var(--bg-secondary);
    color: var(--text-secondary);
    cursor: pointer;
  }

  .sec-pill:hover {
    background: var(--accent-soft);
    color: var(--accent-color);
  }

  .sidebar-footer {
    padding: 12px 16px;
    border-top: 1px solid var(--border-color);
    font-size: 12px;
    color: var(--text-secondary);
  }

  .reader-pane {
    flex: 1;
    overflow-y: auto;
    padding: 40px 24px 120px 24px;
    scroll-behavior: smooth;
    height: 100%;
  }

  .reader-paper {
    max-width: var(--page-max-width);
    margin: 0 auto;
    background: var(--bg-elevated);
    padding: 58px 68px;
    border-radius: 12px;
    border: 1px solid var(--border-color);
    box-shadow: var(--shadow-md);
    font-family: var(--reader-font);
    font-size: var(--font-size);
    line-height: var(--line-height);
    letter-spacing: 0.03em;
    transition: all 0.2s ease;
  }

  @media (max-width: 768px) {
    .sidebar {
      position: absolute;
      height: 100%;
    }
    .reader-pane {
      padding: 18px 10px 90px 10px;
    }
    .reader-paper {
      padding: 28px 20px;
    }
    .word-count-pill {
      display: none;
    }
  }

  .reader-paper h1 {
    font-size: 1.65em;
    font-weight: 700;
    margin: 0.2em 0 1.3em 0;
    padding-bottom: 0.6em;
    border-bottom: 2px solid var(--accent-color);
    color: var(--text-primary);
    line-height: 1.35;
    letter-spacing: 0.05em;
  }

  .reader-paper h2 {
    font-size: 1.25em;
    font-weight: 700;
    margin: 2.2em 0 1.2em 0;
    color: var(--accent-color);
    text-align: center;
    letter-spacing: 0.15em;
  }

  .reader-paper p {
    margin: 0 0 1.05em 0;
    text-indent: var(--para-indent);
    text-align: justify;
  }

  .reader-paper hr {
    border: none;
    text-align: center;
    margin: 2.2em 0;
  }

  .reader-paper hr::after {
    content: "＊　　　＊　　　＊";
    color: var(--text-muted);
    font-size: 0.85em;
  }

  .reader-paper strong {
    color: var(--accent-color);
    font-weight: 700;
  }

  .chapter-nav-footer {
    max-width: var(--page-max-width);
    margin: 28px auto 0 auto;
    display: flex;
    justify-content: space-between;
    gap: 16px;
  }

  .nav-card {
    flex: 1;
    padding: 16px 20px;
    background: var(--bg-elevated);
    border: 1px solid var(--border-color);
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .nav-card:hover {
    border-color: var(--accent-color);
    transform: translateY(-1px);
    box-shadow: var(--shadow-sm);
  }

  .nav-card-label {
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 4px;
  }

  .nav-card-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--text-primary);
  }

  .settings-panel {
    position: fixed;
    top: 62px;
    right: 18px;
    width: 300px;
    background: var(--bg-elevated);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    box-shadow: var(--shadow-md);
    padding: 18px;
    z-index: 200;
    display: none;
  }

  .settings-panel.open {
    display: block;
  }

  .setting-row {
    margin-bottom: 14px;
  }

  .setting-label {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-secondary);
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
  }

  .theme-swatches {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }

  .swatch {
    padding: 8px 4px;
    border-radius: 6px;
    border: 2px solid var(--border-color);
    text-align: center;
    font-size: 12px;
    cursor: pointer;
    font-weight: 500;
  }

  .swatch.active {
    border-color: var(--accent-color);
  }

  .search-results-box {
    max-height: 220px;
    overflow-y: auto;
    margin-top: 8px;
    background: var(--bg-elevated);
    border: 1px solid var(--border-color);
    border-radius: 6px;
    display: none;
  }

  .search-hit {
    padding: 8px 10px;
    border-bottom: 1px solid var(--border-color);
    font-size: 12px;
    cursor: pointer;
  }

  .search-hit:hover {
    background: var(--accent-soft);
  }

  .search-hit-chap {
    font-weight: 600;
    color: var(--accent-color);
    margin-bottom: 2px;
  }

  mark {
    background: rgba(235, 180, 40, 0.35);
    color: inherit;
    padding: 0 2px;
    border-radius: 2px;
  }
</style>
</head>
<body data-theme="sepia">

<div id="progress-bar"></div>

<div class="app-shell">
  <header class="topbar">
    <div class="topbar-left">
      <button class="btn" id="btn-toggle-sidebar" title="切換目錄側欄">☰ 目錄</button>
      <span class="chapter-badge" id="current-chapter-title">載入中...</span>
    </div>
    <div class="topbar-right">
      <span class="word-count-pill" id="word-count-display">0 字</span>
      <button class="btn" id="btn-settings" title="字體、主題與版面設定">Aa 閱讀設定</button>
    </div>
  </header>

  <div class="workspace">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h2 class="book-title">《我不是勇者》</h2>
        <p class="book-subtitle">第一卷：無風迴廊盡頭的少女</p>
        <input type="text" class="search-box" id="global-search" placeholder="🔍 搜尋全卷內文...">
        <div class="search-results-box" id="search-results"></div>
      </div>
      <div class="chapter-list" id="chapter-list"></div>
      <div class="sidebar-footer" id="total-volume-stats"></div>
    </aside>

    <main class="reader-pane" id="reader-pane">
      <div class="reader-paper">
        <article id="reader-article"></article>
      </div>
      <div class="chapter-nav-footer" id="chapter-nav-footer"></div>
    </main>
  </div>
</div>

<div class="settings-panel" id="settings-panel">
  <div class="setting-row">
    <div class="setting-label"><span>閱讀主題</span></div>
    <div class="theme-swatches">
      <div class="swatch active" data-set-theme="sepia" style="background:#f7f3e8; color:#26221e;">文庫紙</div>
      <div class="swatch" data-set-theme="light" style="background:#ffffff; color:#1e2125;">純白</div>
      <div class="swatch" data-set-theme="green" style="background:#e8f0e6; color:#1f2b21;">松綠</div>
      <div class="swatch" data-set-theme="dark" style="background:#1c1f26; color:#d9d6cf;">夜間</div>
    </div>
  </div>

  <div class="setting-row">
    <div class="setting-label"><span>字體風格</span></div>
    <div style="display:flex; gap:6px;">
      <button class="btn" data-set-font="serif" style="flex:1; justify-content:center;">明體 / 宋體</button>
      <button class="btn" data-set-font="sans" style="flex:1; justify-content:center;">黑體</button>
      <button class="btn" data-set-font="kai" style="flex:1; justify-content:center;">楷體</button>
    </div>
  </div>

  <div class="setting-row">
    <div class="setting-label"><span>字級大小</span><span id="lbl-font-size">19px</span></div>
    <input type="range" id="rng-font-size" min="15" max="26" value="19" style="width:100%;">
  </div>

  <div class="setting-row">
    <div class="setting-label"><span>行距寬度</span><span id="lbl-line-height">2.05</span></div>
    <input type="range" id="rng-line-height" min="1.5" max="2.5" step="0.05" value="2.05" style="width:100%;">
  </div>

  <div class="setting-row">
    <div class="setting-label"><span>版面寬度</span></div>
    <div style="display:flex; gap:6px;">
      <button class="btn" data-set-width="640px" style="flex:1; justify-content:center;">窄版</button>
      <button class="btn" data-set-width="760px" style="flex:1; justify-content:center;">標準</button>
      <button class="btn" data-set-width="920px" style="flex:1; justify-content:center;">寬版</button>
    </div>
  </div>

  <div class="setting-row" style="margin-bottom:0;">
    <label style="display:flex; align-items:center; gap:8px; font-size:13px; cursor:pointer;">
      <input type="checkbox" id="chk-indent" checked> 段落首行縮排兩字
    </label>
  </div>

[{"filename": "01_第一章_無風迴廊盡頭的少女.md", "content": "# 《我不是勇者》\n## 第一卷：無風迴廊盡頭的少女\n\n---\n\n# 第一章　無風迴廊盡頭的少女\n\n## １\n\n在地下遺跡裡靠這行維生的人，全都牢記著一條鐵則——在理應死寂無風的封閉坑道中，只要燈火的火苗微微偏斜，就意味著石壁後方藏著會吸氣的暗隙。\n\n那可能是滲漏瘴氣的毒穴，也可能是絕路盡頭唯一通往生機的換氣通道。\n\n不破軒人蹲在潮濕冰冷的石階邊緣。他左手提著一盞玻璃罩帶有一道細長裂痕的鯨油燈，右手穩穩握住三節拼接而成的長鐵鉤，緩緩探進底下兩公尺深的陷阱坑裡。\n\n坑底密密麻麻立著幾排早已鏽透的尖刺，鐵刺之間，掛著一只棕色牛皮側背包。\n\n那是昨天一名剛踏入這行的新手冒險者掉進去的。對方不小心踩翻機關石板，運氣算好，死命攀著牆沿爬回了走廊，裝著家傳懷錶與旅費的側背包卻摔落坑底。坑裡積著一層足以腐蝕皮靴鞋底的淺毒水，冒險者公會開出的回收報酬又只有區區四枚銅幣，沒有哪位資深冒險者肯接這種吃力不討好的差事。委託單在公會櫃檯繞了一圈，最後便轉進了軒人打工的小修繕店「晚鐘亭」手裡。\n\n軒人壓低呼吸，手腕輕巧地一轉。\n\n鐵鉤前端的倒鉤準確咬住牛皮側背包的黃銅扣環，他維持穩定的力道，將背包緩緩往上提。\n\n就在包底即將離開毒水面的那一瞬間，淤泥裡猛然彈出一隻巴掌大的鐵殼毒蠍。泛著幽藍微光的尾針疾甩而來，帶著尖銳的破空聲，「啪」地釘上鐵鉤木柄。\n\n軒人的手腕沒有半分顫動。左手順勢從腰側皮囊抓出一小撮乾石灰粉，順著橘黃燈光精準地撒了下去。\n\n白粉落入毒水，立刻冒起一陣細密的滋滋輕響。鐵殼毒蠍最忌諱鹼性粉末，尾針當場一縮，倉皇退回淤泥深處。軒人趁這道空檔手腕一揚，將棕色牛皮側背包穩穩拉上石階。\n\n他掀開包蓋確認了一遍。裡面的銀殼懷錶仍在滴答走時，皮夾裡的三枚銀幣與十幾枚銅幣一枚都沒少。他抽出乾布，仔細擦淨包面沾附的泥水，這才將側背包收進背後的帆布工具袋，站起身拍落膝蓋上的潮濕灰塵。\n\n「四枚銅幣到手。趁天黑前趕回去吧。」\n\n軒人低頭看了眼懷錶。下午四點半。\n\n山腳下的「白央城」是一座建立在三百年前古工坊「地下支爐」管網上的魔導都市。城裡從街邊照明到家家戶戶的日常器具，清一色都是仰賴支爐管線供能的「觸發式魔導器」——正常人哪怕是年邁老人或剛學會走路的孩童，天生體內都流淌著微弱魔力，只要手指輕碰器物表面的感應紋就能啟動。而這座位於城外西坡的「舊鐘塔遺跡」，則是三百年前大崩落時沉入地底的古工坊舊城區，平時出入此處的冒險者，大都是下來打撈古魔導零件與魔石的遺跡探索者。\n\n這裡是遺跡的地下二層，循原路爬回地面大概只需要三十分鐘，正好能趕上晚餐，也省得被店主千歲碎唸飯菜都放涼了。\n\n他拆收三節鐵鉤，提著鯨油燈沿寬敞的石砌通道往回走。\n\n才剛走出不到百步，前方通往地下一層的主樓梯口忽然炸開一陣雜亂急促的腳步聲與嘶喊。\n\n三名身穿皮甲、高舉著手指一握便自行發光的魔導亮光石的遺跡探索者，跌跌撞撞地從上層衝了下來。跑在最前頭的劍士左臂鮮血淋漓，手中的長劍只剩半截，遠遠瞥見迎面走來的軒人手裡居然提著一盞還要擦火柴點火的玻璃罩鯨油燈，逃命之餘眼底仍掠過一絲詫異——畢竟整座白央城裡，大概也只有體內魔力是「空值」的軒人連最便宜的感應亮光石都點不亮，出門永遠得隨身帶著火柴盒與鯨油燈——隨即幾乎破了音地大喊：\n\n「前面提油燈的，快讓開！上層有頭發狂的『鐵背山豬』衝下來了！」\n\n軒人眼神一凜，幾乎沒花時間思索，瞬間側身貼進走廊側壁的石柱凹槽。\n\n三名冒險者連頭都沒回，狼狽地拐進另一側通往東邊水道的岔口拚命狂奔。幾乎就在他們的背影沒入轉角的同一秒，主樓梯間上方轟然傳來一記令空氣震顫的沉悶巨響。\n\n石砌樓梯的拱頂本就年久龜裂，此刻遭一頭重達數百公斤的龐然大物迎頭撞中，撐頂的兩根腐朽木樑應聲折斷。數十塊比餐桌還要寬大的厚重青石板裹著嗆人煙塵崩落而下，僅僅幾次呼吸之間，通往地下一層的唯一出口便被亂石徹底封死。\n\n軒人立刻抬起前臂捂住口鼻，透過緩緩翻湧的灰霧望向樓梯口，心底瞬間涼了半截。\n\n主樓梯完全塌死了。\n\n更糟的狀況還在亂石堆前。那頭從上層墜落而下的「鐵背山豬」，顯然並未被落石壓垮。\n\n兩公尺多長的厚重身軀覆滿灰黑色礦甲，其中一隻後腿被巨石砸得血肉模糊，每挪動半步，都在青石板上拖出一道黏稠暗紅的血痕。粗重如風箱的喘息夾雜著濃烈血腥與硫磺氣味，穿透漸散的塵霧撲面而來。那對充血的猩紅獸瞳掃過通道，瞬間鎖定了東側水道裡那三名冒險者殘留的魔力氣息——而在轉身追擊之前，那雙野獸的紅眼緩緩轉了個角度，正好停在距離不到五步遠的石柱陰影上。\n\n走廊裡的空氣彷彿在一秒之內徹底凍結。\n\n軒人連一根指頭都沒動。\n\n他的指尖無聲壓下鯨油燈外側的遮光銅片，將橘黃火苗死死壓縮成豆粒般微弱的一點，整個脊背緊貼著冰冷粗糙的石柱凹槽，連胸口的起伏都壓到了最淺。冷汗順著鬢角緩緩滑過耳際，落進衣領裡，冰涼刺骨，他卻連眨眼都不敢。\n\n就在壓下銅片的那一剎那，眼角餘光掠過自己乾淨無紋的手背。\n\n蒼白、平滑，看不見半點魔力迴路的微光，連市面上最廉價的魔導燈都點不亮——平時總被公會裡那些老資格的傢伙私下嘲笑為「廢手」的這雙手，在眼下這種絕境裡，卻成了唯一能保住性命的盾牌。\n\n棲息於地底的魔物多半視力與聽覺遲鈍，索敵全仰賴活人體內溢出的魔力波動與強光。在鐵背山豬的感知之中，貼壁屏息、體內魔力值近乎零的軒人，與一塊毫無溫度的冷石頭沒有兩樣；相較之下，東側岔路裡那三個舉著亮光石狂奔的冒險者，簡直像三支在黑夜中劇烈晃動的耀眼火炬。\n\n短短幾秒鐘，漫長得像是過了半小時。\n\n鐵背山豬暴躁地刨了兩下前蹄，碎石喀喀飛濺，鼻孔噴出兩道滾燙的濁白氣流，最終視若無睹地移開視線。牠猛地調轉龐大身軀，一頭撞碎東側水道的朽木柵欄，發出震耳咆哮，踩著沉重碎步追進了水聲奔湧的陰暗深處。\n\n直到震得靴底發麻的蹄聲徹底消失在水道盡頭，軒人才緩緩鬆開早已攥得指節發白的提燈柄，無聲吐出憋在肺葉裡的一口濁氣，重新掀開遮光銅片。\n\n「主樓梯整個塌死了，東邊水道又有那頭大傢伙在裡面兜轉……」\n\n軒人湊近亂石堆仔細看了一眼。砸下來的全是實心花崗岩，沒有三四名力氣夠大的工匠架起絞盤與鐵撬棍開挖一整天，根本清不出路來；而東側水道是一條死路，受了重傷的山豬要是追丟了目標，遲早會順著原路退回來。\n\n他從胸袋裡摸出一張平時自己手繪的遺跡結構草圖，就著油燈微弱搖曳的橘光逐段檢視路徑。\n\n指腹沿著走廊線條向西移動，最後停在一處畫滿虛線與叉號的偏僻迴廊旁。\n\n那行他從資深冒險者酒後閒聊裡記下的小字，此刻在微光下顯得格外刺眼：**『無風迴廊・禁魔死路』**。\n\n## ２\n\n「無風迴廊」的入口，藏在主樓梯西側三十步外的一道狹窄石縫中。\n\n裂口邊緣原本釘著一塊冒險者公會的警示木牌，上頭『廢棄散魔坑道，嚴禁入內』的字樣早已腐朽了大半，歪斜地垂掛在牆角。腳下的積灰厚得淹過靴緣，顯然已經好幾十年沒有人踏足過此處。\n\n軒人站在裂口前，視線從草圖移向漆黑深邃的坑道內部。\n\n這一段岩層摻雜了大量的吸魔灰岩。任何灌注魔力的魔導具只要帶進去，內部的魔力就會像滲入乾沙的水一般飛快乾涸。一般探索者踏進這裡，不只手裡的亮光石會瞬間罷工，連穿戴在身上的魔導風靴、魔導護具都會當場失效，變作沉重累贅的死鐵。店裡的熟客曾提過，早年有幾支抱著僥倖心態的尋寶隊硬闖這條坑道，結果走不到五十步便全身裝備癱瘓、照明全數熄滅，再加上盡頭早在百年前的一場地震裡徹底塌死，裡頭既無魔物也沒有礦脈，久而久之便成了連公會地圖都懶得標註的廢道。\n\n「留在外面撞上那頭山豬也是死路一條，先摸進去看看有沒有通風口吧。」\n\n軒人從剛回收的牛皮側背包裡借出一顆尚存微弱餘光的蓄能照明魔石捏在左掌，重新拉緊帆布工具袋的肩帶，提著鯨油燈邁進積滿厚灰的石縫裂口。\n\n十步，二十步，三十步。\n\n石板路微微朝下傾斜，兩側岩壁的色澤逐漸轉為泛白的吸魔灰岩。才剛踩出第四十步，掌心裡那顆照明魔石便神經質地閃爍了兩下，隨即徹底熄滅，沉成一塊冰冷毫無生氣的灰白石塊。\n\n反觀他右手提著的那盞舊鯨油燈，玻璃罩內的橘黃火苗依舊穩穩燃燒著，沒有半點動搖。\n\n因為體內天生是沒有半點魔力的「空值」，軒人從小就點不亮任何魔導開關，自十一歲起便是提著這盞燒油的普通鐵皮燈進出遺跡的。他身上帶的玻璃鯨油燈、純物理滑輪組，以及腳上那雙靠腳跟撞針擊發壓縮空氣的純機械氣瓶靴，在這片讓所有魔導器瞬間失效的吸魔灰岩帶裡完全不受半點影響。對離開魔導具就連一步都走不動的探索者而言，這裡是連自己指尖都看不見的絕對死地；對他來說，卻跟平常走夜路沒什麼兩樣。\n\n他將熄滅的魔石放回側背包原處，繼續沿著漆黑通道前行了約莫五十公尺。前方的路果真如傳聞所說，被一面直抵天井的坍塌岩壁徹底封死。參差錯落的巨岩重疊堆積，看不出一絲空隙，也難怪過去誤闖進來的人轉頭便走。\n\n軒人卻沒有掉頭。他蹲下身，將鯨油燈緩緩湊近亂石堆最底部的窄縫旁，順手把燈罩的進氣口旋開一半。\n\n在理應死寂無風的封閉坑道裡，火苗只要微微偏斜，石壁後方就藏著吸氣的暗隙。\n\n寂靜無聲的石洞內，原本筆直向上的昏黃火舌在逼近右下角一塊斜楔著的青石時，果真極其細微地朝縫隙深處傾倒了一小截。\n\n「有氣流往裡頭吸……後面是空的。」\n\n軒人眼底亮起一絲神采，擱下油燈，拔出腰間的扁頭拆件短刀，沿著那塊楔形青石的邊緣仔細輕敲了一圈。\n\n刀背碰上岩面，傳回的聲響清脆而帶著中空的迴音。他抬頭細看上方石堆的受力紋理——原來當年坍方時，頂部幾塊巨岩在半空中彼此咬死，撐出了一道天然的三角卸力拱；底下這塊斜插在舊排水拱門裡的青石根本沒有承受上方重量，只是虛楔在門框當中。只要架起滑輪往外拖出幾十公分，就能露出一道足以讓人側身鑽過去的缺口。\n\n軒人立刻從工具袋取出雙輪滑輪組與精鋼鋼索，一端牢牢纏死在後方石柱底座，另一端套實青石的凸角，雙手緊握撬棍插進縫隙，配合滑輪的省力拉力一點一點往外撬動。\n\n死寂的坑道裡只剩下岩面磨擦的沉重悶響與少年克制的喘息。咬牙費力忙了整整十五分鐘，額角滲出一層細密汗珠，那塊不知封堵了多少歲月的楔形青石總算被硬生生拖開了一道足以讓半個人穿過的狹窄空隙。\n\n缺口的另一側，是一條緩緩向下延伸的古老石砌維護迴廊。\n\n軒人俐落收妥滑輪組，拿白粉筆在缺口內側劃下明顯的回程記號，提著鯨油燈側身鑽了進去。\n\n按照舊鐘塔的建築結構推算，順著這條地下維護迴廊往中庭方向走，理應能找到從前工匠用來吊運大鐘構件的垂直通風井。\n\n可是順著石階往下走了不到五分鐘，他的腳步卻不自覺地漸漸放慢。\n\n這條被吸魔岩層與坍方雙重隔絕的地下迴廊裡，地面積灰始終厚實平整，看不見半枚鞋印，也沒有任何近代留下的鑿痕。然而空氣中的潮冷濕氣卻越來越沉，地底深處隱約浮出微弱的流水聲——那是地下暗河的動靜。\n\n穿過一段冗長的螺旋下坡石階後，前方出現了一扇橫斷通道的三重齒輪鐵柵門。\n\n這是一道純機械構造的配重閘門。鐵框外殼早已蒙滿厚灰與乾燥鏽斑，但內部的密封青銅軸套當年以石蠟封護得極其嚴密，並未徹底鏽死。左側石壁上嵌著三個外型一模一樣的生鐵拉環；老工坊設計的配重閘門大多內建防盜木栓，拉錯次序便會當場落栓鎖死。\n\n軒人沒有貿然伸手。他側過頭將耳朵貼上冰涼粗糙的石壁，反握拆件短刀，以刀柄尾端依序輕輕敲擊三個拉環。\n\n嗡、噹、喀。\n\n石牆內部傳來三道長短分明的配重吊索回音。中間那個拉環相連的吊索最短也最輕，左邊次之，右邊最長。\n\n「先拉最短最輕的中間，再拉左邊，最後拉右邊。」\n\n軒人憑著這六年來拆修上百種老式門鎖磨練出的手感，雙手平穩地依循剛才聽出的次序，接連將三個生鐵拉環拉到底。\n\n喀啦、喀啦。\n\n藏在石壁深處的秤錘接連沉墜作響。乾澀刺耳的金屬摩擦聲刮過耳膜，震落簌簌積灰，沉重的生鐵柵門這才沿著滑軌緩緩向兩側退開。\n\n清涼潮濕的水氣伴隨著嘩啦流水聲撲面湧來，一口氣沖散了吸魔坑道裡那股沉悶死寂的陳舊灰味。\n\n閘門後方視野驟然開闊，一座架設在地下暗河上方的石造廊橋出現在眼前。橋身兩側雕著早已被歲月磨蝕模糊的古老齒輪浮雕，橋下漆黑的河水奔湧流淌，嘩啦水聲在寬廣的地底溶洞裡反覆迴盪出層層低鳴。\n\n廊橋對岸，矗立著一座構築於巨大地下溶洞正中央的八角形石造鐘樓底座。\n\n軒人停在橋頭沒有急著跨步，先伏低鯨油燈，將橋面青石逐塊檢視過一遍，確認石板接縫裡既沒有下沉踏板也沒牽絆暗線，這才放輕呼吸走過廊橋，踏進鐘樓底座石拱門內側的半露天採光門廊。\n\n靴底剛落上門廊石磚，軒人的背脊瞬間繃緊了。\n\n右手無聲按上腰間扁頭拆件短刀的刀柄。\n\n這座位於鐘樓底座內側的小型採光天井底下，從上頭裂縫跌落的碎石與碎玻璃並沒有雜亂散落在地，而是被人用某種扁平工具整整齊齊掃到了左側牆根，堆成兩座邊線分明的小堆；石堆旁擺著一盞早就沒油的老式銅燈座——表面厚積的青綠銅鏽竟被人拿粗布擦去了一半，露出底下泛著暗黃光澤的新鮮銅面，連周圍石磚上都留著一圈乾爽的布屑與拂塵痕跡。\n\n那絕不是數百年前遺留的舊痕。裸露出的銅面亮得刺眼，頂多就是這兩三天才擦拭出來的。\n\n隔著吸魔岩層、被坍方封死在外的地下鐘樓底座裡，竟然真的有活生生的人住著。\n\n而在更前方，那扇半掩的厚重青銅大門門縫之間，此刻正悄悄透出一抹溫熱搖曳的橘黃燭光。\n\n## ３\n\n隨燭光一同從門縫漏出來的，還有一陣規律得有些奇妙的「叮、叮、叮」敲擊聲。\n\n聽起來像有人正舉著鐵鎚，不疾不徐地敲打某塊變形的金屬零件。\n\n軒人壓輕腳步湊近那道約三十公分寬的門縫，側過臉往裡面窺探。\n\n門後是一間極為寬敞的圓形地下工坊。穹頂正中央高懸著一具早已停擺的巨型青銅鐘擺，四周弧形石壁立滿直抵天花板的木質陳列架，分門別類排滿了從上層排水道或天井落下的舊器物——生鏽鐵盔、缺口陶罐、斷裂劍身，每一件都被擦拭得一塵不染。\n\n停擺的巨型鐘擺下方擺著一張長木桌，桌面上點著兩根普通的白蠟燭。\n\n一名留著淡粉紅色長髮的少女正坐在桌後的木凳上。\n\n她看起來約莫十六七歲，穿著一襲略顯寬大的灰藍色舊式工作服，袖口工整地挽至手肘，露出一雙白皙得近乎透明的小臂；領口正中央別著一枚銀色五瓣花胸扣，花芯嵌著一顆圓潤白珠，右下角花瓣缺了一小角。\n\n少女微微偏著頭，左手按住桌上一只顯然是從上層水道沖下來的鏽蝕八音盒，右手卻握著一把尺寸誇張、原本用來敲打鐵軌道釘的平頭重鐵鎚，神情專注而一板一眼地試圖將八音盒側面翹起的一片薄銅皮砸回原位。\n\n鐵鎚實在重過頭了，她每敲落一下，整張長木桌便跟著劇烈一震，八音盒內部的發條隨之發出令人牙酸的細碎顫鳴。\n\n修了六年精密器具的職業本能讓軒人看得眼皮直跳，手指沒收住力道，不自覺在青銅門環上磕出一記清脆輕響。\n\n叮。\n\n屋內的敲擊聲應聲斷絕。\n\n木凳上的淡粉紅髮少女幾乎在同一瞬抬起雙眼。右手那柄沉重的平頭鐵鎚非但沒有放下，反倒順勢橫舉在身前，人已無聲無息地站起身。一雙宛如初春櫻瓣般淺淡的粉紅眼眸冷靜而鋒利，筆直釘住了門縫的方向。\n\n「誰在那裡。」\n\n嗓音偏輕，不帶絲毫受驚的尖叫或慌亂，只有長久獨居者才會養出的清冷戒備。\n\n軒人明白繼續躲藏只會被當成擅闖民宅的小偷，乾脆舉起空著的左手，右手提亮鯨油燈，推開半掩的青銅大門走了進去，在距離長木桌七八步遠的位置停下腳步。\n\n「抱歉，嚇到妳了吧。我不是壞人，只是上面店裡的修繕學徒。」\n\n軒人輕拍了拍肩側的帆布工具袋，又朝身後的來路指了指。\n\n「剛才地下二層的主樓梯被魔物撞塌了，我為了找通風井逃生，順著氣流摸索過來的。外頭那道配重閘門我沒有破壞，只是用短刀刀柄敲環聽出吊索長短才拉開的。」\n\n少女仍未放下手中的重鐵鎚。\n\n她的目光先在軒人右手那盞燃著普通鯨油的舊提燈上停留一拍，再緩緩掠過他乾淨無紋的手背與胸口，細眉微微蹙起。\n\n「外面的吸魔坑道已經坍塌了很久。沒有魔導燈，也沒有白塔標註的地圖，你怎麼找到那道暗門的？」\n\n「因為我天生沒有魔力，從小就一直提著這種普通的鯨油燈。」軒人晃了晃手裡搖曳著暖光的鐵皮燈，「外面的石牆雖然塌死了，但火苗靠過去時往縫隙裡偏斜了一小截，我就知道後面通風，架起滑輪把底下的石塊拖開鑽了進來。」\n\n少女凝視著那盞鯨油燈靜靜看了好幾秒，像在仔細確認他身上確實不存在半分魔力波動，也沒有隱藏任何白塔制式魔導具。\n\n片刻後，她緊繃的肩線總算微微放鬆，將那把與纖白手腕極不相稱的重鐵鎚放回木桌。\n\n「三百年來，你是第一個從正門走進來的人。」她說。\n\n「三百年……？」軒人微微一怔，打量著眼前這名年紀與自己相仿、臉頰在燭光映照下分明透著溫度與生氣的少女，心底暗暗嘀咕——這座地下工坊既沒有日曆也不見天日，這名少女八成是一個人獨自待在這裡太久，把幾個月或幾年誤記成了三百年。\n\n他沒蠢到當面拆穿，只是順著話頭溫聲問道：「妳一個人在這下面住了很久嗎？」\n\n「大多數時候都在後面的石室裡睡覺。只有水聲變大，或是上頭有東西掉下來時才會醒。」\n\n少女低頭瞥了一眼桌上那只被自己砸得微扁的八音盒，伸手想把翹起的薄銅邊壓回去。可指尖剛觸及銳利的銅緣，她卻像忽然想起了什麼，迅速將手指縮回灰藍色工作服的袖口裡。\n\n「通風井在後面那扇鐵門外面。」她抬起左手，指向圓形工坊右後方一條向上延伸的石道，「不過前天半夜地底震動過一次，通風井底下的排水閘被落石卡死了，暗河的水正不斷往石道裡倒灌。你如果游得過去，順著鐵梯就能爬回地面。」\n\n軒人順著她指的方向望了過去。\n\n他這才注意到圓形工坊右後方的地勢比中央低了約半公尺。漆黑冰冷的暗河水早已漫過最底部的三級石階，水位正以肉眼可見的速度緩慢上漲。再拖上兩小時，這張長木桌連同整間地下工坊恐怕全都會泡進水裡。\n\n「水都快漫到桌腳了，妳居然還坐在這裡敲八音盒？」軒人睜大眼睛，「妳不打算一起從通風井出去嗎？」\n\n「我出不去。」\n\n少女重新在木凳上坐下，口吻平淡得像在報告今日的天氣。\n\n「這座房間刻著限制結界。只要我踏出鐘樓底座的範圍，胸口的花扣就會強制切斷我的意識，把我送回後方的石室。」\n\n「那水淹上來怎麼辦？」\n\n「回石室的高台繼續睡，等哪天水退了再醒。」\n\n軒人聽得一時語塞，只覺得眼前這名少女不只記亂了年份，連一般人最起碼的生活常識都欠缺得離譜。\n\n他走去右後方的積水邊緣蹲下身，舉高鯨油燈往漆黑水底照去。清冷的暗河水下一公尺深處，果真立著一扇青銅排水閘；一塊前天震落的長條石死死橫卡在閘門齒輪之間，將本應流向下游的河水全堵回了工坊裡。\n\n「妳前天沒試過把那塊石頭推開嗎？」軒人回頭問。\n\n「試過。」少女的語氣毫無起伏，「那塊石頭浸在水裡重得驚人，我空手推不動，這裡也沒有撬棍。反正水淹上來也不會壞。」\n\n軒人無聲吐了口氣。這話聽起來有些荒唐，卻又莫名契合她那副清冷淡漠的氣質。\n\n只要拿撬棍把卡死齒輪的長條石頂落，積水十分鐘內就能排淨，通往通風井的石道也會乾爽地露出來。\n\n他起身回到長木桌旁，卸下帆布工具袋擱在桌角，從裡頭翻出一把最小號的木柄平口鉗與一柄精巧的黃銅小鎚，順著桌面輕輕推到少女手邊。\n\n少女垂眸看著那兩件巴掌大的工具，抬眼望向他：「這是做什麼的？」\n\n「修八音盒用的。」軒人指了指旁邊那柄鐵軌重鐵鎚，「那麼薄的銅皮得用小鉗子咬住邊緣慢慢收回去，拿重鐵鎚硬砸，裡面的音梳早就被震斷了。」\n\n他一邊說著，一邊彎腰解開小腿的綁腿布，準備捲起褲管涉水。\n\n「我叫不破軒人，在上面的『晚鐘亭』當修繕學徒。借妳這條路逃生，就順手幫妳把卡住水閘的石頭撬掉，免得妳真的得泡在水裡睡覺。對了，該怎麼稱呼妳？」\n\n少女看著桌上那把被掌心磨得溫潤光滑的小木柄平口鉗，靜默了兩秒，伸出左手將它拾了起來。\n\n「我叫Eraser。」她說。\n\n「Eraser？很少見的名字呢，是舊時代的語言嗎？」\n\n「是抹消的意思。」她握住平口鉗，試著輕夾八音盒翹起的銅角。這一回沒有發出半聲刺耳震響，薄銅皮服服貼貼地合回了原位。她的語氣依然平直得像是在朗讀器物銘牌上的規格說明，沒有半分遮掩或防備，「因為我不是人類。我的手碰到正在運作的術式，就能把它徹底抹消。從前造出我的工匠，就是這麼叫我的。」\n\n正彎腰捲著褲管的軒人動作微微一頓，低頭瞥了一眼自己乾淨無紋的手背，又抬起頭看了她一眼。\n\n他自己是手碰上去連普通魔導燈都點不亮的「空值」，眼前這名少女卻自稱是手碰上去會把運作中術式直接抹消歸零的「零號」——這世上哪有這麼奇妙又古怪的對比。\n\n暖黃燭光落在少女白皙的臉頰上，呼吸平穩清晰，怎麼看都像個活生生的人類女孩。他只當她是自小被某個脾氣古怪的魔導師留在地下室裡長大，才被灌輸了一腦袋稀奇古怪的說法，於是笑著點了點頭：「好，那妳就在這裡慢慢修八音盒吧，我去把水放掉。」\n\n那一刻的他，根本沒有把那句話當真。\n\n## ４\n\n暗河的積水比軒人預料得還要冰冷刺骨。\n\n他將褲管捲到大腿上方，踏進齊膝深的冷水，將鯨油燈掛在旁邊凸出的石筍上，深吸一口氣彎腰探身，把精鋼撬棍伸進水面之下，精準卡向橫死在齒輪間的長條石。\n\nEraser沒有繼續坐回桌前。她端起白蠟燭走到乾爽的石階邊緣，安靜地替他照亮水下的齒輪縫隙。\n\n「往左撬開幾公分。」她垂眸凝視著水底的機械構造，「那塊石頭底下原本留有導軌槽，推進槽裡就不會再滑出來。」\n\n軒人依言將撬棍向左一轉，雙臂壓沉發力。\n\n咕嚕——水底傳來一聲沉悶滾動。卡死的長條石終於鬆脫，順勢滑進導軌槽，沉入深坑之中。\n\n然而長條石清開了，青銅水閘卻依然一動也不動。軒人冒出水面抹開滿臉冰冷河水，盯著水閘背後漆黑幽深的涵洞皺起眉頭：\n\n「奇怪，石頭明明已經落槽了，怎麼水閘葉片還是像被什麼東西從背面吸住一樣？」\n\n站在石階上的Eraser將白蠟燭往前探近了幾公分。\n\n搖曳燭火穿透晃動的水波，落進水閘背後的暗縫之中，她那雙淡粉色的眼眸驟然一凝。\n\n「不是卡住。涵洞裡有頭從上層水道鑽進來的魔物，正死死咬著閘門後面的熱水管。」\n\n話音剛落，水閘背後猛然炸起大片沸騰翻湧的白浪。\n\n刺耳欲裂的金屬撕扯聲劃破工坊。兩隻披滿青灰石甲、前彎如鐮刀般的巨型骨爪驟然從涵洞探出，死死扣住數百公斤重的青銅閘門上緣，竟硬生生將厚重的銅板掰彎了一角。\n\n緊接著，一頭身形扁寬、猶如巨型河蟹般的魔物硬擠出涵洞。令人毛骨悚然的是，牠的甲背正中央竟詭異地嵌著半截舊式青銅鍋爐殼。\n\n鍋爐殼縫隙裡透出滾燙的暗紅光紋，將周遭冰涼的水氣蒸得滋滋作響。軒人腦中飛快閃過一個念頭——那八成是舊鐘塔底層報廢的恆溫術式殘片，被這頭棲息在暗河裡的大傢伙連殼嵌進背甲裡當作熱巢，最終異變成了只要感應到活人熱源便瘋狂嗜殺的怪物。\n\n「退上來！」\n\nEraser的左手果斷一把揪住軒人的工具腰帶。就在巨大骨鉤橫掃水面的極限瞬間，她借勢往後猛拽，軒人順勢蹬水躍回乾爽石階。\n\n轟。\n\n他方才立身的水面被骨鉤硬生生劈開兩道白浪。巨蟹魔物八足齊動，龐大的青銅背甲撞碎水沿石欄，挾著腥熱撲鼻的濃霧爬上圓形工坊地面，不偏不倚橫堵在通風井與長木桌之間。\n\n「背上那塊發紅的鍋爐殼，就是驅動它的術式核心。」\n\nEraser將白蠟燭穩穩放上石階，伸手褪去右手的薄布手套，露出一隻纖細白皙的掌心。\n\n「尋常刀劍殺不死它，只要紅光還在燃燒，就算砍斷爪子也會靠魔力接回。你退到鐘擺後面的高台去，我過去直接碰觸那塊紅光，就能把它抹掉。」\n\n「等等，別過去！」\n\n軒人伸手一把拉住她的左腕，將她穩穩拉回自己身側，目光死死盯著那頭不斷噴吐滾燙白霧的巨蟹。\n\n「那塊紅光嵌在鍋爐殼裡面對吧？外層不但鎖著鐵蓋，縫隙裡還有一整圈高速旋轉的青銅散熱葉片，前面更有兩隻一公尺長的鐮刀骨爪護著。妳沒武器也沒有護具，空手衝上去，指頭還沒摸到核心，整隻手就先被葉片絞爛了。」\n\nEraser微微偏過頭看他，語氣平淡得沒有一絲起伏：「散熱葉片只會割破手背，割不斷手腕。只要指尖碰到裡面的核心，這點外傷很快就會好——」\n\n「拜託妳別把『割破手背』說得像被蚊子叮了一口一樣輕描淡寫！」\n\n軒人胸口猛地湧上一股難以壓抑的悶火，直接打斷了她。\n\n直到這一刻，他才徹底明白方才她在桌邊為何下意識縮回手指。在這個不知被誰遺忘在地底三百年的少女認知裡，只要能夠抹除眼前的威脅，自己的手是否會血肉模糊、被高溫燙出焦泡，從來都不在她的計算範圍之內。\n\n「聽好了，Eraser。現在這裡有兩個人，輪不到妳拿自己的手去餵葉片。」\n\n軒人微退半步，視線如鷹隼般飛快掃過工坊中央高懸兩公尺、重達數噸的巨型青銅鐘擺，接著落回自己腳上那雙純機械氣瓶靴的靴跟氣罐。\n\n因為體內是沒有半分魔力的「空值」，點不亮市面上的魔導風靴，這雙靴子是他與店主千歲聯手改裝出來的純機械裝備——三枚壓縮到極限的靴跟氣罐，只要踩落黃銅踏扣、以腳跟撞針擊發壓縮空氣，便會噴出高壓氣流，能為使用者換來三次短促而極具爆發力的直線加速。\n\n「我問妳，如果我能把牠那兩隻大爪子拖住，再撬開背上的鐵蓋、把散熱葉片卡死，妳需要幾秒才能把裡頭的核心抹掉？」\n\nEraser的目光掠過他腰間的扁頭拆件短刀，又望回躁動嘶鳴的巨蟹背甲。\n\n「只要蓋子打開、葉片停下，碰到核心只需要一秒。」\n\n「一秒——足夠了。」\n\n軒人左手從工具袋抽出二十公尺長的精鋼鉤索與兩枚硬木楔子，右腳向後微錯半步，靴跟的黃銅踏扣清脆地磕上青石板。\n\n「妳退到長木桌後面，看準我的信號再衝上來。在我喊妳名字之前，絕對不准自己伸手，聽明白了嗎？」\n\nEraser望著擋在身前、明明體內沒有半點魔力卻將整個戰場的調度全攬在肩上的少年，靜默了半拍，輕輕點了點頭：「聽明白了。」\n\n就在同一瞬間，巨蟹背甲爆出猶如蒸汽汽笛般的尖銳嘶鳴。\n\n八條石甲步足同時蹬裂青石地磚，兩隻鐮刀骨鉤交錯如巨鍘，挾著凌厲破風聲朝石階迎頭劈落。\n\n軒人沒有往後退。\n\n惡風壓臉的剎那，他狠狠踩落右靴的第一顆氣罐踏扣。\n\n嗤——\n\n高壓氣流驟然炸離靴底，狂暴的反作用力震得腳掌一陣發麻。他的身體貼著地面向左斜滑出三公尺，冰冷刀風幾乎擦著額前黑髮削過，兩道石甲骨鉤轟然砸空，將他剛才站立的青石階硬生生削出一排慘白的深槽。\n\n幾乎在同一拍，軒人左手俐落地甩出精鋼鉤索。飛爪沒有射向魔物，而是劃破滾燙水霧直射半空，「喀」地一聲牢牢咬住巨型青銅鐘擺底部的銅掛環。\n\n巨蟹一擊落空，石爪刨裂石磚調轉身軀，龐大的青銅背甲推開滾燙白霧，直朝鐘擺正下方狂撲而去。\n\n就是這個軌跡。\n\n軒人不再閃避，右靴重重踩下第二顆氣罐踏扣。\n\n嗤——\n\n白霧噴湧，氣流推得他拔身斜竄而起。左靴在旁邊高聳的木質陳列架邊緣精準一蹬借力，整個人在半空中俐落翻折。躍過高空的短短一瞬間，左手順勢將繃直的精鋼鋼索繞過木架頂端支柱兜出半道活扣，擦著巨蟹頭頂呼嘯掠過的剎那，精準無誤地將索尾鐵環套死在魔物高高揚起的左爪骨鉤尖端。\n\n人還未落地，軒人已斜撲向鐘擺側面四公尺高的固定架台。\n\n三百年前停機時，這具數噸重的青銅鐘擺並非以繩索懸掛，而是靠一根粗鐵打造的保險插銷硬生生卡死在弧軌起點；經過三個世紀的地底潮氣侵蝕，那根插銷早已鏽得千瘡百孔。\n\n軒人左靴踩實狹窄的架台邊緣，右手迅速拔出扁頭拆件短刀，將扁口深深楔進鏽蝕插銷的卡縫裡。這場賭注沒有第二次機會——他咬緊牙關，傾注身體下墜的全部重量，將右肩連同腰背肌肉絞成一股，死命往外一撬——\n\n喀崩。\n\n鏽透的粗鐵插銷應聲崩斷，暗紅鐵屑在燭光下四散飛濺。\n\n一股野蠻狂暴的反震力沿著刀柄直灌右肩，肩胛深處頓時竄起一陣撕裂般的酸麻劇痛。軒人咬牙借勢躍下架台，靴底卻不巧落上沾滿暗河青苔的潮濕石階，腳下猛然一滑，右膝重重磕在粗礪的石稜之上。粗布褲管當場磨裂，火辣辣的劇痛隨即炸開，滲出一片黏熱血痕。\n\n轟隆——\n\n脫離鎖扣的數噸青銅鐘擺徹底失去束縛，撕裂沉悶空氣發出低沉轟鳴，沿著弧形銅軌朝前方呼嘯擺出。\n\n相連於鐘擺底部的精鋼鋼索瞬間繃成一根劇烈顫鳴的鐵線。無可抵擋的巨力硬生生將巨蟹的左爪拽上半空，連帶著牠龐大沉重的身軀離地側翻半邊，「砰」地一記震天巨響，狠狠撞進鐘擺基座的石柱之中。\n\n巨蟹在半懸空的失衡狀態下瘋狂掙扎，空著的右爪胡亂揮砍半空鋼索，背上的鍋爐殼鐵蓋劇烈震顫，噴出一團團灼燒肺腑的滾燙白煙。\n\n「最後一發。」\n\n軒人咬緊後槽牙，強行壓下右膝火燒般的刺痛與右肩傳來的鈍震，胸口劇烈起伏，不等雙腳站穩便狠踩第三顆、也是最後一顆靴跟氣罐。\n\n高壓氣流暴湧炸開。他整個人貼著石柱斜衝而上，雙靴重重踩實魔物劇烈搖晃的石甲背。\n\n滾燙白霧撲面而來，烤得臉頰皮膚彷彿隨時會脫層皮，就連吸進氣管的空氣都帶著焦灼鐵味。軒人死屏呼吸，盯緊鍋爐鐵蓋在噴氣時微張的一線空檔，將左手緊握的兩枚硬木楔子從側面狠狠釘了進去——硬木楔不僅死死頂住鐵蓋回落，更直直楔入內側的傳動齒環，爆出一陣令人頭皮發麻的尖銳刮響，將裡頭呼呼飛轉、足以削斷手指的青銅散熱葉片硬生生卡得徹底停轉。\n\n右手扁頭拆件短刀隨即插進蓋板鎖扣縫隙裡，雙臂青筋直繃，忍著右肩宛如撕扯般的銳痛往外死命撬開。\n\n喀嚓——崩。\n\n高溫發紅的鐵蓋鎖扣應聲炸裂，蓋板被迫卡停在半張的角度。強烈的反震力震得他虎口發麻，精鋼打造的短刀刀尖終究沒能扛住硬扣的反彈，清脆地崩掉了一小口。\n\n然而蓋板底下那枚燒得如融鐵般劇烈搏動的暗紅術式核心，終於毫無遮擋地暴露在空氣之中。\n\n「Eraser，就是現在！」\n\n軒人單膝壓住滾燙背甲，以崩了口的短刀刀脊死死頂住仍試圖回彈的鐵蓋，啞著嗓子朝長木桌方向高喊。\n\n一道淡粉色的輕盈身影幾乎與喊聲同時掠過斷裂的石欄。\n\n灰藍衣襬在濃白蒸汽之中俐落一翻。她無聲落地於軒人身側，神情冷靜得近乎透明，白皙右手精準穿過被短刀撐開的狹窄縫隙，五根細長手指平穩而毫不猶豫地按在了那塊暗紅核心的正中央。\n\n軒人下意識繃緊臂肌，只怕她的手掌碰上至少三百度的高溫會瞬間焦黑綻裂，隨時準備一把將她扯開。\n\n然而下一秒，整座地下工坊的時間彷彿被人伸手按停了。\n\n滋——\n\n那聲響輕得像深冬第一場初雪靜靜落入炭火。\n\n一圈純白無瑕的微光自少女指縫之間悄然溢開，既不燙手，也沒有掀動半絲氣浪。\n\n在白央城裡，凡是已經啟動的魔力核心，要不是等待內部魔力燃燒殆盡，就是得由數名高階魔導師聯手壓制數小時，絕無半途戛然熄滅的道理。\n\n可就在這一刻，那塊足以熔穿生鐵、連呼吸都烤得灼痛的暗紅核心，在觸及少女指尖短短一秒之內，竟宛如被橡皮擦輕輕拭去的炭筆字痕，連一星火花都未曾炸起，無聲無息地化作一縷冰冷白灰，隨潮濕氣流飄散無蹤。\n\n強行驅動著魔物的暴走魔力瞬間斷絕，巨蟹眼中的狂暴紅光隨即熄滅。龐大身軀軟垂下去，背上吸附的青銅鍋爐殼嘩啦脫落砸在石板上。那頭怪物晃了晃觸鬚，倒像隻受了驚嚇的尋常大河蟹，縮起被拽痛的左爪，順著方才清開的水閘涵洞灰溜溜地退回了暗河深處。\n\n## ５\n\n涵洞徹底暢通，工坊地面的積水打著旋急排而出，不出兩分鐘，通往後方通風井的石階便已乾爽地露了出來。\n\n軒人卻仍單膝跪在落地的空鍋爐殼旁邊，緊盯著裡頭空空如也、連一絲餘溫都未留存的爐芯槽，足足僵了五秒才找回自己的聲音。\n\n「……真的消掉了？」他仰頭望向站在石柱陰影旁的少女，聲音裡滿是難以置信，「那可是正在暴走的高溫術式核心，連討伐隊的騎士都不敢空手靠近。妳連咒語都沒唸，碰一下就沒了？」\n\nEraser緩緩收回右手，安靜垂在身側。\n\n軒人這才看得無比清晰——在她白皙近乎透明的掌心到腕部皮膚底下，浮現的根本不是人類青紅交錯的血管，而是五六條宛如精密銀絲般發著微光的幾何紋路。或許是因為剛才核心高溫的反衝，那些銀絲此刻正透著異常的暗紅燥光，連帶她的小指也微微發麻蜷縮。\n\n凝視著那截皮下流轉的非人微光，軒人的呼吸陡然一窒。\n\n方才在長木桌前，她用毫無起伏的語調吐出的「不是人類」「待了三百年」「工匠造出來的抹消器」——竟然連一個字都不是胡話。一個是手碰上去連普通魔導燈都點不亮的「空值」，一個則是手碰上去會把運作中術式直接抹消歸零的「零號」，竟真的在這座被遺忘的地底工坊裡撞在了一起。\n\n「我沒有騙你。」Eraser望著他僵住的神色，默默將右手縮回灰藍袖管，語氣依舊淡得聽不出一絲情緒，「只要碰到術式的起筆處，我就能把它抹消。現在你親眼見到了。如果覺得可怕，通風井的路已經乾了，你可以自己先上去。」\n\n軒人微怔，望著她那副早已習慣、彷彿隨時準備好被人留在原地的清冷模樣，胸口殘留的那點震駭，轉瞬便化為一股說不出的悶痛與怒氣。\n\n「誰說覺得可怕了？我是驚訝妳這麼厲害好嗎！」\n\n軒人忍著右膝抽痛站起身，大步走回長木桌抓起自己的鋁製水壺，倒出涼開水浸濕一塊乾淨方巾，隨即走回她面前，直接從袖口拉出她藏起的右手，放輕手勁替她包覆住發燙的掌心降溫。\n\n微涼濕布貼上肌膚的那一瞬間，Eraser的指尖微微一縮，抬起淡粉色眼眸望進他眼底：「……你不怕嗎？我手裡面不是血管，是導魔迴路。」\n\n「導魔迴路燒紅了也一樣會痛吧？剛才妳的小指都在發抖了。」\n\n軒人替她將方巾四角仔細繫成一個鬆緊適中的活結，確認不會滑落，這才微鬆了口氣，轉身去撿掉在水沿的青銅鍋爐殼，打算帶回去請千歲鑑定這究竟是什麼年頭的舊東西。\n\n然而就在他將鍋爐殼翻轉過來、鯨油燈的昏黃光線落入內壁的剎那，他手上的動作徹底僵住了。\n\n這塊他剛才還以為是舊鐘塔老舊報廢件的青銅殼內側，赫然刻著一道嶄新、連金屬切緣都仍泛著銳利冷光的新鑿痕。\n\n鑿痕旁是一行清晰工整的小字：\n\n**『七號支爐外溢測試・十月十二日』**\n\n十月十二日——僅僅四天前。\n\n一股寒意順著軒人的背脊瞬間攀升。\n\n原來他從一開始就全猜錯了。這塊將暗河巨蟹逼瘋、堵死排水閘的術式殘片，根本不是數百年前舊鐘塔自然脫落的古董，而是四天前有人蓄意從上游暗河投放進來的活體測試件。\n\n暗河下游筆直通向這座鐘樓底座。要是繼續留在這下面，天曉得上頭那些人下一次還會順水沖進來什麼更要命的東西。\n\n軒人不露聲色地將這塊刻著日期的青銅殼收進工具袋最底層，轉過身，仰頭望向圓形工坊正中央那具巨型青銅鐘擺上方的機芯箱。\n\n「Eraser，妳剛才說不准妳離開鐘樓底座的限制結界，刻在什麼地方？」\n\nEraser順著他的目光抬頭，指向鐘擺頂端四公尺高處那座八角形黃銅封匣：「在機芯匣裡面的母板上。怎麼了？」\n\n「妳既然能抹消術式，以前怎麼沒自己爬上去把它抹掉？」\n\n「那是上下連動的機關。」Eraser指向鐘擺基座兩側的兩塊厚重鐵踏板，「必須有人站在地面，雙腳同時踩住這兩塊鐵踏板不放，上方四公尺高處的黃銅匣蓋才會滑開；底下腳一鬆開，蓋子就會立刻合攏。」\n\n她仰望著高懸於陰影裡的黃銅匣，聲音依舊清淡得沒有絲毫波瀾：\n\n「我只有一個人。踩著下面的踏板，手就搆不到四公尺高的橫樑；爬到橫樑上，下面沒人踩踏板，蓋子便打不開。我以前試過搬石頭去壓，但踏板底下裝了防壓彈簧鎖，死石頭壓超過五秒就會被彈回，必須有活人站在下方隨時憑腳力調整重心才行。」\n\n軒人低頭看向兩塊冰冷的鐵踏板，再抬眼望向四公尺高處的黃銅封匣，胸口彷彿忽然被什麼東西輕輕撞了一下。\n\n原來這並不是什麼無法破解的古代高階秘術。\n\n那是一道從設計的那一天起，就篤定「這間地下室永遠只有她孤零零一個人」的雙人連動機關。只要沒有第二個人走進這裡替她踩住底下的踏板，她就算擁有一雙能將一切術式歸零的手，也永遠被困在這四公尺的距離之內。\n\n「那這道鎖今天算是遇上剋星了。」\n\n軒人忍著右肩隱隱傳來的發酸抽痛走回基座旁，將剛剛收回的精鋼鋼索拋過頂端橫樑的滑輪，俐落繫出一個方便攀踩的腳踏繩環。\n\n「這下面的水道已經被外面的人盯上了，繼續留著太危險。妳先順著滑輪爬到橫樑邊等著；我在底下替妳踩穩踏板。蓋子一開，妳就親手把那個留駐印記抹掉——然後我們一起去地面。」\n\nEraser望著垂落在面前的精鋼繩環，明顯怔住了。\n\n「去地面……？可我在地面上沒有戶籍登錄，也沒有錢。」\n\n「真巧，我們『晚鐘亭』二樓剛好空著一間儲物間，店主千歲姊最近總是抱怨我一個人跑外勤忙不過來，正想找個認得舊器物的人幫忙看店呢。」\n\n軒人用靴尖輕輕點了點基座旁的鐵踏板：「快上去吧，踩踏板這種事我最拿手了。」\n\nEraser仰頭望向高處的橫樑，又低頭看了看站在暖黃燈影裡的少年，靜默兩秒，伸出沒受傷的左手牢牢抓緊鋼索，動作輕盈俐落地借滑輪攀上四公尺高的機芯橫樑。\n\n等她在窄台上站穩腳步，下方的軒人深吸一口氣，雙腳穩穩踏上兩側鐵踏板，刻意忽略右膝傳來的細微拉扯感，順著底下彈簧回推的力道靈巧微調重心，將兩塊厚重踏板死死壓到底端。\n\n四公尺高處，封死了整整三百年的八角形黃銅封匣發出一記清脆機括聲，雙側外蓋緩緩滑開，露出裡頭刻著『零號抹消器・定點留駐』的暗紅銅板。\n\n「開了，動手吧！」軒人在底下揚聲道。\n\n橫樑上的Eraser凝視著那塊自己獨處三個世紀都無從觸及的母板，緩緩伸出左手食指，安靜而堅定地按在了頭一筆刻痕上。\n\n啪。\n\n一聲極輕微的脆響。\n\n母板上的暗紅字跡轉瞬褪作冰冷白灰，順著橫樑細細飄落。幾乎在同一時間，圓形工坊四壁上那層維持了三百年的微弱結界光膜，如同碎裂的水泡般無聲消散在潮濕空氣裡。\n\n兩人順著鋼索滑落地面。\n\nEraser走回長木桌旁，將那只剛修好一半的八音盒、還有她平日翻得起毛邊的《白央散步指南》小心裝進軒人借給她的小布袋，提在左手腕間。\n\n在踏上通往通風井的石階前，軒人忽然停下腳步，轉過身看著她，神色少見地凝重而嚴肅。\n\n「對了，Eraser，在上去之前有一件事妳一定要先答應我——等一下爬出通風井到了地面上，除了我們店裡的千歲姊之外，妳絕對不准跟任何外人提妳不是人類，更不准當著外人的面用這雙手抹消術式。」\n\nEraser抱著小布袋，微微偏過頭：「為什麼？」\n\n「因為在地面上，連一塊三百年前的破銅片都能在黑市炒出天價。要是走漏風聲，讓人知道妳是古工坊留下的活體造物、一伸手就能把任何術式歸零，不管是黑市捕奴隊還是白塔上層的研究院，當天夜裡就會派上百名精銳來抓妳，把妳關進鐵籠裡拆解研究。」軒人指了指她右手腕上的濕方巾，「到了外面，不管誰問起，妳就說妳是我從鄉下來投靠的遠房表妹，手腕只是不小心被開水燙傷。聽明白了嗎？」\n\nEraser垂眼凝視了腕間帶著涼意的方巾片刻，靜默兩秒，輕輕點頭：「聽明白了。不跟外人說。」\n\n軒人這才放心下來，提著鯨油燈走在前面，帶著她踏上了通往通風井的石階。\n\n## ６\n\n推開通風井頂端的鐵柵欄爬出地面時，天色正值黃昏。\n\n舊鐘塔遺跡坐落在城外西側的半山腰上。金紅色的夕陽餘暉鋪滿漫山遍野的秋草，遠方河谷底下的階梯城鎮已經點亮成排靠地下支爐管線供能的黃銅魔導街燈，沁涼的山風裹挾著烤麵包的麥香、河水濕氣與草木清香，迎面拂過臉龐。\n\n軒人先把那只裝著銀殼懷錶的棕色牛皮側背包妥善掛回腰側，一回頭，看見Eraser正停在井口石階上，一動不動地望著遠方。\n\n微涼的暮風掀起她長及腰際的淡粉紅色長髮，幾綹柔軟髮絲輕輕掠過白皙臉頰。\n\n她慢慢抬起左手按住被風吹散的長髮，垂眸看向自己踩在山坡泥土與秋草間的鞋尖，試著向前邁出一步，接著緩緩回過頭，安靜凝視著鬆軟泥地上留下的那枚清晰腳印。\n\n沒有結界攔阻，也沒有將意識強制拖回地底的力量。\n\n「怎麼了？山風太冷嗎？」軒人折回兩步問。\n\n「不是。」Eraser鬆開按住長髮的手，目光遠遠落在山腳下燈火漸次亮起的層疊街區，聲音輕得像融在晚風裡，「從前在下面，只有天井飄落葉進來時，才知道外頭已經是秋天了。這是我第一次從外面看見鐘塔的屋頂。」\n\n偏偏就在這個安靜的瞬間，一聲清晰的「咕嚕」從她腹間傳了出來。\n\nEraser依舊維持著遠眺城鎮的姿態，微微一頓，這才低頭瞄了一眼自己的肚子，白淨臉上浮現一抹極其認真的困惑：「……剛才在下面明明不餓的。」\n\n「一口氣爬了三十公尺高的直立鐵梯，不餓才奇怪吧。」\n\n軒人忍不住失笑出聲，從工具袋的乾糧格裡摸出一包油紙包著的蜂蜜核桃餅——那是今早出門前千歲塞給他防餓的點心，還剩了大半包。\n\n他剝開油紙遞過去：「先拿這個墊墊胃。等一下下山把側背包還給委託人、領了那四枚銅幣，順路去巷口買兩個油紙包著的熱餡餅帶回去。」\n\nEraser接過那塊綴滿碎核桃與蜂蜜糖霜的圓餅，先謹慎地在邊緣咬了一小口。\n\n酥脆溫潤的香甜在舌尖化開，她淡粉色的眼眸微微睜大了一點，隨即垂下視線，第二口便毫不客氣地直接咬在了蜂蜜刷得最厚實的地方。\n\n軒人假裝什麼都沒看見，轉過身替她撥開山道旁橫生擋路的秋日蘆葦。\n\n「走吧，石階沾了晚露有點滑，跟緊我。回到『晚鐘亭』之後，得先讓千歲姊替妳把右手掌心的熱痕敷層藥才行。」\n\n「那個，睡一晚自己就會退了。」\n\n「在我們店裡，手痛就得乖乖擦藥，這一點沒得商量。」\n\n金紅夕陽將一高一矮兩道身影拉得細長，斜斜映在蜿蜒下山的石階上。少女懷裡妥善護著裝書與八音盒的小布袋，安靜小口嚼著甜餅，一步一步跟在提著鯨油燈的少年身後，走進了山腳下溫暖明亮的城鎮燈火裡。\n\n——第一章完——\n", "mtime": 1795001755.4659019}, {"filename": "02_第二章_兩個人的房租與第一份工錢.md", "content": "", "mtime": 1795003123.2097545}, {"filename": "03_第三章_灰鐵巷的便服與微溫的井水.md", "content": "", "mtime": 1795003123.2107558}, {"filename": "04_第四章_暗渠裡的舊銘板與封巷的靴聲.md", "content": "", "mtime": 1795003123.211755}, {"filename": "05_第五章_橋上的黑釘與白塔的算術.md", "content": "", "mtime": 1795003123.2137544}, {"filename": "06_第六章_沉沒工坊的殘響與山坡上的紫星果.md", "content": "# 第六章　沉沒工坊的殘響與山坡上的紫星果\n\n## １\n\n天還沒亮透，河岸斷層邊緣的舊貨運門前，已經籠罩在一層白茫茫的晨霧裡。\n\n十月二十五日清晨五點，冷霧貼著河面緩緩翻湧，吸進肺裡帶著生鐵與濕泥的寒氣。兩名總站派來的巡查員站在門外，正低頭檢視貨運門上方原就架好的高處吊索絞盤，將雙路安全繩逐一穿過滑輪、拉緊試扣。兩人動作熟練俐落，臉上沒有多餘的表情，交談時嘴邊吐出筆直的白氣，目光時不時掠過站在霧裡的少年與少女，透著總站人員一貫不帶私情的戒備。\n\n然而，透過那扇半開的生鐵貨運門往裡望去，門內卻是一條被三百年前的夕陽染成暖橘色的古老石板街。\n\n門外是清晨五點的深秋冷霧，門內卻停駐在三百年前傍晚五點二十分的黃昏裡。\n\n真崎夜一將一塊厚重的黑帆布掛上貨運門左側的支架，讓門框與地面之間的陰影連成完整的一片。他摘下左手手套，將左掌平平按進黑布投下的陰影裡。腕間漆黑的紋路順著鐵框無聲爬行了一圈，原本在晨霧中微微浮動、像是隨時會散開的門內光景立刻定格下來，凝成一幅被釘在牆上的舊油畫。\n\n「入口已經釘住了。你們從這扇門進，也必須從這扇門出來。」夜一低頭瞥了一眼懷錶，「我最多能維持兩個小時，六點五十分之前必須回到白線外面。」\n\n軒人將左右兩條不同顏色的安全繩分別扣在腰帶兩側的鐵環上，往後輕拉三下。門外的兩名巡查員各自回拉確認，他這才拿起掛在胸前的方形魔導傳聲器，按下側邊純機械結構的通話鍵——總站配發的傳聲器內嵌獨立小魔石，不需要使用者自身注入魔力，只要壓下物理簧片就能接通迴路，是少數連「空值」的他也能順手操作的制式裝備：\n\n「聽得到嗎？」\n\n夜一瞥了一眼腳旁的接收盒：「講完話要把按鍵放開，不然收不到外面的聲音。」\n\n軒人連忙鬆開拇指。接收盒裡很快傳出夜一清晰而冷淡的嗓音：「現在通了。記住，每隔十分鐘報一次位置；要是傳聲器失聯，不要繼續往前走，立刻退回上一個能通話的轉角。」\n\nEraser站在軒人身旁。她穿著在灰鐵巷買的素色粗棉便服與微立領開襟外套，衣領扣得整整齊齊，淡粉紅色長髮用深藍色髮帶束在身後，左手腕依然固定著杉木夾板，右手則提著一只空布套；至於照明，因為沉沒工坊內部充滿高濃度的支爐外溢魔力，一般靠指尖魔力觸發的魔導提燈進去就會頻頻閃爍失靈，反倒是軒人平時因為「空值」點不亮魔導器而隨身攜帶的玻璃鯨油燈最不受干擾，千歲便另外替Eraser也準備了一只輕便的防風鯨油燈。今天她沒有帶那本舊書，布套裡只放著抄好的舊工坊平面圖，以及半截粗桿鉛筆。\n\n夜一指了指門檻下方用粉筆畫出的白線：\n\n「跨過這條線，裡面的街道就是支爐外溢魔力維持的『過去殘響』。不要隨便觸碰看起來像活人的影子，更不要跟著他們走進沒有安全繩的地方。」\n\n兩人點了點頭，並肩跨過了那道白線。\n\n## ２\n\n靴底踏上門內石板路的那一瞬間，河岸邊濕冷刺骨的晨霧彷彿被一道無形的界線切斷，迎面吹來的，是一陣帶著煤爐餘溫與烤麥餅香氣的乾燥晚風。\n\n暮色低垂，橘紅色的斜陽將石板縫拉出細長的影子，卻沒有絲毫屬於河谷的寒意。軒人低頭看去。靴底方才在門外沾上的河泥，在乾燥的石板上印出兩個清晰的深色腳印；往前走出兩步再回頭，那兩個泥印依然安靜地留在原處，沒有被三百年前的夕陽抹去。而身後門外的白霧已經縮成一個長方形的淺框，真崎夜一半跪在框內，單手按著黑布陰影，遠遠望去彷彿一幅剪影。\n\n「走右邊這條石階。」Eraser以右手提著鯨油燈，望向前方微微起伏的緩坡，「以前工坊的保管庫，在登記室下面。」\n\n街道兩旁有幾道人影正在活動。\n\n穿粗布圍裙的果販將紅蘋果一顆一顆排進木箱裡，每放到第三顆，他便停下來在圍裙上擦擦手；下一秒，木箱裡的蘋果無聲消散，他又低頭從第一顆重新擺起。對面二樓的木窗向外推開，一名婦人探出半身，朝街面喊著別把推車停在門前，話音剛落便扣上窗扇，過了十幾秒又以分毫不差的角度再次推開。\n\n若只看眼前這幅光景，這裡與灰鐵巷傍晚收攤前的街市幾乎沒有兩樣；可那些日復一日重複著同一截光陰的身影，既聽不見外來者的腳步，也永遠不會迎來真正的入夜。溫暖的橘色暮光反而將整條長街浸在一種近乎透明、無邊無際的寂靜裡。\n\nEraser沿著路側安靜前行。經過果販身旁一處空無一物的牆角時，她的腳步很自然地往外繞開了半步。\n\n軒人注意到這個細微的動作：「那裡以前放著什麼嗎？」\n\n「以前果販會把裝壞果子的空木箱放在那個角落。」Eraser低眼看向空蕩蕩的牆根，青石板邊緣確實留著一道被木箱反覆拖曳磨出的淺槽，「不是每天都有，只是以前走習慣了。」\n\n軒人沒有提醒她現在那裡空無一物可以直接走，只是順著她的步伐一同繞過了那個角落，接著蹲下身，用白粉筆在轉角牆根畫下第一個返回箭頭。\n\n穿過一條不長的石砌拱廊後，前方出現了一棟半嵌在山壁裡的二層石造建築。門楣上懸著一塊漆色斑駁的木牌，寫著『工坊器具登記室』。\n\n走到門檻外時，Eraser的腳步明顯放慢下來，右手指尖不自覺收緊了布套提把。\n\n軒人越過敞開的木門往屋裡看去。\n\n石桌後方坐著一名身穿古工坊制服、兩鬢微白的中年男人。他的左手袖口沾著一小塊黑墨，正拿起桌角的一方麻布，仔仔細細地將左手腕上的墨跡擦淨，再將麻布四邊對齊疊整齊，輕輕放回左邊的木托盤裡，這才伸手翻開桌上的紙卷。\n\n聽見門口的動靜，桌後的人影抬起頭，眼角浮起一抹溫和而略帶倦意的笑：\n\n『回來啦？東側的試作品先放進架子裡，晚點再清點。』\n\n說完，他又低下頭看起文件。過了約莫十秒，他左手腕上再度浮現出那塊黑墨；他又拿起麻布仔細擦拭一遍，疊好放回托盤，抬頭用完全相同的語氣說道：\n\n『回來啦？東側的試作品先放進架子裡，晚點再清點。』\n\n「他就是妳之前提過的……以前對妳很好的那位副工匠長？」軒人站在她身側，不自覺放輕了嗓音。\n\n「嗯。」Eraser的視線靜靜停在桌角那塊疊得方方正正的擦手布上，「這一段殘響是傍晚交班前的時候。白天他忙著改圖，擦完手會直接把布丟在桌邊；只有到了傍晚準備下班前，才會把布疊整齊放進托盤裡。」\n\n軒人輕輕點頭，沒有催促她，只抽出扁頭拆件短刀，在登記室門框下方的石壁上劃出一道極淺的短痕。\n\n等桌後的副工匠長在夕陽裡安靜地重複完第三遍擦手動作，門框上那道新劃出的刀痕依然清晰留在原處，沒有絲毫淡去。\n\n「這間屋子的牆壁跟石桌都是實體，只有桌面上的茶杯和人影是殘響。」軒人收起短刀，「我們去抽屜裡找開地下保管庫的門牌吧。」\n\nEraser跨過門檻，在石桌前停步。\n\n桌後的副工匠長恰好在這時抬起手，將一塊長方形的木牌往桌沿推了推：\n\n『下面的門用這塊牌子開。拿了什麼工具，記得在簿子上寫名字。』\n\n那塊半透明的木牌滑到桌邊便停了下來。Eraser沒有伸手觸碰桌上的虛影，只是順著軒人鯨油燈照亮的位置，伸出右手，緩緩拉開石桌下方的真實抽屜。\n\n抽屜裡積著一層細灰，裡頭靜靜躺著一塊右下角略有缺口的深色硬木門牌，旁邊壓著一本紙頁發黃、卻依然真實存留下來的羊皮領用簿。\n\nEraser拾起那塊沉甸甸的真門牌，指腹輕輕撫過邊緣磨圓的舊缺口，將它妥善收進外套口袋裡。\n\n## ３\n\n通往地下保管庫的石梯相當狹窄，只容一人側身下行。\n\n軒人走在前方，一邊將左側紅繩扣進石壁鐵環，一邊按住胸前的傳聲器回報位置：「我們到登記室下面的石梯了，兩條安全繩都正常。」\n\n傳聲器裡很快傳來夜一簡短冷靜的聲音：「入口穩定。先確認底下的門打得開，別在下面耽擱太久。」\n\n「收到。」\n\n走到石梯中段時，軒人轉過半身，抬高鯨油燈替身後的Eraser照亮台階，順口問道：\n\n「剛才上面那位副工匠長，以前常跟妳說話嗎？」\n\n「他不太擅長聊天，但每次我把撿回來的舊東西擦乾淨擺好，他都會幫我檢查一遍。」Eraser低頭望著腳下被踩得微微發亮的石階，「那本《白央散步指南》本來是旅客掉在山下的，封面破了一角，別人說沒用了要丟進爐子燒掉，是他撿回來擦乾淨交給我的。」\n\n「他人還真不錯。」\n\n「嗯。那時候我以為，沒有人來領的失物就只能銷毀。他告訴我，書跟壞掉的零件不一樣，只要還有人願意讀，留著就有用。」\n\n話音輕輕落下時，兩人正好走到了石梯盡頭。\n\n眼前是一扇低矮卻極為厚重的雙層精鋼保管門。門邊石壁上留著一條明顯高過軒人頭頂的陳年水痕，說明三百年前大崩落引來河水倒灌時，水位曾一路淹過這裡；幸好這扇嵌著厚重鉛條與石膏漆的古式密閉水門咬合緊密，歷經三百年浸蝕仍未滲入一滴河水，替門內完整守住了乾燥。\n\nEraser取出那塊深色硬木門牌，送進門側的長方形凹槽。\n\n門板深處響起一記沉悶的齒輪鬆動聲，整扇精鋼水門卻只往內挪開一指寬的縫隙，就被裡頭生鏽膨脹的防潮卡榫牢牢頂住；與此同時，順著那道窄縫往裡看去，門框內緣與精鋼門栓四周竟還殘留著一圈三百年前防範外人硬闖的「魔力感應防禦刻紋」，在幽暗中泛著微弱卻尚未失效的淡藍冷光。\n\n「主鎖是機械卡死，但門框內緣還留著防撬的魔力感應防禦刻紋。」Eraser退後半步判斷道，「一般有魔力的探索者或白塔技師只要伸手拿工具去撬門栓，體內散溢的活體魔力就會瞬間觸發防禦電弧。我的左手現在綁著夾板，沒辦法伸進去幫你抹消。」\n\n「防活體魔力的刻紋，那再加上機械卡死，對我們來說反而是好消息。」\n\n軒人蹲下身仔細察看門縫。換作城裡任何一名能點亮觸發式魔導器的正常人，此刻手掌一靠近門縫就會引爆防禦電弧；但軒人體內是徹頭徹尾的「空值」，當他伸出完好的左手、將扁頭拆件短刀貼上精鋼門栓時，門框上的魔力感應防禦刻紋根本偵測不到半點活體魔力反應，就像碰到一塊毫無生命的石頭般安靜，連一絲火花都沒冒出來。\n\n換作平時，他大可直接用右手揮動撬棍硬撬，將鏽死的門栓頂開；但今天出門前他答應過千歲和夜一，絕不拿昨天拉傷的右肩硬撐，便轉頭看向Eraser，指了指門框側面那根連動門牌凹槽的解鎖小拉桿：\n\n「Eraser，門邊那根小拉桿有門牌的權限保護，不會觸發刻紋，但得一直往下壓著，裡面的鎖簧才會縮回去。不需要很大力氣，妳用右手能按住嗎？」\n\nEraser走上前，伸出右手試著往下按了按：「這個很輕，可以。」\n\n「好，手一覺得酸就馬上跟我說。」\n\n一個是擁有古工坊最高權限的「零號」，一個是全身上下不帶半點魔力、連防禦刻紋都完全無視的「空值」。軒人讓她用右手穩穩壓住解鎖小拉桿，自己則以完好的左手將扁頭拆件短刀深深插進門栓縫隙，再將腰間備用短繩套在門環與右靴踏扣之間，在防禦刻紋毫無反應的沉寂中，藉著腰腿發力往後一蹬。\n\n喀啦。\n\n鏽死的門栓在純物理的巧勁下清脆彈開，從頭到尾連半點電弧都未曾亮起，沉重的精鋼水門便緩緩向內敞開。這對「零號」與「空值」的搭檔，彷彿天生就是為了打開這種誰也碰不得的古工坊死鎖而湊在一起的。門內沒有絲毫潮黴味，只湧出一股帶著陳年黃銅與乾燥油紙氣息的涼意。\n\n保管庫約莫十坪大小，四面鐵架上井然有序地排列著幾只以防潮油布包裹的扁平木箱。兩人對照抄來的平面圖編號，很快在最裡側標著『零號專用維護具』的第三層鐵架前停下腳步。\n\n軒人小心解開外層油布，將那只大小接近普通工具箱、外框由厚重黃銅打造的扁平匣子捧了下來，輕放在乾燥的石台上掀開上蓋。\n\n匣內分為上下兩層。上層放著一冊包覆油紙的舊圖冊，旁邊是一小卷泛著柔和月白微光的「古銀絲」；下層則嵌著一座結構精密清晰的「雙槽座」，左右兩側各排著一列精細的黃銅接線扣，正中央刻著一朵五瓣花凹槽——大小恰好能讓Eraser領口的花扣穩穩卡進去，將連向地底支爐的舊線與新接的供能線安全分開。\n\n「找到了，這就是『舊分離匣』和古銀絲。」軒人暗暗鬆了口氣，拾起那卷觸手柔軟微涼的古銀絲遞給Eraser，「有了這卷線，回去千歲姊就能幫妳把左腕的裂痕徹底修好了。」\n\nEraser用右手接過那卷細如髮絲的銀線，小心地收進布套裡。\n\n軒人正準備合上匣蓋，視線卻忽然停在鐵架最內側——那裡壓在一塊黃銅鎮紙底下的，是一張折疊得整整齊齊的散頁羊皮紙。\n\n那張羊皮紙的質地明顯比三百年前的古物新上許多。軒人將它緩緩展開，鯨油燈暖黃的光暈落在工整而略顯急迫的鋼筆字跡上，落款日期依照舊曆折算下來，正是九年前的十一月十四日。\n\n**『本月七號支爐首次發生異常逆流，波及灰鐵巷外環，暴漲的爐壓也短暫撐開了這座沉沒舊工坊的殘留通道。我趁著這道空隙從第三分塔潛入這裡，取走保管庫內的一枚「備用花瓣校準片」，即刻趕往灰鐵巷事故現場止損救人。』**\n\n**『我不想驚動沉睡在鐘樓底座裡的「零號」本體，因此將舊分離匣留在原位；只是，這枚備用花瓣校準片與零號領口的花扣本就是記憶同源、彼此共振的構造。在承受高負荷、強行抹消逆流爐火的瞬間，這股共振極可能連帶燒損並剝落沉睡本體領口花扣的對應一角——這絕不是我願意見到的代價。』**\n\n**『一旦動用這枚校準片，白塔本塔必定會察覺有人私取古工坊遺物，追兵很快就會追上來。所以在動身之前，我先在這裡留下這份絕筆。事成之後，我會帶著殘片一路北行，前往三號支爐城「霜鐘鎮」引開耳目與追兵。如果日後有人再度打開這座保管庫，請代我轉告零號——活下去，別讓自己淪為焚燒的薪柴。　——前第三分塔首席技師・賀蘭』**\n\n軒人捏著那張邊緣略微發脆的羊皮紙，站在鐵架前久久沒有出聲。\n\n九年前的十一月十四日。灰鐵巷外環。\n\n昨天在河岸舊調壓所翻見那頁被撕毀的舊交接表時，他只知道九年前父母遇難的那場「舊礦坑坍方」其實是七號支爐的首次逆流；直到此刻看見這封信，他才明白當年那名叫做賀蘭的首席技師，竟然在事發當晚潛入過這座沉沒工坊，取走了一枚與Eraser花扣同源共振的備用花瓣片趕去灰鐵巷救人。\n\n軒人下意識垂下眼，看了一眼自己握著羊皮紙、從十歲起就測不出半點魔力反應的左手。\n\n九年前那個火光與黑煙吞沒整條外環舊街的夜晚，住在事故中心的住戶裡，只有當時八歲的他一個人活了下來。他還記得自己醒來時躺在孤兒院的病床上，渾身上下連一點燒傷都沒有——只是從那以後，他的身體就變成了徹底的「空值」。\n\n難道九年前賀蘭技師帶著那片花瓣趕去灰鐵巷救下的人，跟那場事故裡唯一活下來的自己有關？\n\n「軒人？」Eraser走到他身旁，目光落在那張展開的羊皮紙上，「上面寫了什麼？」\n\n軒人深吸了一口氣，壓下心底那個還沒有確切答案的巨大疑問，指尖沿著紙面輕輕移過，將整份絕筆從頭到尾輕聲唸給她聽。\n\n唸完最後一個落款的名字時，保管庫裡靜得只聽見鯨油燈燈芯細微的劈啪聲。Eraser伸出右手，探進開襟外套領口內側，指腹輕輕碰觸那枚右下角花瓣缺了一小角的銀色花扣。淡粉色的眼眸裡，慢慢浮起一絲恍然。\n\n「原來我花扣上少掉的那一小角，還有想不起來的那段記憶，是九年前被這位技師拿去灰鐵巷救人時燒壞的。」\n\n她放下領口，抬頭看向神色有些出神的軒人：\n\n「你認識這位叫賀蘭的技師嗎？」\n\n「不認識。不過九年前那場灰鐵巷外環的事故發生時，我就住在那附近。」軒人沒有在還沒查清真相前貿然把自己的猜測說出口，只是將那張羊皮紙順著原本的折痕小心折回原樣，連同那冊包覆油紙的舊圖冊一併收進防水內袋，「等我們把這座七號支爐的麻煩徹底解決掉，以後有機會，我們就一起去北邊那個『霜鐘鎮』看看——說不定能查清楚九年前那晚到底發生了什麼，也能幫妳把少掉的那片花瓣找回來。」\n\n「好。」Eraser輕輕點了點頭。\n\n就在這時，胸前的傳聲器亮起微弱紅光，夜一略顯緊促的聲音從中傳了出來：\n\n「軒人，你們還在下面嗎？支爐早上的排氣周期提前了，裡面的街道殘響正在變淡，你們必須在二十分鐘內撤回門口。」\n\n「東西都拿到了，我們現在就原路上去。」\n\n軒人扣緊舊分離匣的黃銅搭扣，刻意避開受傷的右肩，將寬背帶斜跨過左肩，再把重量妥善分攤到腰帶的承重環上。\n\nEraser站在一旁看他調整背帶，開口提醒道：「爬石梯的時候如果覺得太重，就停下來喘口氣。不准再像昨天那樣硬撐著說快到了。」\n\n「放心，今天絕對聽指揮。」\n\n## ４\n\n回到一樓登記室時，屋外的夕陽已經褪淡了一層。整條石板街彷彿隔著一塊毛玻璃，遠處屋簷與巷道的輪廓正一點一點發虛、散開。\n\n石桌後面的副工匠長依然坐在那裡。他拿起麻布仔細擦去左手腕上的黑墨，把布四邊對齊疊整齊放回木托盤，接著抬起頭，露出那抹被三百年光陰靜靜鎖住的溫和笑意：\n\n『回來啦？東側的試作品先放進架子裡，晚點再清點。』\n\nEraser走上前，將那塊用完的硬木門牌放回石桌下方的真實抽屜，輕輕推合抽屜，卻沒有立刻轉身離開。\n\n軒人背著舊分離匣停在門檻外，想起昨晚回程馬車上她交代過的話，正要出聲喚她的名字，Eraser已經先一步望向桌後那道坐在夕陽裡的身影，輕聲開了口：\n\n「那本《白央散步指南》，我帶到地面上去了。」\n\n桌後的副工匠長恰好低頭翻過一頁文件：『拿了什麼工具，記得在簿子上寫名字。』\n\n那道跨越三百年的殘響聽不見她的聲音，也永遠不會給出新的回答。但Eraser依然看著他，右手在外套口袋裡輕輕握住晚鐘亭的房門鑰匙。她的嗓音清澈而安靜，沒有悲傷，也沒有一絲猶豫：\n\n「我現在住在灰鐵巷的一間修理鋪裡，換了新衣服，有自己的房間，也領到第一份工錢了。書上畫的那座山坡鐘塔還在。等修好了手，我會跟朋友一起上去看看，是不是真的看不見河口。」\n\n桌後的老人正好再度抬起頭，溫和地望向敞開的門外，在晚風吹入拱廊之前，說出另一段早已刻在石室光陰裡的囑咐：\n\n『別把門敞著，河邊晚上有風。』\n\n一陣微風穿過拱廊，將門內橘色的殘光吹得薄如蟬翼。軒人站在門外，輕輕喚了她一聲：「Eraser，我們該走了。」\n\n「嗯。」\n\nEraser最後看了一眼桌角那塊疊得方方正正的擦手布，朝那個永遠停留在黃昏下班前的身影微微欠身：\n\n「謝謝您的書。再見。」\n\n她轉身跨出門檻，經過軒人身旁時停下腳步，伸出右手握住登記室那扇真實的木門門把，輕輕把門帶上。\n\n木門扣緊的輕響落在空曠的拱廊裡，溫柔地隔開了屋內那場永遠不會迎來黑夜的黃昏。\n\n## ５\n\n走出拱廊後，石板街上的橘色殘響正從兩側朝中央飛快褪散。\n\n先前在街邊整理蘋果的果販已經消失，牆根底下露出了潮濕發黑的真實斷牆與荒草。兩人剛走到回程第一個轉彎路口，軒人胸前的傳聲器突然響起，夜一的聲音比剛才明顯緊繃了幾分：\n\n「加快腳步——不是叫你們跑，裡面的街道正在切換時段。右邊那條路不要踩過去。」\n\n軒人立刻低頭看去。右側通道不知何時已被一扇從殘牆裡浮現出的半透明月台閘門與滾燙蒸氣殘響徹底覆蓋，右側那條備用麻繩沒入翻湧的暗紅霧氣裡，完全看不出底下的石板是否已經塌空；唯有左側那條紅繩依然穩穩貼在真實的青石板上，一路指向出口。\n\n更棘手的是，兩側半透明的屋簷下開始湧出一群群提著舊式皮箱的虛影。人影聚攏在路口鐘柱底下，低聲而焦急地相互傳遞著河水暴漲與末班疏散車的消息。一名舉著小黃旗的引導員虛影步入路口中央，不斷揮旗催促眾人往左側架起的高台階移動——而那道虛假的高台階，正好壓住了左側紅繩的路徑。\n\n「別跟著人影走。」軒人迅速解開腰間右側那條沒入紅霧的備用繩，將它就近扣牢在路邊畫過白粉筆記號的真實鐵環上，接著蹲低身子確認紅繩的實際走向，「引導員指的木台階是假的。紅繩真正穿過去的地方，是他們腳邊那條約莫六十公分寬的石砌排水溝。」\n\nEraser看了一眼貼著真實牆根的石溝，先把裝著古銀絲的布套遞到前頭，自己側身沿著溝沿小心往前挪移。軒人暫時卸下肩上的舊分離匣，讓她在前頭扶住匣子一角，自己從後方緩緩推移。兩人沒有多說一句，順著彼此的節奏將沉重的黃銅匣子送過狹窄的石縫，再迅速將它重新斜背回左肩。\n\n頭頂那名引導員虛影的小黃旗幾乎擦著軒人的髮梢揮過：\n\n『請各位旅客往高處台階移動，不要在排水溝邊停留。』\n\n軒人壓低身子，屏除耳畔雜亂焦灼的人聲，帶著Eraser一路緊貼著真實石板上的紅繩，硬是從那片混亂的疏散殘響裡穿了出來。\n\n然而，就在距離生鐵貨運門只剩三十步遠的地方，原本連通門檻的那段真實石板路，卻因底下暗河水位驟漲而朝側面轟然坍塌，斷出一道整整三公尺寬的缺口。\n\n缺口下方不再是乾燥的舊街，而是渾濁翻滾、夾帶碎木的冰冷急流。\n\n而在缺口旁一處背風的石壁轉角下，或許因為上方山壁裂縫長年漏進了雨水與一線日光，竟悄悄長著一小片翠綠的野草；草葉之間，藏著一叢結滿深紫色小漿果的矮灌木——那是只有在舊時代山坡林間才能見到的「紫星果」。\n\n三十步外的貨運門外，夜一與兩名巡查員已經拉緊了左邊的主安全繩。\n\n「右邊路面塌了，別往邊緣踩。」夜一左手緊按著門框上的黑布陰影，額角滲出細密冷汗，朝門內揚聲喊道，「門頂的高處吊索絞盤已經掛上主繩了。軒人，先把你們那頭的滑索扣到高處牆環拉緊，匣子先吊過來，人再用吊環過河。」\n\n「明白，匣子先過去。」\n\n軒人仰頭確認缺口前那面真實石壁上嵌入的高處鐵環。他迅速將原本貼在石板地上的左路主安全繩解開拉高，穿過比人頭還高的牆壁鐵環，回頭與門外送進來的副繩扣緊成雙股滑索。外頭的兩名巡查員同步收緊貨運門上方原就架好的高處吊索絞盤，整條主繩立刻繃直，化作一道高懸於湍急水面之上的空中滑索。\n\n軒人卸下左肩的舊分離匣，牢牢扣上滑索的滑輪掛鉤，朝門外揮手示意。兩名巡查員合力拉動絞盤，沉重的黃銅匣子懸在半空平穩滑過三公尺寬的急流，安穩落進貨運門外的地面。\n\n趁著巡查員將空滑輪吊環送回來的兩分鐘空檔，軒人轉過頭，看見Eraser的目光在石壁轉角那叢深紫色漿果上靜靜停了片刻，便開口問道：\n\n「那個果子能吃嗎？」\n\n「能吃。叫紫星果，以前工坊的學徒很喜歡在山坡上摘。」Eraser望著草葉間沾著露水的深紫色小果實，語氣輕了下來，「很甜。」\n\n軒人彎下腰，挑了七、八顆乾淨飽滿的紫星果，用隨身乾淨手帕包妥放進她的布套裡，自己另留了一顆，抬手遞到她唇邊：「剛才走了一路，先吃一顆潤潤喉嚨。」\n\nEraser微微一怔，張嘴咬下那顆果子。清涼酸甜的汁水在舌尖化開，她輕輕瞇起淡粉色的眼眸，低頭看著自己留在轉角青草上的鞋印，聲音很輕：\n\n「以前在下面看書的時候，我以為這些東西早就絕種了。」\n\n「只要種子還在土裡，有陽光跟水，總會再長出來的。」\n\n滑輪滑過繩索的輕響打斷了短暫的靜謐，空吊環已順著高處滑索滑回兩人眼前。\n\n軒人替Eraser將腳踏繩環套妥，讓她用右手抓牢上方的防滑結：「妳先過去，外面兩個人接著，不用跳。」\n\nEraser點了點頭，穩穩踩實繩環。外頭的巡查員合力絞動高處絞盤，將她平穩吊過三公尺寬的湍急水面，輕輕放落在了貨運門外真實的青石板上。\n\n緊接著，軒人將自己的腰帶承重環扣上主繩。他低頭瞥了一眼靴跟——裡頭只剩昨天在舊調壓所用完兩顆後，留下的最後一顆氣罐。看準腳下石板邊緣即將徹底滑落急流的那一瞬間，他右腳往後一撤，乾脆俐落地踩下靴跟最後一顆氣罐的踏扣。\n\n「我過去了。」\n\n嗤——\n\n白霧炸開，高壓氣流推著他拔地而起，在半空中劃出一道俐落的弧線，一躍跨過三公尺寬的渾濁水面。雙腳落地時他順勢屈膝卸力，靴底在濕滑的青石板上往前滑出半步，不偏不倚停在夜一腳尖前不到二十公分處。\n\n「沒撞到你吧？」軒人站直身子，胸口微喘地笑問。\n\n夜一這才緩緩鬆開按在黑布陰影上的左手，垂眼看了一眼自己凍得毫無血色的指尖，沒多說什麼，只淡淡回了一句：「還差半步。」\n\n## ６\n\n清晨六點五十分準時撤出斷層入口後，兩人先隨真崎夜一與巡查員返回管網總站，依規定登記古匣編號、核對勘查紀錄，順道領取了補充裝備與全新的靴跟氣罐。等總站馬車將兩人連同舊分離匣送回晚鐘亭時，時間已是上午九點。\n\n一回到店裡，千歲立刻清出工作檯，花了整整一個半小時，用那卷三百年前原配的古銀絲，替Eraser左腕的結構裂痕做了一次從裡到外的正式修補。\n\n上午十點半，當最後一針細如髮絲的銀線穩穩接通副迴路時，Eraser試著輕輕動了動左手五指。雖然為了保險起見，左腕這幾天仍得戴著輕便護板固定、不能用來抹消術式或提舉重物，但先前那種彷彿瓷器錯位般的細密刺痛已經徹底消散，手指也能靈活地扶住茶杯或壓住紙角。\n\n「成了，再靜養上兩個禮拜，連護板都可以拿掉。」千歲鬆了口氣，取下眼前的細鑷，這才轉向工作檯上的舊分離匣與那冊舊圖冊。\n\n為了遵守榊主任的封口令，晚鐘亭整個上午都拉著門簾、掛著歇業木牌。千歲戴上放大鏡，對照舊圖冊上的原始結構圖反覆推敲，很快釐清了將Eraser領口花扣改成「獨立供能」的完整步驟——只要動用舊分離匣下層的雙槽座與中央五瓣花凹槽，先在花扣外側穩穩接上一枚獨立魔力環與小魔石，撐住她的日常運作，就能在不傷及意識與記憶的前提下，將連向七號支爐底層的那條舊底線徹底剪斷。\n\n「不過，我絕不會直接拿這孩子的身體當第一次試驗品。」\n\n千歲指節輕叩在舊分離匣的黃銅外框上，語氣沒有絲毫退讓的餘地：\n\n「今天下午，我們先去河岸那段已經清空居民的『舊貨運支架』，拿這只舊分離匣做一次局部管線隔離測試。一來驗證新舊管線分離的順序正不正確，二來確認舊分離匣在實際負荷下的穩定度。等下午測試穩穩過關了，明天一早再幫Eraser換上獨立魔力環。」\n\n臨近上午十一點，還沒到準備午餐的時間。趁著軒人與千歲在樓下忙著清點下午測試要帶的工具時，Eraser獨自走回二樓自己的房間。\n\n十月末的晨光斜斜穿過木窗欞，落在靠窗的小方桌上，也靜靜照亮了攤開在桌面的《白央散步指南》——書頁正停在畫著山坡鐘塔與烤栗子薄餅攤的那一幅插圖上。\n\n她拉開木椅坐下，從外套口袋裡取出那張第一天在舊鐘塔地下寫下自己名字的失物標籤牌，輕輕翻到空白的背面。\n\n她用右手拾起那半截粗桿鉛筆，微微俯下身，在紙牌背面一筆一劃寫下了幾個字。隨後，她輕輕吹去細碎的鉛筆灰，將這張失物標籤牌仔細夾進畫著山坡鐘塔的那一頁裡，安靜地合上了書本。\n\n——第六章完——\n", "mtime": 1795001561.104697}, {"filename": "07_第七章_不當英雄的方法.md", "content": "# 第七章　不當英雄的方法\n\n## １\n\n河岸試驗區的木圍欄外，貼著三張告示。\n\n第一張寫著管線檢修禁止入內，第二張寫著河道停航，第三張則是染布坊老闆娘自己用紅紙寫好貼上去的，通知熟客領取布匹改到西坡的臨時棚子。\n\n軒人提著舊分離匣，走過空蕩蕩的水街。前兩天還晾滿靛藍棉布的露台，如今拆得只剩下光禿禿的鐵架；最後幾戶居民正推著堆滿被褥與鍋碗的板車，在巡查員的引導下緩步往高處撤離區移動。街角麵包鋪的櫥窗空無一物，門板上那塊寫著『傍晚八折』的木牌還沒來得及取下，正孤零零地在河風裡輕輕晃動。\n\nEraser走在他身旁，視線從那塊打折木牌上掠過，腳步沒有停頓：\n\n「大家都在往上面搬。」\n\n「先搬上去比較安全。只要我們今天下午把隔離順序試出來，明天關掉底下的支爐，後天大家就能回來了。」\n\n兩人很快走到河岸邊的舊貨運支架前。\n\n那是一座橫跨排水渠的小型雙樑鐵架。上方的木踏板已經預先拆除，只留下兩根同時連結新舊管線的承重鐵樑，用來模擬明天切斷城市共用管網時的實際受力。\n\n總站的技師已在對岸架設好讀數板；千歲與Eraser留在木圍欄外的工作檯旁核對那冊舊圖冊；真崎夜一則守在靠街一側的石柱陰影裡，準備一旦支架失穩便立刻出手固定結構，掩護裡面的人撤離。\n\n動手之前，千歲舉著分工表，當著眾人的面逐項確認：\n\n「讀數超過警戒線，誰負責喊停？」\n\n「我。」對岸的總站技師舉手應聲。\n\n「誰負責拉下試驗總閘？」\n\n「我。」站在支架內側檢修台上的軒人回答。\n\n「記住，一旦發現圖紙上沒標註的額外爐火，立刻停手退回圍欄外，不准一邊硬撐一邊找原因。退路誰看？」\n\n「我。」夜一倚著石柱，簡短答道。\n\nEraser伸出右手，輕輕按住被河風掀起的舊圖冊紙頁，補了一句：\n\n「如果看見紅光不是順著銅管流動，而是往下面的石頭裡鑽，也要立刻停下來。」\n\n軒人點了點頭，按下胸前傳聲器確認通話正常，接著將舊分離匣扣上了貨運支架側面的檢修孔。\n\n## ２\n\n最初五分鐘的測試，順利得幾乎讓人產生今天能提早收工的錯覺。\n\n這座貨運支架分為上下兩層：上方是明面看得見的黃銅排氣管，下方則是墊在鐵樑底部的舊條石基座。\n\n舊分離匣接通後，對岸技師依序報出讀數。軒人照著預定計畫，先轉動左側旋鈕，將上方黃銅管裡的爐火關小一半，隨後準備拉下右側閘柄，把底下的舊線路一併切斷。\n\n支架上方的排氣呼嘯聲漸漸低沉下去，預先頂在鐵樑底部的兩根實心木柱穩穩承接了重量。\n\n對岸技師舉起綠旗，示意讀數完全落在安全區間內。\n\n「維持現狀，準備切斷最後一組底線。」傳聲器裡傳來千歲沉穩的聲音。\n\n軒人伸出左手，握住舊分離匣右側的第二根閘柄。\n\n就在他將閘柄拉下一半的那一秒，分離匣中央原本已經收斂下去的暗紅火光，毫無徵兆地猛然暴漲。\n\n軒人的手指倏地僵住。\n\n「等一下，有一股火流從下面倒灌回來了。」\n\n圍欄外的Eraser立刻抬眼：「從哪裡回來的？上面的黃銅管已經關了。」\n\n「不是從上面銅管來的，是從支架底下的石頭縫裡湧出來的。」\n\n對岸技師連忙俯身查驗貼在石堤下方的備用感溫片；靠街一側的夜一已經摘下黑手套，左掌無聲按進了石柱投下的陰影裡：\n\n「先把總閘關上。」\n\n軒人幾乎沒有猶豫，反手將第二根閘柄推回原位，狠狠拉下總閘。\n\n然而，理應熄滅的暗紅火光卻沒有半點退縮。因為方才先關閉了上方的黃銅管，管內無處宣洩的高壓爐火被迫全數往下衝，硬生生灌進石頭基座內部的陳年暗槽裡，順著排水渠底的石堤一路奔湧向下游。\n\n下一瞬，排水渠深處傳來一聲沉悶的低吼。\n\n石縫間猛然噴出一團滾燙刺鼻的白霧，翻湧的熱氣與紅光在濕滑渠壁邊緣迅速疊出一截虛假的木造走道。下游五十步外，兩名原本正在渠壁進行例行檢修的年輕檢查工被迎面撲來的燙霧嗆得睜不開眼，驚慌後退間一腳踩進了那截半透明的假木走道——腳下瞬間踩空，兩人連同手裡的記錄板一起滑跌下來，順著濕滑的石坡一路翻滾，重重摔進了貨運支架正下方的排水渠底。\n\n其中一名檢查工狼狽抬起頭，望見正上方發出刺耳金屬呻吟的龐大生鐵主樑，血色瞬間從臉上褪盡，整個人僵在原地動彈不得。\n\n「下面有人！」軒人呼吸一滯，脫口喊出聲。\n\n石柱旁的夜一立刻探身望向排水渠下。可他的視線被上方寬厚的承重鐵樑徹底遮蔽，從岸邊根本看不見渠底那兩名檢查工究竟落在哪個方位，視野裡只剩一片翻攪模糊的紅霧與滾燙白煙。\n\n「人在哪一側？報位置。」夜一對著傳聲器冷聲追問。\n\n偏偏就在這一瞬，支架底座的舊條石爆出一連串乾裂的脆響。\n\n碎石簌簌崩落，兩根臨時木柱猛然歪斜。檢修台旁控制捲揚齒輪的棘輪制動手把在龐大的下墜力道拉扯下猛地向前翻彈——重達數噸的生鐵主樑，朝著下方兩名檢查工的頭頂沉沉壓低了十幾公分。\n\n來不及思考。\n\n身體比念頭更快撲了出去。軒人雙手緊扣住那根冰冷的棘輪制動手把，將全身體重不顧一切地往後壓到底。\n\n只要手把不鬆開、底下的棘爪牢牢咬住捲揚齒輪的齒牙，靠著齒輪倍力就能硬把這根數噸重的主樑鎖在半空。可底座的石塊仍在不斷剝落崩塌，狂暴的震顫透過齒輪反傳上來，順著鐵柄一路狠狠撞進掌骨與小臂，震得他整個胸腔發麻，雙手指節彷彿隨時會被生生折斷。\n\n生鐵主樑下墜的勢頭，就這樣被他硬生生卡停了一瞬。\n\n渠底的兩名檢查工慌亂地試圖往渠壁爬。其中一人腳下一滑，踩進了爐火疊出的虛假木板，整條小腿直接沒入冰冷黑水；幸好同伴一把抓住他的衣領，兩人跌跌撞撞退到渠底右側一塊只有磨盤大的真實凸石上。\n\n「不要踩木板！站在右邊那塊黑石頭上不要動！」軒人喉嚨發緊，壓著聲音朝底下大喊。\n\n傳聲器裡，夜一的聲音第二次切了進來，比剛才更冷、更急：\n\n「軒人，回答我。他們在你的哪個方向？」\n\n棘輪制動手把在掌心瘋狂劇震，每一記金屬反衝都像拿鈍斧劈在骨頭上。昨天才剛重新包紮好的右肩與左手虎口瞬間裂開，滾燙的鮮血迅速浸透兩層白紗布，順著痙攣顫抖的指縫滴落到發燙的鐵柄上，滋地騰起一縷極淡的白煙。\n\n肺裡的空氣像是被一隻無形的手狠狠攥住，胸口悶得發痛。就在這幾乎令人窒息的瞬間，木圍欄外突然傳來鐵木手杖敲擊青石板的聲音。\n\n篤。篤。\n\n那聲響並不算大，卻像一根細冰針，筆直扎進他的耳膜。\n\n軒人抬起被汗水與血氣模糊的雙眼，看見千歲右手拄著手杖從工作檯後站起，快步朝木圍欄邊緣挪來，似乎想探身往下看清排水渠的線路。\n\n「別過來！」\n\n軒人吼了出來，聲音嘶啞得連自己都感到陌生。\n\n千歲停在圍欄邊。傳聲器裡，夜一第三次緊追不捨地喝問：「軒人，報位置！」\n\n「我還能拉得住……」軒人緊盯著千歲右手握著的手杖，以及那條空蕩蕩的左褲管，用力咬緊後槽牙，字句幾乎是從齒縫裡擠出來的，「這根手把我自己能撐住，你們誰都別靠近圍欄……」\n\n他看不見對岸瘋狂揮動的旗號，也聽不進技師與夜一在傳聲器裡的呼喊。\n\n在被劇痛、失血與窒息感吞沒的視野裡，頭頂這根發出尖嘯、沉沉下壓的生鐵主樑，與木圍欄邊的千歲，毫無縫隙地與三年前那個昏暗傍晚重疊在了一起。\n\n＊　　　＊　　　＊\n\n三年前，十四歲的軒人第一次獨自接下一件回收故障「魔導四輪搬貨車」的委託。\n\n那原本算不上什麼棘手的工作。一輛在倉庫裡失控原地打轉的重型魔導四輪搬貨車，車輪早被木楔卡死，只要卸下底盤下的魔導驅動盒就能推回店裡交差。在白央城裡，一般天生帶有微弱魔力的修繕學徒，只要伸手摸一下車底的輪軸外殼，就能憑皮膚自然感應到裡面還有沒有殘留的「魔力蓄壓」；但十四歲的軒人體內是徹頭徹尾的「空值」，手掌貼在冰冷的金屬外殼上什麼都感覺不到。\n\n那時的他又急著一個人把活幹完、想向千歲證明自己就算沒有魔力也能獨當一面，竟忘了先去拿千歲特地為他改裝的「物理外接測壓表」，只看到車體表面的警示紅光熄滅便以為安全無虞，直接拿扳手擰下了第二顆固定螺栓。\n\n下一瞬，輪軸內殘留的高壓魔力蓄壓猛然炸開，整輛魔導搬貨車朝前狂暴衝出。\n\n外套下襬捲進齒輪，他整個人被硬生生拖倒在堆滿生鐵輪圈的巨型貨架底下。被撞斷底柱的巨型生鐵貨架發出令人牙酸的金屬撕裂聲，當時的他也是像這樣拚命攥著一根支撐桿，天真地以為只要自己絕不鬆手就能頂住。\n\n千歲那天原本根本不需要去現場。她只是發現軒人匆忙出門時，把那只專為他做的「物理外接測壓表」與備用墊片落在了櫃檯上，順路替他送過去罷了。\n\n軒人只記得後領被人狠狠一扯，布料撕裂，自己整個人摔進貨架外的碎木片裡；下一秒，滿載生鐵輪圈的巨型生鐵貨架轟然砸落。\n\n在那一天之前，千歲走路是不需要手杖的。她的兩隻手永遠能同時拿著鑷子與焊槍。\n\n從那以後的三年裡，每當聽見鐵木手杖敲在石板上的篤篤聲，軒人心底便會有一個冰冷的念頭反覆響起——都是因為自己這具連殘留魔力都感覺不到的「空值」身體、都是因為當初的疏忽害千歲沒了左腿；下次再有什麼東西塌下來，就算把兩隻手都折在裡頭，也得自己一個人撐到底，絕不能再讓任何人踏前一步來替他挨這一下。\n\n＊　　　＊　　　＊\n\n「軒人。」\n\n一道清冷、澄澈而極具穿透力的聲音，筆直割開了棘輪刺耳的金屬摩擦聲。\n\n是Eraser。\n\n她靜靜站在木圍欄外側，守著約定沒有用受傷的左手觸碰任何物件，只是伸直右手，準確指向排水渠底下的某一點，一字一句清晰地對他說：\n\n「他們兩個在你的右下方，離二號排水口三步遠的凸石上！夜一被鐵樑擋住了看不見，只有你看得見，把位置告訴他！」\n\n軒人渾身一震，猛地眨掉刺進眼簾的汗水。\n\n三年前那座昏暗倉庫的幻影轟然碎散。眼前只有不斷剝落碎石的基座，以及渠底那兩名正貼著石頭、仰望向他的年輕檢查工。\n\n他狠狠吸進一口冰冷的河風，用沾滿鮮血的左手拇指重重按下胸前的傳聲器：\n\n「右下方。距離二號排水口三步遠的真實凸石上，有兩個人。旁邊冒出來的木地板是假的，不能踩。」\n\n岸邊的夜一在收到座標的同一秒鐘便出了手。\n\n「收到。別再往回硬扯手把，咬死現在的角度就行。」\n\n漆黑的紋路從夜一按住的石柱陰影下方驟然疾射而出，順著生鐵主樑投在渠壁上的斜影一路向下竄行，精準避開翻湧的假木走道，在距離那塊真實凸石不到半公尺的渠壁維修鐵梯兩側，瞬間凝成兩道穩固的黑色護欄。\n\n兩名檢查工看見渠壁旁憑空立起的黑色護欄，這才回過神，踩著實體鐵梯手腳並用地往上攀爬；對岸技師同步甩下救援繩，眾人合力將兩人拉上了安全的岸邊。\n\n然而，此刻站在檢修台上的軒人，雙臂已經抖得幾乎握不住制動手把。\n\n底座條石的裂縫越張越寬，棘輪齒牙發出瀕臨極限的金屬呻吟。手把每往前滑開幾公分，他右肩撕裂的傷口便像是連著骨膜被生生扯開。\n\n「……我這邊快撐不住了。」軒人對著傳聲器吐出了這句話。\n\n話音落下，傳聲器裡沒有任何一聲責備。\n\n千歲的聲音在下一秒俐落地傳了進來，冷靜而果決：\n\n「前面那根主樑不要救了。把制動手把根部的保險鎖片抽掉，讓整座支架往右邊的洩洪支渠裡倒。」\n\n「可是舊分離匣還扣在檢修孔上——」\n\n「夜一已經把人接上來了。你現在只管看你自己的退路。」\n\n夜一的聲音緊跟著響起：「兩個檢查工都上岸了。軒人，現在就拔鎖片，別等齒輪自己崩斷。」\n\n軒人低頭鎖定制動手把根部那枚因受力過度而咬死的保險鎖片。\n\n他沒有再用幾近脫力的右肩去硬扯，而是右腳踩實下方鐵踏板，用寬皮腰帶抵住手把暫時借力，左手反手抽出扁頭拆件短刀，反握刀身，拿沉重的刀柄朝鎖片側面狠狠一敲。\n\n喀噠。\n\n卡死的鎖片乾脆地彈脫開來。\n\n軒人立刻鬆手，順著預先拉緊的安全繩往後連退五步，翻身躍出檢修台。\n\n就在雙腳落回木圍欄外的同一毫秒，失去制動的貨運支架爆出一聲震動河岸的悶雷巨響，順著引導方向朝右側空無一人的洩洪支渠轟然傾倒，砸起漫天碎石與混著黑水的霧浪。而那只來不及卸下的舊分離匣，也跟著支架翻進兩根鐵樑交錯的縫隙裡，險險卡在積著黑水的渠底上方。\n\n## ３\n\n沒有一個人被壓在下面。\n\n兩名檢查工坐在圍欄外的青石上急促喘息，除了其中一人腳踝擦破了點皮之外，其餘連一點外傷都沒有。千歲依然穩穩站在工作檯旁，鐵木手杖握在右手裡，連一粒碎石都沒擦到她。\n\n軒人跌坐在圍欄外的泥地上，雙腿仍止不住地輕微發顫，一時竟站不起來。\n\n夜一走過來，在他面前蹲下身：\n\n「哪裡傷了？」\n\n「……右肩跟左手虎口。都是昨天留下的傷，又拉開了。」\n\n夜一掃了一眼他滲透紗布的暗紅血跡，側頭示意巡查員拿乾淨止血布過來。軒人呼吸仍有些急促，扭頭望向旁邊坍塌的洩洪支渠——那只舊分離匣正卡在兩根扭曲的鐵樑中間，黃銅外框被壓扁了一角，幸好沒有落進底下的黑水裡。\n\n「匣子……我現在下去取回來……」軒人撐著泥地想要起身。\n\n夜一伸出右手，一掌穩穩按在他左肩上，直接將他按回原地：\n\n「等技師確認鐵樑不會二次滑動再去拿。」\n\n「可是裡面的雙槽座很重要——」\n\n「我知道很重要。所以上面沒有再多壓一個你，等一下會比較好拿。」\n\n軒人張了張嘴，對上夜一那張沒有絲毫玩笑意味的冷臉，終究垂下肩膀，乖乖坐了回去。\n\n半小時後，確認殘骸徹底穩固，巡查員才架起滑輪將舊分離匣吊了上來。\n\n臨時工作棚裡亮起了總站制式的冷光魔導提燈。軒人左手纏著新換的白紗布，右手握著炭筆，在實驗記錄表第一頁逐字寫下今天下午的全部經過——包括看見千歲走向圍欄時驟然恐慌、企圖獨自硬撐制動手把，以及因此延誤整整十秒才向夜一報出檢查工位置的事，全數如實落筆，沒有替自己添上任何一句辯解。\n\n傍晚時分，河風轉冷。趕赴現場的榊主任掀開棚簾步入屋內，深色大衣上還帶著河岸的寒氣。他拿起桌上的實驗記錄表，從頭到尾安靜地看完。\n\n棚內瞬間沉寂下來，只剩下魔導提燈內核運轉的細微嗡鳴。\n\n榊主任的視線停在延誤報位十秒那一行，過了幾秒才緩緩抬起眼，鏡片後的目光冷得沒有一絲溫度。他沒有拍桌子，也沒有提高音量斥責，只將記錄表輕輕放回桌面，發出清脆而冰冷的一聲輕叩。\n\n「延誤報位十秒。」\n\n榊主任望著軒人，每一個字都平淡得像在宣讀一份冰冷的傷亡清單：\n\n「差點當場砸死兩名總站檢查工。昨晚我暫緩執行炸藥方案，是因為你們承諾能以零風險拿出驗證數據。結果第一場局部試驗，現場主要操作員就因為個人情緒失控卡死整整十秒——不破軒人，光是這十秒，明天進入核心的特別許可，我現在就可以當場吊銷。」\n\n棚內幾名巡查員下意識挺直背脊，連呼吸都不自覺放輕了。軒人喉頭發緊，雙手在膝上攥成拳，卻找不到任何一個能反駁的理由。\n\n榊主任伸手探進大衣內袋，緩慢抽出一支纖細的紅墨水鋼筆。燈光滑過暗紅筆身，他的目光平靜而近乎殘酷：\n\n「從今晚起全面維持清場，明天禁止再碰任何連結居民區的支架。明天日落準時執行炸藥切斷方案，犧牲外環三條街，保住其餘數千條人命——至少炸藥不會在關鍵時刻猶豫十秒。」\n\n冰冷的壓迫感幾乎將工作棚裡的空氣抽乾。\n\n就在榊主任的指尖抵上筆蓋、準備拔開紅鋼筆的那一瞬間，一道平靜清澈的聲音穩穩接住了他的話。\n\n「今天這場意外，把三百年來沒人查清的倒灌根源露出來了。」\n\n一直安靜坐在桌側擦拭舊圖冊封面的Eraser，將一張畫滿紅線的剖面底圖推到了桌案正中央，正好擋在榊主任那支紅鋼筆前方。\n\n棚內所有人的視線瞬間集中過去。\n\nEraser伸出右手食指，精準點在貨運支架底座與下游水閘之間那段石堤的剖面線條上：\n\n「三百年前砌這道石堤的時候，條石裡面也刻了一層排火的暗槽。剛才我們先關了上面的黃銅管，管子裡的高壓爐火無處可去，就全數往下擠進石頭暗槽裡，順著河堤一路衝向下游，逼出燙霧跟假走道，才害檢查工踩空。」\n\n千歲拿著放大鏡湊過去細看一眼，眉頭驟然鎖緊，隨即明白了過來：\n\n「難怪染布坊那天關了上層閥門還是壓不住火。原來上下順序徹底反了——先關上面的銅管，火就會往底下的石頭暗槽裡鑽。」\n\n「對。」Eraser迎向榊主任的視線，語氣平靜而堅定，「正確的順序只有一條：第一步，先用舊分離匣封住底下石頭的暗槽；第二步，再關掉上面的黃銅管；第三步，最後才拆開鐵架底座。只要先把底下的石頭暗槽堵死，上面的火就不會再往下亂竄。」\n\n千歲轉過身，手掌重重拍在旁邊那只外框壓歪一角的舊分離匣上，直視榊主任毫無溫度的目光，寸步不退：\n\n「匣子只是黃銅外框壓扁了一角，裡頭的雙槽座和接線扣完好無損，我今晚回店裡打上兩道鋼箍就能復原。榊主任，光靠畫幾張圖紙、點兩盞小燈，像你這樣只看損益的人肯定不會信——叫你的技師現在就去現場河堤，直接從石堤上敲一塊同批刻紋古條石樣本回晚鐘亭，再把總站庫存的三百年前河堤施工底圖調出來核對，確認石堤裡面沒有第二層暗槽。今晚當著你派來的人的面，我拿真古條石搭舊分離匣實測五次給你看。」\n\n榊主任眉頭極輕地動了一下，視線很快又轉回軒人身上：「就算順序找到了，進到核心裡面，誰敢保證你明天不會再卡死十秒？」\n\n軒人抬起頭，沒有避開那道審視的目光，右手平平按在桌角那份舊分工表上：\n\n「剛才延誤十秒是我的錯，我沒有任何理由替自己開脫。明天如果執行分離方案，水街、東石橋和舊站所有外圍支架與巡檢權，我全數交給總站技師班與外勤隊負責。我不再一個人硬扛外面的事，進核心之後也不會再把現場負重跟退路判斷同時抓在自己手裡。」\n\n魔導提燈的冷光輕輕閃動了一下。\n\n工作棚裡靜得能聽見河水流過斷石的微響。榊主任垂眼看著那張標清暗槽走向的紅線底圖，目光依序掃過神色鎮定的少女、態度強硬的千歲，以及纏著血紗布卻眼神筆直的軒人。他顯然正在腦海裡飛快重算眼前的代價與風險——強炸三條街的重建成本、數千名外環居民的善後，以及再給這幾個人最後一夜驗證的機率。\n\n過了漫長的十幾秒，榊主任喀噠一聲合上了紅鋼筆的筆蓋。\n\n「可以。」他的聲音依舊不帶絲毫溫度，「石樣立刻讓技師去敲，總站今晚派人全程盯場記錄。另外，外圍三處接點的實際切線與巡檢權立刻收歸總站調度。不破軒人，你明天只准負責核心開鎖，不許再越權去扛外面的支架。」\n\n榊主任站起身，高大的身影在燈下投出一道銳利的陰影，冷冷補上最後的條件：\n\n「但我把話說在前頭——今晚那五次古條石實測，只要冒出一絲倒灌火花，或是明早連她自己的獨立接口都沒法穩穩過關，我不會再聽任何解釋。明早立刻啟動炸藥部署，明天日落準時炸封。」\n\n話音落地，他轉身掀簾步入暮色，背影沒有一絲遲疑。\n\n回晚鐘亭的路上，夜色已經沉了下來。軒人手裡一直捏著那份實驗記錄副本，指尖無意識地把紙角折過去又攤開，折出了一道深深的白痕。\n\n走在身旁的夜一伸出右手，將他手裡那張快被揉爛的紙輕輕按平：\n\n「再看十遍，倒掉的架子也不會自己站起來。」\n\n「……我知道你要說什麼。」軒人低聲道。\n\n「你不知道。」夜一收回手，目光平視前方的石板路，「我要說的是，明天進到支爐裡面之後，絕對不能讓同一個人同時負責『承受重量』和『判斷撤退』。你今天扣住手把的時候，眼裡就只剩下那根鐵桿了，連身邊的人在喊什麼都聽不見。」\n\n軒人腳步微頓了半拍：「如果當時我第一秒就把位置報給你，下面的檢查工就連腳踝都不會擦傷了吧？」\n\n「可能會快幾秒。不過在看清下面位置之前，我也沒辦法出釘。」夜一語氣平淡，沒有絲毫安慰的意思，卻反而讓人的心跳沉靜下來，「你要改的是及時開口回報，不是把世上所有可能發生的意外都算成你一個人的罪過。」\n\n## ４\n\n回到晚鐘亭、送走夜一之後，千歲立刻升起小爐子，著手鍛打鋼箍加固舊分離匣的黃銅外框；戴著輕便護板的Eraser坐在燈下，用右手替她照順序整理明天要用的接線標記。\n\n軒人坐在水盆邊，想把左手虎口那圈被血浸透的舊繃帶揭下來重包。血痂早已乾結在紗布纖維裡，他才剛掀開一角，掌心便傳來一陣尖銳刺痛，手指不由得一縮，動作停在半空。\n\n一隻白皙的右手將一只盛滿溫水的粗陶碗，輕輕放到了他手邊的矮凳上。\n\n「先用水沾濕再拆。」Eraser站在他面前說，「千歲師傅第一天就教過了。」\n\n「……我記得。」\n\n「那你剛才乾著扯什麼？」\n\n軒人一時無言，只好乖乖把左手浸進溫水裡，等乾硬的紗布慢慢泡軟。\n\nEraser拉過一張小圓凳在他對面坐下，靜靜看著水盆裡散開幾縷極淡的紅絲，過了片刻才輕聲開口：\n\n「今天下午在支架上，你大聲叫千歲師傅不要過來的時候，我一開始以為是她腳下又有別的暗門打開了。」\n\n軒人垂著頭解開軟化的紗布：「……沒有暗門。」\n\n「後來我看見了。圍欄外面很安全，她只是想走近一點，幫你看清楚底下的線。」\n\n「嗯。」\n\nEraser沒有繼續往下追問，只將一卷乾淨的新紗布放在他手邊，便起身回到工作檯旁，繼續替千歲遞工具。\n\n等軒人重新包紮好左手，夜色已經很深了。隨行留守在店裡的總站技師早已將從河岸現場敲回來的同批刻紋古條石樣本搬進了屋內，同時帶來總站檔案室調出的三百年前河堤施工圖——圖面清楚標示著，整道石堤內部確實只有那一層聯通的排火暗槽。\n\n千歲將打好鋼箍、重新箍緊復原的舊分離匣擺上工作檯，把那塊刻著真實暗槽的古條石樣本接上模擬火路，上方架起銅管與兩盞標示壓力的魔導測燈，接著照著Eraser指明的順序——先封底下石槽、再關上面銅管、最後撤開底座——在總站技師緊盯不放的注視下，一步不差地反覆實測了五次。\n\n五次下來，每一次導流與切斷都乾淨俐落，刻紋古條石的暗槽裡連絲毫倒灌的火花都沒有冒出來。\n\n留守的總站技師這才鬆了口氣，將五次零火花的實測數據逐筆抄錄封存，連夜帶回總站向榊主任覆命，並約定明早由總站派覆核員前來做最後確認、領取簽字正本。\n\n送走技師，又等Eraser上二樓洗漱休息之後，軒人走到還在用油布擦拭扳手的千歲身旁：\n\n「千歲姊，我有點事想跟妳說。不是關於明天測試的事。」\n\n千歲擦拭扳手的手頓了一下，抬眼看他，下巴朝屋後輕輕一點：\n\n「那就幫我把高腳凳搬到後院去。屋裡一股機油跟焦鐵味，悶得很。」\n\n＊　　　＊　　　＊\n\n晚鐘亭的後院不大，只放得下兩張凳子與幾只接雨水的大木桶。\n\n軒人將高腳木凳擺在靠牆最平整的青石板上，伸手搖了兩下確認四條凳腳毫不晃動，這才在旁邊的矮石墩上坐下來。千歲坐上高腳凳，將那根伴隨她三年的鐵木手杖橫放在膝上，從圍裙口袋裡摸出一小張細砂紙，靜靜打磨起手杖握把邊緣一處極小的毛刺。\n\n「握把那裡磨手嗎？」軒人輕聲問。\n\n「這兩天走得多，虎口邊上有點刮拇指，磨圓一點比較順手。」\n\n高牆外頭的灰鐵巷深處，遠遠傳來上層區報時鐘塔低沉的整點鐘聲；餘韻慢慢融進秋夜裡，隨後只聽見夜巡警衛提著魔導提燈走過石板路的腳步聲由近及遠，四周再度歸於寂靜。\n\n軒人望著千歲膝蓋上那根磨得微亮的鐵木手杖，喉嚨動了動，終於把那句在心底壓了整整三年、今天下午又差點害死下面兩個人的話，毫無保留地說了出來：\n\n「今天下午在圍欄邊，我怕妳又因為我受傷。」\n\n千歲捏著細砂紙的手指停住了。\n\n「所以你就覺得，只要你一個人緊抓著那根制動手把不放、把所有重量都自己扛下來，我就不會受傷了？」千歲轉過頭看著他。\n\n軒人低下視線，纏著白紗布的雙手在膝蓋上緩緩收緊：\n\n「我不知道除了那樣還能怎麼做……三年前在倉庫裡，要是我的身體不是連殘留魔力都感應不到的『空值』，要是我沒有急著逞強表現、在擰螺栓之前先去拿妳替我做的物理外接測壓表檢查一遍，妳就不用衝進來推開我，妳的左腿也不會——」\n\n「不破軒人。」\n\n千歲連名帶姓地打斷了他。\n\n她將鐵木手杖穩穩靠回牆邊，抬起手指，平靜地點了點自己空蕩蕩的左腿膝蓋位置。她的聲音在秋夜的後院裡格外清澈，沒有刻意渲染的情緒起伏，卻字字沉甸甸地敲在人心上：\n\n「三年前那天，你漏看了魔導搬貨車輪軸裡的殘留魔力蓄壓。那不是因為你是『空值』，是因為你當時急著表現、忘了先插物理外接測壓表，沒守住基本規矩做錯了事。我後來罵過你，罰你把店裡所有的安全規程抄了二十遍，從那以後我也立下死規矩，店裡不管是誰，拆任何魔導器前都必須先插物理測壓表。」\n\n她望著抬起頭來的少年，眼底既沒有自憐，也沒有絲毫責怪：\n\n「這條腿確實沒了。下雨天會酸，高處爬不上去，搬重箱子得花錢請隔壁的工人搭手。這些都是實實在在的事，不需要你替我美化成什麼了不起的犧牲。但是軒人，我還活著，還在開這間晚鐘亭。」\n\n千歲重新捏起那張細砂紙，指尖輕點了一下靠在牆邊的手杖握把：\n\n「我每天想的是怎麼把工作檯的高度改得更順手，怎麼把這根手杖磨得不刮拇指，今天晚上燉湯要放幾根香腸，忙完了要早點關門睡覺。這些日子全是我自己一天一天過出來的——跟你能替我擋下多少危險，根本不是同一回事。」\n\n軒人的喉頭像是被什麼重物抵住了，眼眶無聲地發酸發熱。\n\n「你每次看見我拄著手杖走路，眼神裡都像只看得見三年前那個砸下來的生鐵貨架。」千歲看著他的眼睛，語氣平靜得近乎溫柔，「我不只剩下那一天，軒人。你也一樣。」\n\n大木桶裡的水面倒映著屋簷下搖晃的鯨油風燈。一陣微涼的夜風掠過院牆，水面上的燈影碎開，又在漣漪平復後慢慢聚攏。\n\n軒人垂下頭，盯著左手虎口上新換的白紗布，沉默了許久，才低啞著嗓子開了口：\n\n「……今天下午抓著手把的時候，我其實怕得要命。手根本使不上力氣，腦子裡一直在轉，萬一我鬆手了下面兩個人怎麼辦，萬一喊你們過來連你們也跟著掉下去怎麼辦。」\n\n「害怕手撐不住的時候，就開口喊人。」千歲把那小張細砂紙遞到他掌心，「你今天需要做的，就只是告訴夜一下面有兩個人、告訴我你的手快脫力了。我們這麼多人站在現場，不是為了在旁邊看你一個人當英雄的。」\n\n軒人伸手接過那張還殘留著千歲掌心餘溫的細砂紙，拿起靠在牆邊的鐵木手杖，低著頭，順著握把邊緣那處刮手的毛刺，一下、一下，極為專注地慢慢磨平。\n\n細碎的淺色木屑輕輕落在青石板上。\n\n「……磨好了，千歲姊。妳試試看還刮不刮手？」\n\n千歲接過手杖在右手裡轉了半圈，拇指撫過打磨圓滑的弧度，滿意地點了點頭：「順手多了。進屋吧，把明天的分工表改完就早點睡。」\n\n回到一樓燈下的工作檯前，軒人抽出了明天最終行動的分工草表。\n\n今天早上擬定這份表格時，他在『外圍巡檢』、『支架卸載』、『主控鐵箱拆鎖』和『後備接應』四個欄位後面，全都只填了『不破軒人』四個字。\n\n現在，他重新拾起炭筆，將外圍巡檢與支架卸載後面的『不破軒人』一條一條乾脆劃掉，改填上『總站技師班』與『水務班』；在『入口固定與緊急撤離』那一欄寫上『真崎夜一』；最後只在『主控鐵箱開鎖與隔板操作』後面留下自己的名字，旁邊並排工整地寫下了『Eraser』。\n\n停頓片刻，他在表格最下方的備註欄裡，一筆一劃補齊了三條撤退鐵則：\n\n**『一、任何一組人員負傷超限，立刻停手撤離。二、傳聲器失聯超過三十秒，不准繼續前進，原路退回上一個通話點。三、收到三聲撤退哨音，無條件優先撤人，工具與舊分離匣皆可當場棄置。』**\n\n炭筆輕輕擱回桌沿。窗外的秋夜無風，地底的爐火尚未熄滅，明天就要到來了。\n\n——第七章完——\n", "mtime": 1795001457.9049003}, {"filename": "08_第八章_燈祭前夜的荷包蛋.md", "content": "# 第八章　燈祭前夜的荷包蛋\n\n## １\n\n十月二十六日的早晨，軒人是被兩下規律而輕脆的敲門聲喚醒的。\n\n窗外的秋陽已經升過斜坡屋脊。隔著層層疊疊的灰瓦，遠方上層區白塔試敲鐘聲的清越餘韻隨風飄落，隱約混著高街石板路上馬車奔馳的轆轆車輪聲——從清晨起，滿載白金彩旗與煙火木箱的車隊就沒停過，整座高處城區正忙著迎接明天的建城三百週年燈祭。\n\n與高處的華美喧囂截然不同，樓下這間狹小工坊的廚房裡，此刻正順著木梯縫隙飄上來一股奇異的氣味——是剛熬好的早晨熱湯，混著某樣東西徹底燒焦的苦味，其間還夾雜著碗盤輕碰的細碎聲響。\n\n門板又以完全相同的節奏被輕敲了兩下。\n\n「你昨晚答應過，今天早上不會坐在床邊發呆。」門外傳來Eraser平靜無波的聲音。\n\n軒人低頭一看，才發現自己不知何時已經把右腳套進了氣瓶靴裡，左腳卻還光著腳掌，呆呆踩在微涼的木地板上。帆布工具包整齊靠在床尾椅腳旁，裡頭塞著昨晚重新打磨過刃口的扁頭拆件短刀。\n\n「我已經起來了。」他說。\n\n「你兩分鐘前也是這麼說的。」\n\n軒人忍不住失笑，彎腰將左腳氣瓶靴的靴帶拉緊扣牢，起身拉開房門。\n\nEraser正站在二樓走廊斜落進來的晨光裡。她穿著前幾天在灰鐵巷成衣鋪挑的素色粗棉裙與微立領開襟外套，淡粉紅色長髮以深藍髮帶收束在腦後，左腕依然固定著輕便的護板，右手則穩穩托著一只白瓷平盤。\n\n盤子正中央，靜靜躺著一顆邊緣焦黑捲曲、連蛋白外圈都泛成深褐色的荷包蛋。\n\n軒人盯著瓷盤看了兩秒：「……今天的早餐？」\n\n「只有第一顆油溫拉得太高。後面煎的兩顆我有看緊火候，已經端到樓下給你和千歲師傅了。」\n\n「那妳端著這顆上來，是打算賞給賴床的人當懲罰嗎？」\n\nEraser平靜地回望他一眼：「我自己煎壞的，當然我自己吃。只是順路端上來叫你起床。」\n\n話音剛落，她便用右手握著叉子，低頭對著荷包蛋焦脆發黑的邊緣咬下一小口。\n\n喀嚓一聲細響。她的眉尖幾乎在同時極輕地蹙了一下。\n\n軒人靠在門框邊，殘存的最後一絲睡意徹底散了：「很苦吧？」\n\n「很苦。」她坦率地點了點頭。\n\n「不能用妳的能力，讓它退回燒焦之前的狀態嗎？」\n\n「我的能力只能抹消術式，沒辦法抹消煎過頭的雞蛋。」Eraser把白瓷盤往懷裡收了半分，神色認真地看著他，「而且樓下留給你的那一顆，邊緣其實也有一點點焦。」\n\n「一點點焦總比啃木炭好多了。」軒人伸手接過她手裡的叉子，順手替她把最黑的那一角撥開，轉身邁向樓梯，「走吧，再不下去，千歲姊就要把完好的那兩顆全切進湯裡了。」\n\n下樓用完早餐，千歲將一樓工作檯上的雜物盡數清開，鋪上一塊潔淨的白棉布。\n\n兩盞測試用的魔導小術燈、昨晚從河岸現場敲回來的那塊刻著暗槽的古條石樣本，以及昨晚加打兩道鋼箍加固外框的舊分離匣，井然有序地排列在桌面中央。總站技師昨晚連夜帶回了五次零火花的實測數據，今早一開門，總站又派出一名專責覆核員上門進行最終現場複驗，並取走簽字正本。\n\n覆核員逐項核對過昨晚留底的五組紀錄，目光落在白布上的古條石與舊分離匣之間，沉聲要求千歲將左右兩盞小術燈正反對調位置，完整重跑一遍流程。\n\n千歲右手穩穩撐住鐵木手杖，左手俐落動手。先封死底下古條石的暗槽，再關閉上方銅管，最後卸開底座接頭。左側小術燈乾脆熄滅，右側燈火依舊平穩常亮；夾在中央的古條石毫無異動，暗槽內壁連一星半點倒灌的火花也沒有竄出。\n\n覆核員俯身細測石槽內壁與導線溫度，確認讀數分毫不差，這才在紀錄表最末一欄蓋下覆核印記，將簽字正本仔細折進公文夾，匆匆起身趕回總站向榊主任覆命。\n\n門外急促的腳步聲逐漸遠去。軒人走到店門前，反手插實厚木門栓，再將臨街的深灰厚布簾徹底拉攏。\n\n白晝的微光與外街喧響頓時被隔絕在外。狹小的工坊瞬間安靜下來，只剩工作檯上方那一盞冷光魔導檢修燈垂落光束，照亮鋪著白布的桌面。\n\nEraser拉開工作檯前的圓凳坐定，抬眼望向千歲：\n\n「接下來輪到我了嗎？」\n\n千歲轉過高腳木凳，先將桌上那只舊分離匣的上層黃銅隔蓋輕輕掀開，露出下層那組專為古工坊核心打造的雙槽座。她再從一旁的絨布盒裡夾起一枚剛打磨完成、鑲著拇指大小白色小魔石的淺銀色圓環，平放在Eraser眼前的白布上：\n\n「動手之前，我先把每一個步驟說清楚。並不是因為外頭那些人準備就緒了，妳就非得在今天動這個改裝不可。」\n\n千歲用尖頭鑷子點了點舊分離匣下層雙槽座中央那道五瓣花形狀的凹槽，再輕觸那枚獨立魔力環：\n\n「妳領口的花扣底下，有一根暗紅色的粗底線一路連向地底的七號支爐，所以支爐一停，妳也會跟著停擺。待會兒我們先把妳的花扣對準舊分離匣雙槽座中央的五瓣花凹槽固定穩妥，藉著雙槽座替妳接通這枚裝有小魔石的獨立魔力環；等新圓環平穩起轉之後，我再照著舊圖冊記載的次序，用古銀絲把維持妳身體機能的細銀線一根一根移過去，最後才用絕緣銀剪剪斷連往地底七號支爐的舊底線。」\n\n千歲抬起視線，目光平穩而沉靜地望進少女眼底：\n\n「整個過程絕不碰觸妳的記憶，妳也會一直保持清醒。中途只要覺得有一絲發悶、疼痛或發冷，隨時喊停，我們立刻照原路退回，絕不硬撐。」\n\nEraser垂下眼睫，右手食指的指腹隔空懸停在那枚沒有繁複雕花、打磨得光滑溫潤的淺銀色獨立魔力環上方。\n\n「記憶不會變少？」她輕聲確認。\n\n「半個字都不會少。」\n\n軒人拉開側邊抽屜，取出一只普通的黃銅機械懷錶，輕輕擱在Eraser一低頭就能望見的桌角。千歲瞥了他一眼：\n\n「擺個懷錶在這裡，是為了量每次移線的間隔，不是拿來盯著秒數催她繼續。」\n\n「我知道。」軒人把錶盤轉向少女，細小的秒針在靜謐的屋內吐出一聲聲清脆規律的滴答，「是讓她自己看著時間走，心裡有底。」\n\nEraser伸出右手食指，輕輕觸碰了一下懷錶微涼的黃銅外殼。\n\n「開始吧。」她抬起臉，淡粉色的眼眸澄澈而堅定，「我想把那條連著地底的舊線拆掉。」\n\n## ２\n\n軒人先幫千歲調好工作檯邊緣的托架高度，讓Eraser能以最不費力的姿態微微前傾，衣領恰好平貼在舊分離匣上方。\n\n當千歲雙手握穩絕緣鑷，將她領口那枚右下角缺了一小角的銀色五瓣花扣對準雙槽座中央的五瓣花凹槽、極輕極緩地嵌下去時，軒人下意識屏住了呼吸。\n\n喀噠。一聲細微而精準的咬合。\n\n凹槽兩側的微型絕緣壓扣順勢扣實，舊分離匣下層的雙槽座穩穩承接住花扣底座。那股平常偶爾會透過衣料滲出的低沉微震頓時被底座吸收大半，替千歲騰出了雙手精細作業的穩固支撐。\n\n千歲這才用專用薄片輕輕撬開五瓣花扣的外蓋。\n\n裡頭的內部構造比軒人想像的更加細密。十幾根纖細如蛛絲的古銀絲連向Eraser胸口，安靜地維持著她的呼吸與體溫；而在最底層，一根暗紅色的粗底線筆直穿透底座探向地底，每隔數秒，便隨著遙遠七號支爐的脈動傳來一陣低沉鈍重的震動。\n\n掀開花扣外蓋之後，那些裸露在空氣裡的十幾根古銀絲對外在的魔力波動極其敏感。千歲自己都必須拉開半臂距離、透過加長的絕緣鑷操作，因為就算是一般白塔的高階技師站在旁邊幫忙扶分離匣，常人體內自然散溢的微弱人體魔力也會干擾古銀絲的震動頻率；全白央城裡，唯獨身為「絕對魔力絕緣體」、體內處於徹底「空值」的軒人，能夠貼在距離她胸口不到半尺的地方，穩穩按住舊分離匣底座、舉著冷光鏡，卻不會對裸露在外的精密迴路造成哪怕一丁點干擾。\n\n千歲在動手移線前，看了一眼軒人穩穩壓在雙槽座邊框上的手掌，不禁感嘆了一句：\n\n「這活兒換成白塔本塔的技師來還真幫不上忙，全城也只有你這雙半點魔力都不沾的手，能湊這麼近替我按住底座。」\n\n「那我這雙連魔導燈都點不亮的手，今天也算排上頭號用場了。」軒人低聲應道，手腕穩如磐石，連半分晃動都沒有。\n\n千歲沒有急著碰那根暗紅粗底線。她先將鑲著白色小魔石的獨立魔力環嵌入雙槽座另一側的副槽，再用兩根柔韌的古銀絲在雙槽座之間架起穩定橋路。小魔石剛一接通，獨立魔力環內緣立刻亮起一抹柔和而極淡的銀白微光，雙槽座旁的壓力指針隨即平穩滑升至綠區中段。\n\n「新環起轉了。」千歲低聲報出一句，目光掠過攤在桌角泛黃的舊圖冊，鑷尖精準夾住第一根銀白細線的接頭，將它自舊底座平緩移上古銀絲接點，再轉接入獨立魔力環。\n\n軒人貼在距離Eraser胸口不到半尺的側面，左手舉著冷光鏡微調照明角度、腕側穩穩按實舊分離匣底座，右手備著炭筆，視線在魔力波動表與桌角懷錶之間來回移動；Eraser靜靜坐著，依約隨時口頭回報體感。\n\n「第一根，沒有感覺。」\n\n「第二根，指尖有點發涼，馬上散掉了。」\n\n當千歲移接第三根細線時，Eraser的眉心輕輕一攏：「胸口有一點悶。」\n\n千歲手裡的絕緣鑷瞬間凝住，連半毫米都沒再往裡送，果斷退回上一個接點：「這根線原本走得太緊，轉進新環後角度偏了一點。我多接一小段古銀絲放寬弧度，就不會扯到妳了。」\n\n軒人右手握著炭筆，在手邊的紀錄紙上如實寫下停頓的秒數與線位，沒有催促半個字。冷光魔導燈籠罩的工坊裡，只剩古銀絲細微的金屬摩擦聲，以及懷錶秒針一格一格走過的輕響。\n\n多接上一小段古銀絲重新轉接後，Eraser的右手指尖僅微涼了三秒便恢復暖意，胸口也沒再泛悶。\n\n一根，兩根，五根，十根。時間安靜流淌，窗簾邊縫滲入的秋日晨光緩緩移過桌角。\n\n等到最後一根維生細線穩妥落入獨立魔力環、雙槽座左右兩排指針悉數定格在平穩綠區的那一刻，千歲才換上絕緣銀剪，將冰冷的刃口緩緩合攏在最底層那根連往地底七號支爐的暗紅粗底線上。\n\n「準備好了？」她問。\n\n「好了。」Eraser的聲音極穩。\n\n喀嚓。\n\n一聲清脆俐落的剪響劃破寂靜。\n\n暗紅粗底線應聲而斷。頭頂的冷光魔導燈沒有閃爍，工作檯沒有絲毫震顫，雙槽座上的指針也平穩得沒有半分偏移。千歲鬆開五瓣花凹槽兩側的壓扣，將接妥獨立魔力環的花扣底座從舊分離匣裡輕輕托起。\n\nEraser依舊挺直背脊坐在圓凳上，左手安穩搭在固定護板上，右手平放膝頭。\n\n她垂下視線望著自己微微張開的掌心，隨即緩緩吸進一口氣，又輕輕吐出。\n\n「……那個一直從地底拉扯著我的聲音，消失了。」她抬起眼望向千歲，淡粉色眸子裡映著冷光魔導燈的燈影，透出一種前所未有的澄澈與輕盈，「現在是新的魔力環在運作嗎？」\n\n「對。從這一秒起，維持妳身體活動的魔力完全由花扣背面這枚獨立魔力環和小魔石供應。地底下那座支爐往後不管是停是拆，都再也不會牽連妳的性命。」千歲並未急著收工具，視線仍停在錶盤上，「先安靜坐著休息，也別急著測試能力，我們靜置觀察十分鐘。」\n\n軒人這才驚覺，自己握著炭筆的掌心早已沁出一層薄汗，筆尖在紀錄紙角落停駐太久，悄悄暈開一小團黑漬。\n\nEraser偏過臉望著他：「你剛才是不是一直憋著氣？」\n\n「哪有，我明明一直在呼吸。」\n\n「至少有半分鐘沒聽見你換氣。」\n\n「……我那是怕喘氣聲太大，吹歪千歲姊手裡的古銀絲。」\n\n十分鐘在安靜的滴答聲裡緩緩過去。魔力波動表的指針始終靜止在綠線正中，連半格都未曾晃動。軒人倒了半杯溫水遞過去，Eraser用右手接過抿了兩口，還小聲挑剔了一句今天的水好像比昨天燙了一點。千歲聽見反倒徹底放了心，笑著搖搖頭數落了一句「還真挑嘴」，隨手將淺銀色的獨立魔力環正式封入花扣底座，穩妥合上銀色五瓣花外蓋。\n\n從正面看去，那枚銀色五瓣花扣依舊保持著原本的模樣，右下角花瓣那道九年前留下的小缺角清晰如昔；唯有緊貼衣領的背面邊緣，多了一圈細緻柔和的新銀接縫。\n\n千歲遞過去一面小銅鏡：「自己照照看。看得出來有修補過的接縫，沒辦法跟三百年前剛出廠時一模一樣了。」\n\nEraser接過銅鏡仔細端詳了一會兒，右手食指順著背面光滑的新接縫輕輕描過一圈，轉過頭望向軒人：\n\n「會很難看嗎？」\n\n軒人湊近半步認真看了看：「收口焊得很平整，應該不會勾到外套毛線。」\n\n「我不是在問會不會勾衣服。」她把銅鏡輕輕放回桌面。\n\n一旁的千歲不輕不重地咳了一聲。軒人耳根微微一熱，連忙重新看向她領口那枚帶著新銀邊的花扣，坦率地改口：\n\n「看得出補了一圈新邊，但我覺得比以前更好看。」\n\nEraser低頭又掃了一眼銅鏡，伸手將微立領外套理平整：「那就這樣吧。」\n\n上午十點整，千歲收妥舊分離匣，在工作檯上換出三組不同負荷強度的模擬測試銅板，正式展開唯一一輪獨立供能的抹消上限實測。\n\n這一次不再連著地底支爐，全靠獨立魔力環裡那顆拇指大小的白色小魔石獨自運轉。\n\n第一塊測試板僅刻著普通的照明術式。Eraser右手食指輕輕觸及，刻紋便無聲化為一片空白，花扣外殼連絲毫溫熱都沒有泛起。第二塊模擬水閘強度的中負荷刻紋，她持續按壓了二十秒，指尖才泛起微微暖意，鬆手歇了兩分鐘便徹底消退。\n\n輪到第三塊模擬七號支爐主迴路的高負荷測試板時，千歲讓她每隔十秒回報一次掌心觸感；軒人則握緊懷錶站在桌旁，目不轉睛地盯著花扣正中央那顆圓潤白珠。\n\n「三十秒，手心微微發溫。」\n\n「五十秒，手腕內側開始發燙。」\n\n「七十秒，指節有點發緊。」\n\n屋內的空氣驟然繃緊。秒針一格一格跳過八十秒。當細長的指針剛踏上第八十五秒刻度線的瞬間，花扣正中央那顆雪白圓珠的最外圈，悄然浮現出一道清晰的鵝黃色細環。\n\n「停。」千歲幾乎在同一剎那出聲。\n\nEraser立刻收回右手。千歲夾起感溫銀箔貼在花扣背面讀出數值，隨即將降溫用的薄銅片按上外殼，轉過頭神色凝重地望著軒人：\n\n「把剛才那個顏色牢牢記在腦海裡。平常走路、說話，一顆小魔石足夠撐大半天，我也另外替她縫了個掛在外套內袋的小皮袋裝著備用小魔石，早晚換一顆就行。但動手抹消高強度爐火的時候，九十秒就是絕對不能碰觸的紅線——甚至不必等到九十秒，只要你看見白珠外圈一開始浮出鵝黃色，無論現場只差幾秒鐘，都必須立刻喊停收手。」\n\n千歲指了指感溫銀箔上尚未退散的熱紋，嗓音冷硬而清晰：\n\n「這種發熱會累積在花扣與手腕迴路本身，就算現場換上十顆新魔石也沒辦法重置，必須徹底靜置冷卻好幾個小時才能歸零。今天下午進了檢修站，絕對不會有第二輪九十秒的機會，聽明白了嗎？」\n\n「白珠一泛黃立刻收手，沿途零星動手的秒數也要全算進總額度裡。」軒人提筆將這條鐵律工整寫在行動手冊最上方，抬眼掃過桌上的冷卻計時器，「我會全程盯緊花扣的顏色。」\n\nEraser右手按了按外套內側那只備用小皮袋，輕聲問：「那如果半路上碰到很小一段殘留術式呢？」\n\n「能繞就繞，能交給軒人用工具拆就用工具拆。」千歲一邊替花扣降溫，一邊把規矩定死，「前面多抹消一秒，最後留給主控鐵箱的時間就少一秒。別當成逛市集順手掃除，看見哪裡閃紅光就隨便伸手去碰。」\n\n「我記住了。」Eraser認真點頭。\n\n## ３\n\n接近正午時分，榊主任與真崎夜一親自來到晚鐘亭。\n\n距離上午十點那輪上限實測已經過了將近兩個小時，花扣始終依規靜置冷卻，沒有再多作半分額外消耗。榊主任進門後先翻開桌上的實測讀數表，從頭到尾逐行核對感溫紀錄與魔力波動線，再俯身確認計時器與感溫銀箔上穩定歸零的冷卻讀數。\n\n合上記錄夾，他臉上沒有流露多餘的鬆懈或笑意，神情依舊冷峻務實。\n\n「獨立供能曲線平穩，九十秒高負荷紅線與冷卻條件皆已鎖進數據裡，最不穩定的變數算是有了解法。」榊主任抬起目光，將蓋過總站鋼印的正式行動令按上桌面，隨即攤開下午的最終現場部署圖，「按計畫執行。」\n\n他修長的指尖重重點在部署圖上的三個紅圈：\n\n「外圍隔離從昨晚便已同步展開。水街東口、東石橋頭、河岸舊調壓所這三處共用接點，由總站三組工程班分頭負責，嚴格依照你們昨晚和今早覆核通過的順序——先封底下石槽、再關上方銅管、最後拆鐵架底座——推進。大部分承重支架昨晚已換成實體木樁，今天日落前就能完成外圍切離。」\n\n指節順著圖紙往河岸上游滑動，停在那座半塌的「七號支爐舊檢修站」標記上。\n\n「麻煩留在支爐內部。七號支爐的主控鐵箱與主承重鐵架是三百年前留下的實體，但這幾天爐壓持續外溢，舊主架周圍已經翻湧出一整片重疊錯亂的舊礦道與管線殘響區。今早封鎖線合圍之前，有十二名住在河岸邊的居民和巡查工被突然張開的殘響通道捲了進去，目前仍受困在裡頭的舊車間與管道廊裡。」\n\n軒人垂眼看向一旁攤開的失聯名冊。紙面密密麻麻列著十二人的姓名、衣著特徵與最後目擊地點，最下方還預留著幾行空白欄。\n\n「只有這十二個人嗎？」軒人問。\n\n「這是街區居民與家屬已核實的十二人，但不排除還有沒登錄在本地名冊上的外地過路工匠。」榊主任的語氣低沉平直，「你們進場之後，第一步是把裡面所有活人找出來，沿著我們架在河岸三座真實石墩上的實體檢修橋送回岸邊；第二步，等外圍三組全部切離完畢、確認裡頭再沒半個活人，你們才准靠近主控鐵箱接上舊分離匣，用那九十秒額度徹底抹消箱內的三段失控指令。」\n\n靠在門邊的真崎夜一垂目將左手那只黑色薄手套的袖口理平，冷靜地接過話頭：\n\n「我守在舊檢修站外側的真實入口，以黑布和固定燈位替你們撐住通往岸邊的出口陰影。我必須留在外頭穩住入口結構，無法跟你們一起深入殘響區尋人。三條撤退信號記牢——外側連敲三聲銅鈴、傳聲器重複呼叫撤回、或是她的花扣白珠提前泛黃。觸發任何一條，當場停手撤離。」\n\n「明白。」軒人將三條撤退條件一字不漏地複述了一遍。\n\n送走榊主任與夜一後，他把加打鋼箍的舊分離匣調整成左肩斜背、腰帶雙扣分擔重量的背負方式，帶著Eraser在店內實地演練了三次短導線快拔與換位，直到兩人在狹窄空隙間錯身也不會扯到導線才停手。\n\n中午十二點多，趁總站工程班還在河岸進行最後一遍實體石墩載重測試，軒人與Eraser走去水街的撤離集合點吃午餐。\n\n抬頭朝山坡高處望去，半山腰與上層區的屋簷之間已懸滿慶祝明天燈祭的白金彩旗，在清透的秋日陽光裡獵獵翻飛；遠方高街大道上不時滑過塗著金漆的慶典花車與拉運煙火的馬車，明亮得宛如另一個無憂無慮的國度。\n\n然而山腳下的水街卻截然相反——空氣裡浮著搬遷揚起的塵灰，巷口拉起總站的臨時警示繩，水街的居民們正推著載滿家當的手推板車，一步步往西坡與高處撤離。空蕩蕩的魚市攤位排成一列，只剩木棚在地上投下冷清的斜影。\n\n兩人端著溫熱的木盒便當，坐在水街原本賣魚的空攤長凳上，借著魚販留下的舊木棚遮住午後陽光。\n\n對面染布坊門前停著兩輛大板車，老闆娘正指著一根比車斗長出一大截的晾布長橫桿，和兩名搬運工爭得面紅耳赤：\n\n「怎麼能說鋸就鋸？這根老木橫桿要是鋸斷了，搬去西坡臨時市場誰替我接回原樣？」\n\n「不鋸短，車子轉不過西邊那條窄巷啊，老闆娘。」\n\nEraser端著便當盒站起身走過去，蹲下身仔細看了一眼長橫桿中段包著鐵箍的接縫：\n\n「這裡原本就做著活接頭。不用鋸斷，只要把中間這兩顆對位螺絲擰下來，就能拆成兩截裝車。拆之前拿粉筆在側面畫一道對齊線，搬過去才不會裝反。」\n\n軒人也走上前看了一眼。他沒有自己蹲下去硬扳，而是向搬運工借了把長柄扳手，用纏著薄紗布的左手示範了一遍鬆開對位螺帽的卡角，隨即把扳手交還給兩名力氣充足的搬運工。不到五分鐘，長橫桿便俐落地拆成兩截，工整躺上板車。\n\n老闆娘長長吐出一口氣，可回頭望著搬空大半的店面，眉心又緊緊蹙了起來：「架子是運走了，可西坡的臨時市場連條引水溝都沒有，後面這幾十桶等著漂洗的布匹，該怎麼趕在燈祭結束後交貨啊。」\n\n軒人將便當盒暫放板車角，從外套口袋抽出一張空白的申請便條紙遞給她：\n\n「老闆娘，光對著搬運工先生發愁沒辦法解決問題。妳把每天需要的運水車趟數、臨時晾布架需要的場地空間，還有延誤交貨的布匹數量全寫在這張紙上，待會兒送去總站一樓後勤窗口，請辦事員蓋個收件章留底。今天未必能立刻撥下來，但留下一紙正式書面紀錄，總比口頭反映有用得多。」\n\n老闆娘微微一愣，接過紙筆先寫下染布坊的招牌名號，抬眼瞥見Eraser左腕的護板與軒人左手纏著的紗布，連忙擺手把兩人往回趕：\n\n「好了好了，你們兩個手上的傷都還沒好全，別站在這裡吸灰了，快回去坐下吃午餐吧，再拖下去便當都要涼透了。」\n\n兩人走回空魚攤的木棚下坐定。\n\nEraser用右手掀開便當盒的木蓋。裡頭裝著白米飯、燉得軟嫩的豆子，旁邊壓著一塊煎得金黃平整的厚蛋燒。她先夾起厚蛋燒咬下一口，細細嚼完，認真點頭：\n\n「比我早上煎的好吃。」\n\n「妳早上煎的那顆，原本就不能歸類在食物裡吧。」\n\n「只是邊緣黑了一點。」\n\n「中間也已經發黑了。」\n\n「……你不用把每件事都記得那麼清楚。」\n\n軒人低頭扒飯，嘴角忍不住揚起一抹笑意。才吃到一半，一輛堆滿鍋盆家具的手推板車嘎吱作響地從巷口經過。跟在板車後方的，正是灰鐵巷烤餅鋪的松井婆婆，還有鄰居家那個總愛拿根木枝到處比劃的小男孩——前幾天逛早市買餅時，他們早已熟稔得像同個街區的鄰居。\n\n小男孩今天沒有揮著木枝亂跑，雙臂緊緊抱著一只裝得圓鼓鼓的布袋，袋口斜插著一隻用藍紙摺的小風車。\n\n「是軒人哥哥，還有粉紅頭髮的姊姊。」\n\n小男孩一眼認出木棚下的兩人，扯著松井婆婆的衣袖快步跑了過來。\n\n松井婆婆走到棚下，目光先落在Eraser左腕的護板上，又掃過軒人手上的白紗布，眼角眉梢滿是熟人重逢的牽掛：「這兩天忙得都沒見你們晃去烤餅鋪，原來一直在外頭四處奔波。聽街口的巡查員說，我們這片先搬去山坡上的舊學舍暫住兩天，你們下午還要下河岸那邊的舊站嗎？」\n\n「還有人困在底下的通道裡，我們得去把人接出來。」軒人放下筷子點頭，放柔聲音叮囑道，「婆婆，去舊學舍要走南邊那條大坡道，別抄鐘樓後頭的小路，那邊的碎石還沒清乾淨。等這兩天忙完了，我們再去店裡吃剛出爐的熱烤餅。」\n\n「好，我等著替你們多留兩張剛出爐的芝麻烤餅。」松井婆婆笑著溫聲答應。\n\n小男孩先看了看軒人腳邊鼓脹的工具包，再低頭看看自己懷裡的大布袋，仰起臉小聲問道：\n\n「底下那些還沒出來的人，等一下也會搬去舊學舍跟我們一起住嗎？」\n\n「應該會吧，床位由總站那邊統一安排。」\n\n小男孩抿著嘴唇認真想了兩秒，隨即低頭伸出兩隻小小的手掌，使勁把自己懷裡圓鼓鼓的布袋往下壓扁了一些：\n\n「那我把我的袋子壓小一點，空出位子給他們。」\n\n松井婆婆笑著摸了摸孩子的頭頂，又向軒人與Eraser道了一聲務必保重，這才牽著孩子匯入撤離人流，順著青石坡道一步步朝高處走去。\n\n軒人目送那一高一矮的背影沒入坡道盡頭的陽光裡，這才低頭將便當盒裡最後一口米飯扒進嘴裡。\n\n從前他總以為，所謂解決災禍，就像故事書裡的勇者那樣孤身衝上去斬斷元凶，隔天太陽照常升起，街巷裡的一切就會自動復原。直到這兩天親眼看著整條水街的人拆橫桿、寫申請條、算運水車趟數、把小布袋壓扁一點替陌生人空出床位，他才真正明白——每一次動盪在日常裡撕開的裂口，從來都不是靠奇蹟癒合的，而是靠活著的普通人一點一滴親手縫補回去。\n\n「我還沒去過山坡上的舊學舍。」Eraser合上空便當盒，工整疊在他那一份上面。\n\n「等這邊的路修好了，再帶妳去看看。那邊操場視野開闊，站著就能望見整條河。」\n\n「山坡上的鐘塔也能望見。」她輕聲說。\n\n軒人側過臉，望著被秋日暖光鍍上一層淡金輪廓的少女側臉，微微一笑：\n\n「那就先去鐘塔，再去學舍。」\n\nEraser把筷子收進布套，唇角極輕地往上彎起一個弧度：\n\n「記得帶錢買薄餅。」\n\n## ４\n\n下午三點，出發前的最後一刻。\n\n真崎夜一已經把總站的雙輪馬車停在晚鐘亭巷口等候。店鋪的木門板關了一半，千歲把客人寄修的鐘錶器具全數搬上內室高架，坐回矮凳替軒人的氣瓶靴換上三顆全新的靴跟氣罐，再親手清點三枚硬木楔子逐一塞進他腰間工具袋、扣實搭扣，最後仔細拽試了兩遍腰帶上的雙重承重扣。\n\n「靴跟氣罐一共三顆，硬木楔子三枚，起跳前先看死落腳點。」千歲屈指輕敲了一下他的靴跟，「右肩絕對不准拿來吊人，救生繩全數掛在腰帶主環上；舊分離匣背在左肩，短導線只有在最後碰到主控鐵箱時才准插上Eraser的花扣。都記清楚了嗎？」\n\n「記清楚了。」\n\n「昨天你也是這麼說的。」\n\n「今天要是再犯，回來妳罰我抄一百遍安全規程。」\n\n千歲撇了撇嘴，將一卷新備妥的紅繩塞進他掌心。軒人背好工具包與舊分離匣，俯身確認Eraser領口花扣的冷卻讀數徹底歸零、中央白珠透著最純淨的雪白色，兩人這才一同扶著千歲登上巷口馬車，隨夜一駛往河岸上游的「七號支爐舊檢修站」。\n\n下午四點，十月二十六日的秋日漸漸西斜。\n\n遠方高踞山脊的白塔外牆，已搶在暮色降臨前點起試燈用的暖白魔導燈列，整齊璀璨地勾勒出高塔輪廓，彷彿正無聲預告著明天盛大的建城燈祭。\n\n然而河岸這邊卻像被切進了另一個冰冷而灼熱的世界。舊檢修站外圍已經架起三座由厚重精鋼樑串聯的實體檢修平台，平台下方掛著滑輪索道，河岸邊停靠著兩艘隨時待命的救援木艇；早已就位的榊主任正手持現場名冊，佇立在指揮棚前冷靜盯著水文讀數。\n\n順著實體平台望進檢修站大廳深處的那一瞬間，軒人的呼吸陡然收緊。\n\n原本應該空蕩荒廢的磚石大廳，此刻已被一層自地底支爐翻湧而出的暗紅濃霧徹底吞沒。濃霧深處，三百年前支爐初建時的多層礦車軌道、轉運車間與蒸汽廊橋層層疊疊地浮懸在半空緩緩輪轉；幾名身穿古式深藍工裝的虛影工匠推著裝滿礦石的鐵車，悄無聲息地從懸空軌道上滑掠而過。\n\n而在靠外側第一間半透明的值班室玻璃窗後，一名繫著當下水街圍裙的年輕婦人正拚命拍打窗面，朝岸邊的燈火用力揮手——正是今早失聯名冊上的十二名居民之一。\n\n「她在對我們揮手，看得見岸上的動靜，是活人。」\n\n軒人隔著十幾公尺的距離，朝窗後的婦人舉起右手，穩穩比了一個『留在原地』的手勢。窗後的婦人瞬間領會，連忙停下拍窗，順從地往屋裡退開半步。\n\n真崎夜一邁步走至平台最前端，將一塊厚重黑帆布固定在左側魔導燈架下方，隨即摘下左手黑色薄手套，將蒼白的掌心筆直按進地面的黑影裡。\n\n濃稠如墨的漆黑紋路順著平台邊緣疾竄而出，瞬間沿著地縫切上檢修站入口處那扇隨殘響劇烈震顫的鐵門下緣，將門框牢牢釘進真實的石墩基座裡，露出了底下寬敞平整的實體鐵板。\n\n「入口釘住了。」夜一的聲音低沉而平穩，「第一批人帶出來之後，直接順著這塊鐵板送上救援艇。」\n\n軒人將第一卷紅繩牢牢扣上腰帶主環，側過臉望向身旁的Eraser。\n\n「走吧。先把人接出來，再關爐子。」\n\n「好。」Eraser右手握緊短繩扣環，與他並肩踏上了通往暗紅濃霧深處的實體鐵板。\n\n——第八章完——\n", "mtime": 1795001504.9528966}, {"filename": "09_第九章_穿過沸騰的暗渠.md", "content": "# 第九章　穿過沸騰的暗渠\n\n## １\n\n踏進舊檢修站大門的那一瞬間，彷彿迎面撞開了鍛造爐的爐門。\n\n滾燙的蒸汽夾雜著濃重鐵鏽味劈臉撲來，灼得眼眶發酸；三百年前殘留的尖銳汽笛聲與滋滋作響的廣播雜音幾乎在同一秒灌滿耳膜，震得人太陽穴隱隱發脹。\n\n一道身穿古式深藍工裝的值班員虛影正立在入口鐵梯旁，僵硬地抬起右臂指向前方轉運通道，嘴裡機械而平直地一遍遍複誦著同一句指令：\n\n『爐壓檢修期間，請非當班人員盡速離開車間。』\n\n值班員的雙靴懸在半空。他腳下三百年前原本鋪設的木踏板早已腐朽塌盡，底下只剩暴漲奔湧的暗黑河水，拍擊著深鏽鐵樑捲起震耳欲聾的轟鳴。\n\n軒人沒有分神去看虛影，先單膝落地扣緊岸上工程班推進來的實體鐵踏板插銷，再伸手用力猛拉兩下綁在入口鉚釘上的第一卷紅繩。確認繩結牢靠得沒有半分滑移，他這才回過頭朝Eraser一點頭。\n\nEraser緊貼在他身後半步。她左肩斜背著舊分離匣的備用雙扣背帶，連往領口花扣的那根短導線仍安靜收在匣側卡槽裡，尚未接通。\n\n兩人一前一後踩上入口踏板。\n\n當軒人從值班員虛影身前大步跨過時，那道半透明的人影連眼皮都未曾抬動，毫無反應；可就在Eraser鞋尖剛踏上同一塊鐵板的剎那，值班員虛影竟猛地旋過半身，手臂筆直橫掃過來，硬生生攔在她胸前：\n\n『檢修人員請出示通行木牌。』\n\n一股灼熱猛烈的風壓隨著虛影抬臂橫切而過，將Eraser額前幾縷淡粉紅色碎髮吹得向後急揚。\n\n她立刻止步，低頭望了一眼胸前領緣那枚上午剛剛改妥獨立供能的銀色五瓣花扣，眼底瞬間浮現清明的判斷。\n\n「這座車間的舊檢哨只感應魔力波動。」她側過臉，對退回半步的軒人輕聲道，「體內沒有絲毫魔力的『空值』走過去，在它眼裡就像滾過一塊石頭，根本不會觸發警戒。以前我連著地底支爐的底線，它會把我辨識成車間內部的零件放行；上午剛換上獨立魔力環，身上帶著獨立運轉的魔力波動，它反倒把我當成擅闖的外人攔了下來。」\n\n軒人左手反握扁頭拆件短刀，試探性地往前一壓，想將那條攔路手臂撥開——虛影看著半透明，手臂周圍壓出來的滾燙氣牆卻硬得像燒紅的生鐵棍，猛地反震過來，震得他纏著薄紗布的左虎口一陣發麻。\n\n硬闖只會平白耗損體力。Eraser沒有後退，目光迅疾掃向右側三步外的礦石卸貨口。\n\n那裡同樣立著一名古裝搬運工的虛影，正機械地重複著彎腰扛起長木箱、轉身推過鐵軌、淡去重來的循環。每當搬運工彎腰把木箱放落地面，他身後那根真實的承重鐵樑便會騰出兩秒鐘的空檔。\n\n「從右邊卸貨口繞過去，別跟他耗。」Eraser語氣果決。\n\n軒人立刻回身，朝大門外側的真崎夜一比出右移手勢。門外的夜一掌心微微一偏，釘住門檻的黑影便順著鐵板邊緣向右無聲滑開半步，恰好替實體踏板咬穩卸貨口邊緣。\n\n搬運工虛影俯身卸箱。就是現在。\n\n軒人左手果斷攥緊Eraser完好的右腕，兩人同時屈膝蓄力，踩準那轉瞬即逝的兩秒縫隙一前一後躍過狹窄鐵樑，靴底清脆落地，穩穩踩進車間內側真實的磚石走廊。\n\n「進來了，兩人。」軒人按下領口傳聲器低聲回報。\n\n傳聲器滋滋響了一聲，傳出榊主任冷靜的指示：「收到。不要看車間牆上的舊計數牌，每找到一個活人就回報一組衣著特徵。」\n\n話音未落，剛才在玻璃窗後拍窗求救的那名水街年輕婦人已經從值班室裡跌跌撞撞衝了出來。她右腳跑丟了一隻布鞋，剛踩上走廊中段，頭頂上方的虛影滑軌驟然爆出一陣刺耳的鐵輪尖嘯——一隻裝滿赤紅礦渣的懸空吊籃破開濃霧疾掠而來。婦人顯然被困了一上午早已摸熟規律，反應極快地一把抱住身旁鐵柱蹲身縮頭，任由漫天灼熱火星自頭頂刮過，這才起身踉蹌撲向他們。\n\n「外面的橋真的通了嗎？」婦人緊緊攥住軒人拉進來的紅繩，嗓音早已被熱氣燻得沙啞。\n\n「通了，貼著這條紅繩往外走就能直接上岸邊救援艇。」軒人騰出右手從外套口袋抽出失聯名冊飛快核對，「太太，妳們這一區總共有幾個人？」\n\n「這邊四個，最裡頭鐵工具櫃旁邊還卡著一位老先生。」婦人回頭急喊了一聲。\n\n值班室角落隨即陸續鑽出三道活人身影：一名體格魁梧、穿著連身碼頭工裝的男子，以及兩名緊緊抱著空菜籃和帆布書包的年輕學徒。而在最內側那座覆滿厚鏽的鐵工具櫃旁，一名六十多歲的老人正雙手緊撐著櫃門把手，右腿僵直在原地，額角疼得沁滿冷汗。\n\n軒人目光飛快掃過名冊上的姓名與衣著。五個人，全數吻合那份十二人失聯名單。\n\n「Eraser，妳先帶能走動的四個人貼牆退到入口踏板邊。我過去把老先生拉出來。」\n\nEraser並未急著領人動身，先仰頭緊盯走廊上方滑軌默數了三秒節奏。那隻懸空礦石吊籃每隔十秒鐘沿軌道掠過一次，傾瀉的滾燙火星全數灑在走廊正中。\n\n她完全沒有動用抹消能力，右手筆直指向左側潮濕的石牆根，語氣沉穩清亮地向婦人與兩名學徒交代：\n\n「貼緊左邊釘著鉚釘的石牆根前進。只要頭頂滑軌一亮紅光就立刻停腳蹲低，等吊籃劃過去再起身走，火星燙不到牆根。」\n\n婦人急忙點頭，一手拉住兩個發抖的年輕學徒照做。\n\n軒人幾大步跨到鐵工具櫃旁單膝蹲下。他壓低防風鯨油燈往暗處一照，立刻看清了癥結——老先生的右腳並不是單純扭傷，而是工具櫃底下那根隨著車間廣播反覆執行「開合鎖定」的折疊生鐵桿，牢牢鉗住了他厚皮靴的靴跟。每當頭頂廣播重新播送一次，鐵桿便重重向下咬實一下，把厚靴跟壓得嘎吱作響。\n\n「老先生，這隻靴子保不住了。」軒人反手拔出腰間的扁頭拆件短刀。\n\n「先保住我這把老骨頭的腳踝，還管什麼破靴子。」老人疼得倒吸冷氣，額角青筋直跳。\n\n軒人左手原本下意識探向腰袋裡那三枚留作備用的硬木楔子，指尖剛觸到木頭邊緣便猛地一頓，隨即改了主意——絕緣硬木楔必須留給更深處的關鍵鎖扣與蓄力彈簧，絕不能浪費在這根生鐵轉軸上。他反手從工具包側袋抽出一把厚實沉重的備用生鐵扳手，雙目死鎖鐵桿根部。\n\n廣播的尾音剛落。折疊鐵桿喀噠向上彈起幾公分，露出一道轉瞬即逝的兩秒空隙。\n\n軒人左手疾探，將厚實的生鐵扳手整根橫插進鐵桿根部的轉軸縫裡牢牢卡緊；右手幾乎在同時揮落扁頭拆件短刀，順著皮靴側面最薄的車縫線俐落一刀劃開厚牛皮，緊跟著雙掌合抱老先生的小腿往後一抽。\n\n喀嚓一聲刺耳的金鐵悶響。\n\n折疊鐵桿重重砸落，硬是把那把生鐵扳手壓出一道深白凹痕、折彎了一截，連同那隻空皮靴一起死死鉗在縫裡。老先生只穿著厚襪的右腳已順利脫困，連腳踝骨都沒傷著半分。\n\n「再晚來十分鐘，我這把老骨頭都快拿鐵鎚自己砸靴子了。」老人長長呼出一口濁氣。\n\n軒人剛想半蹲起身、避開受傷的右肩改用左側背起老先生，身旁忽地大步跨來一道高大身影。剛才那名穿著連身工裝的魁梧碼頭工人已將空菜籃塞回學徒懷裡，折返過來時目光不經意掠過軒人右肩衣料下隱約透出的繃帶邊緣，沒多說什麼便俯身架起老先生右臂，將大半重量穩穩扛上自己厚實的肩膀：\n\n「少年，你只管在前頭開路、盯緊頭頂。背個人而已，我這身力氣還綽綽有餘。」\n\n「那就拜託大叔了，到入口踏板只要二十步。」\n\n五名受困者踩準Eraser報出的十秒空檔，貼著真實石牆一路快跑，順利退抵入口的實體鐵板。岸邊兩名救援員迅速接過老先生扣進滑索吊椅，五人接連沿鋼索安全滑返對岸。\n\n傳聲器裡很快響起榊主任俐落的點名回音：「第一批五人全數上岸，皆在失聯名單內。一名年長者右腳踝表皮擦傷，已交由岸邊醫護處置。」\n\nEraser站在入口內側，目送空吊椅滑回扣牢，這才側過頭望著軒人：\n\n「你右肩剛才使力了嗎？」\n\n「沒有，那位碼頭大叔直接把人扛過去了。」軒人甩了甩微酸的左手腕，順手拍拍腰袋確認三枚硬木楔子全數完好無缺，「不過再往裡走，要是又遇上動不了的傷患，得改用滑輪拉，絕不能逞強硬背。」\n\n「嗯。」\n\n兩人重新掛上第二卷紅繩，肩並肩穿過翻湧的滾燙白霧，朝車間中段的二號熔煉廊全速推進。\n\n## ２\n\n二號熔煉廊的實際方位比三百年前的舊圖偏移了半個彎。\n\n兩人合力推開一道半敞的厚重防火門，靴底觸感驟然一變——堅實粗糙的石板在此戛然而止，眼前取而代之的是懸空架設的網格鐵板。下方暗渠沸騰的水氣裹挾著刺鼻硫磺味滾滾上湧，狹窄長廊裡並列立著六座古舊冷卻水槽，數名身穿古式工裝的工匠虛影正雙手端著長柄鐵杓，一遍遍將水槽裡滾沸的虛影熱水機械地傾進排水溝。\n\n就在第三座冷卻水槽後方的死角裡，六道身穿深灰市政制服與粗布工裝的身影緊縮在一堆翻倒的空鐵桶後面。一捕捉到軒人手裡防風鯨油燈的暖黃光束，裡頭立刻有人拚命揮手低喊：\n\n「這邊。我們全在這裡。」\n\n軒人並未貿然踏上鐵網，穩穩停在防火門側的真實石樑上，高舉左手比出三根手指：\n\n「看得清我舉了幾根手指嗎？」\n\n「三根！我們是活人，不是那些半透明的影子！」為首一名年輕技術員急切大喊，「腳下別踩正中央那塊泛紅光的網格板，那塊鐵板每過一分鐘就會往下翻開一次！」\n\n能即時回答新問題、又知道提醒機關規律，確定是活人無誤。軒人快步沿著邊緣真實樑筋繞進死角，同時掏出失聯名冊逐一清點——四名穿粗布工裝的年輕檢修工，加上兩名穿深灰市政制服、原本負責抄錄水壓的市政文書，正好六名受困市政人員，與名冊上的資料分毫不差。\n\n可剛靠近第三座冷卻水槽，軒人心口隨即一沉。\n\n剛才領頭答話的那名年輕技術員，右前臂正被一輛側翻的半透明礦渣推車鐵欄桿重重壓在水槽厚沿上，表皮已被灼出一圈觸目驚心的暗紅；而在他身旁，另一名年輕檢修工正捂著明顯腫脹的左腳踝靠坐在鐵桶邊——逃跑閃避翻板時一腳踩滑，把腳踝嚴重扭傷了。\n\n那幾名市政檢修工腰間其實都帶著制式的魔導千斤頂與切割鉗，水槽腳邊還散落著兩具已經焦黑變形的器械。只是這條二號熔煉廊裡充滿了高濃度的支爐外溢魔力紅霧，任何需要注入魔力啟動的工具一打開開關，就會瞬間與紅霧劇烈共鳴、燙得冒煙甚至反噬灼傷使用者的手掌，害他們空有滿身制式裝備卻束手無策；反倒是軒人為了配合自己「空值」體質而常年帶在身上的那套純機械滑輪組、不吃魔力的精鋼撬棍、靠腳跟撞針擊發的純機械氣瓶靴，以及那把磨得順手的扁頭拆件短刀，在這片讓所有魔導器徹底癱瘓的沸騰暗渠裡，成了唯一能救命的利器。\n\n「先分點水喝，千萬別硬拔手臂。」軒人解下腰間鋁製水壺，遞給一旁那名三十多歲、雙手微微發抖卻仍強撐著照料傷員的市政女文書，「除了你們六位，再往裡面還有其他人嗎？」\n\n「有。」扭傷腳踝的檢修工接過女文書遞來的鋁壺急灌了一口，顫抖的手指朝二號熔煉廊最盡頭那扇緊閉的實心小鐵門指去，「剛才通道突然變樣、大家往外跑的時候，水街送飯的那個十二歲小女孩嚇懵了跑錯方向，一頭鑽進最前面那間備品小鐵室裡；有個背著折疊木工尺的外地大叔聽見女孩哭，回頭衝進去救她，結果鐵門『匡噹』一聲從外頭反扣上了，兩個人全被關在裡面。」\n\n軒人與Eraser迅疾交換了一個眼神。\n\n水街送飯的十二歲女孩，正是本地名冊上最後的第十二人；而那個背著木工尺折返救人的外地大叔，果然印證了榊主任的判斷——是沒有登錄在本地名冊上的外地過路工匠。\n\n軒人立刻按下領口傳聲器，將這裡尋獲六名市政人員、以及最前端備品小鐵室還有兩人受困的座標簡明報回岸邊。\n\n就在他拇指鬆開按鍵的同一瞬間——\n\n咯吱吱。\n\n壓在年輕技術員右臂上的半透明礦渣推車毫無徵兆地劇烈震顫。車輪沿著斜傾的水槽鐵沿硬是再向下滑移了幾公分，暗紅滾燙的鐵欄桿眼看就要將技術員的前臂骨頭硬生生壓斷。\n\n技術員疼得猛吸一口冷氣，臉色瞬間褪得毫無血色。\n\n軒人反手拉出腰帶備用扣環牢牢勾住推車把手往後猛拽，靴底在網格鐵板上蹬出細碎火星。但這輛礦渣推車本就是一段尚未跑完的傾倒殘響，根本不存在實體剎車銷可供撬開；越往後硬拉，紅光裡那股機械式的反推力道反而壓得更重。\n\nEraser快步蹲至推車側面細看兩秒，右手抬起輕觸領口花扣——中央白珠依然透著純淨雪白。\n\n她湊近軒人耳畔，在翻騰的蒸汽嘶鳴下用僅供兩人聽清的氣音飛快開口：\n\n「這輛推車跟整條長廊的鐵網連在同一段殘響裡，不能整輛抹消，不然大家腳下的路會一併消失。但我可以只抹掉壓在他手臂上這十公分長的一小截欄桿，開出抽手的空隙。大約三秒。」\n\n「動手。我替妳擋住後面的視線。」\n\n軒人沒有半秒遲疑，跨前一步寬身側立，刻意敞開寬大的厚帆布工裝外套，連同左肩斜背的舊分離匣一起，將後方其餘五名市政人員的視線徹底擋住。與此同時，他左手亮出扁頭拆件短刀卡進推車欄桿縫隙，嗓音沉亮地喊道：\n\n「全都把臉轉開閉緊眼睛，後面的人退開半步別往前湊。我拿短刀硬撬這根帶火的鐵欄，小心崩出火星燙傷眼睛。」\n\n年輕技術員幾乎是本能地緊閉雙眼，猛地把臉扭向水槽內側；後方的五名市政人員也連忙抬起手肘緊緊護住面龐。\n\n軒人手腕一翻，故意拿短刀厚背朝身邊的空鐵桶用力敲出「噹、噹」兩記刺耳脆響。\n\n就在金屬撞擊聲炸裂的同一瞬，隱身在他肩影背後的Eraser探出右手，纖細的食指與中指筆直穿過翻湧熱氣，穩穩按上那截泛著刺目紅光的欄桿接點。\n\n滋。\n\n一秒。兩秒。三秒。\n\n沒有半點驚動旁人的炫目閃光，那截暗紅滾燙的鐵欄桿中段無聲融開了一道約莫十公分寬的純白缺口。\n\n「抽手！」軒人壓低嗓音出聲。\n\n他沉腰借力將技術員往後一帶，年輕人猛地將右前臂自那道純白空隙裡抽脫出來。幾乎就在手腕脫離的下一瞬，Eraser迅疾收回右手退回軒人肩後；那截斷開的暗紅欄桿虛影轟然合攏，匡噹一聲重重砸落水槽鐵沿，激起一大片翻騰的滾燙水霧。\n\n年輕技術員睜開眼，試著轉了轉沒有骨折、僅表皮燙紅的右前臂，滿眼震撼地盯著軒人手裡那把樸素的扁頭短刀：「你這手藝也太厲害了，連那種泛著紅光的詭異推車都能用刀撬開。」\n\n「只是運氣好，剛好卡對了接縫而已。」軒人隨口帶過，趁後頭五人連忙圍上來攙扶傷員的空檔，迅速垂眼檢查Eraser的右手與領口，壓低聲音追問，「花扣怎麼樣？」\n\n「白珠沒有變色。」Eraser輕聲回應，「指尖也不痛。」\n\n軒人退至防火門框旁，抬腕看過機械錶秒數，背對眾人按下傳聲器壓低嗓音向岸邊的千歲回報：「千歲姊，剛才為了救壓傷手臂的人動手了三秒，旁人沒看見，花扣白珠也沒泛黃。」\n\n傳聲器裡立刻傳來千歲俐落清晰的紀錄聲：「記下了。累計三秒，還剩八十七秒餘裕。後面能用工具硬拆的就用工具，別再零星消耗她的額度。」\n\n話音剛落，一行人正帶著六名市政人員退回二號熔煉廊入口的防火門前，頭頂與腳下卻在同時爆出一陣令人牙酸的鋼筋撕裂聲。\n\n轟隆。\n\n原本連接一號車間的那段三公尺長鐵走道，在剛才推車撞擊水槽引發的餘震裡徹底崩塌斷裂，扭曲的碎鐵板翻滾著墜進下方奔湧的沸騰暗渠，轉眼被厚重白霧吞沒。\n\n防火門檻外，赫然裂開了一道三公尺寬、足有一層樓深的斷層碎石坑。只有他們進來時牽過來的那條紅繩，依然孤零零地緊繃在翻騰熱霧之中，遙遙連向對岸一號車間牆壁上的真實鐵環。\n\n六名市政人員裡有兩人帶傷——一個右前臂剛脫困使不上勁、另一個左腳踝腫得根本無法著地——別說護送傷患，就算換成四肢健全的普通人，也不可能徒手抓著一根細麻繩盪過三公尺寬的沸騰深坑。\n\n軒人箭步跨到門框旁，急按傳聲器呼叫：「夜一，二號熔煉廊出口的走道塌了，跟一號車間之間裂開三公尺寬、一層樓深的斷口。紅繩還連著對面鐵環。」\n\n「我看得見這頭的紅繩在晃，但光影被牆擋死，我看不見你們那邊的門框，影釘沒辦法往那頭伸。」夜一的回應沉靜而迅疾，「一號車間真實鐵環後方我有四名工程班隊員守著。你們身上帶了滑輪，能自己架起一道索橋嗎？」\n\n軒人反手按上腰際那兩具千歲塞給他的重型鋼滑輪——原本一具預留給舊分離匣吊運，另一具正好能掛人員吊帶。\n\n「能架。」軒人偏頭看向身旁的Eraser，「這邊門框底下能確認真實承重點嗎？」\n\nEraser上前貼近防火門右側，抽過短刀以刀柄俐落敲碎表層泛著紅霧的浮灰，露出底下沉暗深鏽的厚重古鋼樑與鉚釘孔：「這根是三百年前的原車間主樑，是真的。但鋼索必須繞過整根橫樑，不能只掛在鉚釘孔邊緣。」\n\n軒人沒有多作猶豫，立刻將重型鋼索一端兜過粗實主樑拉緊打實死結，再解下左肩背負的舊分離匣暫交給Eraser護住，自己緊攥鋼索另一端往門內退開兩大步。\n\n隔著翻湧白霧望過去，對岸牆壁上的真實鐵環比這邊門檻略低十幾公分。更棘手的是，三公尺斷口正中央還懸著一扇每隔五秒便左右橫滑一次的半透明虛影鐵門，滑移時掀起的灼熱氣壓足以把半空裡的人直接掃下暗渠。\n\n「等那扇虛影鐵門往左滑開那一拍，我直接跳過去把滑輪鎖進對面鐵環。」\n\n軒人右腳往後一撤，腳跟精準磕響氣瓶靴的第一顆靴跟氣罐踏扣。\n\n五、四、三、二、一。\n\n暗紅色的虛影鐵門向左猛然滑開。\n\n軒人一步踩死門檻邊緣，壓下靴跟。\n\n砰——一記短促暴烈的高壓氣爆自靴底炸響。\n\n強勁的推力瞬間奪去雙腳的重力，整個人如離弦之箭凌空射出。滾燙的蒸汽貼著雙頰呼嘯掠過，下方一層樓深的暗渠白霧在視野邊緣急速飛退，短暫的失重感讓胃部猛地一提。\n\n然而身體剛越過斷口中段，軒人的呼吸陡然一滯——起跳那側的破敗門檻竟然在發力瞬間細微下沉了幾公分，硬是把整條拋物線的落點壓低了一截。\n\n半空無處借力，胸口眼看就要迎面撞上對岸堅硬的鐵沿。\n\n沒有多餘的思考時間。軒人腰腹暴收、雙膝猛地朝胸前曲起，趕在軀幹撞擊前硬是將兩隻靴底往前一送，精準蹬實對岸鐵板下緣的鋼邊；與此同時，對岸緊盯紅繩的工程班隊員同時發力，將連在他腰際的安全繩往後猛拉繃緊。\n\n咚。\n\n沉悶的撞擊聲在鋼板上震開。軒人順著安全繩的拉力翻滾躍上對岸鐵板，左膝蓋避無可避地結實磕上鋒利鐵沿——一股尖銳的白熱劇痛瞬間炸裂，眼前猛然泛白了半秒，深灰褲管應聲撕開滲出鮮紅血漬。可他雙手十指依然像鐵鉗般牢牢扣死牆上的真實鐵環，身軀連一公分都沒往坑底滑落。\n\n「站穩了，別再往後拉。」軒人咬牙吸進一口滾燙空氣，聲音有些發緊。\n\n他連揉一下劇痛左膝的空檔都沒留，單膝跪在鐵環邊飛快將鋼索穿入重型滑輪、拉緊打扣，緊接著架起上下平行的承重索與扶手索。他先把自己的全身重量掛上去用力試拉了兩下，確認兩端主樑紋絲不晃，這才朝對岸蒸氣裡等待的Eraser重重揮手。\n\n對岸的Eraser與兩名未受傷的檢修工迅速聯手，替第一位撤離者扣牢寬腰套。\n\n排在最前頭的，正是剛才那名三十多歲的市政女文書。當她站到崩裂的門檻邊沿、垂眼望見腳下一層樓深的暗紅碎石坑與底下沸騰咆哮的黑水時，臉上的血色瞬間褪得一乾二淨。她的雙膝不受控制地發軟後退了半步，嘴唇劇烈打顫，連完整的句子都拼湊不出來：\n\n「太高了……我只要一跨出去就會掉下去，我不敢……」\n\n後方熔煉廊深處驟然傳來礦渣推車撞碎冷卻水槽的巨響。那些原本只在原地反覆舀水的古裝工匠虛影，竟端著冒煙的長柄鐵杓一步步朝防火門逼近，走廊裡殘存的安全時間只剩最後幾分鐘。\n\nEraser沒有從背後推促她，也沒有拔高嗓音催喊。她平穩地向前一步，用完好的右手輕輕托起上方那道粗實扶手索，穩妥放進女文書冰涼濕黏的掌心裡，再覆上自己的手背陪她一同握緊，將那份沉穩的體溫傳過去：\n\n「不用自己跳。先把寬腰套扣牢，人先坐到門檻邊緣就行——現在我們先只做到坐下這一步。」\n\n女文書雙膝仍在發顫，抬眼望進少女澄澈無波的淡粉色眼眸，咬緊嘴唇順著她的節奏在冰涼的鐵門檻上坐穩，可兩條小腿依舊緊緊蜷縮在門內，不敢往外伸出半分。\n\n對岸的軒人單膝蹲低身形，刻意讓自己的視線與門檻上的女文書保持齊平。他沒有高喊什麼鼓舞的口號，只是抬手指了指自己腰間那只磕得微微發凹的鋁製水壺：\n\n「女士，剛才在水槽後面，是妳一路幫那兩位受傷的同事分水喝的吧？水壺現在掛在我腰上，裡頭還留著小半壺涼水。別往下看，就盯著我腰上這只水壺——我們先滑過來喝一口水，好不好？」\n\n女文書微微一怔。她順著聲音抬起眼，撞進對岸少年安穩而篤定的視線裡，胸口那陣急促紊亂的喘息竟奇蹟般放緩了一拍。\n\nEraser靜靜等著，直到感覺到掌心下她緊繃的雙肩不再劇烈顫抖，這才貼近她耳側，隨著她的呼吸緩緩數拍：\n\n「聽著我的節奏。吸氣，吐氣——我數到三。妳手裡的扶手索別放開，只要把兩隻腳往前輕輕一伸，腰上這條寬皮帶就會牢牢接住妳。一、二、三。」\n\n女文書緊閉雙眼，把心一橫，順著最後一聲輕數將雙腳筆直伸出了門檻。\n\n滑輪喀噠一聲穩穩吃住體重。軒人與身後工程班隊員同步均勻收繩，女文書短促地驚呼了一聲，十指緊緊扣住上方扶手索，不過兩三個呼吸的工夫便平穩滑越三公尺深坑，鞋底結實踩上軒人身前的實體鐵板。\n\n「到了，腳底下全是真鐵板。」軒人俐落替她解開腰套扣環。\n\n女文書睜開眼，先伸手摸了一把腳下堅硬冰涼的鐵板，緊接著忽然揪住軒人的衣袖，壓抑不住地無聲哭了出來。\n\n「想哭等會兒再哭，先退到後面石柱邊喝口水，把落腳位騰給下一個人。」軒人把鋁製水壺塞進她掌心。\n\n女文書胡亂抹開臉上的淚水用力點頭，自己扶著牆根退進安全處。有了第一位跨出的示範，剩餘五名市政人員的撤離瞬間變得俐落流暢——左腳踝扭傷的檢修工優先被吊過對岸，另一名市政文書與兩名檢修工緊隨其後；至於右前臂剛脫困的那名年輕技術員，也沒有逞強去拉繩子，反而一越過斷口便主動坐進安全區，用雙腳穩穩抵住滑輪底座，幫工程班壓直走繩防止纏結。\n\n不到三分鐘，六名受困的市政人員全數安全越過斷口。\n\n最後輪到Eraser自己。她先將舊分離匣扣上滑輪平穩送過對岸，再刻意避開打著護板的左腕，以右手將腰套牢牢扣緊在身前，握穩扶手索朝對岸的軒人輕輕一點頭。\n\n軒人與工程班隊員同時均勻收繩。就在Eraser滑抵對岸邊沿的那一刻，軒人踏前半步，探出左手穩穩接住她的腰套扣環收住前衝的慣性，讓她的雙腳輕巧平穩地落回實體鐵板正中央。\n\n「左手護板剛才磕到了嗎？」軒人垂眼替她鬆開扣環。\n\n「沒有。倒是你的左膝蓋。」Eraser的目光筆直落在他撕裂滲血的褲管口，「剛才落地撞在鐵沿上了。」\n\n軒人低頭瞄了一眼，彎曲伸直了兩下膝關節：「只擦破一層皮，骨頭跟關節都沒事，照樣跑得動。」\n\n傳聲器裡緊接著傳來榊主任俐落的通報聲：\n\n「第二批六名市政人員全部確認上岸，累計獲救十一人。名冊上還差最後那名十二歲送飯女孩，以及你們剛剛追加通報的一名背木工尺的外地工匠。」\n\n話音剛落，整座二號熔煉廊外側那些不停閃爍的半透明虛影工燈，竟無預警地接連暗滅了一大片，連空氣中壓迫皮膚的灼熱紅霧都肉眼可見地稀薄了幾分。\n\n「水街東口與東石橋頭兩處的底下石槽均已封實，上方銅管全部關閉。」榊主任的聲音裡難得透出一絲俐落而克制的振奮，「河岸舊調壓所組正在拆除最後一處鐵架底座。注意，主控鐵箱本身的失控指令還沒截斷，你們一救出最後兩個人，立刻準備就位接箱。」\n\n## ３\n\n岸邊防風魔導提燈暖黃的光暈下，先後獲救的十一個人正披著厚毛毯、捧著熱水碗慢慢緩氣。\n\n而在一號車間通往最前部舊主架的實體大鋼樑旁，兩名總站工程班隊員正滿頭大汗地將手臂粗的實體鋼索與重型鐵夾牢牢鎖上入口門框，徹底接替下那份硬撐了大半個小時的結構負荷。\n\n軒人與Eraser沿著滑索返抵中段、剛繞過粗重主樑，腳步卻不約而同地微微一頓。\n\n不遠處，真崎夜一正背靠著一根冰冷鐵柱微微低頭，安靜地調整著呼吸。\n\n頭頂高出力魔導探照燈慘白的光束垂直灑落下來。軒人的目光定格在他垂在身側的那隻左手上——沒有手套遮掩的五根修長手指，此刻竟然失去了所有血色，指節泛著一層近乎凍傷般的青白寒意，彷彿剛從冰窟裡抽出來一般；連他試圖微微舒展指尖時，關節都顯出幾分僵硬滯澀。\n\n察覺到兩人的腳步與落在手背上的視線，夜一抬起眼，灰色的眸子平靜如寒潭。\n\n他沒有解釋半個字，也沒露出一絲示弱或疲態，只是神色如常地從黑大衣口袋裡抽出那隻薄手套，修長的右手平穩地捏住袖口，將那五根凍得發白的手指一根一根套回黑布裡，徹底藏進衣袖陰影之下。\n\n「給我兩分鐘換位。」夜一微轉了轉套回手套的左腕，嗓音淡得聽不出半分波動，「門框已經用鋼索鎖死了，用不著我再拿影子硬撐。我直接前移到最前面備品小鐵室附近那根真實大樑下接應你們。」\n\n說完，他微微頷首，轉身融進實體鋼樑內側的暗影裡，無聲朝更深處移去。\n\n軒人收回目光，沒有多問，趁這兩分鐘空檔單膝蹲下，最後清點了一遍全身裝備。\n\n氣瓶靴裡的靴跟氣罐還剩兩顆；腰袋裡的三枚硬木楔子一枚未動，依然整齊留著三枚；扁頭拆件短刀的刀尖剛才卡推車欄桿時又崩了一小粒，但刃口依舊堪用。右肩絕不可提重、左虎口舊傷隔著紗布微微滲出一絲紅血、左膝蓋剛磕破皮；抬起頭望向身旁，Eraser領口那枚五瓣花扣的中央白珠依然透著純淨雪白，高負荷抹消額度還留有足足八十七秒。\n\n兩人確認完畢，踩著舊主架側面的真實工字鋼樑朝最深處推進。\n\n越接近最前方那座低沉嗡鳴的主控鐵箱，周圍來回搬運礦石的工匠虛影便越密集，留給活人落腳的實體通道也收縮得越發狹窄。走到通往備品小鐵室前最後一段不到一公尺寬的懸空鋼道時，望著眼前每隔幾秒便交錯滑過的滾燙蒸汽管虛影，軒人的腳步忍不住停了下來：\n\n「Eraser，前面那間備品小鐵室是純機械鎖，裡頭沒有需要妳抹消的術式。要不妳先留在這根大樑後頭等我？我一個人過去撬開門把那兩個人帶出來就行，免得這條窄道太擠，虛影撞傷妳完好的右手。」\n\nEraser腳步一停，偏過臉靜靜望著他：\n\n「那如果你過去撬門的時候，身後這排蒸汽管虛影換了位置把退路封死，誰幫你辨認腳下哪一塊鋼板才是真的？」\n\n「我可以用粉筆在真鋼板上畫記號——」\n\n「粉筆畫在半空重疊的假地板上，虛影一錯位，記號也會跟著消失。」Eraser語氣平靜，眼神卻寸步不讓，「反過來，如果現在我叫你留在這根柱子後面養你右肩和左膝的傷，由我自己拎著撬棍過去開門，你會點頭嗎？」\n\n軒人張了張嘴：「那怎麼行，妳左手還固定著護板，單手怎麼撐得住撬開變形厚鐵門的力道。」\n\n「所以我們兩個各自想出來的『把對方留在安全處』方案，都有漏洞。」\n\nEraser筆直望進他的眼底，清亮的聲音在翻騰蒸汽裡格外清晰：\n\n「昨晚我們在分工表上清清楚楚寫好了，一起進去，一起出來。不要因為怕對方受傷，就臨時替對方改決定。前面真有過不去的險處我們當場商量，只要任何一個人喊停，就立刻一起退回去。」\n\n軒人愣了兩秒。迎著少女清澈篤定的淡粉色雙眸，心底那股總想獨自攬下所有危險的壞習慣頓時散了個乾淨，他忍不住低聲笑了出來：\n\n「……妳說得對，我又犯了一個人硬扛的壞習慣。走吧，我們一起過去。」\n\n兩人踩準蒸汽管交錯的兩秒縫隙，一前一後俐落掠過不到一公尺寬的懸空窄道。\n\n備品小鐵室是一間直接焊在舊主架前端的實體小鐵房。外門鐵皮被連日震動擠壓得微微扭曲變形，門把外側還裝著一截泛著暗紅餘熱的自動閉門彈簧桿，裡頭緊緊壓縮著隨時會暴彈反甩的強大張力。\n\n軒人蹲在門前，沒有急著插刀撬縫，先舉起短刀刀柄在厚鐵門上用力敲出『兩長一短、兩長一短』的新節奏：\n\n「裡面有人嗎？聽得見活人說話的話，照我剛才的節奏敲回來。」\n\n不到兩秒，厚鐵門內側便傳來清晰的『兩長一短』回響，緊跟著是一道沉穩微喘的中年男聲：「在。我和這個女孩都沒受重傷，就是門從外頭卡死了推不開。」\n\n「是活人，不是重複錄音的殘響。」\n\n軒人這才俯低身軀，目光銳利地審視門側那根紅光隱隱、緊繃如滿弓的自動閉門彈簧桿。\n\n三年前在倉庫裡漏看輪軸蓄力的血淋淋教訓，他此刻記得分毫不差。\n\n還沒碰觸變形的門栓半分，他先掀開腰袋，精準抽出兩枚硬木楔子，穩穩敲進閉門彈簧的壓縮槽裡咬死彈片——腰袋裡如今只剩下最後一枚硬木楔子。緊接著他拉出備用短鋼索，將整根彈簧筒繞了整整三圈，死死捆緊在旁邊的真實角鋼支架上，伸手用力扳試了兩下確認蓄力徹底鎖死，再示意Eraser退到門扇彈開的半徑之外，這才反手探出扁頭拆件短刀，對準變形門栓猛地一挑。\n\n匡噹。\n\n厚鐵門乾脆彈開二十公分。蓄滿力道的閉門彈簧剛一掙動，便被兩枚硬木楔子與三圈短鋼索牢牢壓死在原位，連半分反彈的餘地都沒有，沒有傷到任何人。\n\n可門才剛拉開，一團滾滾沸騰的暗紅管道虛影恰巧從門檻下方翻湧上來，瞬間吞沒了正門前方的半片踏板。\n\n小鐵室裡頭，一名左腳明顯腫起、手裡緊握著一把折疊木工尺的中年木匠正護著牆角的小女孩——那個十二歲、懷裡到現在還緊抱著一只空送飯食盒的小女孩。\n\n中年木匠只探頭掃過門外翻湧的紅霧，立刻俐落抬手指向小鐵室頭頂那扇用四顆蝴蝶螺帽固定的方形鐵蓋：\n\n「少年，別硬走正門。我是外地來幫人丈量門窗的木匠，剛才關在裡頭把整間屋子摸透了——掀開這間備品室的頂蓋，上去就直接踩在舊主架最頂端那根真實的工字大樑上，從上面走完全碰不到底下的紅霧。」\n\n軒人舉燈仰頭一照。屋頂確實是一扇純機械咬合的檢修通風蓋，四周鉚釘真實厚重。\n\n他踩著屋角兩隻翻扣的結實空鐵桶翻身躍起，雙手奮力擰下那四顆鏽緊的蝴蝶螺帽，一把推開沉重頂蓋。夾雜著外頭河面氣息的清涼冷風瞬間從上方灌進悶熱的小屋。軒人接過岸邊放過來的獨立安全腰套，先替嚇得發抖的送飯小女孩扣牢，再與木匠合力，將小女孩與扭傷左腳的木匠一先一後托上頭頂寬闊的工字大樑。\n\n只要順著這根真實的工字大樑往外走出十幾步，就是工程班架好的安全平台。\n\n然而就在小女孩剛剛站上工字大樑、正要邁步往外走的那一剎那，她不經意偏頭往腳下瞥了一眼。\n\n下方十幾公尺深處，奔騰咆哮的暗黑河水正炸開滾白浪花，猛烈拍擊著石墩。\n\n十二歲女孩臉上的血色瞬間消褪，雙腿一軟，沾了水氣的布鞋鞋底毫無徵兆地從微濕的窄樑邊緣滑了出去——整個人一腳踏空，朝深淵直墜下去。\n\n呼吸都在這一秒凝止。\n\n近在咫尺的軒人腦中警鈴大作，千歲臨行前的死命令卻已化作刻進骨血的本能——絕不能用受傷的右肩去硬拉下墜的活人。不及細想，他雙腳分開狠踏實工字樑面，重心壓低到底，反手一把撈過小女孩連著的安全腰套繩，在自己腰帶主承重環裡迅疾扣繞鎖死，靠整個腰胯與下盤硬扛住這股驟然襲來的猛墜衝擊。\n\n幾乎就在小女孩靴尖懸空下墜的同一剎那——\n\n早已前移到距離備品室僅有十幾步遠的那根真實大樑柱下、早就摘掉黑手套戒備多時的真崎夜一，單腳踏實柱腳，蒼白的左掌朝工字樑側面凌空一翻。\n\n一道濃墨般的漆黑長影自樑柱陰影中疾刺而出，瞬間橫跨這十幾步距離，精準而平穩地橫托在工字樑下沿小女孩滑空的雙腳底下，輕巧地將她向外滑脫的勢頭往樑面內側一推。與此同時，岸上早已繃緊神經的四名巡查員同時低喊，雙臂同步發力猛收滑輪索。\n\n腰帶主環的穩拉、十幾步外黑影的及時托舉、加上岸邊滑輪的收緊——三股力道在同一秒無縫銜接。小女孩僅離樑下墜了不到半公尺，便被眾人齊力穩穩拽回工字大樑內側，平平安安滑上了安全平台。\n\n五分鐘後，懷抱空食盒的送飯小女孩與左腳扭傷的外地木匠，雙雙踏上了岸邊搖晃卻溫暖的救援木艇。\n\n岸邊燈光下，等得雙眼通紅的女孩父親衝破警戒線，一把將女兒緊緊擁進懷裡失聲痛哭；外地木匠拍了拍肩上的鐵灰，朝著河岸上空這片紅霧遠遠舉起手裡的折疊木工尺揮了兩下。\n\n榊主任站在指揮棚前，手持炭筆在失聯名冊最後一格工整劃下勾號，隨即按下總頻道傳聲器，清亮沉穩的聲音傳遍整條河岸：\n\n「第十二名已知失聯者、以及第十三名外地過路工匠，全數確認安全上岸。目前七號支爐舊檢修站內已無任何受困平民，僅剩內側作業人員兩名——不破軒人、Eraser。」\n\n檢修站最深處。\n\n軒人與Eraser並肩坐在舊主架前端的實體檢修平台上，輪流喝下一口鋁壺裡最後殘存的微涼清水，慢慢讓胸口狂跳的呼吸平復下來。\n\n岸邊點名表最下方，屬於他們兩人的那兩格撤出欄依然空著。\n\n而在兩人眼前不到十步遠的暗紅霧氣深處，那座統御了整條第七支爐整整三百年的「主控鐵箱」，正隨著箱底巨型傳動輪軸的沉重轉動，發出一陣陣悶雷般低沉而執拗的嗡鳴。\n\n——第九章完——\n", "mtime": 1795001666.159697}, {"filename": "10_第十章_我不是勇者.md", "content": "# 第十章　我不是勇者\n\n## １\n\n這座地下支爐並不知道，它原本要供暖的舊時代早已結束了。\n\n主控鐵箱上方的紅色指示燈依然亮著。每隔半分鐘，箱頂那塊顯示運作狀態的黃銅翻牌便會「喀噠」翻過一面，平穩地停在『維持運轉・等待交接』的位置上。\n\n軒人沒有因為那十三名受困者都已平安上岸，就直接衝過去開箱。\n\n他先將岸邊巡查員遞來的車間結構核對圖攤在膝上，與Eraser一同沿著主鐵架的最前端又走了一遍。舊工具間、司機值班席、存放備用魔石的窄鐵櫃——每一扇可能藏著人的小門，兩人都親自拉開、舉起防風鯨油燈向內照看，並敲出『兩長一短』的新節奏反覆確認。\n\n值班席的鐵椅上，只剩一雙早已乾硬脆化的厚革隔熱手套；操作台旁的鐵夾扣著一塊空白的黃銅交接牌。半透明的值班員虛影仍握著操縱桿，嘴裡低念著三百年前的壓力讀數，沒有因兩人的腳步聲而轉過頭來。\n\n軒人蹲下身確認過座椅底下最後一處死角，在核對圖的末格劃下勾號，按下傳聲器：\n\n「前部死角全部清查完畢，沒有發現其他活人。所有受困人員均已在岸上。」\n\n岸邊的榊主任核對完內外兩份名單，隨即應聲：「收到。允許接近主控鐵箱。」\n\nEraser站在值班席旁，順手將旁邊一扇半敞的實體檢修小鐵門闔上扣緊，免得凸出的門角待會撤退時勾住衣擺：\n\n「前面就是了。」\n\n主控鐵箱比軒人預想的更為龐大。那並非能隨手提走的鐵盒，而是直接焊死在主鐵架正中央、幾乎與肩同高的厚重黑鐵方箱。兩根粗大的導流管沿底座向後延伸，箱體側面焊著一塊僅容兩名維修工並肩站立的實體窄鐵台；窄台正下方，一組巨型傳動輪軸仍在持續運轉，震動順著鐵骨不斷傳上腳底。\n\n岸上工程班預先架設的四根新鋼索已牢牢扣進主鐵架的吊耳，另一端繞過河岸的三座真實石墩，將主架穩穩拉在檢修平台觸手可及的位置。\n\n傳聲器裡傳來千歲的叮囑：\n\n「先找主控鐵箱背面的檢修小蓋。別去拆整面外殼，底下的傳動輪軸還沒停。」\n\n軒人對照著舊圖冊上的標示，在主控鐵箱背向值班席的一側找到一塊巴掌大的六角小鐵蓋。四顆固定螺絲鏽蝕頗深，所幸螺帽邊緣還留著足以咬住扳手的稜角。\n\n他解開左肩舊分離匣外層的防雨帆布套，將匣子平放在窄台上。Eraser站在他左側，暫時還沒把短導線接上花扣，只是先將匣子的接頭轉向自己右手最順手的角度。\n\n就在軒人以左手握住扳手、才將第一顆螺絲轉鬆半圈的瞬間——\n\n岸邊陡然傳來一聲急促的呼喊。\n\n幾乎在同一拍，主控鐵箱底下的傳動輪軸驟然暴衝加速。牽制主架西側的那根承重鋼索迸出尖銳刺耳的金屬刮擦聲，軒人腳下的實體窄台猛地朝河面方向傾斜了幾公分。\n\n噹、噹、噹。\n\n岸邊的警戒銅鈴連響三聲，急促而清亮。\n\n軒人連半秒遲疑都沒有，當場鬆開手裡只差半圈就能卸下的螺絲，左手反手扣緊舊分離匣的提把：\n\n「退！」\n\n他讓Eraser先踏上後方寬闊的真實工字樑，自己緊貼在後。兩人沿著剛才確認過的退路迅速撤回中段的檢修平台，沒有停在原地去賭那三聲鈴響是不是誤報。\n\n「內側已退回安全平台。舊分離匣未接通，還沒開始。」軒人按下傳聲器回報。\n\n守在平台前端的真崎夜一抬起右手，指向右側的備用踏板：\n\n「靠右邊站。西側這根副樑要換支撐點。」\n\n待兩人退至右側踏板站穩，夜一這才鬆開按在西側副樑陰影上的左手。失去壓制的副樑立刻向下一沉，隨即被岸上放下的第二道備用鋼索穩穩接住，停在不會撞及主架的安全高度。\n\n軒人回頭望了眼剛才站立的窄鐵台。隨著副樑下沉，窄台的角度已偏往另一側——方才他若貪快多留三秒把那顆螺絲卸完，此刻兩人恐怕已經掛在傾斜的鐵板上隨風搖晃了。\n\n傳聲器裡響起榊主任簡明冷靜的說明：\n\n「河岸調壓所組剛才卸下了最後一段新供能管，主鐵架失去外部壓制，開始動用殘存動力試圖啟動返程輪軸。主樑載重並未超標，但側向受力改變了，剛才已讓下方的施工員全數撤出。」\n\n千歲的聲音緊跟著插了進來：\n\n「不能讓底下的大輪子一邊拖著平台走、你們一邊在上面接線。得先把窄台下面那根紅色的『離合拉桿』拔出來，讓大輪子跟鐵架脫開空轉，把那股扯力卸掉。」\n\n軒人俯身朝窄台下方探去。\n\n主控鐵箱底座與傳動輪軸之間，果然橫著一根漆著暗紅防鏽漆的L形生鐵拉桿。只要將它向外抽到底，底下的巨型傳動大輪便會與主架脫離咬合；屆時大輪轉得再瘋狂，也不會再拉扯平台。\n\n問題在於，那根紅色離合拉桿深嵌在主架下方的凹槽裡，四周全是高速往復抽送的粗重連桿；更致命的是，主控鐵箱正下方正是整座七號支爐三百年魔力亂流最狂暴的風眼。普通人類或白塔技師只要垂降到那裡，體內的魔力迴路就會被高壓亂流攪得劇烈逆流，撐不到十秒就會昏厥墜河；現場所有人之中，唯獨體內沒
