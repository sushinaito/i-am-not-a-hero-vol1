<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>《我不是勇者》第一卷：無風迴廊盡頭的少女</title>
<style>
  :root {
    --bg-primary: #f7f3e8;
    --bg-secondary: #efe9d8;
    --bg-elevated: #fdfbf6;
    --text-primary: #26221e;
    --text-secondary: #6e655c;
    --text-muted: #9c9286;
    --border-color: #dfd6c3;
    --accent-color: #8c3f2b;
    --accent-hover: #702f1e;
    --accent-soft: rgba(140, 63, 43, 0.08);
    --shadow-sm: 0 2px 8px rgba(38, 34, 30, 0.06);
    --shadow-md: 0 8px 28px rgba(38, 34, 30, 0.1);
    --reader-font: "Songti TC", "Noto Serif TC", "PMingLiU", "SimSun", serif;
    --ui-font: -apple-system, BlinkMacSystemFont, "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif;
    --font-size: 19px;
    --line-height: 2.05;
    --page-max-width: 760px;
    --para-indent: 2em;
  }

  [data-theme="light"] {
    --bg-primary: #f8f9fa;
    --bg-secondary: #eef0f3;
    --bg-elevated: #ffffff;
    --text-primary: #1e2125;
    --text-secondary: #5c6470;
    --text-muted: #8c95a2;
    --border-color: #e1e4e8;
    --accent-color: #2b579a;
    --accent-hover: #1e3f73;
    --accent-soft: rgba(43, 87, 154, 0.08);
  }

  [data-theme="dark"] {
    --bg-primary: #14161a;
    --bg-secondary: #1c1f26;
    --bg-elevated: #22262f;
    --text-primary: #d9d6cf;
    --text-secondary: #98948c;
    --text-muted: #66635d;
    --border-color: #2e333d;
    --accent-color: #d4845a;
    --accent-hover: #e3966e;
    --accent-soft: rgba(212, 132, 90, 0.12);
    --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
    --shadow-md: 0 8px 28px rgba(0, 0, 0, 0.45);
  }

  [data-theme="green"] {
    --bg-primary: #e8f0e6;
    --bg-secondary: #dbe6d8;
    --bg-elevated: #f2f7f1;
    --text-primary: #1f2b21;
    --text-secondary: #526354;
    --text-muted: #7b8e7d;
    --border-color: #c8d8c5;
    --accent-color: #2d6a4f;
    --accent-hover: #1b4332;
    --accent-soft: rgba(45, 106, 79, 0.1);
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg-primary);
    color: var(--text-primary);
    font-family: var(--ui-font);
    overflow: hidden;
    transition: background-color 0.25s ease, color 0.25s ease;
  }

  #progress-bar {
    position: fixed;
    top: 0;
    left: 0;
    height: 3px;
    background: var(--accent-color);
    width: 0%;
    z-index: 1000;
    transition: width 0.1s ease;
  }

  .app-shell {
    display: flex;
    flex-direction: column;
    height: 100vh;
    width: 100vw;
  }

  .topbar {
    height: 54px;
    background: var(--bg-elevated);
    border-bottom: 1px solid var(--border-color);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 18px;
    gap: 12px;
    z-index: 100;
    box-shadow: var(--shadow-sm);
    flex-shrink: 0;
  }

  .topbar-left, .topbar-right {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    border-radius: 6px;
    border: 1px solid var(--border-color);
    background: var(--bg-elevated);
    color: var(--text-primary);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s ease;
    user-select: none;
    white-space: nowrap;
  }

  .btn:hover {
    background: var(--bg-secondary);
    border-color: var(--text-muted);
  }

  .chapter-badge {
    font-family: var(--reader-font);
    font-size: 15px;
    font-weight: 700;
    color: var(--text-primary);
    max-width: 420px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .word-count-pill {
    font-size: 12px;
    color: var(--text-secondary);
    background: var(--bg-secondary);
    padding: 4px 10px;
    border-radius: 999px;
    border: 1px solid var(--border-color);
    white-space: nowrap;
  }

  .workspace {
    display: flex;
    flex: 1;
    overflow: hidden;
    position: relative;
  }

  .sidebar {
    width: 290px;
    background: var(--bg-secondary);
    border-right: 1px solid var(--border-color);
    display: flex;
    flex-direction: column;
    transition: margin-left 0.25s ease;
    flex-shrink: 0;
    z-index: 50;
  }

  .sidebar.collapsed {
    margin-left: -290px;
  }

  .sidebar-header {
    padding: 18px 16px 14px 16px;
    border-bottom: 1px solid var(--border-color);
  }

  .book-title {
    font-family: var(--reader-font);
    font-size: 18px;
    font-weight: 700;
    margin: 0 0 4px 0;
    color: var(--text-primary);
  }

  .book-subtitle {
    font-size: 12px;
    color: var(--text-secondary);
    margin: 0 0 12px 0;
  }

  .search-box {
    width: 100%;
    padding: 8px 10px;
    border-radius: 6px;
    border: 1px solid var(--border-color);
    background: var(--bg-elevated);
    color: var(--text-primary);
    font-size: 13px;
    outline: none;
  }

  .search-box:focus {
    border-color: var(--accent-color);
  }

  .chapter-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
  }

  .chapter-item {
    padding: 11px 12px;
    border-radius: 8px;
    cursor: pointer;
    margin-bottom: 4px;
    transition: all 0.15s ease;
    border: 1px solid transparent;
  }

  .chapter-item:hover {
    background: var(--bg-elevated);
  }

  .chapter-item.active {
    background: var(--bg-elevated);
    border-color: var(--accent-color);
    box-shadow: var(--shadow-sm);
  }

  .chapter-item-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-primary);
    margin-bottom: 4px;
  }

  .chapter-item.active .chapter-item-title {
    color: var(--accent-color);
  }

  .chapter-item-meta {
    font-size: 11px;
    color: var(--text-muted);
    display: flex;
    justify-content: space-between;
  }

  .section-anchors {
    margin-top: 6px;
    padding-left: 8px;
    border-left: 2px solid var(--border-color);
    display: none;
    flex-wrap: wrap;
    gap: 4px;
  }

  .chapter-item.active .section-anchors {
    display: flex;
  }

  .sec-pill {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 4px;
    background: var(--bg-secondary);
    color: var(--text-secondary);
    cursor: pointer;
  }

  .sec-pill:hover {
    background: var(--accent-soft);
    color: var(--accent-color);
  }

  .sidebar-footer {
    padding: 12px 16px;
    border-top: 1px solid var(--border-color);
    font-size: 12px;
    color: var(--text-secondary);
  }

  .reader-pane {
    flex: 1;
    overflow-y: auto;
    padding: 40px 24px 120px 24px;
    scroll-behavior: smooth;
    height: 100%;
  }

  .reader-paper {
    max-width: var(--page-max-width);
    margin: 0 auto;
    background: var(--bg-elevated);
    padding: 58px 68px;
    border-radius: 12px;
    border: 1px solid var(--border-color);
    box-shadow: var(--shadow-md);
    font-family: var(--reader-font);
    font-size: var(--font-size);
    line-height: var(--line-height);
    letter-spacing: 0.03em;
    transition: all 0.2s ease;
  }

  @media (max-width: 768px) {
    .sidebar {
      position: absolute;
      height: 100%;
    }
    .reader-pane {
      padding: 18px 10px 90px 10px;
    }
    .reader-paper {
      padding: 28px 20px;
    }
    .word-count-pill {
      display: none;
    }
  }

  .reader-paper h1 {
    font-size: 1.65em;
    font-weight: 700;
    margin: 0.2em 0 1.3em 0;
    padding-bottom: 0.6em;
    border-bottom: 2px solid var(--accent-color);
    color: var(--text-primary);
    line-height: 1.35;
    letter-spacing: 0.05em;
  }

  .reader-paper h2 {
    font-size: 1.25em;
    font-weight: 700;
    margin: 2.2em 0 1.2em 0;
    color: var(--accent-color);
    text-align: center;
    letter-spacing: 0.15em;
  }

  .reader-paper p {
    margin: 0 0 1.05em 0;
    text-indent: var(--para-indent);
    text-align: justify;
  }

  .reader-paper hr {
    border: none;
    text-align: center;
    margin: 2.2em 0;
  }

  .reader-paper hr::after {
    content: "＊　　　＊　　　＊";
    color: var(--text-muted);
    font-size: 0.85em;
  }

  .reader-paper strong {
    color: var(--accent-color);
    font-weight: 700;
  }

  .chapter-nav-footer {
    max-width: var(--page-max-width);
    margin: 28px auto 0 auto;
    display: flex;
    justify-content: space-between;
    gap: 16px;
  }

  .nav-card {
    flex: 1;
    padding: 16px 20px;
    background: var(--bg-elevated);
    border: 1px solid var(--border-color);
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .nav-card:hover {
    border-color: var(--accent-color);
    transform: translateY(-1px);
    box-shadow: var(--shadow-sm);
  }

  .nav-card-label {
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 4px;
  }

  .nav-card-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--text-primary);
  }

  .settings-panel {
    position: fixed;
    top: 62px;
    right: 18px;
    width: 300px;
    background: var(--bg-elevated);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    box-shadow: var(--shadow-md);
    padding: 18px;
    z-index: 200;
    display: none;
  }

  .settings-panel.open {
    display: block;
  }

  .setting-row {
    margin-bottom: 14px;
  }

  .setting-label {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-secondary);
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
  }

  .theme-swatches {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }

  .swatch {
    padding: 8px 4px;
    border-radius: 6px;
    border: 2px solid var(--border-color);
    text-align: center;
    font-size: 12px;
    cursor: pointer;
    font-weight: 500;
  }

  .swatch.active {
    border-color: var(--accent-color);
  }

  .search-results-box {
    max-height: 220px;
    overflow-y: auto;
    margin-top: 8px;
    background: var(--bg-elevated);
    border: 1px solid var(--border-color);
    border-radius: 6px;
    display: none;
  }

  .search-hit {
    padding: 8px 10px;
    border-bottom: 1px solid var(--border-color);
    font-size: 12px;
    cursor: pointer;
  }

  .search-hit:hover {
    background: var(--accent-soft);
  }

  .search-hit-chap {
    font-weight: 600;
    color: var(--accent-color);
    margin-bottom: 2px;
  }

  mark {
    background: rgba(235, 180, 40, 0.35);
    color: inherit;
    padding: 0 2px;
    border-radius: 2px;
  }
</style>
</head>
<body data-theme="sepia">

<div id="progress-bar"></div>

<div class="app-shell">
  <header class="topbar">
    <div class="topbar-left">
      <button class="btn" id="btn-toggle-sidebar" title="切換目錄側欄">☰ 目錄</button>
      <span class="chapter-badge" id="current-chapter-title">載入中...</span>
    </div>
    <div class="topbar-right">
      <span class="word-count-pill" id="word-count-display">0 字</span>
      <button class="btn" id="btn-settings" title="字體、主題與版面設定">Aa 閱讀設定</button>
    </div>
  </header>

  <div class="workspace">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h2 class="book-title">《我不是勇者》</h2>
        <p class="book-subtitle">第一卷：無風迴廊盡頭的少女</p>
        <input type="text" class="search-box" id="global-search" placeholder="🔍 搜尋全卷內文...">
        <div class="search-results-box" id="search-results"></div>
      </div>
      <div class="chapter-list" id="chapter-list"></div>
      <div class="sidebar-footer" id="total-volume-stats"></div>
    </aside>

    <main class="reader-pane" id="reader-pane">
      <div class="reader-paper">
        <article id="reader-article"></article>
      </div>
      <div class="chapter-nav-footer" id="chapter-nav-footer"></div>
    </main>
  </div>
</div>

<div class="settings-panel" id="settings-panel">
  <div class="setting-row">
    <div class="setting-label"><span>閱讀主題</span></div>
    <div class="theme-swatches">
      <div class="swatch active" data-set-theme="sepia" style="background:#f7f3e8; color:#26221e;">文庫紙</div>
      <div class="swatch" data-set-theme="light" style="background:#ffffff; color:#1e2125;">純白</div>
      <div class="swatch" data-set-theme="green" style="background:#e8f0e6; color:#1f2b21;">松綠</div>
      <div class="swatch" data-set-theme="dark" style="background:#1c1f26; color:#d9d6cf;">夜間</div>
    </div>
  </div>

  <div class="setting-row">
    <div class="setting-label"><span>字體風格</span></div>
    <div style="display:flex; gap:6px;">
      <button class="btn" data-set-font="serif" style="flex:1; justify-content:center;">明體 / 宋體</button>
      <button class="btn" data-set-font="sans" style="flex:1; justify-content:center;">黑體</button>
      <button class="btn" data-set-font="kai" style="flex:1; justify-content:center;">楷體</button>
    </div>
  </div>

  <div class="setting-row">
    <div class="setting-label"><span>字級大小</span><span id="lbl-font-size">19px</span></div>
    <input type="range" id="rng-font-size" min="15" max="26" value="19" style="width:100%;">
  </div>

  <div class="setting-row">
    <div class="setting-label"><span>行距寬度</span><span id="lbl-line-height">2.05</span></div>
    <input type="range" id="rng-line-height" min="1.5" max="2.5" step="0.05" value="2.05" style="width:100%;">
  </div>

  <div class="setting-row">
    <div class="setting-label"><span>版面寬度</span></div>
    <div style="display:flex; gap:6px;">
      <button class="btn" data-set-width="640px" style="flex:1; justify-content:center;">窄版</button>
      <button class="btn" data-set-width="760px" style="flex:1; justify-content:center;">標準</button>
      <button class="btn" data-set-width="920px" style="flex:1; justify-content:center;">寬版</button>
    </div>
  </div>

  <div class="setting-row" style="margin-bottom:0;">
    <label style="display:flex; align-items:center; gap:8px; font-size:13px; cursor:pointer;">
      <input type="checkbox" id="chk-indent" checked> 段落首行縮排兩字
    </label>
  </div>

[{"filename": "01_第一章_無風迴廊盡頭的少女.md", "content": "# 《我不是勇者》\n## 第一卷：無風迴廊盡頭的少女\n\n---\n\n# 第一章　無風迴廊盡頭的少女\n\n## １\n\n在地下遺跡裡靠這行維生的人，全都牢記著一條鐵則——在理應死寂無風的封閉坑道中，只要燈火的火苗微微偏斜，就意味著石壁後方藏著會吸氣的暗隙。\n\n那可能是滲漏瘴氣的毒穴，也可能是絕路盡頭唯一通往生機的換氣通道。\n\n不破軒人蹲在潮濕冰冷的石階邊緣。他左手提著一盞玻璃罩帶有一道細長裂痕的鯨油燈，右手穩穩握住三節拼接而成的長鐵鉤，緩緩探進底下兩公尺深的陷阱坑裡。\n\n坑底密密麻麻立著幾排早已鏽透的尖刺，鐵刺之間，掛著一只棕色牛皮側背包。\n\n那是昨天一名剛踏入這行的新手冒險者掉進去的。對方不小心踩翻機關石板，運氣算好，死命攀著牆沿爬回了走廊，裝著家傳懷錶與旅費的側背包卻摔落坑底。坑裡積著一層足以腐蝕皮靴鞋底的淺毒水，冒險者公會開出的回收報酬又只有區區四枚銅幣，沒有哪位資深冒險者肯接這種吃力不討好的差事。委託單在公會櫃檯繞了一圈，最後便轉進了軒人打工的小修繕店「晚鐘亭」手裡。\n\n軒人壓低呼吸，手腕輕巧地一轉。\n\n鐵鉤前端的倒鉤準確咬住牛皮側背包的黃銅扣環，他維持穩定的力道，將背包緩緩往上提。\n\n就在包底即將離開毒水面的那一瞬間，淤泥裡猛然彈出一隻巴掌大的鐵殼毒蠍。泛著幽藍微光的尾針疾甩而來，帶著尖銳的破空聲，「啪」地釘上鐵鉤木柄。\n\n軒人的手腕沒有半分顫動。左手順勢從腰側皮囊抓出一小撮乾石灰粉，順著橘黃燈光精準地撒了下去。\n\n白粉落入毒水，立刻冒起一陣細密的滋滋輕響。鐵殼毒蠍最忌諱鹼性粉末，尾針當場一縮，倉皇退回淤泥深處。軒人趁這道空檔手腕一揚，將棕色牛皮側背包穩穩拉上石階。\n\n他掀開包蓋確認了一遍。裡面的銀殼懷錶仍在滴答走時，皮夾裡的三枚銀幣與十幾枚銅幣一枚都沒少。他抽出乾布，仔細擦淨包面沾附的泥水，這才將側背包收進背後的帆布工具袋，站起身拍落膝蓋上的潮濕灰塵。\n\n「四枚銅幣到手。趁天黑前趕回去吧。」\n\n軒人低頭看了眼懷錶。下午四點半。\n\n山腳下的「白央城」是一座建立在三百年前古工坊「地下支爐」管網上的魔導都市。城裡從街邊照明到家家戶戶的日常器具，清一色都是仰賴支爐管線供能的「觸發式魔導器」——正常人哪怕是年邁老人或剛學會走路的孩童，天生體內都流淌著微弱魔力，只要手指輕碰器物表面的感應紋就能啟動。而這座位於城外西坡的「舊鐘塔遺跡」，則是三百年前大崩落時沉入地底的古工坊舊城區，平時出入此處的冒險者，大都是下來打撈古魔導零件與魔石的遺跡探索者。\n\n這裡是遺跡的地下二層，循原路爬回地面大概只需要三十分鐘，正好能趕上晚餐，也省得被店主千歲碎唸飯菜都放涼了。\n\n他拆收三節鐵鉤，提著鯨油燈沿寬敞的石砌通道往回走。\n\n才剛走出不到百步，前方通往地下一層的主樓梯口忽然炸開一陣雜亂急促的腳步聲與嘶喊。\n\n三名身穿皮甲、高舉著手指一握便自行發光的魔導亮光石的遺跡探索者，跌跌撞撞地從上層衝了下來。跑在最前頭的劍士左臂鮮血淋漓，手中的長劍只剩半截，遠遠瞥見迎面走來的軒人手裡居然提著一盞還要擦火柴點火的玻璃罩鯨油燈，逃命之餘眼底仍掠過一絲詫異——畢竟整座白央城裡，大概也只有體內魔力是「空值」的軒人連最便宜的感應亮光石都點不亮，出門永遠得隨身帶著火柴盒與鯨油燈——隨即幾乎破了音地大喊：\n\n「前面提油燈的，快讓開！上層有頭發狂的『鐵背山豬』衝下來了！」\n\n軒人眼神一凜，幾乎沒花時間思索，瞬間側身貼進走廊側壁的石柱凹槽。\n\n三名冒險者連頭都沒回，狼狽地拐進另一側通往東邊水道的岔口拚命狂奔。幾乎就在他們的背影沒入轉角的同一秒，主樓梯間上方轟然傳來一記令空氣震顫的沉悶巨響。\n\n石砌樓梯的拱頂本就年久龜裂，此刻遭一頭重達數百公斤的龐然大物迎頭撞中，撐頂的兩根腐朽木樑應聲折斷。數十塊比餐桌還要寬大的厚重青石板裹著嗆人煙塵崩落而下，僅僅幾次呼吸之間，通往地下一層的唯一出口便被亂石徹底封死。\n\n軒人立刻抬起前臂捂住口鼻，透過緩緩翻湧的灰霧望向樓梯口，心底瞬間涼了半截。\n\n主樓梯完全塌死了。\n\n更糟的狀況還在亂石堆前。那頭從上層墜落而下的「鐵背山豬」，顯然並未被落石壓垮。\n\n兩公尺多長的厚重身軀覆滿灰黑色礦甲，其中一隻後腿被巨石砸得血肉模糊，每挪動半步，都在青石板上拖出一道黏稠暗紅的血痕。粗重如風箱的喘息夾雜著濃烈血腥與硫磺氣味，穿透漸散的塵霧撲面而來。那對充血的猩紅獸瞳掃過通道，瞬間鎖定了東側水道裡那三名冒險者殘留的魔力氣息——而在轉身追擊之前，那雙野獸的紅眼緩緩轉了個角度，正好停在距離不到五步遠的石柱陰影上。\n\n走廊裡的空氣彷彿在一秒之內徹底凍結。\n\n軒人連一根指頭都沒動。\n\n他的指尖無聲壓下鯨油燈外側的遮光銅片，將橘黃火苗死死壓縮成豆粒般微弱的一點，整個脊背緊貼著冰冷粗糙的石柱凹槽，連胸口的起伏都壓到了最淺。冷汗順著鬢角緩緩滑過耳際，落進衣領裡，冰涼刺骨，他卻連眨眼都不敢。\n\n就在壓下銅片的那一剎那，眼角餘光掠過自己乾淨無紋的手背。\n\n蒼白、平滑，看不見半點魔力迴路的微光，連市面上最廉價的魔導燈都點不亮——平時總被公會裡那些老資格的傢伙私下嘲笑為「廢手」的這雙手，在眼下這種絕境裡，卻成了唯一能保住性命的盾牌。\n\n棲息於地底的魔物多半視力與聽覺遲鈍，索敵全仰賴活人體內溢出的魔力波動與強光。在鐵背山豬的感知之中，貼壁屏息、體內魔力值近乎零的軒人，與一塊毫無溫度的冷石頭沒有兩樣；相較之下，東側岔路裡那三個舉著亮光石狂奔的冒險者，簡直像三支在黑夜中劇烈晃動的耀眼火炬。\n\n短短幾秒鐘，漫長得像是過了半小時。\n\n鐵背山豬暴躁地刨了兩下前蹄，碎石喀喀飛濺，鼻孔噴出兩道滾燙的濁白氣流，最終視若無睹地移開視線。牠猛地調轉龐大身軀，一頭撞碎東側水道的朽木柵欄，發出震耳咆哮，踩著沉重碎步追進了水聲奔湧的陰暗深處。\n\n直到震得靴底發麻的蹄聲徹底消失在水道盡頭，軒人才緩緩鬆開早已攥得指節發白的提燈柄，無聲吐出憋在肺葉裡的一口濁氣，重新掀開遮光銅片。\n\n「主樓梯整個塌死了，東邊水道又有那頭大傢伙在裡面兜轉……」\n\n軒人湊近亂石堆仔細看了一眼。砸下來的全是實心花崗岩，沒有三四名力氣夠大的工匠架起絞盤與鐵撬棍開挖一整天，根本清不出路來；而東側水道是一條死路，受了重傷的山豬要是追丟了目標，遲早會順著原路退回來。\n\n他從胸袋裡摸出一張平時自己手繪的遺跡結構草圖，就著油燈微弱搖曳的橘光逐段檢視路徑。\n\n指腹沿著走廊線條向西移動，最後停在一處畫滿虛線與叉號的偏僻迴廊旁。\n\n那行他從資深冒險者酒後閒聊裡記下的小字，此刻在微光下顯得格外刺眼：**『無風迴廊・禁魔死路』**。\n\n## ２\n\n「無風迴廊」的入口，藏在主樓梯西側三十步外的一道狹窄石縫中。\n\n裂口邊緣原本釘著一塊冒險者公會的警示木牌，上頭『廢棄散魔坑道，嚴禁入內』的字樣早已腐朽了大半，歪斜地垂掛在牆角。腳下的積灰厚得淹過靴緣，顯然已經好幾十年沒有人踏足過此處。\n\n軒人站在裂口前，視線從草圖移向漆黑深邃的坑道內部。\n\n這一段岩層摻雜了大量的吸魔灰岩。任何灌注魔力的魔導具只要帶進去，內部的魔力就會像滲入乾沙的水一般飛快乾涸。一般探索者踏進這裡，不只手裡的亮光石會瞬間罷工，連穿戴在身上的魔導風靴、魔導護具都會當場失效，變作沉重累贅的死鐵。店裡的熟客曾提過，早年有幾支抱著僥倖心態的尋寶隊硬闖這條坑道，結果走不到五十步便全身裝備癱瘓、照明全數熄滅，再加上盡頭早在百年前的一場地震裡徹底塌死，裡頭既無魔物也沒有礦脈，久而久之便成了連公會地圖都懶得標註的廢道。\n\n「留在外面撞上那頭山豬也是死路一條，先摸進去看看有沒有通風口吧。」\n\n軒人從剛回收的牛皮側背包裡借出一顆尚存微弱餘光的蓄能照明魔石捏在左掌，重新拉緊帆布工具袋的肩帶，提著鯨油燈邁進積滿厚灰的石縫裂口。\n\n十步，二十步，三十步。\n\n石板路微微朝下傾斜，兩側岩壁的色澤逐漸轉為泛白的吸魔灰岩。才剛踩出第四十步，掌心裡那顆照明魔石便神經質地閃爍了兩下，隨即徹底熄滅，沉成一塊冰冷毫無生氣的灰白石塊。\n\n反觀他右手提著的那盞舊鯨油燈，玻璃罩內的橘黃火苗依舊穩穩燃燒著，沒有半點動搖。\n\n因為體內天生是沒有半點魔力的「空值」，軒人從小就點不亮任何魔導開關，自十一歲起便是提著這盞燒油的普通鐵皮燈進出遺跡的。他身上帶的玻璃鯨油燈、純物理滑輪組，以及腳上那雙靠腳跟撞針擊發壓縮空氣的純機械氣瓶靴，在這片讓所有魔導器瞬間失效的吸魔灰岩帶裡完全不受半點影響。對離開魔導具就連一步都走不動的探索者而言，這裡是連自己指尖都看不見的絕對死地；對他來說，卻跟平常走夜路沒什麼兩樣。\n\n他將熄滅的魔石放回側背包原處，繼續沿著漆黑通道前行了約莫五十公尺。前方的路果真如傳聞所說，被一面直抵天井的坍塌岩壁徹底封死。參差錯落的巨岩重疊堆積，看不出一絲空隙，也難怪過去誤闖進來的人轉頭便走。\n\n軒人卻沒有掉頭。他蹲下身，將鯨油燈緩緩湊近亂石堆最底部的窄縫旁，順手把燈罩的進氣口旋開一半。\n\n在理應死寂無風的封閉坑道裡，火苗只要微微偏斜，石壁後方就藏著吸氣的暗隙。\n\n寂靜無聲的石洞內，原本筆直向上的昏黃火舌在逼近右下角一塊斜楔著的青石時，果真極其細微地朝縫隙深處傾倒了一小截。\n\n「有氣流往裡頭吸……後面是空的。」\n\n軒人眼底亮起一絲神采，擱下油燈，拔出腰間的扁頭拆件短刀，沿著那塊楔形青石的邊緣仔細輕敲了一圈。\n\n刀背碰上岩面，傳回的聲響清脆而帶著中空的迴音。他抬頭細看上方石堆的受力紋理——原來當年坍方時，頂部幾塊巨岩在半空中彼此咬死，撐出了一道天然的三角卸力拱；底下這塊斜插在舊排水拱門裡的青石根本沒有承受上方重量，只是虛楔在門框當中。只要架起滑輪往外拖出幾十公分，就能露出一道足以讓人側身鑽過去的缺口。\n\n軒人立刻從工具袋取出雙輪滑輪組與精鋼鋼索，一端牢牢纏死在後方石柱底座，另一端套實青石的凸角，雙手緊握撬棍插進縫隙，配合滑輪的省力拉力一點一點往外撬動。\n\n死寂的坑道裡只剩下岩面磨擦的沉重悶響與少年克制的喘息。咬牙費力忙了整整十五分鐘，額角滲出一層細密汗珠，那塊不知封堵了多少歲月的楔形青石總算被硬生生拖開了一道足以讓半個人穿過的狹窄空隙。\n\n缺口的另一側，是一條緩緩向下延伸的古老石砌維護迴廊。\n\n軒人俐落收妥滑輪組，拿白粉筆在缺口內側劃下明顯的回程記號，提著鯨油燈側身鑽了進去。\n\n按照舊鐘塔的建築結構推算，順著這條地下維護迴廊往中庭方向走，理應能找到從前工匠用來吊運大鐘構件的垂直通風井。\n\n可是順著石階往下走了不到五分鐘，他的腳步卻不自覺地漸漸放慢。\n\n這條被吸魔岩層與坍方雙重隔絕的地下迴廊裡，地面積灰始終厚實平整，看不見半枚鞋印，也沒有任何近代留下的鑿痕。然而空氣中的潮冷濕氣卻越來越沉，地底深處隱約浮出微弱的流水聲——那是地下暗河的動靜。\n\n穿過一段冗長的螺旋下坡石階後，前方出現了一扇橫斷通道的三重齒輪鐵柵門。\n\n這是一道純機械構造的配重閘門。鐵框外殼早已蒙滿厚灰與乾燥鏽斑，但內部的密封青銅軸套當年以石蠟封護得極其嚴密，並未徹底鏽死。左側石壁上嵌著三個外型一模一樣的生鐵拉環；老工坊設計的配重閘門大多內建防盜木栓，拉錯次序便會當場落栓鎖死。\n\n軒人沒有貿然伸手。他側過頭將耳朵貼上冰涼粗糙的石壁，反握拆件短刀，以刀柄尾端依序輕輕敲擊三個拉環。\n\n嗡、噹、喀。\n\n石牆內部傳來三道長短分明的配重吊索回音。中間那個拉環相連的吊索最短也最輕，左邊次之，右邊最長。\n\n「先拉最短最輕的中間，再拉左邊，最後拉右邊。」\n\n軒人憑著這六年來拆修上百種老式門鎖磨練出的手感，雙手平穩地依循剛才聽出的次序，接連將三個生鐵拉環拉到底。\n\n喀啦、喀啦。\n\n藏在石壁深處的秤錘接連沉墜作響。乾澀刺耳的金屬摩擦聲刮過耳膜，震落簌簌積灰，沉重的生鐵柵門這才沿著滑軌緩緩向兩側退開。\n\n清涼潮濕的水氣伴隨著嘩啦流水聲撲面湧來，一口氣沖散了吸魔坑道裡那股沉悶死寂的陳舊灰味。\n\n閘門後方視野驟然開闊，一座架設在地下暗河上方的石造廊橋出現在眼前。橋身兩側雕著早已被歲月磨蝕模糊的古老齒輪浮雕，橋下漆黑的河水奔湧流淌，嘩啦水聲在寬廣的地底溶洞裡反覆迴盪出層層低鳴。\n\n廊橋對岸，矗立著一座構築於巨大地下溶洞正中央的八角形石造鐘樓底座。\n\n軒人停在橋頭沒有急著跨步，先伏低鯨油燈，將橋面青石逐塊檢視過一遍，確認石板接縫裡既沒有下沉踏板也沒牽絆暗線，這才放輕呼吸走過廊橋，踏進鐘樓底座石拱門內側的半露天採光門廊。\n\n靴底剛落上門廊石磚，軒人的背脊瞬間繃緊了。\n\n右手無聲按上腰間扁頭拆件短刀的刀柄。\n\n這座位於鐘樓底座內側的小型採光天井底下，從上頭裂縫跌落的碎石與碎玻璃並沒有雜亂散落在地，而是被人用某種扁平工具整整齊齊掃到了左側牆根，堆成兩座邊線分明的小堆；石堆旁擺著一盞早就沒油的老式銅燈座——表面厚積的青綠銅鏽竟被人拿粗布擦去了一半，露出底下泛著暗黃光澤的新鮮銅面，連周圍石磚上都留著一圈乾爽的布屑與拂塵痕跡。\n\n那絕不是數百年前遺留的舊痕。裸露出的銅面亮得刺眼，頂多就是這兩三天才擦拭出來的。\n\n隔著吸魔岩層、被坍方封死在外的地下鐘樓底座裡，竟然真的有活生生的人住著。\n\n而在更前方，那扇半掩的厚重青銅大門門縫之間，此刻正悄悄透出一抹溫熱搖曳的橘黃燭光。\n\n## ３\n\n隨燭光一同從門縫漏出來的，還有一陣規律得有些奇妙的「叮、叮、叮」敲擊聲。\n\n聽起來像有人正舉著鐵鎚，不疾不徐地敲打某塊變形的金屬零件。\n\n軒人壓輕腳步湊近那道約三十公分寬的門縫，側過臉往裡面窺探。\n\n門後是一間極為寬敞的圓形地下工坊。穹頂正中央高懸著一具早已停擺的巨型青銅鐘擺，四周弧形石壁立滿直抵天花板的木質陳列架，分門別類排滿了從上層排水道或天井落下的舊器物——生鏽鐵盔、缺口陶罐、斷裂劍身，每一件都被擦拭得一塵不染。\n\n停擺的巨型鐘擺下方擺著一張長木桌，桌面上點著兩根普通的白蠟燭。\n\n一名留著淡粉紅色長髮的少女正坐在桌後的木凳上。\n\n她看起來約莫十六七歲，穿著一襲略顯寬大的灰藍色舊式工作服，袖口工整地挽至手肘，露出一雙白皙得近乎透明的小臂；領口正中央別著一枚銀色五瓣花胸扣，花芯嵌著一顆圓潤白珠，右下角花瓣缺了一小角。\n\n少女微微偏著頭，左手按住桌上一只顯然是從上層水道沖下來的鏽蝕八音盒，右手卻握著一把尺寸誇張、原本用來敲打鐵軌道釘的平頭重鐵鎚，神情專注而一板一眼地試圖將八音盒側面翹起的一片薄銅皮砸回原位。\n\n鐵鎚實在重過頭了，她每敲落一下，整張長木桌便跟著劇烈一震，八音盒內部的發條隨之發出令人牙酸的細碎顫鳴。\n\n修了六年精密器具的職業本能讓軒人看得眼皮直跳，手指沒收住力道，不自覺在青銅門環上磕出一記清脆輕響。\n\n叮。\n\n屋內的敲擊聲應聲斷絕。\n\n木凳上的淡粉紅髮少女幾乎在同一瞬抬起雙眼。右手那柄沉重的平頭鐵鎚非但沒有放下，反倒順勢橫舉在身前，人已無聲無息地站起身。一雙宛如初春櫻瓣般淺淡的粉紅眼眸冷靜而鋒利，筆直釘住了門縫的方向。\n\n「誰在那裡。」\n\n嗓音偏輕，不帶絲毫受驚的尖叫或慌亂，只有長久獨居者才會養出的清冷戒備。\n\n軒人明白繼續躲藏只會被當成擅闖民宅的小偷，乾脆舉起空著的左手，右手提亮鯨油燈，推開半掩的青銅大門走了進去，在距離長木桌七八步遠的位置停下腳步。\n\n「抱歉，嚇到妳了吧。我不是壞人，只是上面店裡的修繕學徒。」\n\n軒人輕拍了拍肩側的帆布工具袋，又朝身後的來路指了指。\n\n「剛才地下二層的主樓梯被魔物撞塌了，我為了找通風井逃生，順著氣流摸索過來的。外頭那道配重閘門我沒有破壞，只是用短刀刀柄敲環聽出吊索長短才拉開的。」\n\n少女仍未放下手中的重鐵鎚。\n\n她的目光先在軒人右手那盞燃著普通鯨油的舊提燈上停留一拍，再緩緩掠過他乾淨無紋的手背與胸口，細眉微微蹙起。\n\n「外面的吸魔坑道已經坍塌了很久。沒有魔導燈，也沒有白塔標註的地圖，你怎麼找到那道暗門的？」\n\n「因為我天生沒有魔力，從小就一直提著這種普通的鯨油燈。」軒人晃了晃手裡搖曳著暖光的鐵皮燈，「外面的石牆雖然塌死了，但火苗靠過去時往縫隙裡偏斜了一小截，我就知道後面通風，架起滑輪把底下的石塊拖開鑽了進來。」\n\n少女凝視著那盞鯨油燈靜靜看了好幾秒，像在仔細確認他身上確實不存在半分魔力波動，也沒有隱藏任何白塔制式魔導具。\n\n片刻後，她緊繃的肩線總算微微放鬆，將那把與纖白手腕極不相稱的重鐵鎚放回木桌。\n\n「三百年來，你是第一個從正門走進來的人。」她說。\n\n「三百年……？」軒人微微一怔，打量著眼前這名年紀與自己相仿、臉頰在燭光映照下分明透著溫度與生氣的少女，心底暗暗嘀咕——這座地下工坊既沒有日曆也不見天日，這名少女八成是一個人獨自待在這裡太久，把幾個月或幾年誤記成了三百年。\n\n他沒蠢到當面拆穿，只是順著話頭溫聲問道：「妳一個人在這下面住了很久嗎？」\n\n「大多數時候都在後面的石室裡睡覺。只有水聲變大，或是上頭有東西掉下來時才會醒。」\n\n少女低頭瞥了一眼桌上那只被自己砸得微扁的八音盒，伸手想把翹起的薄銅邊壓回去。可指尖剛觸及銳利的銅緣，她卻像忽然想起了什麼，迅速將手指縮回灰藍色工作服的袖口裡。\n\n「通風井在後面那扇鐵門外面。」她抬起左手，指向圓形工坊右後方一條向上延伸的石道，「不過前天半夜地底震動過一次，通風井底下的排水閘被落石卡死了，暗河的水正不斷往石道裡倒灌。你如果游得過去，順著鐵梯就能爬回地面。」\n\n軒人順著她指的方向望了過去。\n\n他這才注意到圓形工坊右後方的地勢比中央低了約半公尺。漆黑冰冷的暗河水早已漫過最底部的三級石階，水位正以肉眼可見的速度緩慢上漲。再拖上兩小時，這張長木桌連同整間地下工坊恐怕全都會泡進水裡。\n\n「水都快漫到桌腳了，妳居然還坐在這裡敲八音盒？」軒人睜大眼睛，「妳不打算一起從通風井出去嗎？」\n\n「我出不去。」\n\n少女重新在木凳上坐下，口吻平淡得像在報告今日的天氣。\n\n「這座房間刻著限制結界。只要我踏出鐘樓底座的範圍，胸口的花扣就會強制切斷我的意識，把我送回後方的石室。」\n\n「那水淹上來怎麼辦？」\n\n「回石室的高台繼續睡，等哪天水退了再醒。」\n\n軒人聽得一時語塞，只覺得眼前這名少女不只記亂了年份，連一般人最起碼的生活常識都欠缺得離譜。\n\n他走去右後方的積水邊緣蹲下身，舉高鯨油燈往漆黑水底照去。清冷的暗河水下一公尺深處，果真立著一扇青銅排水閘；一塊前天震落的長條石死死橫卡在閘門齒輪之間，將本應流向下游的河水全堵回了工坊裡。\n\n「妳前天沒試過把那塊石頭推開嗎？」軒人回頭問。\n\n「試過。」少女的語氣毫無起伏，「那塊石頭浸在水裡重得驚人，我空手推不動，這裡也沒有撬棍。反正水淹上來也不會壞。」\n\n軒人無聲吐了口氣。這話聽起來有些荒唐，卻又莫名契合她那副清冷淡漠的氣質。\n\n只要拿撬棍把卡死齒輪的長條石頂落，積水十分鐘內就能排淨，通往通風井的石道也會乾爽地露出來。\n\n他起身回到長木桌旁，卸下帆布工具袋擱在桌角，從裡頭翻出一把最小號的木柄平口鉗與一柄精巧的黃銅小鎚，順著桌面輕輕推到少女手邊。\n\n少女垂眸看著那兩件巴掌大的工具，抬眼望向他：「這是做什麼的？」\n\n「修八音盒用的。」軒人指了指旁邊那柄鐵軌重鐵鎚，「那麼薄的銅皮得用小鉗子咬住邊緣慢慢收回去，拿重鐵鎚硬砸，裡面的音梳早就被震斷了。」\n\n他一邊說著，一邊彎腰解開小腿的綁腿布，準備捲起褲管涉水。\n\n「我叫不破軒人，在上面的『晚鐘亭』當修繕學徒。借妳這條路逃生，就順手幫妳把卡住水閘的石頭撬掉，免得妳真的得泡在水裡睡覺。對了，該怎麼稱呼妳？」\n\n少女看著桌上那把被掌心磨得溫潤光滑的小木柄平口鉗，靜默了兩秒，伸出左手將它拾了起來。\n\n「我叫Eraser。」她說。\n\n「Eraser？很少見的名字呢，是舊時代的語言嗎？」\n\n「是抹消的意思。」她握住平口鉗，試著輕夾八音盒翹起的銅角。這一回沒有發出半聲刺耳震響，薄銅皮服服貼貼地合回了原位。她的語氣依然平直得像是在朗讀器物銘牌上的規格說明，沒有半分遮掩或防備，「因為我不是人類。我的手碰到正在運作的術式，就能把它徹底抹消。從前造出我的工匠，就是這麼叫我的。」\n\n正彎腰捲著褲管的軒人動作微微一頓，低頭瞥了一眼自己乾淨無紋的手背，又抬起頭看了她一眼。\n\n他自己是手碰上去連普通魔導燈都點不亮的「空值」，眼前這名少女卻自稱是手碰上去會把運作中術式直接抹消歸零的「零號」——這世上哪有這麼奇妙又古怪的對比。\n\n暖黃燭光落在少女白皙的臉頰上，呼吸平穩清晰，怎麼看都像個活生生的人類女孩。他只當她是自小被某個脾氣古怪的魔導師留在地下室裡長大，才被灌輸了一腦袋稀奇古怪的說法，於是笑著點了點頭：「好，那妳就在這裡慢慢修八音盒吧，我去把水放掉。」\n\n那一刻的他，根本沒有把那句話當真。\n\n## ４\n\n暗河的積水比軒人預料得還要冰冷刺骨。\n\n他將褲管捲到大腿上方，踏進齊膝深的冷水，將鯨油燈掛在旁邊凸出的石筍上，深吸一口氣彎腰探身，把精鋼撬棍伸進水面之下，精準卡向橫死在齒輪間的長條石。\n\nEraser沒有繼續坐回桌前。她端起白蠟燭走到乾爽的石階邊緣，安靜地替他照亮水下的齒輪縫隙。\n\n「往左撬開幾公分。」她垂眸凝視著水底的機械構造，「那塊石頭底下原本留有導軌槽，推進槽裡就不會再滑出來。」\n\n軒人依言將撬棍向左一轉，雙臂壓沉發力。\n\n咕嚕——水底傳來一聲沉悶滾動。卡死的長條石終於鬆脫，順勢滑進導軌槽，沉入深坑之中。\n\n然而長條石清開了，青銅水閘卻依然一動也不動。軒人冒出水面抹開滿臉冰冷河水，盯著水閘背後漆黑幽深的涵洞皺起眉頭：\n\n「奇怪，石頭明明已經落槽了，怎麼水閘葉片還是像被什麼東西從背面吸住一樣？」\n\n站在石階上的Eraser將白蠟燭往前探近了幾公分。\n\n搖曳燭火穿透晃動的水波，落進水閘背後的暗縫之中，她那雙淡粉色的眼眸驟然一凝。\n\n「不是卡住。涵洞裡有頭從上層水道鑽進來的魔物，正死死咬著閘門後面的熱水管。」\n\n話音剛落，水閘背後猛然炸起大片沸騰翻湧的白浪。\n\n刺耳欲裂的金屬撕扯聲劃破工坊。兩隻披滿青灰石甲、前彎如鐮刀般的巨型骨爪驟然從涵洞探出，死死扣住數百公斤重的青銅閘門上緣，竟硬生生將厚重的銅板掰彎了一角。\n\n緊接著，一頭身形扁寬、猶如巨型河蟹般的魔物硬擠出涵洞。令人毛骨悚然的是，牠的甲背正中央竟詭異地嵌著半截舊式青銅鍋爐殼。\n\n鍋爐殼縫隙裡透出滾燙的暗紅光紋，將周遭冰涼的水氣蒸得滋滋作響。軒人腦中飛快閃過一個念頭——那八成是舊鐘塔底層報廢的恆溫術式殘片，被這頭棲息在暗河裡的大傢伙連殼嵌進背甲裡當作熱巢，最終異變成了只要感應到活人熱源便瘋狂嗜殺的怪物。\n\n「退上來！」\n\nEraser的左手果斷一把揪住軒人的工具腰帶。就在巨大骨鉤橫掃水面的極限瞬間，她借勢往後猛拽，軒人順勢蹬水躍回乾爽石階。\n\n轟。\n\n他方才立身的水面被骨鉤硬生生劈開兩道白浪。巨蟹魔物八足齊動，龐大的青銅背甲撞碎水沿石欄，挾著腥熱撲鼻的濃霧爬上圓形工坊地面，不偏不倚橫堵在通風井與長木桌之間。\n\n「背上那塊發紅的鍋爐殼，就是驅動它的術式核心。」\n\nEraser將白蠟燭穩穩放上石階，伸手褪去右手的薄布手套，露出一隻纖細白皙的掌心。\n\n「尋常刀劍殺不死它，只要紅光還在燃燒，就算砍斷爪子也會靠魔力接回。你退到鐘擺後面的高台去，我過去直接碰觸那塊紅光，就能把它抹掉。」\n\n「等等，別過去！」\n\n軒人伸手一把拉住她的左腕，將她穩穩拉回自己身側，目光死死盯著那頭不斷噴吐滾燙白霧的巨蟹。\n\n「那塊紅光嵌在鍋爐殼裡面對吧？外層不但鎖著鐵蓋，縫隙裡還有一整圈高速旋轉的青銅散熱葉片，前面更有兩隻一公尺長的鐮刀骨爪護著。妳沒武器也沒有護具，空手衝上去，指頭還沒摸到核心，整隻手就先被葉片絞爛了。」\n\nEraser微微偏過頭看他，語氣平淡得沒有一絲起伏：「散熱葉片只會割破手背，割不斷手腕。只要指尖碰到裡面的核心，這點外傷很快就會好——」\n\n「拜託妳別把『割破手背』說得像被蚊子叮了一口一樣輕描淡寫！」\n\n軒人胸口猛地湧上一股難以壓抑的悶火，直接打斷了她。\n\n直到這一刻，他才徹底明白方才她在桌邊為何下意識縮回手指。在這個不知被誰遺忘在地底三百年的少女認知裡，只要能夠抹除眼前的威脅，自己的手是否會血肉模糊、被高溫燙出焦泡，從來都不在她的計算範圍之內。\n\n「聽好了，Eraser。現在這裡有兩個人，輪不到妳拿自己的手去餵葉片。」\n\n軒人微退半步，視線如鷹隼般飛快掃過工坊中央高懸兩公尺、重達數噸的巨型青銅鐘擺，接著落回自己腳上那雙純機械氣瓶靴的靴跟氣罐。\n\n因為體內是沒有半分魔力的「空值」，點不亮市面上的魔導風靴，這雙靴子是他與店主千歲聯手改裝出來的純機械裝備——三枚壓縮到極限的靴跟氣罐，只要踩落黃銅踏扣、以腳跟撞針擊發壓縮空氣，便會噴出高壓氣流，能為使用者換來三次短促而極具爆發力的直線加速。\n\n「我問妳，如果我能把牠那兩隻大爪子拖住，再撬開背上的鐵蓋、把散熱葉片卡死，妳需要幾秒才能把裡頭的核心抹掉？」\n\nEraser的目光掠過他腰間的扁頭拆件短刀，又望回躁動嘶鳴的巨蟹背甲。\n\n「只要蓋子打開、葉片停下，碰到核心只需要一秒。」\n\n「一秒——足夠了。」\n\n軒人左手從工具袋抽出二十公尺長的精鋼鉤索與兩枚硬木楔子，右腳向後微錯半步，靴跟的黃銅踏扣清脆地磕上青石板。\n\n「妳退到長木桌後面，看準我的信號再衝上來。在我喊妳名字之前，絕對不准自己伸手，聽明白了嗎？」\n\nEraser望著擋在身前、明明體內沒有半點魔力卻將整個戰場的調度全攬在肩上的少年，靜默了半拍，輕輕點了點頭：「聽明白了。」\n\n就在同一瞬間，巨蟹背甲爆出猶如蒸汽汽笛般的尖銳嘶鳴。\n\n八條石甲步足同時蹬裂青石地磚，兩隻鐮刀骨鉤交錯如巨鍘，挾著凌厲破風聲朝石階迎頭劈落。\n\n軒人沒有往後退。\n\n惡風壓臉的剎那，他狠狠踩落右靴的第一顆氣罐踏扣。\n\n嗤——\n\n高壓氣流驟然炸離靴底，狂暴的反作用力震得腳掌一陣發麻。他的身體貼著地面向左斜滑出三公尺，冰冷刀風幾乎擦著額前黑髮削過，兩道石甲骨鉤轟然砸空，將他剛才站立的青石階硬生生削出一排慘白的深槽。\n\n幾乎在同一拍，軒人左手俐落地甩出精鋼鉤索。飛爪沒有射向魔物，而是劃破滾燙水霧直射半空，「喀」地一聲牢牢咬住巨型青銅鐘擺底部的銅掛環。\n\n巨蟹一擊落空，石爪刨裂石磚調轉身軀，龐大的青銅背甲推開滾燙白霧，直朝鐘擺正下方狂撲而去。\n\n就是這個軌跡。\n\n軒人不再閃避，右靴重重踩下第二顆氣罐踏扣。\n\n嗤——\n\n白霧噴湧，氣流推得他拔身斜竄而起。左靴在旁邊高聳的木質陳列架邊緣精準一蹬借力，整個人在半空中俐落翻折。躍過高空的短短一瞬間，左手順勢將繃直的精鋼鋼索繞過木架頂端支柱兜出半道活扣，擦著巨蟹頭頂呼嘯掠過的剎那，精準無誤地將索尾鐵環套死在魔物高高揚起的左爪骨鉤尖端。\n\n人還未落地，軒人已斜撲向鐘擺側面四公尺高的固定架台。\n\n三百年前停機時，這具數噸重的青銅鐘擺並非以繩索懸掛，而是靠一根粗鐵打造的保險插銷硬生生卡死在弧軌起點；經過三個世紀的地底潮氣侵蝕，那根插銷早已鏽得千瘡百孔。\n\n軒人左靴踩實狹窄的架台邊緣，右手迅速拔出扁頭拆件短刀，將扁口深深楔進鏽蝕插銷的卡縫裡。這場賭注沒有第二次機會——他咬緊牙關，傾注身體下墜的全部重量，將右肩連同腰背肌肉絞成一股，死命往外一撬——\n\n喀崩。\n\n鏽透的粗鐵插銷應聲崩斷，暗紅鐵屑在燭光下四散飛濺。\n\n一股野蠻狂暴的反震力沿著刀柄直灌右肩，肩胛深處頓時竄起一陣撕裂般的酸麻劇痛。軒人咬牙借勢躍下架台，靴底卻不巧落上沾滿暗河青苔的潮濕石階，腳下猛然一滑，右膝重重磕在粗礪的石稜之上。粗布褲管當場磨裂，火辣辣的劇痛隨即炸開，滲出一片黏熱血痕。\n\n轟隆——\n\n脫離鎖扣的數噸青銅鐘擺徹底失去束縛，撕裂沉悶空氣發出低沉轟鳴，沿著弧形銅軌朝前方呼嘯擺出。\n\n相連於鐘擺底部的精鋼鋼索瞬間繃成一根劇烈顫鳴的鐵線。無可抵擋的巨力硬生生將巨蟹的左爪拽上半空，連帶著牠龐大沉重的身軀離地側翻半邊，「砰」地一記震天巨響，狠狠撞進鐘擺基座的石柱之中。\n\n巨蟹在半懸空的失衡狀態下瘋狂掙扎，空著的右爪胡亂揮砍半空鋼索，背上的鍋爐殼鐵蓋劇烈震顫，噴出一團團灼燒肺腑的滾燙白煙。\n\n「最後一發。」\n\n軒人咬緊後槽牙，強行壓下右膝火燒般的刺痛與右肩傳來的鈍震，胸口劇烈起伏，不等雙腳站穩便狠踩第三顆、也是最後一顆靴跟氣罐。\n\n高壓氣流暴湧炸開。他整個人貼著石柱斜衝而上，雙靴重重踩實魔物劇烈搖晃的石甲背。\n\n滾燙白霧撲面而來，烤得臉頰皮膚彷彿隨時會脫層皮，就連吸進氣管的空氣都帶著焦灼鐵味。軒人死屏呼吸，盯緊鍋爐鐵蓋在噴氣時微張的一線空檔，將左手緊握的兩枚硬木楔子從側面狠狠釘了進去——硬木楔不僅死死頂住鐵蓋回落，更直直楔入內側的傳動齒環，爆出一陣令人頭皮發麻的尖銳刮響，將裡頭呼呼飛轉、足以削斷手指的青銅散熱葉片硬生生卡得徹底停轉。\n\n右手扁頭拆件短刀隨即插進蓋板鎖扣縫隙裡，雙臂青筋直繃，忍著右肩宛如撕扯般的銳痛往外死命撬開。\n\n喀嚓——崩。\n\n高溫發紅的鐵蓋鎖扣應聲炸裂，蓋板被迫卡停在半張的角度。強烈的反震力震得他虎口發麻，精鋼打造的短刀刀尖終究沒能扛住硬扣的反彈，清脆地崩掉了一小口。\n\n然而蓋板底下那枚燒得如融鐵般劇烈搏動的暗紅術式核心，終於毫無遮擋地暴露在空氣之中。\n\n「Eraser，就是現在！」\n\n軒人單膝壓住滾燙背甲，以崩了口的短刀刀脊死死頂住仍試圖回彈的鐵蓋，啞著嗓子朝長木桌方向高喊。\n\n一道淡粉色的輕盈身影幾乎與喊聲同時掠過斷裂的石欄。\n\n灰藍衣襬在濃白蒸汽之中俐落一翻。她無聲落地於軒人身側，神情冷靜得近乎透明，白皙右手精準穿過被短刀撐開的狹窄縫隙，五根細長手指平穩而毫不猶豫地按在了那塊暗紅核心的正中央。\n\n軒人下意識繃緊臂肌，只怕她的手掌碰上至少三百度的高溫會瞬間焦黑綻裂，隨時準備一把將她扯開。\n\n然而下一秒，整座地下工坊的時間彷彿被人伸手按停了。\n\n滋——\n\n那聲響輕得像深冬第一場初雪靜靜落入炭火。\n\n一圈純白無瑕的微光自少女指縫之間悄然溢開，既不燙手，也沒有掀動半絲氣浪。\n\n在白央城裡，凡是已經啟動的魔力核心，要不是等待內部魔力燃燒殆盡，就是得由數名高階魔導師聯手壓制數小時，絕無半途戛然熄滅的道理。\n\n可就在這一刻，那塊足以熔穿生鐵、連呼吸都烤得灼痛的暗紅核心，在觸及少女指尖短短一秒之內，竟宛如被橡皮擦輕輕拭去的炭筆字痕，連一星火花都未曾炸起，無聲無息地化作一縷冰冷白灰，隨潮濕氣流飄散無蹤。\n\n強行驅動著魔物的暴走魔力瞬間斷絕，巨蟹眼中的狂暴紅光隨即熄滅。龐大身軀軟垂下去，背上吸附的青銅鍋爐殼嘩啦脫落砸在石板上。那頭怪物晃了晃觸鬚，倒像隻受了驚嚇的尋常大河蟹，縮起被拽痛的左爪，順著方才清開的水閘涵洞灰溜溜地退回了暗河深處。\n\n## ５\n\n涵洞徹底暢通，工坊地面的積水打著旋急排而出，不出兩分鐘，通往後方通風井的石階便已乾爽地露了出來。\n\n軒人卻仍單膝跪在落地的空鍋爐殼旁邊，緊盯著裡頭空空如也、連一絲餘溫都未留存的爐芯槽，足足僵了五秒才找回自己的聲音。\n\n「……真的消掉了？」他仰頭望向站在石柱陰影旁的少女，聲音裡滿是難以置信，「那可是正在暴走的高溫術式核心，連討伐隊的騎士都不敢空手靠近。妳連咒語都沒唸，碰一下就沒了？」\n\nEraser緩緩收回右手，安靜垂在身側。\n\n軒人這才看得無比清晰——在她白皙近乎透明的掌心到腕部皮膚底下，浮現的根本不是人類青紅交錯的血管，而是五六條宛如精密銀絲般發著微光的幾何紋路。或許是因為剛才核心高溫的反衝，那些銀絲此刻正透著異常的暗紅燥光，連帶她的小指也微微發麻蜷縮。\n\n凝視著那截皮下流轉的非人微光，軒人的呼吸陡然一窒。\n\n方才在長木桌前，她用毫無起伏的語調吐出的「不是人類」「待了三百年」「工匠造出來的抹消器」——竟然連一個字都不是胡話。一個是手碰上去連普通魔導燈都點不亮的「空值」，一個則是手碰上去會把運作中術式直接抹消歸零的「零號」，竟真的在這座被遺忘的地底工坊裡撞在了一起。\n\n「我沒有騙你。」Eraser望著他僵住的神色，默默將右手縮回灰藍袖管，語氣依舊淡得聽不出一絲情緒，「只要碰到術式的起筆處，我就能把它抹消。現在你親眼見到了。如果覺得可怕，通風井的路已經乾了，你可以自己先上去。」\n\n軒人微怔，望著她那副早已習慣、彷彿隨時準備好被人留在原地的清冷模樣，胸口殘留的那點震駭，轉瞬便化為一股說不出的悶痛與怒氣。\n\n「誰說覺得可怕了？我是驚訝妳這麼厲害好嗎！」\n\n軒人忍著右膝抽痛站起身，大步走回長木桌抓起自己的鋁製水壺，倒出涼開水浸濕一塊乾淨方巾，隨即走回她面前，直接從袖口拉出她藏起的右手，放輕手勁替她包覆住發燙的掌心降溫。\n\n微涼濕布貼上肌膚的那一瞬間，Eraser的指尖微微一縮，抬起淡粉色眼眸望進他眼底：「……你不怕嗎？我手裡面不是血管，是導魔迴路。」\n\n「導魔迴路燒紅了也一樣會痛吧？剛才妳的小指都在發抖了。」\n\n軒人替她將方巾四角仔細繫成一個鬆緊適中的活結，確認不會滑落，這才微鬆了口氣，轉身去撿掉在水沿的青銅鍋爐殼，打算帶回去請千歲鑑定這究竟是什麼年頭的舊東西。\n\n然而就在他將鍋爐殼翻轉過來、鯨油燈的昏黃光線落入內壁的剎那，他手上的動作徹底僵住了。\n\n這塊他剛才還以為是舊鐘塔老舊報廢件的青銅殼內側，赫然刻著一道嶄新、連金屬切緣都仍泛著銳利冷光的新鑿痕。\n\n鑿痕旁是一行清晰工整的小字：\n\n**『七號支爐外溢測試・十月十二日』**\n\n十月十二日——僅僅四天前。\n\n一股寒意順著軒人的背脊瞬間攀升。\n\n原來他從一開始就全猜錯了。這塊將暗河巨蟹逼瘋、堵死排水閘的術式殘片，根本不是數百年前舊鐘塔自然脫落的古董，而是四天前有人蓄意從上游暗河投放進來的活體測試件。\n\n暗河下游筆直通向這座鐘樓底座。要是繼續留在這下面，天曉得上頭那些人下一次還會順水沖進來什麼更要命的東西。\n\n軒人不露聲色地將這塊刻著日期的青銅殼收進工具袋最底層，轉過身，仰頭望向圓形工坊正中央那具巨型青銅鐘擺上方的機芯箱。\n\n「Eraser，妳剛才說不准妳離開鐘樓底座的限制結界，刻在什麼地方？」\n\nEraser順著他的目光抬頭，指向鐘擺頂端四公尺高處那座八角形黃銅封匣：「在機芯匣裡面的母板上。怎麼了？」\n\n「妳既然能抹消術式，以前怎麼沒自己爬上去把它抹掉？」\n\n「那是上下連動的機關。」Eraser指向鐘擺基座兩側的兩塊厚重鐵踏板，「必須有人站在地面，雙腳同時踩住這兩塊鐵踏板不放，上方四公尺高處的黃銅匣蓋才會滑開；底下腳一鬆開，蓋子就會立刻合攏。」\n\n她仰望著高懸於陰影裡的黃銅匣，聲音依舊清淡得沒有絲毫波瀾：\n\n「我只有一個人。踩著下面的踏板，手就搆不到四公尺高的橫樑；爬到橫樑上，下面沒人踩踏板，蓋子便打不開。我以前試過搬石頭去壓，但踏板底下裝了防壓彈簧鎖，死石頭壓超過五秒就會被彈回，必須有活人站在下方隨時憑腳力調整重心才行。」\n\n軒人低頭看向兩塊冰冷的鐵踏板，再抬眼望向四公尺高處的黃銅封匣，胸口彷彿忽然被什麼東西輕輕撞了一下。\n\n原來這並不是什麼無法破解的古代高階秘術。\n\n那是一道從設計的那一天起，就篤定「這間地下室永遠只有她孤零零一個人」的雙人連動機關。只要沒有第二個人走進這裡替她踩住底下的踏板，她就算擁有一雙能將一切術式歸零的手，也永遠被困在這四公尺的距離之內。\n\n「那這道鎖今天算是遇上剋星了。」\n\n軒人忍著右肩隱隱傳來的發酸抽痛走回基座旁，將剛剛收回的精鋼鋼索拋過頂端橫樑的滑輪，俐落繫出一個方便攀踩的腳踏繩環。\n\n「這下面的水道已經被外面的人盯上了，繼續留著太危險。妳先順著滑輪爬到橫樑邊等著；我在底下替妳踩穩踏板。蓋子一開，妳就親手把那個留駐印記抹掉——然後我們一起去地面。」\n\nEraser望著垂落在面前的精鋼繩環，明顯怔住了。\n\n「去地面……？可我在地面上沒有戶籍登錄，也沒有錢。」\n\n「真巧，我們『晚鐘亭』二樓剛好空著一間儲物間，店主千歲姊最近總是抱怨我一個人跑外勤忙不過來，正想找個認得舊器物的人幫忙看店呢。」\n\n軒人用靴尖輕輕點了點基座旁的鐵踏板：「快上去吧，踩踏板這種事我最拿手了。」\n\nEraser仰頭望向高處的橫樑，又低頭看了看站在暖黃燈影裡的少年，靜默兩秒，伸出沒受傷的左手牢牢抓緊鋼索，動作輕盈俐落地借滑輪攀上四公尺高的機芯橫樑。\n\n等她在窄台上站穩腳步，下方的軒人深吸一口氣，雙腳穩穩踏上兩側鐵踏板，刻意忽略右膝傳來的細微拉扯感，順著底下彈簧回推的力道靈巧微調重心，將兩塊厚重踏板死死壓到底端。\n\n四公尺高處，封死了整整三百年的八角形黃銅封匣發出一記清脆機括聲，雙側外蓋緩緩滑開，露出裡頭刻著『零號抹消器・定點留駐』的暗紅銅板。\n\n「開了，動手吧！」軒人在底下揚聲道。\n\n橫樑上的Eraser凝視著那塊自己獨處三個世紀都無從觸及的母板，緩緩伸出左手食指，安靜而堅定地按在了頭一筆刻痕上。\n\n啪。\n\n一聲極輕微的脆響。\n\n母板上的暗紅字跡轉瞬褪作冰冷白灰，順著橫樑細細飄落。幾乎在同一時間，圓形工坊四壁上那層維持了三百年的微弱結界光膜，如同碎裂的水泡般無聲消散在潮濕空氣裡。\n\n兩人順著鋼索滑落地面。\n\nEraser走回長木桌旁，將那只剛修好一半的八音盒、還有她平日翻得起毛邊的《白央散步指南》小心裝進軒人借給她的小布袋，提在左手腕間。\n\n在踏上通往通風井的石階前，軒人忽然停下腳步，轉過身看著她，神色少見地凝重而嚴肅。\n\n「對了，Eraser，在上去之前有一件事妳一定要先答應我——等一下爬出通風井到了地面上，除了我們店裡的千歲姊之外，妳絕對不准跟任何外人提妳不是人類，更不准當著外人的面用這雙手抹消術式。」\n\nEraser抱著小布袋，微微偏過頭：「為什麼？」\n\n「因為在地面上，連一塊三百年前的破銅片都能在黑市炒出天價。要是走漏風聲，讓人知道妳是古工坊留下的活體造物、一伸手就能把任何術式歸零，不管是黑市捕奴隊還是白塔上層的研究院，當天夜裡就會派上百名精銳來抓妳，把妳關進鐵籠裡拆解研究。」軒人指了指她右手腕上的濕方巾，「到了外面，不管誰問起，妳就說妳是我從鄉下來投靠的遠房表妹，手腕只是不小心被開水燙傷。聽明白了嗎？」\n\nEraser垂眼凝視了腕間帶著涼意的方巾片刻，靜默兩秒，輕輕點頭：「聽明白了。不跟外人說。」\n\n軒人這才放心下來，提著鯨油燈走在前面，帶著她踏上了通往通風井的石階。\n\n## ６\n\n推開通風井頂端的鐵柵欄爬出地面時，天色正值黃昏。\n\n舊鐘塔遺跡坐落在城外西側的半山腰上。金紅色的夕陽餘暉鋪滿漫山遍野的秋草，遠方河谷底下的階梯城鎮已經點亮成排靠地下支爐管線供能的黃銅魔導街燈，沁涼的山風裹挾著烤麵包的麥香、河水濕氣與草木清香，迎面拂過臉龐。\n\n軒人先把那只裝著銀殼懷錶的棕色牛皮側背包妥善掛回腰側，一回頭，看見Eraser正停在井口石階上，一動不動地望著遠方。\n\n微涼的暮風掀起她長及腰際的淡粉紅色長髮，幾綹柔軟髮絲輕輕掠過白皙臉頰。\n\n她慢慢抬起左手按住被風吹散的長髮，垂眸看向自己踩在山坡泥土與秋草間的鞋尖，試著向前邁出一步，接著緩緩回過頭，安靜凝視著鬆軟泥地上留下的那枚清晰腳印。\n\n沒有結界攔阻，也沒有將意識強制拖回地底的力量。\n\n「怎麼了？山風太冷嗎？」軒人折回兩步問。\n\n「不是。」Eraser鬆開按住長髮的手，目光遠遠落在山腳下燈火漸次亮起的層疊街區，聲音輕得像融在晚風裡，「從前在下面，只有天井飄落葉進來時，才知道外頭已經是秋天了。這是我第一次從外面看見鐘塔的屋頂。」\n\n偏偏就在這個安靜的瞬間，一聲清晰的「咕嚕」從她腹間傳了出來。\n\nEraser依舊維持著遠眺城鎮的姿態，微微一頓，這才低頭瞄了一眼自己的肚子，白淨臉上浮現一抹極其認真的困惑：「……剛才在下面明明不餓的。」\n\n「一口氣爬了三十公尺高的直立鐵梯，不餓才奇怪吧。」\n\n軒人忍不住失笑出聲，從工具袋的乾糧格裡摸出一包油紙包著的蜂蜜核桃餅——那是今早出門前千歲塞給他防餓的點心，還剩了大半包。\n\n他剝開油紙遞過去：「先拿這個墊墊胃。等一下下山把側背包還給委託人、領了那四枚銅幣，順路去巷口買兩個油紙包著的熱餡餅帶回去。」\n\nEraser接過那塊綴滿碎核桃與蜂蜜糖霜的圓餅，先謹慎地在邊緣咬了一小口。\n\n酥脆溫潤的香甜在舌尖化開，她淡粉色的眼眸微微睜大了一點，隨即垂下視線，第二口便毫不客氣地直接咬在了蜂蜜刷得最厚實的地方。\n\n軒人假裝什麼都沒看見，轉過身替她撥開山道旁橫生擋路的秋日蘆葦。\n\n「走吧，石階沾了晚露有點滑，跟緊我。回到『晚鐘亭』之後，得先讓千歲姊替妳把右手掌心的熱痕敷層藥才行。」\n\n「那個，睡一晚自己就會退了。」\n\n「在我們店裡，手痛就得乖乖擦藥，這一點沒得商量。」\n\n金紅夕陽將一高一矮兩道身影拉得細長，斜斜映在蜿蜒下山的石階上。少女懷裡妥善護著裝書與八音盒的小布袋，安靜小口嚼著甜餅，一步一步跟在提著鯨油燈的少年身後，走進了山腳下溫暖明亮的城鎮燈火裡。\n\n——第一章完——\n", "mtime": 1795001755.4659019}, {"filename": "02_第二章_兩個人的房租與第一份工錢.md", "content": "# 第二章　兩個人的房租與第一份工錢\n\n## １\n\n下山的路比爬上來時輕鬆得多。\n\n兩人穿過城外西側的石拱橋，踏進下層街區「灰鐵巷」時，天色已經徹底暗沉下來。街道兩側靠地下支爐管線供能的黃銅魔導路燈一盞接一盞亮起，將被晚露潤濕的青石板路面映成一片柔和的暖黃。\n\n軒人先帶著Eraser，拐進巷口那間冒險者平時常聚會的「銅壺酒館」。\n\n昨天遺失側背包的年輕冒險者正趴在靠門木桌邊連連嘆氣，一見到軒人從帆布袋裡掏出那只擦得乾乾淨淨的棕色牛皮側背包，差點連人帶木凳一起翻倒。他急忙掀開包蓋從頭翻點了一遍，確認家傳銀殼懷錶與裡頭的三枚銀幣一枚都沒少，激動得連聲道謝，除了原本談妥的四枚銅幣委託費，還爽快地多塞了兩枚銅幣當作額外謝禮。\n\n推開酒館厚重的木門走出來，軒人掂了掂掌心六枚沉甸甸的銅幣，眼角彎起一抹笑意。\n\n他轉過頭，望向安靜站在屋簷下等他的少女。\n\n從剛才跨過石拱橋踏進灰鐵巷開始，Eraser的視線就幾乎沒有停歇過。酒館門額懸掛的褪色鹿角木牌、對街鐵匠鋪裡不時濺出門檻的灼亮打鐵火星，甚至路邊推著手推車賣熱騰騰炭烤栗子的小販掀開爐蓋時，驟然竄出的白霧與焦甜香氣——這條街上的每一幕日常風景，都能讓她停下腳步多看上好幾秒。\n\n「拿著。」\n\n軒人轉到隔壁的熱餡餅攤前，花掉兩枚銅幣買了兩個剛出爐的洋蔥牛肉餡餅，將剩下的四枚銅幣妥善收進外套口袋，再把其中一個滾燙的油紙袋遞到她面前。\n\n「剛才在山上吃的那幾口甜餅頂多算點心，這個油紙包著的熱餡餅才墊胃。」\n\nEraser垂眸打量著油紙袋裡烤得金黃酥脆、邊緣還微微冒著熱氣的餡餅，用沒纏布的左手接了過來。這回她沒再多問裡頭摻沒摻奇怪的溶劑，湊近吹散兩口熱氣，便小口而認真地咬了起來。\n\n繞過兩條扯滿晾衣繩的窄巷，前方轉角處亮起一扇透著橘黃暖光的玻璃櫥窗。\n\n店門上方釘著一塊邊緣微有掉漆的老橡木招牌，中央刻著一口小鐘與一把開口扳手，旁邊是三個深雕的工整字體：**『晚鐘亭』**。\n\n軒人停在門階前，右手才剛碰上冰涼的黃銅門把又縮了回來，回頭看了一眼身後的Eraser。\n\n「怎麼了？」Eraser嚥下最後一口餡餅，將沾了些許油漬的油紙袋折成工整方塊收進衣袋。\n\n「我在盤算，進門後先交代哪一件事，比較不會被千歲姊唸到半夜。」\n\n「刀尖崩了口的短刀、耗光的三顆靴跟氣罐，還是多帶了一個人回來？」\n\n「……妳其實用不著幫我算得這麼齊全。」\n\n軒人腦中才剛打好腹稿，店門已經「喀啦」一聲從裡頭猛然拉開。\n\n一根尾端包覆著防滑厚革的鐵木手杖率先探出來，不輕不重地敲在軒人的右靴靴尖上。\n\n「杵在門外竊竊私語幹什麼？叫你去二層撈一只側背包，撈到太陽下山才看見人影，我還以為你掉進陷阱坑裡打算跟毒蠍作伴了。」\n\n店主千歲站在門框內側。她三十出頭，深栗色長髮以一根磨得發亮的鐵簪俐落挽在腦後，粗布圍裙前袋插滿各式螺絲起子與細長鑷子；她左手提著一把拆解到一半的二手魔導門鎖，右手穩穩拄著那根鐵木手杖——左側深色長裙的下擺垂落得微空，缺了左腿的她站姿卻依然筆直俐落，看不出半分遲滯。\n\n軒人乾笑兩聲，往側面讓開半步。\n\n「路上撞見二層主樓梯整個塌了，繞舊通風井才爬出來。千歲姊，這位是Eraser，我在鐘樓底座下面遇見的——多虧她幫忙，我才能活著回到地面。」\n\n千歲的目光越過軒人肩頭，緩緩落到門階下的淡粉紅髮少女身上。\n\n她的視線先是在少女那襲三百年前古工坊制式的灰藍色舊工作服上微微一凝，緊接著掠過領口正中央那枚右下角花瓣缺了一小角的銀色五瓣花胸扣，最後定格在少女裹著濕方巾的右手上。\n\n門口的空氣安靜了整整兩拍。\n\n千歲並沒有大驚小怪地當街盤問，只是不動聲色地側開身，將左手那把拆了一半的魔導門鎖直接塞進軒人懷裡。\n\n「拿著。堵在門口吹冷風像什麼樣子，還不快請客人進屋。」\n\nEraser望了千歲一眼，又轉看朝她輕輕點頭的軒人，這才邁步跨過木質門檻。\n\n晚鐘亭的一樓店面不大，卻整理得井然有序。灰鐵巷的居民買不起上層區昂貴的新品，家家戶戶日常使用的，大多是從上層淘汰下來的二手老舊魔導家電。靠街的左半邊立著三排厚實木架，整齊排滿修繕妥當的魔導發熱壺、魔導計時鐘、魔導門鎖與舊式鯨油提燈；右半邊橫擺著一張寬厚橡木工作檯，牆面掛板依尺寸整齊排列著扳手、平口鉗與銅量規，桌角還擺著一支千歲特地替軒人製作的「夾著碎魔石的試電銅筆」——一般魔導技師修東西，都是直接靠手指注入微弱魔力查探內部迴路，唯獨體內是「空值」的軒人手指碰上去毫無反應，平時檢修這些老舊魔導器，全憑耳朵細聽齒輪簧片聲，以及拿那支夾著碎魔石的試電銅筆去觸碰感應點。最裡側的爐灶上正溫著一鍋蔬菜燉肉湯，陶蓋被翻滾的熱氣頂得噗噗輕跳，整間店裡瀰漫著胡椒與焦糖洋蔥的暖香。\n\n千歲拄杖拉開一張高腳木凳坐定，順手把圍裙袋裡尖銳容易劃傷人的尖嘴鉗抽出來放到工作檯遠角。\n\n「我是千歲，這間修繕店的店主。」她望著桌邊站得筆直的少女，嗓音沉穩而俐落，「聽軒人說，妳的手在遺跡底下受傷了。我想解開方巾檢查看看妳的右手，但如果妳不願意，我絕不碰妳。」\n\nEraser微微一怔，下意識轉過頭看向正在卸帆布工具袋的軒人。\n\n「放心吧，千歲姊的手穩得很，比我可靠多了。」軒人一邊將工具袋靠牆放好，一邊朝她溫和一笑。\n\n「我問的是她本人，你少替人家回答。」千歲輕瞪了軒人一眼，視線隨即轉回Eraser臉上，靜靜等候她的答覆。\n\nEraser低頭看著自己纏著濕方巾的右手，將提在左腕間的小布袋輕輕放上旁邊木椅，這才伸出右手，平穩地擱在鋪著軟皮墊的橡木工作檯上。\n\n「請看吧。」她說。\n\n## ２\n\n千歲旋亮工作檯上的銅座油燈，從胸袋取出一具做工極為精密的黃銅單眼放大鏡扣上左眼，指腹極輕緩地解開那塊早已被體溫烘得半乾的棉布方巾。\n\n這套手法乾淨得挑不出半點多餘動作。她沒急著直接觸碰皮表紅痕，反而拉開工作檯上層襯著深色絨布的暗抽屜，以銀鑷子夾出一片薄如蟬翼的感溫銀箔——那是白塔上層工坊高階技師專用的精密檢片，尋常下層街區的小店連買都買不到——指腕穩得像拿尺量過一般，將銀箔輕輕貼上Eraser腕內那道暗紅熱痕旁邊。\n\n起初她大概也只當這是尋常的高溫燙傷。\n\n然而下一秒，感溫銀箔表面浮現出的並不是人類體溫暈散開的紅斑，而是一整排精密到近乎非人、唯有三百年前古工坊核心造物才會刻下的銀白幾何導流迴路。\n\n噹啷。\n\n千歲左手指間的銀鑷子直接脫手，清脆地摔在橡木工作檯上。\n\n這位平時就算半屋子待修魔導具同時走火都連眉頭都不曾皺一下的女店主，盯著那片微微發亮的銀箔整整僵住三秒，隨即猛然抬起頭看向軒人。\n\n「去把前門門栓插上，窗簾全部拉緊。」\n\n軒人立刻快步落栓拉簾，確認外頭黃銅魔導街燈的光透不進半絲縫隙才折回桌邊，壓低聲音將方才在舊鐘塔地底遭遇異變巨蟹、以及親眼見到她短短一秒便將三百度高溫術式核心抹成冰冷白灰的經過，一字不漏地講了一遍，同時伸手進工具袋最底層，把那塊從巨蟹背甲拆下的青銅鍋爐殼掏出來放到桌角。\n\n他伸手往後掏重物時，震傷的右肩不自覺地僵了一下。\n\n千歲聽完後，緩緩摘下黃銅單眼放大鏡擱在桌面，長長吸進一口冷氣，重新端詳坐在對面木凳上的淡粉紅髮少女，嗓音壓得極低。\n\n「早年我在白塔上層工坊任職時，曾經被編進古工坊殘卷的封存與修復研究組。」千歲的目光緊鎖著少女手腕皮下細微流轉的銀光，指尖無意識地收緊，「殘卷裡記載的導魔紋路與『古銀絲』工藝，就是妳手裡這一套。當年我在密卷邊頁也曾讀過零星紀錄——說三百年前古工坊毀滅前夕，曾造出一件擁有自我意識、能徒手將運作中術式歸零的『零號』活體抹消器。可就連白塔研究院那些資深學者都一口咬定那是舊時代工匠誇大其詞的神話，或是早在大火裡熔成廢鐵的死物……」\n\n千歲望進Eraser那雙沉靜清澈的淡粉眼眸，好半天才將心底翻湧的震撼強壓下去。\n\n「難怪你這傢伙剛進門時神情那麼緊繃。幸好你們一路回來沒在街上露出破綻。這孩子的這隻手要是被白塔本塔那群瘋狂的研究員撞見，整座白央城今晚就得翻天覆地了。」\n\n她彎腰拾起掉在桌角的銀鑷子，收斂起震驚神色，指尖力道比剛才更加輕柔，仔細確認過那幾條泛著熱紅的古銀絲迴路，才從抽屜最深處取出一個散發清冽薄荷冷香的小錫盒，用細木片挑起一層銀白藥膏，均勻敷在少女腕內。\n\n「妳這隻手裡的迴路細得比蠶絲還要嬌貴，設計出來本就不是讓妳直接貼著三百度鐵殼硬扛的。今晚這隻手不准再動用能力，重物也一概別提。我用軟布替妳纏妥，外人問起就說燙傷。半夜如果哪裡發麻刺痛，隨時叫醒我。」\n\n清涼潤澤的藥膏貼上肌膚，腕骨深處殘留的那絲緊繃燥意頃刻散去了大半。\n\nEraser試著輕輕屈伸五指，看著千歲熟練替她在腕側打上一個不礙事的平結，低聲道：\n\n「從前下來檢查的人說，這種程度的紅痕不用管，自己就會退。」\n\n「不管當然會退，可暗傷日積月累，哪天碰上高負荷就會整條崩裂。」千歲合上小錫盒，隨手用鐵木手杖朝旁邊矮凳輕敲了兩記，目光落在軒人磨破滲血的右邊褲管與方才掏袋子時微僵的右肩上，「連鐵扳手用完都知道要擦乾上油，自己的手反倒不當一回事嗎？還有你，軒人，剛才掏工具袋時右肩都在抖了，右膝的褲管也蹭破了一塊——坐過來，把褲管捲上來，領口拉開一點給我看看。」\n\n軒人乖乖坐上矮凳，齜著牙任由千歲替他清洗右膝磕破的血痂，又按開震傷發腫的右肩敷上消腫止痛藥膏。\n\n「右膝和右肩這兩天別逞強硬扛重物，拉傷了筋可夠你受的。待會兒上二樓收拾儲物間，真有搬不動的重箱子，就墊在厚帆布上拖到樓梯口，明天早上再找隔壁鐵匠鋪的學徒幫忙搬下來，聽見沒有？」千歲手下俐落地纏好紗布，這才拿起桌角那塊青銅殘片，重新架起放大鏡細看內壁上那行『七號支爐外溢測試・十月十二日』的嶄新鑿痕，眉心越鎖越緊。\n\n「果然是第七分塔那些傢伙在背地裡動的手腳。」\n\n千歲擱下銅片，指節在橡木桌面上沉沉敲了兩下。\n\n「舊鐘塔遺跡底下的暗河，上游直連白塔城內分部的『七號支爐』。按照規定，支爐燒剩的廢渣和殘留術式全該封存進地底排渣池，這塊銅片卻是有人蓄意從排渣口放進暗河，想試探帶著活術式的爐渣漂流下去究竟會鬧出什麼狀況。」\n\n軒人眉頭擰緊：「他們往暗河裡丟這種危險東西做什麼？那條暗河雖然流往舊鐘塔，但支脈也滲進我們灰鐵巷底下的地下水層啊。」\n\n「最近幫第七分塔送五金件的鐵匠鋪師傅來店裡修風箱時，跟我提過這件事。」千歲從鼻息間發出一聲冰冷的嗤笑，「說分塔上頭剛調來一名新總管，姓榊原。七號支爐的排渣池早就逼近滿載，規規矩矩向中央本塔申請專用中和劑來清理，一趟得花掉大筆銀幣。那位新上任的總管多半想省下預算向上頭邀功，動起歪腦筋想把廢棄的舊暗渠當免費排污溝用了。」\n\n說完，她抬起視線，平靜地望向桌邊的Eraser。\n\n「要是舊鐘塔底下的水道今後動不動就湧進這類危險廢料，妳原本棲身的那間地下工坊遲早會變成魔物巢穴。妳接下來有什麼打算？」\n\nEraser雙手端端正正置於膝頭，偏眸看了一眼木椅上裝著八音盒與舊書的小布袋。\n\n「定點留駐的印記已經抹掉了，不必再回鐘樓底下。」她誠實地回答，「但我在地面上沒有去處。」\n\n千歲拉開工作檯底層抽屜，取出兩把繫著小木牌的備用黃銅鑰匙，將其中一把推到Eraser面前。\n\n「二樓走廊最裡面有間空房，平時堆些不常動的老木料。窗戶能推開透氣，門也能從裡面反鎖。一週房租算妳兩枚銀幣，包含早晚兩餐。今晚天色已晚，妳先住下來，房租先記在帳上。」\n\n軒人下意識開口，手也往外套口袋裡的錢袋探去，正想說「她的房租從我工錢裡扣就好」——話還沒出口，千歲手裡那根鐵木手杖便先一步不輕不重敲在他鞋背上。\n\n軒人立刻乖乖把嘴閉緊。\n\nEraser垂眸凝視著桌面上那把泛著柔光的黃銅鑰匙，並未貿然伸手：「我現在沒有錢。你們店裡，有我能做的工作嗎？」\n\n「有。」千歲直視她的淡粉色眼眸，口吻乾脆明快，「但帳目必須先講清楚——住進店裡，不代表妳把自己賣給了晚鐘亭。妳平時幫我看店、協助辨認附近居民送修的舊器具上沾沒沾到殘留術式，或是搭檔軒人跑外勤，酬勞一律按件分帳。做多少工作就領多少工錢，跟房租各算各的。明天妳先跟著軒人去接一單尋常的街區委託，覺得合得來，回來再決定要不要長住。這條件可以嗎？」\n\nEraser注視著千歲那雙毫無施捨意味的澄澈眼睛，又垂眸看回桌面那把專屬於自己的房間鑰匙。\n\n停頓了兩秒，她伸出左手，將黃銅鑰匙安靜握進掌心裡。\n\n「我想試試看。」她說。\n\n「那就這麼說定了。軒人，盛湯吃晚餐，吃飽了帶新員工上樓把二樓那間房騰出來。」\n\n## ３\n\n晚餐是熱氣騰騰的馬鈴薯燉肉湯，配著烤得外皮微脆的黑麥麵包。\n\n考量到Eraser右手纏著軟布敷藥，千歲特地替她換了一柄握桿粗圓的木匙。Eraser用左手舀湯起初略顯生疏，頭一勺滾燙的馬鈴薯骨碌滾回碗裡，第二勺放慢腕勁，總算穩穩送進了口中。\n\n收拾完碗筷後，軒人提著鯨油燈，領她踏上微微吱呀作響的木樓梯，清理二樓走廊盡頭那間儲物房。\n\n晚鐘亭裡修不好的舊器物向來分作三類：一樓木架擺著的是還沒排上工期的，牆角堆著的是客人嫌報價太高乾脆不要的，而塞滿二樓儲物間的，全都是軒人這些年從各處撿回來、連千歲都懶得承認還有救的破銅爛鐵。\n\n「這個要留嗎？」\n\nEraser立在房間中央，左手提起一盞只剩半截銅座的壓癟提燈。\n\n「留，配個新玻璃罩又能點了。」軒人坐在門檻邊的矮凳上，正把散落滿地的螺絲依粗細分進木格盒，頭也沒抬地指揮。\n\n她將殘破提燈挪出走廊，又用鞋尖輕輕點了點腳邊一只鏽得發紅的鐵皮方盒：「這個呢？」\n\n「也留，裡面的齒輪還沒壞。」\n\n「裡面沒有齒輪，是空的。」\n\n「……那鐵殼留著拿來裝釘子也挺不錯的嘛。」\n\nEraser安靜轉過臉，目光掃過已經被搬出去的雜物堵到只剩一條窄縫的二樓走廊。\n\n「那我今晚要睡哪裡？」\n\n「把靠窗那兩大箱廢銅片搬出去，就騰得出放單人床墊的空位了。」\n\n「搬到哪裡去？」\n\n軒人望向走廊，Eraser也跟著望向走廊。\n\n「……後院雨棚底下。」軒人徹底投降，站起身想去抱那箱最沉重的舊銅片，卻被Eraser橫過左手攔了一步。\n\n「千歲師傅剛才在樓下交代過，你的右膝和右肩今晚不能硬扛重物，要把箱子墊在厚帆布上拖到樓梯口，明天早上再找隔壁鐵匠鋪的學徒幫忙搬下去。」\n\n她整理雜物的章法比軒人想像中熟練得多。高木盒抵實牆角，沉重的生鐵件壓在最底層，帶著尖銳捲口的銅片一律將利邊朝內靠牆。每堆妥一列，她還會貼著牆邊留出剛好夠一人轉身的通道。\n\n「妳從前在鐘樓底下也常這樣歸置東西嗎？」軒人蹲著幫她扯緊厚帆布的一角，隨口問道。\n\n「上層水道和通風井漏下來的雜物，全都會掉進我那間工坊。」Eraser將最後一只空鐵盒端正疊上箱頂，「鐵鍬跟礦燈最多，偶爾也會掉手套。早年有個在上面修水渠的工人，一連三個禮拜從同一個通風口掉下同一隻右手皮手套。每次我把手套擺上通風井底的石台，隔天他垂鐵鉤釣上去，過幾天又會掉下來。」\n\n軒人聽得忍不住笑出聲：「那位工人先生的手也滑得太離譜了吧？後來呢？」\n\n「第三次掉下來時，我找了根細麻繩，在手套腕口打了個可以套上自己手腕的防掉圈。」Eraser神色平靜地說，「從那之後，那隻手套就再也沒有掉下來過。」\n\n「還真管用呢。」\n\n「也許只是他換去別條水渠掉手套了。」\n\n她說得一本正經，軒人卻笑得差點被口水嗆著。\n\n不出半小時，原本塞滿雜物的儲物間便清出了大半片敞亮空地。靠窗牆邊架好一張鋪了乾淨亞麻床單的單人木床，床頭配著一張舊木方桌；推開木窗，灰鐵巷高低錯落的深灰石板屋頂盡收眼底，更遠處的高架引水橋上點綴著成排暖亮的橘黃燈火。\n\nEraser走到窗沿前，將木窗扇向外推開到底，安靜吹了一會兒帶著微涼夜露氣息的晚風，接著拉回半扇，伸手試了試內側的黃銅防風窗鉤。\n\n「對街的黃銅魔導路燈靠地下支爐管線供能，整夜都不會熄滅，會不會太亮睡不著？」軒人站在房門邊問。\n\n「不會，這樣剛剛好。」\n\n她轉身回到小方桌旁，將那只修好一半的八音盒和那本磨損起毛邊的《白央散步指南》從小布袋裡取出來，並排擺放得平平穩穩。\n\n隨後她想抬手解開腦後已經鬆散半截的髮帶重新束起，無奈右手纏著軟布不便使勁，單靠左手扯了兩下，那條黑色舊緞帶反倒順勢滑落肩頭。\n\n正準備捧走最後一箱小零件的軒人見狀，隨手從箱頂摸出一只全新未拆封的木製晾衣夾，輕輕擱在她的桌角。\n\nEraser垂眸端詳著那只小巧的木夾：「這是拿來夾衣服的。」\n\n「暫時也能拿來夾頭髮，總比散下來擋住視線好。」\n\n她捏起木夾，試著用左手將滑落頰邊的一綹淡粉紅色長髮別到耳後。沒對著鏡子拿捏角度，木夾別得略微歪斜，遠看活像被晚風吹過後不小心沾在髮絲間的一片小木屑。\n\n「很奇怪嗎？」她微微偏頭問軒人。\n\n軒人上下掃了一眼，努力憋住嘴角笑意點頭：「比剛才俐落多了。洗臉盆在走廊盡頭，洗完就早點休息吧。我就住隔壁，半夜有事敲牆就行。」\n\n他抱起零件箱邁出走廊，剛轉步走向自己房門，背後卻傳來門內黃銅插銷推過去又拔回來的「喀噠、喀噠」輕響。\n\n「別一直撥那個插銷，它年紀也不小了。」軒人忍俊不禁地回過頭。\n\n木門旋開一道窄縫。Eraser左手攥著那把繫了小木牌的房間鑰匙，站在昏暖的門縫裡靜靜望他。\n\n「我今晚，真的沒有別的工作要做了嗎？」\n\n「沒了。早餐是早上八點，睡過頭就只能啃冷麵包。」\n\n「一直睡到八點也可以嗎？」\n\n「妳要是半夜三點爬起來掃後院，我才要提出抗議。」\n\n她垂下眼望著掌中鑰匙，停頓了半拍，再次抬眸問道：\n\n「還有，剛才在樓下，千歲師傅說房租是兩枚銀幣的時候，你為什麼把手伸進口袋裡？」\n\n軒人抱著零件箱的雙臂微微一頓：「妳看見了？」\n\n「你的錢袋繩頭露出來了。你當時想替我付房租。」\n\n軒人低頭瞄見自己外套口袋邊緣果真垂出半截麻繩頭，耳根微微發熱，有些尷尬地拿肩頭蹭了蹭臉頰。\n\n「我只是怕妳剛上地面身上半枚硬幣都沒有，心裡背著欠帳會覺得不踏實……」\n\n話才說到一半，他自己先卡住了。\n\n他想起千歲在樓下敲他靴尖時那道沉靜透徹的眼神，又想起剛才眼前這名少女接過鑰匙前第一句便認真問出口的「有我能做的工作嗎」。她想要的，從來就不是旁人的白白施捨。\n\n軒人把後頭多餘的解釋嚥了回去，抓了抓後頸改口道：「抱歉，是我多管閒事了。千歲姊說得沒錯，明天出門跑外勤，妳自己賺的工錢就夠交房租了。」\n\nEraser站在門內，左手靜靜攥實那把繫著木牌的黃銅鑰匙，望向走廊微光下的少年。\n\n「今天在遺跡底下，謝謝你替我踩住踏板。」\n\n「都說了是借路逃生的回禮啦。晚安，Eraser。」\n\n「晚安。」\n\n軒人退回隔壁房門前時，聽見身後那扇木門輕輕合攏，裡頭的黃銅插銷穩穩落扣，「喀噠」一聲鎖了起來。\n\n## ４\n\n翌日清晨，灰鐵巷在清脆的馬車銅鈴與早市的鮮活喧鬧聲裡甦醒過來。\n\n早起時千歲仔細檢查過Eraser的右手，確認皮下暗紅紋路已經褪去大半，便撤掉了厚重的軟布，改換上一圈透氣輕薄的護腕，仍反覆叮囑她今天就算不疼，也只准動用左手處理低負荷的小事。\n\n吃過早餐，軒人接過千歲遞來的第一張外勤委託單。\n\n委託單是兩條街外「河岸染布坊」的老闆娘一大早託人送來的：店裡二樓露台那台靠手指按壓感應盤啟動的「魔導烘布滾筒」從昨天傍晚起突然失控暴走，外層感應盤徹底失靈，不管老闆娘怎麼按停機感應紋、甚至將一樓的魔力供能總閥死命擰緊到底也停不下來，把客人急著取貨的幾匹上等靛藍棉布全捲上半空瘋狂甩動，盼望中午前能有人上門搶修，酬勞四枚銀幣。\n\n軒人替自己的氣瓶靴裝上三顆剛充飽的全新靴跟氣罐，仔細確認過扣鎖，背起帆布工具袋推門等待Eraser。\n\nEraser將房間鑰匙與千歲借給她的半截粗桿鉛筆妥善收進衣袋，走到門檻邊，伸手輕輕碰了碰耳後依舊別在髮間的那只木製晾衣夾。\n\n「可以出發了。」\n\n「那個木夾，妳今天也打算別著出門？」軒人挑眉問道。\n\n「頭髮沒有散。」她答得理所當然。\n\n軒人忍不住失笑，順手替她拉開了店門。\n\n＊　　　＊　　　＊\n\n河岸染布坊門外早已圍了一群伸長脖子張望的鄰居與路人。\n\n二樓石砌露台上，原本仰賴手指輕觸感應盤便能勻速帶動「魔導烘布滾筒」烘乾棉布的鋼鐵框架，此刻正發出刺耳劇烈的「匡噹」狂響。驅動輪箱縫隙裡猛冒滾燙白氣，側面那塊黃銅感應盤上的紋路燒得赤紅刺眼，連帶著整根傳動軸與上方四根鐵製晾布長桿失控狂旋，每隔幾拍便貼著眾人頭頂呼嘯橫掃而過；幾匹浸染飽滿的上等靛藍長布被甩得像飽受強風的巨帆，布匹邊緣竟詭異地透出一層極不尋常的暗紅微光。\n\n染布坊老闆娘正站在一架靠牆木梯上，雙手死握長竹竿，焦急地試圖把捲在鐵桿前頭的昂貴棉布鉤下來。\n\n「老闆娘，別硬扯了，快點從梯子上下來！」\n\n軒人一眼掃見二樓露台邊緣固定鐵架的兩顆地腳螺栓已經震脫半截，當場拔高嗓音喊道。\n\n老闆娘低頭一看腳邊磚沿早已鬆動掉灰，臉色頓時發白，連忙丟開竹竿貼牆滑下木梯，急忙迎向軒人與Eraser。\n\n「軒人，你們總算來了。這台魔導烘布滾筒前天還好端端的，手指輕碰一下感應盤就能順暢調速。可從昨天傍晚西邊河道水閘那頭傳來一陣悶水聲開始，地底下的供能管壓就詭異得不得了。輪箱側面的感應盤整個失靈，我怎麼按壓停機感應紋都沒反應，把一樓的供能總閥死命轉到底了，樓上的魔導烘布滾筒跟晾布桿還是發瘋似的狂轉，眼看整個架子都要掀翻了。」\n\n「昨天傍晚水閘響過之後才開始的？」\n\n軒人與身旁的Eraser交換了一道敏銳的眼神。\n\n他沒有急著衝上二樓露台，而是先請老闆娘守在前門勸離圍觀的群眾，自己帶著Eraser繞去染布坊一樓臨河的陰濕後牆。他抽出昨天崩了一小口刀尖的扁頭拆件短刀，反握刀柄沿牆根青磚逐塊輕敲。\n\n敲到第七塊青磚時，牆體深處傳來一聲發空的悶響，灰漿縫隙裡正絲絲縷縷透出熟悉的硫磺與灼熱鐵鏽氣味。\n\nEraser先確認狹巷兩端沒有路人經過，這才蹲下身，將左手食指懸在磚縫幾公分外凝神感應了兩秒，低聲告訴軒人：\n\n「這面牆後面藏了別的管線。不是染布坊自己的供能管，裡頭漏出來的，是跟昨天那塊鍋爐殘片一模一樣的『支爐廢火』。」\n\n軒人將拆件短刀的扁口插進牆腳一塊鬆動排水磚的縫隙，俐落撬開半塊青磚往裡細看。\n\n只看了一眼，整件事的原委便清晰無比地浮現眼前。\n\n緊貼著染布坊原本往二樓輸送熱能的魔力供能立管旁邊，不知何時竟被白塔工程部私下緊挨著加埋了一根粗碩的支爐黃銅排渣暗管。大概是支爐壓力驟增，黃銅排渣管接口硬生生崩開了一道斜裂口——狂暴且裹挾著殘留術式的支爐廢火順裂口瘋狂外洩，直接灌進了緊鄰的染布坊魔力供能立管內部，一路直衝二樓魔導烘布滾筒的驅動輪箱，導致外層感應盤徹底失靈，催動得整根傳動軸、魔導烘布滾筒與四根晾布桿宛如受了狂鞭般徹底暴走，難怪老闆娘怎麼按停機感應紋或關死一樓總閥都毫無作用。\n\n就在這一瞬間，頭頂二樓露台猛然炸開一聲刺耳的「崩」響。\n\n左前側那顆早已鬆動的地腳螺栓應聲飛脫。整座掛滿濕重布匹、重達數百公斤的鋼鐵烘布架朝街道方向硬生生傾斜了三十度，連帶半堵石欄磚縫齊裂，眼看便要朝對街麵包店轟然砸落。\n\n「街上所有人都快退到巷口外頭去！」\n\n軒人轉身奔出前門，高聲催促老闆娘與圍觀的鄰居們一律退至三十步外的街角安全線，隨即壓低聲音對跟在身側的Eraser交代：\n\n「我先上二樓拉正鐵架、卡死傳動齒輪，再拉下那幾匹藍棉布擋住街角的視線，妳聽我喊再上來抹掉裡頭那縷廢火。」\n\n「好。」Eraser乾脆俐落地點頭。\n\n軒人從帆布袋抽出精鋼鉤索與滑輪組，三兩下將主繩尾端牢牢纏死在一樓後牆的實心石柱上，右腳微錯半步，靴跟清脆磕響氣瓶靴的第一顆氣罐踏扣。\n\n嗤——\n\n高壓氣流貼著石板地面驟然炸開。猛烈推力托著他沿染布坊側牆斜躍而上，足尖在二樓窗沿輕巧一借力，人已穩穩翻進白霧翻湧的二樓露台。\n\n炙熱氣浪迎面如牆壓下。四根鐵製晾布長桿拖著沉重藍布，宛如四條失控的鐵鞭貼著頭皮呼呼狂掃。\n\n軒人矮身伏低，貼地鑽過橫掠而過的鐵桿陰影，左手俐落地甩出精鋼飛爪——「喀」地一聲牢牢咬實傾斜鐵架的頂端橫樑。雙靴抵實露台內側石欄，雙臂青筋直繃，借著滑輪組的省力構造死命後仰一拽。\n\n嘎吱——\n\n精鋼繩索繃得嗡嗡顫鳴。數百公斤重的傾斜鋼鐵框架被硬生生從半空中扯回正位，金屬底座「砰」地重落回露台石板。軒人動作毫不停頓，左手從腰袋抓出兩枚備用長螺栓塞進底座螺孔，舉起短刀刀背猛砸到底迅速擰緊；緊接著摸出一枚硬木楔子，趁飛轉齒輪閃出半指空隙的剎那，精準無誤地狠狠打進驅動輪箱側面的齒輪咬合縫中。\n\n咯吱——喀。\n\n堅硬的橡木楔子死死卡進鋼齒。整根狂飆的傳動軸發出一聲沉悶頓震，連帶四根瘋狂甩動的鐵製晾布桿徹底鎖停在半空。\n\n傳動軸被強行鎖死的那一瞬間，驅動輪箱正中央那面滾燙的圓形檢修蓋「啪」地彈開，露出了順著魔力供能立管倒灌上來、此刻正死死纏繞於傳動軸心劇烈躍動的一縷暗紅廢火。\n\n軒人順勢一把拉過旁邊垂落的兩匹寬幅靛藍棉布，拉滿整面露台石欄，宛如掛起兩幅厚實不透光的深藍布幕，將樓下街角望過來的視線遮擋得一絲不漏，這才朝二樓樓梯口急促招手。\n\n「視線擋好了，上來吧。」\n\n早已候在樓梯轉角的Eraser快步踏上露台。\n\n鐵架穩鎖，深藍布幕高懸，從三十步外的街角往上看，只看得見修繕學徒蹲在輪箱前揚灑石灰粉的模糊背影。Eraser來到滾燙輪箱前，牢記千歲早晨的叮囑絕不動用右手，沉靜地伸出左手食指，輕輕點在纏繞於傳動軸上的那縷暗紅廢火起筆處。\n\n滋。\n\n微不可察的一線冷白光芒在深藍布幕後方一閃即逝。\n\n死纏著傳動軸的暗紅殘留術式眨眼散作細碎白灰。軒人極具默契地抓起一大把普通白石灰粉撒進輪箱蓋口充作障眼法，白粉遇熱騰起一團清淡白煙，整座魔導烘布滾筒隨即吐出一聲長長的洩壓嘆息，外層感應盤上的赤紅亂光應聲褪盡，徹底安靜了下來。\n\n## ５\n\n回到一樓後牆根，軒人又從工具袋拆出隨身攜帶的耐高溫石棉布與重型鐵箍，將白塔那根裂開斜口的黃銅排渣暗管嚴嚴實實裹緊封死，與染布坊的魔力供能立管徹底隔開，確保廢火再也沒有縫隙可鑽。\n\n染布坊老闆娘上樓檢查過那幾匹完好無缺的上等靛藍棉布，頓時露出如釋重負的笑容，一回到樓下便爽快地數出四枚亮燦燦的銀幣塞進軒人手裡。臨送兩人出門時，她眼尖瞥見Eraser耳後依然別著那只顯眼的小木晾衣夾，不由得柔和地笑起來，轉身從櫃檯旁的樣品籃裡翻出一條剛染好的深海藍色細棉布髮帶，塞進少女手心。\n\n「剛才看妳在牆邊幫忙聽管線、在樓上遞工具，動作俐落得很呢。這條深海藍的細棉布帶是店裡新染的上等邊角料，就當謝禮拿去紮頭髮吧，總比夾個晾衣夾合適多了。」\n\nEraser垂眼輕輕撫摸掌心柔軟潔淨的深藍棉布帶，微微怔住兩秒，這才抬手取下耳後的木製晾衣夾規矩地交還給軒人，轉向老闆娘認真彎起眼角：「謝謝您。」\n\n離開染布坊拐過街角，軒人停下腳步，攤開掌心，將剛剛到手的四枚銀幣乾脆俐落地分出兩枚，放進Eraser手裡。\n\n「拿好，這是妳的第一份工錢。」\n\nEraser望著掌中兩枚沉甸甸的銀幣，略帶猶豫地抬眼：「你又是爬外牆又是拉滑輪、卡齒輪，我只是指出了後牆的暗管，再點了一下輪箱裡的暗火而已。平分太多了。」\n\n「要是沒有妳一眼看穿後牆藏著支爐暗管，我就算把二樓的魔導烘布滾筒全拆成零件也找不到病根；更別說最後傳動軸上那團暗火，整條灰鐵巷除了妳之外，根本沒有第二個人消得掉。」軒人將自己的兩枚銀幣收進錢袋，笑道，「千歲姊常說，技術工作是按本事分帳的，不是按誰流的汗多來算錢。安心收下吧，這兩枚剛好抵妳第一週的房租，一點都不欠。」\n\nEraser低頭凝視著手心裡映著微暖日光的兩枚銀幣。\n\n她伸出左手拇指，極輕柔地摩挲過銀幣表面微凸的紋樣，這才仔細收進貼身衣袋裡。\n\n回晚鐘亭的途中經過巷口麵包店，恰巧遇上傍晚熱爐出清打折。炙烤起司混合著小麥焦香的溫暖氣味順著敞開的木窗格漫出半條街。\n\n軒人停步笑了笑，直接從外套口袋摸出昨天在銅壺酒館跑腿多賺、買完餡餅後剛好剩下的那四枚銅幣，向麵包店老闆買了一大牛皮紙袋剛出爐的脆皮起司麵包。\n\n滾燙的熱氣透過牛皮紙袋直透掌心。他掰下一大塊拉出金黃起司絲的脆皮麵包遞給Eraser，自己咬了一口另一半，兩人並肩沿著暮色溫柔的灰鐵巷邊走邊分著吃。\n\n「這四枚銅幣，要算進我的帳上嗎？」Eraser小心咬下一口酥香的麵包邊，認真地問道。\n\n「慶祝妳開張賺到第一份工錢，算我請客。」軒人含著麵包含糊一笑，「等妳以後攢下自己的零用銅幣，再回請我一袋就行了。」\n\nEraser低頭看了一眼手裡溫熱鬆軟的麵包，輕輕「嗯」了一聲。\n\n剛推開晚鐘亭的木門，Eraser沒先卸下肩上的空袋，而是徑直走到橡木工作檯前，將貼身收好的那兩枚銀幣端端正正地擺在桌面中央。\n\n「這是這一週的房租。」她說。\n\n千歲抬眼看過桌上的兩枚銀幣，再瞥了一眼正把剩餘半袋熱起司麵包擱上矮桌的軒人，唇角彎出一抹滿意的淺弧。她拉開錢匣將銀幣妥善收好，順手提筆填了一張印著晚鐘亭鐘形小章的正式房租收據推過去。\n\n「點收無誤。看這副樣子，第一天搭檔配合得還挺順手？」\n\n「嗯，她聽暗管比我拿刀柄敲磚還準呢。」軒人走去水盆邊洗淨手上的石灰粉與鐵鏽，走回來時神色卻漸漸沉靜下來，將染布坊後牆被白塔私接黃銅排渣暗管、支爐廢火順著魔力供能立管倒灌上二樓魔導烘布滾筒的經過完整說了一遍，「千歲姊，白塔工程部把七號支爐的排渣暗管偷接進了水街與灰鐵巷的地基裡。照這股壓力繼續往上漲，這幾天恐怕不只是染布坊，整片河岸街區的地下管道都會被廢火撐爆。」\n\n千歲臉上的溫和笑意一點一點斂去。\n\n她拄起鐵木手杖行至牆邊，取下架上那捲泛黃捲邊的灰鐵巷早期地下管網全圖，在橡木工作檯上沉沉攤平。\n\n「染布坊後牆那條暗管，順著脈絡往上游追，連著的是『河岸舊調壓所』。」千歲指尖穩穩按在圖紙西側一處標著紅框的地下室記號上，「早年那裡設著監測支爐總壓的主閥門室，十年前卻被白塔用紅磚徹底封死了。」\n\n軒人微微挑眉：「那我們明天一早就過去看看？」\n\n「別急著一頭撞上去。」千歲搖了搖頭，眼神冷靜而務實，「地下主幹道是水務班跟白塔的轄區，我們一間民間小修繕鋪沒憑沒據自己去撬封門，只會把自己搭進去。正好水務班的班長後天要來店裡拿他送修的測壓表，我到時候順口把染布坊後牆有暗管漏火的事給他提個醒，讓水務班自己去查。至於明天一早——」\n\n她的視線轉回坐在工作檯邊的少女，語氣半是叮囑半是打量：\n\n「明天先帶這孩子去街上買套普通衣服換上。別老是穿著三百年前的古工坊制服在灰鐵巷裡晃，遲早會被白塔巡查的人一眼看出破綻。」\n\n軒人這才恍然瞄向Eraser身上那襲顯眼的灰藍色舊工作服，連忙點頭道：「說得也是，領口那枚花扣平常也得想辦法遮一遮才行。」\n\n當天晚餐過後，千歲看見Eraser桌上小心疊放著染布坊老闆娘送的那條深海藍色細棉布髮帶，便喚她坐到工作檯旁的矮凳上，拿起木梳替她將那頭長及腰際的淡粉紅色長髮梳得柔順服貼，順手以新布帶紮起一條清爽俐落的馬尾。\n\nEraser抬起左手，極輕地碰了碰腦後柔軟的棉布結。\n\n上樓回房前，她在安靜的二樓走廊停下腳步，借著樓梯口那盞昏黃溫潤的壁燈，從口袋裡取出千歲開給她的那張正式房租收據，安靜端詳了許久，這才推開房門走進去，將它細細夾進了《白央散步指南》畫著山坡鐘塔的那一頁裡。\n\n——第二章完——\n", "mtime": 1795001565.6372063}, {"filename": "03_第三章_灰鐵巷的便服與微溫的井水.md", "content": "# 第三章　灰鐵巷的便服與微溫的井水\n\n## １\n\n十月十八日的清晨，灰鐵巷屋簷下凝著的秋露還沒被朝陽曬乾，千歲便用鐵木手杖的底端在櫃檯邊輕輕磕出兩聲脆響。\n\n「走吧，Eraser。趁成衣鋪剛拉開門板、架上的成衣還沒被客人翻亂，帶妳去挑兩套像樣的便服。」\n\n正在擦拭長桌的Eraser停下手裡的布巾，低頭端詳起身上那件寬大的灰藍色工作服。布料厚實耐髒，袖口整齊地反摺了兩道，縫線依然緊實平整。\n\n「這件並沒有破損。」她平靜地說，「昨天晚上洗過後晾在後院，今天早上已經完全乾了。」\n\n「沒破才傷腦筋。」千歲右手穩穩拄著鐵木手杖，左手探進圍裙口袋摸出裝著銀銅幣的小布包，「灰鐵巷出入的人多而雜，在城裡打滾了幾十年的老工匠隨處可見。妳這套制服的剪裁與領口暗紋，全都是三百年前古工坊的制式規格，稍微懂行的人多看兩眼就會起疑。挑兩套尋常的粗棉長裙和開襟外套來換，把這身舊制服收進箱子最底層吧。」\n\n站在工作檯後方清點零件的軒人抬起視線。確實如此。前天傍晚從西山下來時天色早已全黑，昨天在河岸染布坊又是滿屋翻騰的蒸汽與亂甩的靛藍長布，街上沒人有餘裕細看衣服的剪裁樣式；可既然打算在灰鐵巷長住下去，天天穿著古工坊制服在街上走動，等於是主動替白塔的巡查人員遞上現成的線索。\n\n出門前，千歲先喚Eraser坐到工作檯的油燈下，仔細解開她右手腕上最後那圈透氣薄布，舉起放大鏡逐寸檢視。原先泛著薄紅的肌膚此刻已完全恢復白皙，以指腹輕按也不見半點殘熱，連一絲緊繃感都消褪乾淨。\n\n「表層的熱痕全退掉了，今天起不必再纏護腕。」千歲將捲好的薄布收進抽屜，口氣聽似平淡，分量卻沉得很，「不過記住，沒事別拿這雙手直接去碰高溫。妳手腕裡頭那些迴路比蠶絲還要纖細，萬一真撐出裂縫，市面上可找不到能替古工坊結構修補的古銀絲。」\n\nEraser將五根手指緩緩收攏又舒展開來，確認過指節的觸感，安靜地點頭應了聲「好」，這才跟在千歲身後推門外出。\n\n門楣上的黃銅鈴鐺清脆晃響了兩下，店裡隨即安靜下來。\n\n軒人走到門口將『營業中』的木牌翻好，趁早市的客潮還沒上門，拎起工具箱走上二樓，打算替Eraser把房間裡還沒整理妥當的邊角一次修完。靠街那扇木窗右側的鉸鏈鬆脫了大約一公分，夜裡山風一灌進來便咯吱作響；門邊的牆柱上也缺了幾枚能掛外套的木釘。他拿螺絲起子鎖緊鉸鏈、點上兩滴潤滑機油，又裁了兩塊刨得平滑的舊杉木板，在書桌正上方釘出一層牢靠的壁架。\n\n他將那本封面邊角已經磨毛的《白央散步指南》，以及還在修補途中的八音盒並排擺上木架，特意坐到書桌前的木椅上伸手比劃了一下高度。只要稍微抬臂，指尖剛好能夠碰到書脊。\n\n正當他把最後一枚圓頭掛衣釘敲進牆柱時，樓下的黃銅門鈴再度響起。\n\n「軒人，把工具箱裡那把裁縫小剪刀拿下來。」千歲從樓梯口仰頭喚道，「順便替我們倒兩杯熱茶。」\n\n軒人隨手抓起小剪刀走下木梯。可就在他的腳步剛拐過二樓轉角的那一瞬間，整個人微微頓住了。\n\n站在櫃檯前方的少女正背對著灑進店裡的晨光。\n\n那襲沉悶寬大、彷彿沾著百年石塵的灰藍色古工坊制服已經不見了蹤影。取而代之的，是一件柔和的淺燕麥色素面粗棉長裙，外頭罩著深灰褐色的微立領開襟外套，布面樸素柔軟，車線細密平整。同色布帶在腰際繫出清爽俐落的輪廓，長及腰間的淡粉紅色長髮依然用昨天染布坊老闆娘送的深藍色細棉布髮帶束成馬尾，幾綹沒收進去的碎髮輕垂在頰側與頸間，被晨曦鍍上一層淺金光暈，柔和得令人一時挪不開眼。\n\n地下石室裡那份與世隔絕了三百年的冷清疏離消失無蹤，她看起來也不再像某件隨時會被收進深庫封存的古老器物。站在十月晨光裡的她，分明就是一名剛搬進灰鐵巷、氣質安靜的十六歲少女。\n\nEraser聽見樓梯上的腳步聲戛然而止，偏過頭望上來。她下意識抬起右手，指尖輕輕碰了碰微立領的布邊，神情略帶幾分拿捏不準的遲疑。\n\n「……會很奇怪嗎？」她開口問道，那種認真確認標準答案的語氣，活脫脫就像前天晚上把木製晾衣夾歪歪斜斜夾在耳後時一樣。\n\n軒人這才驚覺自己站在台階上整整怔了兩秒，乾咳一聲移開視線，加快腳步走下樓梯，將手裡的小剪刀遞過去：「不會，非常合身。比那件灰藍色制服自然多了。」\n\n「那是當然，也不看看是誰挑的。」千歲左手提著另一包裝著替換衣裙的牛皮紙袋，右手將手杖往木地板輕輕一點，「兩套素面粗棉長裙配開襟外套，耐洗又耐穿，費用我先記在預支帳上，以後從工錢裡慢慢扣。」\n\n「好。」Eraser點點頭，旋即神情鄭重地伸手進外套口袋，小心翼翼地取出那枚銀色五瓣花扣。花芯中央那顆白珠在晨光下泛著溫潤柔白的光澤，右下角花瓣缺了一小角的斷口依然清晰可見。「千歲師傅，這枚花扣不能離開身體太久。」\n\n「我知道，離身久了妳會沒精神。」千歲接過小剪刀，從櫃檯底層抽出一塊素色細麻布裁出小片軟墊，同時將一條輕薄柔軟的淺灰細領巾遞到少女面前，「把花扣別在襯衣的衣領內側，我在布料背面縫上一層薄墊，免得金屬邊緣磨痛鎖骨。出門時把微立領的鈕扣扣好，起風了再把這條淺灰細領巾鬆鬆繞上一圈，從正面看過去，連一絲銀光都不會露出來。」\n\n千歲戴上老花眼鏡穿針引線，左手熟練地翻轉穿刺，不到十分鐘便在領口內側縫出了一處貼合的暗扣位。Eraser背對著櫃檯將花扣穩穩別妥，逐顆扣上微立領的木質圓扣，再把淺灰細領巾繞過頸間打成俐落的平結。當她轉回身來時，胸前只剩下溫潤整齊的粗棉褶皺，那枚足以引來白塔本塔傾力搜捕的古工坊標記，就這樣不著痕跡地隱沒進了日常衣料之中。\n\n軒人替她拎起那包替換衣裙送上二樓。推開房門，Eraser一眼便望見書桌上方新釘好的杉木壁架，以及牆柱上整齊排開的圓頭木釘。她先將折得方方正正的灰藍色舊制服收進床底的舊木箱最底層，接著走到窗邊，伸手輕輕推拉了兩下木窗。\n\n「不會再發出咯吱聲了。」她回過頭來確認。\n\n「鉸鏈都重新鎖緊上油了。」軒人拍去指縫沾著的細碎木屑，「外套跟領巾也有地方掛，以後不用全都搭在椅背上。」\n\nEraser注視著牆柱上那排木釘，將備用的細領巾輕輕掛了上去。她的視線隨後落回杉木壁架上的《白央散步指南》與舊八音盒，唇角極淺地向上彎起一道柔和弧度：「這間房間，現在看起來真的有人住了。」\n\n「本來就有人住啊。」軒人笑著往門邊退開半步，「走吧，十點之前得把昨天積下來的魔導報時鐘跟溫水壺分類完，晚了千歲姊又要拿手杖敲我鞋尖了。」\n\n## ２\n\n十月十九日與二十日，是軒人這半年來難得覺得胸口踏實的兩天。\n\n灰鐵巷這片位於城牆下層的職人街區從不顯得冷清，它有著屬於底層城鎮的蓬勃節奏。天色才剛泛白，運煤馬車碾過青石板的低沉轔轔聲便由巷口滾進巷尾；過了七點，麵包鋪剛出爐的焦脆麥香、隔壁鐵匠鋪風箱鼓動的呼哧聲，以及轉角小鋪煎烤熱餡餅的濃郁油脂香氣混在一塊兒，把整條石板街烘得暖洋洋的。\n\nEraser融入『晚鐘亭』日常的速度，遠比軒人預想得還要快上許多。\n\n十九日上午，千歲原本只讓她先認熟牆上幾座老掛鐘的走時節奏，順道把櫃底三大箱混在一起的黃銅螺絲依尺寸分門別類。軒人坐在一旁拆洗一只生鏽的溫水壺嘴，無意間抬眼望去，卻見她連游標卡尺都沒動用，單憑指腹輕輕一滾，就能準確辨明螺距與長度，將一枚枚黃銅螺絲俐落地投進對應的木格裡。到了下午，千歲推過一只客人送修的魔導報時鐘，教她如何辨別內部游絲與傳動齒輪的異音。\n\n她絲毫沒有動用那股抹消之力，只像個專注的新手學徒那樣，左手扶穩銅殼、右手捏著細起子，微微傾身側耳靜聽了三秒，便抬眼平靜地報告：\n\n「左側第三枚小銅輪的軸心歪了一點，每轉滿七圈就會刮到一次銅殼內壁。」\n\n千歲架起放大鏡細驗了一番，不由得挑眉失笑：「比軒人當年剛進門的時候強多了。這傢伙十一歲頭三個月拆發條盒，彈簧沒壓穩直接彈飛，差點把我半個茶杯削掉。」\n\n「那時候我手還小好不好。」軒人在一旁忍不住抗議，結果反倒換來Eraser一臉認真地點頭附和：「十一歲的手掌確實比較小，握不住發條盒的外殼。」\n\n「妳怎麼還幫著千歲姊補刀啊……」軒人無奈嘆氣，店裡卻跟著浮起一陣久違的輕快笑意。\n\n沒過兩天，這條街的鄰居們也漸漸熟識了櫃檯後方那位安靜守禮的粉紅髮少女。巷尾雜貨鋪的李店主拎著一只靠底座感應紋加熱的「二手魔導溫水壺」走進店裡，一邊抱怨最近底座漏水、加熱又慢，一邊大倒苦水說整組導魔底座又漲價了，足足抱怨了五分鐘。Eraser安安靜靜聽完，接過溫水壺倒扣在工作軟墊上，指著壺底邊緣平靜開口：\n\n「不是感應迴路壞掉。是底座的導魔銅片早年曾經撞凹過，反覆受熱膨脹後在接縫裂出細紋才漏水。只要補貼一塊薄導魔銅片敲平焊牢就行，不需要更換整塊底座。」\n\n軒人接過手，只花了十來分鐘便將薄導魔銅片俐落裁好、貼合敲平並重新焊牢，連同旁邊另一只剛校正完齒輪的魔導報時鐘一併收尾。然而到了最後一步「開機測試」時，軒人就算把自己的手指用力按在底座的啟動感應紋上，那圈紋路卻依舊黯淡冰冷，連半點反應都沒有——體內魔力是「空值」的他，空有一身修好機械與迴路的好手藝，卻完全沒辦法自己做通電開機測試。以前千歲不在店裡時，他每回修完魔導器，都得略顯尷尬地請客人自己伸手摸一下試機；現在他自然而然地將修好的二手魔導溫水壺順著軟墊推到旁邊。\n\nEraser心領神會地伸出左手，收斂起抹消術式的迴路，只以體內維持日常活動的微弱魔力、用普通力道在壺底感應紋上輕輕一碰。\n\n壺底立刻亮起一圈柔和穩定的暖橘色加熱光紋，連帶旁邊那只魔導報時鐘也在她的輕觸下發出清脆悅耳的整點鐘響。\n\n站在櫃檯外的李店主見狀，又伸手自己按了一下確認熱度，頓時朗聲笑開：「軒人手藝是整條街最好的，偏偏自己連修好的魔導壺都點不亮，現在多了個能幫忙試機的表妹可省事多了。」\n\n一聽還省下了整整一半的換底修繕費，李店主高興得連連稱讚Eraser眼力真好，臨走前還特意從懷裡摸出兩顆油亮飽滿的蜜漬無花果，硬是塞在櫃檯角落當作謝禮。\n\n十九日傍晚打烊結帳時，千歲合上厚重的皮面帳冊，拉開抽屜裡的錢匣，動作俐落地數出一小把澄黃發亮的銅幣推過橡木桌面。不多不少，整整十二枚。\n\n「三只魔導報時鐘的拆洗分紅、兩口二手魔導溫水壺的檢修與試機費，再加上妳上午整理完三大箱零件的理貨薪資。」千歲收起沾墨的細筆，語氣乾脆，「這禮拜的房租妳已經結清，離下禮拜還早得很。這十二枚是妳自己掙的零用錢，想怎麼花都隨妳。」\n\nEraser垂下視線，靜靜凝視著桌面上那排泛著溫暖金屬光澤、還沾著一絲微弱機油氣息的銅幣。過了兩秒，她才伸出已經徹底痊癒的右手，將銅幣一枚接著一枚緩慢收進掌心。\n\n硬幣彼此輕碰，發出一串細碎卻紮實的叮噹聲。\n\n「這些是……我自己賺到的。」她輕聲複述了一遍，像是在確認某件極為難得的事實。\n\n「不然難道是從天上掉進妳衣領裡的？」千歲把錢匣推回原位鎖好，「找條乾淨手帕包起來，別直接往口袋裡塞，跑起來會掉出來。」\n\n軒人靠在工作檯邊，看著她神情專注地將十二枚銅幣逐一疊進乾淨棉布手帕裡再仔細折成方塊，心底莫名漾起一陣輕快。前天在染布坊掙來的兩枚銀幣還沒捂熱便拿去交了房租；唯有眼前這把沉甸甸的銅幣，是她憑著一雙普通人的手、靠著這條街的溫度與真本事換回來的第一份零用錢。\n\n二十日上午，秋日的天空清朗透澈。千歲列了一張採買清單，讓軒人帶著Eraser去灰鐵巷中段的早市，順道採買細銅絲、松香、黑麥粉，以及幾束新鮮香草與青蔥。\n\n早市裡已然熱鬧起來，叫賣聲、秤盤撞擊聲與木車輪碾過石板的聲音此起彼落。兩人剛拐過蔬果攤旁那段寬石階，一股濃郁誘人的烘烤麥香與白芝麻焦香便順著秋風迎面撲來。轉角處架著一座接通地下支爐微熱支線的厚實「魔導石窯」，頭髮花白、繫著灰藍圍裙的松井婆婆左手在窯壁側面的溫控感應紋上熟練一按調勻火力，右手拿著長鐵鉗，將一張張烤得金黃起泡、撒滿翠綠香草碎與粗鹽的香草鹽烤麥餅夾上竹篩。\n\n「早啊，軒人，今天真難得沒往城外跑呢。」松井婆婆眼尖看見他，立刻笑著招呼。\n\n「松井婆婆早。」軒人笑著走到攤前，「這兩天店裡積了一批魔導鐘錶要趕修，出來補點材料。請給我兩張芝麻烤餅，邊緣焦脆一點的。」\n\n松井婆婆爽快應聲，一邊將剛出窯的熱餅夾進牛皮紙袋，一邊順勢把目光移向站在軒人身後半步的Eraser，眼角頓時笑出溫和的細紋：「這位就是千歲家新住下來的遠房表妹吧？巷尾的李店主逢人就誇妳修魔導溫水壺眼力準、還能幫軒人試機呢。外頭風大，別傻站在路邊吹風，往魔導石窯邊靠過來暖和點。」\n\nEraser微微一怔，旋即端端正正地行了一禮：「婆婆您好，我叫Eraser。」\n\n「氣質真好，名字也挺別緻。」松井婆婆將兩張芝麻烤餅遞給軒人，轉手又從竹篩邊角挑出一塊邊緣稍微烤裂、卻格外焦香酥脆的鹹香烤餅，拿防油紙妥善包好塞進Eraser手裡，「這塊邊角烤裂了，擺上檯面不好賣，婆婆請妳吃。趁熱咬下去最香了。」\n\nEraser雙手捧著還燙手的紙包望向軒人，見他微笑點頭，這才慎重地彎了彎腰，誠懇地說了聲「謝謝松井婆婆」。\n\n話音才剛落下，一道矮小的身影忽然高舉著一把略顯粗糙的玩具木劍，像陣小旋風似地從蔬果攤之間的縫隙衝了出來，在軒人面前兩步遠處猛然煞停，呼呼朝前奮力一劈：「看招，鐵背山豬別想逃！」\n\n那名七、八歲的小男孩臉頰被秋風吹得紅通通的，粗布袖口沾著一塊塊泥灰，烏黑的眼珠裡滿是藏不住的朝氣；他小手緊緊握著的玩具木劍劍柄上，還鑲著一顆米粒大小的廉價魔石碎片，正隨著他小手掌溢出的微弱天生魔力，一閃一閃地發出淡綠色螢光。\n\n「好啦好啦，揮慢一點，別戳到店裡的客人。」松井婆婆笑著出聲制止，順道向兩人解釋，「這孩子是鄰居木匠家的小男孩，他母親去河邊洗床單，暫時託我看顧一會兒。昨天他在酒館門口聽幾個遺跡探索者吹牛，回來就纏著他父親在木劍上鑲了顆碎魔石，鬧著說長大也要去舊鐘塔討伐魔物。」\n\n小男孩聽見這話立刻收住玩具木劍，仰起腦袋，一臉期待地望著軒人：「軒人哥哥，聽說你前幾天真的進過舊鐘塔了？裡頭真的有跟房子一樣大的鐵甲怪嗎？」\n\n「跟房子一樣大的倒沒遇見，比你們家木門還寬的確實碰上一隻。」軒人微笑著蹲下身，接過他手裡那把護手邊緣還沒磨平的玩具木劍——玩具木劍一落進軒人毫無魔力的掌心，劍柄上那顆廉價魔石碎片頓時暗了下去——他從腰間抽出隨身小刀，動作俐落地把劍柄上扎手的木刺一一削平再遞回去，「想當探索者的話，第一步得先學會別讓木刺扎傷手掌。」\n\n小男孩雙手一接回木劍，劍柄上的碎魔石立刻又亮起微弱螢光。他眨了眨大眼睛，低頭看看自己發亮的木劍，又好奇地指了指軒人的腰側：「軒人哥哥，為什麼連我握著木劍都會亮，你腰上卻一直掛著舊式的火柴盒跟燒油的提燈呀？」\n\n「因為哥哥天生點不亮魔石，但在黑漆漆的地底，火柴跟鯨油燈可不會挑人用。」軒人笑著回答。\n\n小男孩似懂非懂地用力點了點頭，寶貝似地雙手握緊玩具木劍。下一秒，他的視線忽然飄向一旁正小口啃著鹹香烤餅的Eraser，歪著腦袋仔細打量了幾秒：「軒人哥哥，這位粉紅頭髮的姊姊是剛搬來的嗎？她的頭髮好像春天山坡上開的櫻花。」\n\nEraser咀嚼的動作頓了一下。她垂下淡粉色的眼眸，安靜地看著只到自己腰際高的小男孩，隨後打開防油紙，掰下一角還沒碰過、沾滿酥香白芝麻與香草鹽粒的脆餅邊遞了過去：「給你吃。味道很香。」\n\n小男孩眼睛頓時一亮，慌忙在衣服下襬擦了兩下手掌才鄭重接過，一口塞進嘴裡，腮幫子鼓鼓囊囊地喊道：「謝謝粉紅頭髮的姊姊。以後要是有壞人還是鐵甲怪跑來灰鐵巷，我會拿木劍保護你們的。」\n\n「那到時候可就拜託你了。」軒人忍住笑，伸手輕輕揉了揉他亂蓬蓬的髮頂。\n\n告別松井婆婆與小男孩踏上歸途，兩人剛走至早市盡頭的高架水橋下方，頭頂數十公尺高的宏偉石拱橋面上，忽然隆隆滾過一陣整齊而沉重的馬蹄與重型鐵輪聲。\n\n軒人腳步微緩，仰起頭望向高空。\n\n一支插滿白塔紋章旗的龐大貨運車隊，正沿著寬闊的石橋緩緩往山坡上層區攀行。每一輛雙馬重車上都層層疊滿覆著厚實帆布的木箱，箱側清楚烙著慶典煙火工坊的朱紅火印；車架兩側綑綁著一捲捲嶄新的白金綢緞彩旗與精煉燈油桶。成排白金旗幟在高空秋風裡翻湧作響，馬頸懸掛的黃銅鈴鐺一路交織出清亮整齊的節拍。\n\n距離十月二十七日的建城三百週年燈祭，只剩下最後七天。\n\n重車壓過拱橋時震落了幾絲微細的石灰粉塵，如乾雪般從高處飄落，無聲灑在下方灰鐵巷蔬果攤的帆布遮雨棚上。\n\n底下的蔬果商販煩躁地抬手拍去肩頭落灰，低聲抱怨：「上層區辦一場燈祭，光是煙火木箱就連著運了三天。我們底下這排黃銅魔導街燈的玻璃罩破了整整半年，也沒見過半個工程人員下來換。」\n\n隔壁攤販冷笑著接話：「上頭忙著迎接王都來的巡視官，哪還有空管山腳下這幾條老街。燈祭當晚只要我們別冒黑煙擋著貴人們看煙火，他們大概就謝天謝地了。」\n\n軒人沒有接話。他靜靜望著高架橋盡頭逐漸遠去的白金旗尾，停頓了幾秒，這才收回視線繼續往前邁步。上層白塔的繁盛與山腳灰鐵巷的陰影，中間彷彿隔著一道看不見卻厚重無比的玻璃牆。\n\n快走回晚鐘亭街口時，街角那間麵包鋪正好推開木製百葉窗，端出上午第一爐剛出烤箱的脆皮起司麵包。濃郁的焦烤乳酪與發酵麥香瞬間漫過轉角。\n\nEraser停下了腳步。\n\n「想買嗎？」軒人偏頭看她，「我身上還帶著零錢。」\n\n「不用。」她輕輕搖了搖頭，右手探進深灰褐色外套的口袋，取出那塊折得方方正正的棉布手帕，仔細展開一角，「我有自己的銅幣。」\n\n她走到木製櫃檯前，先抬眼看清立牌上的標價，再將掌心的銅幣平攤開來，以食指一枚、兩枚、三枚、四枚仔細點數清楚，端端正正地放進櫃檯的黃銅零錢盤裡。\n\n「老闆，麻煩給我兩個脆皮起司麵包。」她的聲音不大，卻清澈篤定。\n\n麵包師傅親切地笑著點頭，迅速用牛皮紙袋裝起兩個烤得金黃焦裂、還冒著熱氣的麵包遞出來。走出幾步後，Eraser將其中一袋還燙著指尖的紙袋遞向軒人。\n\n「給我的？」軒人略顯意外。\n\n「前天晚上從染布坊回來的時候，你說過等我存下自己的零用銅幣，再回請你一袋。」Eraser神情無比認真，「今天換我買。另外一個帶回去給千歲師傅配茶。」\n\n軒人伸手接過沉實溫熱的牛皮紙袋，濃郁的烤起司香氣透過紙層直滲指腹。頭頂高架橋上的祭典車隊早已徹底遠去，只剩下幾縷飄散在秋風裡的微弱鈴音；可眼前的街角陽光正好，少女垂著長睫，把剩餘的八枚銅幣重新包回手帕收進衣袋，那副慎重仔細的模樣，簡直像剛完成一筆攸關全店生計的大委託。\n\n「那我就不客氣了。」軒人咬下一口酥脆的外皮，笑著稱讚，「妳眼光挺準，這顆裡面的起司特別多。」\n\n「是最左邊剛出爐的那兩個，烤色最深。」她老老實實地回答，也跟著咬了一小口，眼尾微微彎了起來。\n\n## ３\n\n十月二十一日，灰鐵巷的空氣裡莫名多出了一股揮之不去的燥悶。明明已是深秋時節，午前卻連一絲微風都沒有，陽光灑在青石板路上，竟蒸出一層黏膩潮熱的氣息。\n\n午餐過後，軒人在工作檯邊整理工具袋，抖出這幾天從舊鐘塔與河岸染布坊帶回來的幾條厚帆布工具布。其中兩條早已沾滿焦黑爐灰，另一條前幾天拿來擦拭過自己右膝擦傷的血跡，暗紅印記早滲進粗布纖維深處，光用冷水和肥皂根本搓洗不掉。\n\n他忽然想起二樓那只第一天借給Eraser裝《白央散步指南》的斜背小布袋。袋底右下角被粗石階與書脊磨出了大約一指寬的裂口，縫線邊緣已經開始鬆散。\n\n「Eraser，裝書的那只斜背小布袋這兩天先騰出來吧。」軒人走上二樓，輕敲兩下敞開的房門，「我正好要把沾了爐灰跟血跡的工具布拿到河岸染布坊，請老闆娘過一遍皂角水，順便請她幫妳把袋角補結實。」\n\nEraser正坐在窗邊擦拭舊八音盒的黃銅發條蓋，聞言立刻將指南與筆記移上杉木壁架，把空出來的小布袋對折整齊遞給他：「袋子本來就是你借我的，洗補好了就還給你。」\n\n「急什麼，補牢了妳接著裝書就行。」軒人將小布袋與工具布一併包進防潮油布裡，「順道去確認一下老闆娘那台魔導烘布滾筒這兩天還安不安分。」\n\n兩人順著緩坡來到河岸染布坊。二樓石砌露台上的四根鐵製晾布桿靜靜停在原位，幾匹剛染好的靛藍棉布在微風中輕晃。染布坊老闆娘迎出門口，一眼望見身穿素色粗棉長裙、紮著深藍色髮帶的Eraser，臉上頓時綻開笑意：「我早就說那條靛藍布帶襯妳的髮色吧，今天換上這身素淨便服，整個人看起來真有精神。」\n\n軒人將油布包放上櫃檯說明來意。老闆娘打開翻看一遍，爽快地收進櫃底木籃：「這點小事沒問題。陳年血漬得先泡上一晚皂角水才洗得掉，破掉的袋角我拿鋪裡最結實的深色粗線幫你們鎖邊，保證再背三年都不會開線。等洗淨曬乾了，我請送菜的年輕人順路給你們帶口信。」\n\n「老闆娘，樓上那台魔導烘布滾筒這兩天沒有再出狀況吧？」軒人順口問道。\n\n老闆娘臉上的笑意微微收斂，擦著手朝屋後引水渠的方向偏了偏下巴：「滾筒本身倒是乖得很，你封在暗管外頭的石棉布確實頂用。只是……說起來實在透著古怪。這兩天一過傍晚，屋後地板底下總會傳出低沉的嗡嗡悶響，聽起來就像有人在地底燒著一口大鍋爐。連從河道引上來漂洗棉布的水，手伸進去都溫吞吞的，一點也不像往年秋天那樣冰骨頭。」\n\n軒人與Eraser不動聲色地交換了一道視線。\n\n告別染布坊踏上回程時，秋日西斜。兩人剛轉進靠近下游排水明溝的窄巷，路旁一棟矮石屋的木門忽然「匡噹」一聲猛然拉開。鄰居周老先生手裡還攥著一塊滴水的抹布，神色慌張地探出半個身子：「軒人，太好了你正好經過，快進來看看，我家那口魔導恆溫鍋出了怪事。」\n\n走進狹窄的石屋廚房，靠後牆砌著的支爐供能爐座明明處於關閉狀態，正面那圈啟動感應紋黯淡無光，根本沒有人伸手去碰觸啟動；然而架在爐座鐵圈上的厚重「魔導恆溫鍋」底座卻被地底倒灌上來的熱力催得燒紅發燙，鍋裡半鍋清水正騰起細密白氣，灼人熱浪隔著兩步遠便直撲臉頰。\n\n「昨天半夜我就聽見廚房有咕嘟聲，今天午餐過後我特地確認過明明沒人用手去碰啟動感應紋，剛才想洗鍋子，整口魔導恆溫鍋卻自己燒得通紅，手指才剛碰到鍋耳就差點燙出水泡。」周老先生聲音微微發顫，「沒人碰啟動感應紋卻自己把鍋底燒紅，該不會沾上什麼失控的術式殘渣了吧？」\n\n軒人沒有急著伸手碰鍋，先回頭望了站在門邊的Eraser一眼。\n\n確認這間小廚房裡沒有其他外人後，Eraser靜靜上前一步，在距離魔導爐座大約三十公分遠的空氣中，將右手掌心極輕地停頓了兩秒——既沒有觸碰爐壁，也沒有啟動抹消能力，單憑細膩的感應確認過後，便朝軒人極輕地搖了搖頭，低聲說道：「魔導恆溫鍋裡沒有活著的獨立術式，也不是感應紋短路。是後牆底下有地底支爐倒灌的廢火與高溫硬衝進爐座槽，直接把鍋底催紅了。」\n\n不是需要抹消的附著術式，而是確確實實的管網倒灌積熱。軒人心裡有了底，轉頭安撫道：「老先生別擔心，不是什麼作祟的東西，是爐座後方的支管散熱口被堵死了。」\n\n他自工具袋掏出厚帆布隔熱手套戴牢，雙手穩穩端起滾燙的魔導恆溫鍋移至一旁的青石料理檯，隨即提起鯨油燈俯身照向爐座內部。這座魔導爐座緊貼著屋後鄰近排水溝的暗牆，爐腹最深處原本留有一道通往屋後窄溝的方形散熱孔；此刻覆在孔口外側用來防鼠的薄銅片，因連日承受地底支管倒灌的過高熱度而扭曲變形，死死卡死在滑槽裡。屋後牆根的支管磚縫正源源不絕滲進灼熱廢氣，高溫無處排散，全都悶在密閉爐座裡，硬生生把上方的魔導恆溫鍋烤成了開水鍋。\n\n軒人伏低重心，不動用任何花俏技巧，只憑最踏實的修繕工具——抽出扁頭拆件短刀，以厚實刀背抵住扭曲銅片的邊緣，沉腕俐落一撬。\n\n喀吱一聲，卡死的銅片應聲彈脫，積聚在爐膛深處的灼熱氣浪呼地湧出。軒人迅速側臉避開，待熱浪散去大半，從袋中取出兩片耐高溫石棉隔熱片與薄石板，向周老先生借來濕黃泥嚴密糊死漏氣的磚縫，再將雙層石棉墊實壓緊在爐底與後牆之間，最後順手清通通往屋側的排氣暗槽。\n\n前後不過二十分鐘，灶口蒸騰的灼熱便退去了大半。周老先生試探著將手掌懸在鐵圈上方感受了片刻，終於長長鬆出一口氣，執意往軒人掌心塞進了兩枚謝禮銅幣。\n\n退出矮石屋，軒人沒有立刻轉回大街，而是帶著Eraser繞進屋後那條僅容一人側身的陰暗夾巷。\n\n夾巷最底端是一道覆著鑄鐵條柵的石砌排水明溝。深秋傍晚的空氣本該帶著滲人涼意，然而當軒人蹲下身湊近鐵柵邊緣時，卻清清楚楚看見一縷縷綿密溫熱的白霧，正順著潮濕石縫慢吞吞地向上翻湧。\n\n他壓低呼吸輕嗅了一口。氣味並不算濃烈，卻冷得叫人胃底發緊——濕潤河泥的氣息裡，裹著極為鮮明的硫磺與焦鐵味，與他在舊鐘塔地下暗河、染布坊後牆磚縫裡聞到的味道分毫不差。\n\n這絕非單獨一戶的異常，也不只是一根暗管滲漏。這股來自地底的異常高溫，正在整條灰鐵巷的腳下悄無聲息地蔓延開來。\n\n兩人沉默地站起身，沿著石屋旁窄陡的石階向上攀登了十幾級，來到半山腰一處開闊的轉角石台透口涼氣。\n\n暮色漸沉，整座城市的燈火正由上而下陸續點亮。\n\n仰頭望去，呈階梯狀層層疊升的『白央城』上層區已化作一片璀璨無邊的燈海。為了迎接六天後的十月二十七日建城三百週年燈祭，高聳入雲的純白高塔外壁懸垂下數十幅長達數十公尺的巨幅白金旗幟，魔導探照燈自塔基處向上打亮，將金紋徽記映得耀眼奪目，就連低空流雲的邊緣都被染上一層華麗的暖金光暈。\n\n盛大、體面、宛如毫無陰霾的理想都城。\n\n軒人原本只是靜靜看著那些隨風舒展的巨旗，目光卻在無意間略微偏向城牆西側的荒坡——他的眉頭驟然收緊。\n\n城外西坡早已沉沒在青灰色的夜幕之中，遠處半山腰上，那座孤零零佇立的舊鐘塔遺跡只剩下一抹模糊殘影。太陽下山之後，就連最敢拿命換錢的冒險者也不敢踏足那片碎石荒草叢生的廢墟。\n\n可就在這一刻，舊鐘塔外圍坍塌的石牆邊緣，赫然出現了七、八點排列整齊、冷白與橘紅交雜的光點，正在黑暗中緩緩移動。\n\n那是白塔巡檢隊制式的防風魔導提燈。\n\n距離太遠，看不清執燈之人的輪廓，只能見著那幾點光亮在舊鐘塔底層通風井與外圍山道之間來回勘查，停駐了相當長一段時間，最後才收束成一條急促筆直的細長光線，順著山路疾行，直奔城內第七分塔的方向而去。\n\n軒人搭在石護欄上的五指一點一點收攏，指節泛白。\n\n十月十二日，有人朝舊鐘塔暗河投下了七號支爐的測試銅片。十六日，他帶著獨自守在地下石室三百年的少女走了出來。今天是十月二十一日——白塔巡檢隊偏偏選在這個傍晚，提著防風魔導提燈登上了舊鐘塔。\n\n他們在底下發現了什麼？還是已經察覺到了「缺席」？\n\n「軒人。」身側傳來輕而沉靜的喚聲。\n\n軒人回過神轉過頭。Eraser正順著他的目光，安靜凝視著西坡那串逐漸隱沒進城門的提燈微光。微涼晚風拂起她耳際幾綹淡粉紅色碎髮，她的左手自然垂落身側，右手卻隔著深灰褐色外套與淺灰細領巾，極輕地按了按衣領內側——正是那枚缺角五瓣花扣藏身的位置。\n\n「那邊的山坡上，有白塔的提燈。」她的語氣平靜無波，只是冷靜陳述眼前的事實。\n\n「八成是分塔的例行巡山罷了。」軒人沒有把最壞的猜測說出口，收回視線將帆布工具袋重新甩上肩頭，「天色全黑了，回店裡吧。這幾天出門，頸上的領巾記得繞緊一些。」\n\n「嗯。」她輕應一聲，安靜地跟隨他步下石階。\n\n身後，上層白塔懸掛的巨幅白金旗幟在探照燈下熠熠生輝；而他們腳下，通往灰鐵巷深處的青石板正透過鞋底傳來一絲令人背脊發涼的微溫。\n\n## ４\n\n地底的徵兆並沒有讓灰鐵巷等得太久。\n\n十月二十二日一早，街口那座供給二十幾戶居民取水的「公用魔導抽水井」便出了異樣。\n\n軒人拎著空木桶走到井台時，周圍已經擠了七、八名端著銅盆與水桶的鄰居。平日清晨總是寒暄不斷、充滿朝氣的井邊，此刻卻瀰漫著一層壓抑焦躁的氣息。\n\n「別直接往臉上潑，水是燙的。」剛按壓井台啟動感應紋、從魔導抽水管接滿一桶水的巷尾雜貨鋪李店主連連甩著手，眉頭緊鎖地盯著桶面。\n\n軒人跨前一步低頭細看。明明是氣溫偏低的深秋清晨，公用魔導抽水井從十幾公尺深井底抽上來的這桶水，水面竟浮著一層肉眼清晰可見的滾燙白氣。他探出指尖點進去一試，哪裡還有半分地下冷泉該有的清冽，水溫竟已滾燙得逼近熱浴水，木桶邊沿更浮著一圈細碎暗沉的黑色灰末，指尖輕攪便浮起一股微濁的煤灰與鐵鏽氣息。\n\n「昨晚打上來還只是微溫，怎麼隔了一宿竟然都冒出熱氣了？」麵包鋪老闆娘端著銅盆滿面愁容，「這種水溫拿去揉麵，發酵全都得亂套，漂著黑灰也不能拿來做麵包賣給客人啊。」\n\n「河邊低窪處的水窖也一樣。」旁邊一名扛著水桶的搬運工壓低了嗓音，「聽說第七分塔這個禮拜日夜不停地給上層燈祭供熱供電，該不會把地底哪條主管道給燒穿了吧？」\n\n「講話小聲點，新調來的榊原總管手段硬得很，這幾天街上到處都是巡查兵……」\n\n鄰居們你一言我一語地低聲議論，眉宇間滿是無處申訴的不安。提著大口陶罐的松井婆婆排在人群外側，無奈嘆了口氣，小心翼翼地撇掉表層浮灰，打算先提回去靜置沉澱半天再說。軒人默默走上前，接過沉重的陶罐替婆婆一路送回烤餅攤，順道繞往巷尾看了一眼河岸染布坊。\n\n染布坊今天難得沒有掛出新染的布匹。老闆娘正盯著門前的引水木槽嘆氣，一見到軒人便朝他揮手：「軒人，我正想找人通知你呢。你昨天送來洗補的那只斜背小布袋跟工具布，我到現在都沒敢泡進大木盆裡。」\n\n順著她的視線望去，連通暗渠的引水木管裡，水流正忽急忽緩地劇烈抽動，時而猛地噴出一股夾雜灰泥的渾濁溫水濺濕石階，隔兩秒又細如游絲，管壁深處不時傳出壓抑的悶響。\n\n「昨天半夜起水壓就怪得離譜，水裡還漂著黑灰，布料丟下去漂只會越洗越髒。」老闆娘嘆息著搖頭，「東西我都替你們妥善收在乾爽的木櫃裡了，等這陣子水質清了、水壓穩下來，馬上過皂角水洗淨，再拿深色粗線把破角補牢。」\n\n「不急，反正不趕著用。老闆娘這兩天魔導烘布滾筒的供能閥別開太大，自己多留意些。」軒人叮囑了兩句，心頭壓著一塊石頭似地回到了晚鐘亭。\n\n午後的灰鐵巷比平時冷清不少，上門送修器物的居民足足少了一半。軒人閒不住，走出店門抬頭一望，發現晚鐘亭前簷西側的銅皮排水溝被連日震落的瓦屑與枯葉堵了大半，固定水槽的生鐵托架也已歪斜鬆動，萬一過幾天落起秋雨，雨水肯定會順著牆面倒灌進二樓窗縫。\n\n他從後院扛出木梯架穩，腰帶上插妥大號管鉗與備用鐵釘，動作俐落地攀上了兩層樓高處。\n\n左手穩穩扣住簷下木椽，右手抄起沉重管鉗咬死生鏽的托架螺栓，深吸一口氣向左發力扭轉。鏽死的螺栓連一毫米都沒轉動。他腳掌踩緊梯級橫檔，咬牙將全身力氣灌進右臂，硬生生再次一扳——\n\n嘶。\n\n一陣深沉銳利的悶酸猛然從右肩肩胛骨縫裡鑽了出來，沿著臂筋一路麻到小臂。前幾天在舊鐘塔裡拉扯青銅鐘擺時震傷的底子，疊上這些年爬高扛重累積下來的舊勞損，平時做些細碎修繕還不覺異樣，一旦高舉過頭硬催蠻力，骨縫間立刻像被細針狠狠扎了一下。\n\n管鉗的咬口微微一滑，差點磕響屋瓦。軒人神色沒有半點變化，只是暗自咬緊牙關撐過那一瞬，趁底下沒人察覺飛快垂手甩了兩下發酸的右臂，隨即改用肩背抵緊木椽借力，重新卡穩螺栓。\n\n「鏽死了就下來換長柄扳手，不然去隔壁請鐵匠學徒過來扶梯遞撬棍，別在上面單手硬擰。」\n\n樓下傳來千歲冷靜而清楚的聲音。\n\n軒人垂下眼簾。千歲立在店門石階上仰望著他，右手平穩拄著磨得發亮的鐵木手杖，微風輕拂過她深栗色的長髮，也掠過她左側的深色長褲——那截空蕩蕩的左褲管懸垂在膝蓋下方，在清冷秋風裡襯得她的背影挺拔卻孤峭。\n\n站在梯腳旁的Eraser雙手穩穩扶住木梯立柱，抬起頭微微蹙起眉尖：「你的右手剛才抖了一下。螺栓太緊的話，我上去幫你托著水槽，或者換我試試。」\n\n軒人的目光只在鐵木手杖與那截空蕩的左褲管上停駐不到半秒，胸口卻像被某塊冰冷硬物極輕地硌了一下。\n\n三年前那場倉庫貨架倒塌的舊事，店裡誰也沒有再提過半句；可每當他看見千歲拄著手杖站在地面仰望自己，某種早已刻進骨頭裡的執拗便會悄無聲息地浮上心頭——這種程度的修繕根本不值得驚動誰，更不該讓身邊的人分擔任何一絲多餘的風險。\n\n「沒事，梯子架得很穩。」軒人立刻扯出一抹輕鬆笑意，不動聲色地將發酸的右肩藏進屋簷投下的陰影裡，「剛才只是鐵鏽打滑，螺栓已經鬆了半圈。這點高度我自己轉兩下就好，外頭風涼，你們先進屋喝杯熱茶。」\n\n不等底下再開口，他屏住呼吸壓低右臂角度，借著身體側壓的巧勁硬生生擰下鏽死螺栓換上新釘，再順手清乾淨銅溝裡的枯葉瓦屑，這才收好工具走下木梯。\n\n雙腳剛踏上青石板，千歲沒有多說一句教訓的話，只將鐵木手杖底端在地面輕點了一下，銳利目光精準掃過他略顯僵硬的右肩：「下次逞強把螺絲擰滑牙了，請屋瓦匠人重鋪屋頂的費用全從你工錢裡扣。」\n\n說完，她便轉身拄著手杖推門回了店裡。\n\n軒人乾笑著摸了摸鼻尖，下意識抬起右手想扯下掛在頸間的汗巾擦汗，可右肘才舉到肩膀高度便微微一頓，順勢改成左手抓過毛巾擦了一把額頭。\n\n就在這時，一條擰乾了水分、仍帶著溫熱水氣的濕布巾靜靜遞到了他眼前。\n\nEraser沒有點破他刻意換手的小動作，淡粉色的眼眸平靜而清澈：「後院水盆裡的水還是溫的。敷一下肩膀，晚上才不會那麼僵。」\n\n軒人微怔了半拍，這才伸出左手接過還透著暖意的濕布巾，低聲道了句「謝了」。\n\n十月二十三日傍晚，暮色剛壓過灰鐵巷參差不齊的屋脊，街邊靠地下支爐管線供能的黃銅魔導路燈才剛亮起，燈罩裡的魔導光芯卻在夜色中忽明忽暗，不時閃爍著詭異的暗紅光。就在這時，晚鐘亭的木門被人急促地推開，黃銅門鈴撞出一連串緊促脆響。\n\n跨進門檻的是水務班的班長。這名五十歲出頭、平日連暗渠暴漲都能咬著菸捲冷靜指揮的硬派工頭，此刻竟滿頭冷汗，深藍工裝的袖口沾滿新鮮紅磚灰與黑泥，臉色凝重得宛如壓著厚厚鉛雲。\n\n「千歲、軒人，先把店門帶上。」班長反手掩實木門，大步走到工作檯前，連水都顧不上喝便壓低聲音開口，「前幾天我來拿測壓表的時候，千歲提醒我染布坊後牆有支爐暗管在漏熱——我們水務班這幾天順著那條線往下查，查出大麻煩了。」\n\n千歲放下手中的細口鉗，抬眼示意軒人拉上一半臨街窗簾：「查到『河岸舊調壓所』了？」\n\n「對，就在那座十年前封死的舊調壓所。」班長粗糙的指頭重重按在工作檯那張泛黃的早期地下管網圖西角，「十年前白塔停用舊調壓所後，外頭那間河岸舊倉庫的生鐵門原本還留著；後來倉庫屋主嫌河底的陰風老從門縫灌進來太冷，乾脆請人砌了一層紅磚牆徹底封死，外頭還堆滿了空酒桶。這兩天整條街的井水越來越燙，今天下午我帶了兩名信得過的隊員，藉口巡查漏水挪開酒桶摸過去看了一眼。」\n\n「情況怎麼樣？」軒人沉聲追問。\n\n班長的神情徹底沉了下來：「我伸手貼上那面封了整整十年的紅磚牆——燙得嚇人，手掌根本停不住三秒。」\n\n工作檯上的鯨油燈火苗隨之微微一晃。\n\n「還不只這樣。」班長從工裝內袋摸出一塊用破布包著的濕泥拍上桌面，黑灰泥塊裡赫然黏著幾絲切口雪亮、剛車削出來的嶄新黃銅碎屑與焦黑機油污漬，「我們順著外圍的洩洪支渠往下撈了整整兩天，在距離舊調壓所幾百步遠的暗渠岔口撈到了這些東西——已經能確定了，這幾天半夜有人從暗渠另一端偷偷潛進去改過主管道。」\n\n店裡頓時靜得只剩下牆上老掛鐘沉穩單調的滴答聲。\n\n千歲以指尖拈起那撮還帶著新鮮刀痕的黃銅碎屑對準油燈細照，唇線抿得冰冷俐落：「倉庫紅磚十年沒拆過，裡頭卻沖出剛切削下來的黃銅新屑……第七分塔那些人，果然趁著籌備燈祭，在我們整條街的地基正下方私自改裝了排渣管線。」\n\n「最要命的是，水務班上頭的主管跟第七分塔走得太近，我今天剛提了一嘴調壓所溫度不對，上頭就立刻壓下來不准我們再查，說誰敢在燈祭前亂報險情就地革職。」班長眉頭深深蹙起，從懷裡摸出一小袋屬於水務班緊急修繕預備金的銀幣拍在桌角，語聲壓得更低，「可我們幾個老隊員一家老小全都住在灰鐵巷，總不能眼睜睜看著腳底下的管子把整條街炸上天。明天——十月二十四日早上七點整，趁第七分塔巡查隊換班、河岸舊倉庫還沒開工的空檔，我帶兩名口風緊的隊員扛上鐵鎬跟紅麻繩，私下把那面單層紅磚牆敲開，進去拿確鑿證據直接捅去城中心的管網總站。」\n\n說到這裡，他的目光誠懇地轉向軒人與站在桌旁的Eraser：「只是底下那些三百年前古工坊留下的舊閥門跟古體銘牌，我們這幾個只懂疏通溝渠的粗人根本看不懂。千歲店裡有早年的原始管網圖，軒人手腳俐落，你這位表妹這幾天在街上更是出了名的認得舊時代器物構造。這趟算我們水務班私下出錢委託晚鐘亭——明天早上，你們兩個願不願意跟我們下去一趟，幫忙看清楚裡面的古閥門跟原始紀錄？」\n\n軒人偏過頭望向身旁的Eraser。少女安靜地回望過來，極輕卻堅定地點了點頭，淡粉色的眼眸裡沒有半分退縮。\n\n「我們去。」軒人乾脆應承下來，「不過先說好，只核對原始圖紙與閥門紀錄，拿到實證立刻撤回，絕不往深處硬闖。」\n\n「那就這麼說定了。」班長用力拍了一下軒人的左肩，拉低工帽帽簷，迅速推門沒入漸濃的夜色裡。\n\n門鈴餘韻消散後，千歲凝視著工作檯上那張泛黃的早期地下管網圖，沉默了好一會兒，這才將它捲起捆實，鄭重交進軒人手裡：「圖紙收好。明天不管在底下看見什麼，活著出來最重要。」\n\n「明白。」軒人點點頭，仔細將管網圖收進了防水皮袋裡。\n\n## ５\n\n十月二十三日深夜，灰鐵巷陷入沉寂的時間比往常早了許多。或許是井水發燙的異變攪得整條街人心惶惶，才剛過晚上九點，沿街窗戶便陸續上鎖熄燈，只剩下晚鐘亭的工作檯前還亮著一盞暖黃的鯨油燈。\n\n軒人將平時穿慣了的氣瓶靴擱上軟皮墊，開始逐項檢整明早的裝備。\n\n前幾天在河岸染布坊攀上二樓露台時用掉了一顆氣罐，這幾天只跑些鄰近住戶的零碎修繕，一直還沒抽空補滿。他拿細口扳手旋開靴跟的黃銅鎖扣，卸下那顆用空的氣罐收進待充木箱，再從防潮鐵盒裡挑出三顆壓力指針穩指滿格的全新氣罐，逐一卡入靴跟槽位。\n\n喀噠、喀噠、喀噠。\n\n三聲清脆俐落的金屬咬合聲依序落定。他伸手反覆拍試靴跟的踏扣彈簧，確認擊發順暢毫無阻滯，這才將補滿三顆全新氣罐的靴子並排擺放到店門邊。\n\n緊接著，他抽出腰際那把扁頭拆件短刀。十月十六日在舊鐘塔撬開鐵蓋、翻倒那頭巨蟹的時候，刀尖右側崩出了一道米粒大小的缺口。這幾天拿來削削樹枝、撬開變形銅片還算堪用，可明天要踏進封閉了整整十年的滾燙暗渠，絕不能把性命託付給一把帶傷的刃口。\n\n他端來盛著涼水的木盆，將浸透水氣的細目青油石穩穩擱在桌沿。\n\n沙——沙——\n\n冰冷鋼刃貼緊濕潤油石勻速推拉，細密的灰白水漿順著石面緩緩滑落。在一次次精準控角的反覆研磨裡，原本毛糙崩裂的刀尖缺口漸漸磨平，重新浮現出一道冷冽平直的灰銀鋒線。\n\n坐在工作檯對面的Eraser沒有先回二樓休息。她身上穿著這幾天洗得愈發柔軟的淺燕麥色粗棉長裙與深灰褐色開襟外套，淡粉紅色長髮依然用那條深藍髮帶束在腦後。她以徹底痊癒的右手拿著細軟鹿皮布，將兩盞鯨油燈的玻璃燈罩擦得一塵不染，隨後又把白粉筆、精鋼銷釘、精鋼撬棍、滑輪組、短繩與備用石棉片依序整理好，妥貼裝進厚帆布工具包。暖黃燈火順著她低垂的長睫落下，在桌面上投出一道安靜柔和的剪影。\n\n「明天底下的熱氣肯定比染布坊後牆還要重。」軒人拿布巾仔細擦淨磨亮的短刀，以拇指指腹輕輕試過平滑鋒利的刀尖，「妳右手的護腕雖然拆掉幾天了，終究才剛養好不久。萬一底下遇到突發狀況，妳只管專心辨認管線和記路線，撬鐵門、扛重物那些差事全交給我跟水務班，別搶著往前站。」\n\n「嗯。」Eraser將小油燈的棉芯修剪齊整，抬起雙眸平靜地看向他，「你也是。昨天修繕屋簷的時候，你右肩發酸了，明天不准一個人硬扛。」\n\n軒人擦拭刀背的手指微微一頓，無奈地輕笑出聲：「結果還是被妳看出來了。」\n\n「你擦汗的時候刻意換了左手，今天晚上倒茶也沒有把茶壺舉過胸口。」她一本正經地列出觀察到的證據，把已經收整完畢的工具包推回工作檯中央，「千歲師傅說過，搭檔不是由一個人獨自撐著的。明天有紅麻繩，有水務班的人，也有我。」\n\n連日來壓在軒人心口的那層沉悶，竟在這一瞬間散開了不少。他將重新開鋒的短刀「喀」一聲推回皮鞘，俯身吹熄工作檯側面的副燈：「裝備都齊了，上樓早點休息吧，明早六點半就得起床。」\n\n臨走上木梯前，軒人順手拉開靠街高窗的木插銷，想最後確認一下門外的門鎖與夜色。微涼的深秋夜風隨即灌進屋裡，Eraser靜靜站在他身側半步之遙，一同抬頭望向窗外漆黑的夜空。\n\n咻——\n\n一聲細長而尖銳的破空哨音，毫無預警地從極高、極遠的上層城區劃破寂靜。\n\n軒人下意識抬起頭。在高聳純白的高塔尖頂斜上方，深藍近墨的廣闊天幕裡，驟然綻開一團奪目耀眼的金色光球。\n\n轟——\n\n沉悶而盛大的爆裂聲隔了整整兩秒，才緩緩滾過整個山谷。金紅與銀白的星火層層炸開，化作一株龐大璀璨的光之巨樹，在夜幕高處優雅地垂落漫天流光。上層區的慶典工坊，正為四天後的建城三百週年燈祭進行大型煙火試射。炫目光輝瞬間照亮了半山腰隨風翻飛的白金巨旗，照亮白塔潔白無瑕的石造塔身，極遙遠的高處甚至隱約隨風飄落幾縷上層區細碎歡快的歡呼聲。\n\n短短三秒，高空煙火燃盡最後一粒餘燼，夜空重新沉回深藍。\n\n軒人安靜看完了那場遙不可及的華美試射，隨後緩緩收回目光，讓視線順著山勢一層一層向下落回低谷——越過高聳白塔、越過橫跨夜空的巨大高架水橋、越過成片漆黑沉睡的石板屋頂，最終停駐在晚鐘亭門前那條狹窄冷清的街道上。\n\n夜裡忽明忽暗、時而閃著詭異暗紅光的黃銅魔導路燈下，整條灰鐵巷空無一人。\n\n在店門外僅僅兩步遠、沾滿深秋夜露的青石板縫隙之間，一縷細長、近乎無聲的滾燙白氣，正筆直地向上升騰，在微寒夜風裡靜靜散開。\n\n軒人沉默地反手拉上木窗，扣緊防風鐵栓。\n\n明天一早，他們就要敲開那面滾燙的紅磚牆。\n\n——第三章完——\n", "mtime": 1795001757.857788}, {"filename": "04_第四章_暗渠裡的舊銘板與封巷的靴聲.md", "content": "# 第四章　暗渠裡的舊銘板與封巷的靴聲\n\n## １\n\n「入口就在這面牆後面。」\n\n十月二十四日清晨，河岸薄霧還沒完全散盡。水務班的班長站在河岸舊倉庫的最深處，將手裡那盞靠手掌魔力點亮的制式感應提燈往牆根壓低。微冷的螢白燈光貼著潮濕地面推開，照出一排吸飽水氣而發黑的空酒桶，以及後方那面連半扇通氣窗都沒有的紅磚實心牆。\n\n軒人展開從晚鐘亭帶來的早年地下管網圖，借著燈火核對比例尺，隨即抬眼望向那面正隱隱滲出悶熱氣息的磚牆。\n\n「圖紙上標示的是一扇雙開生鐵門。」\n\n「十年前確實是門。」班長伸出佈滿厚繭的手掌，隔空靠近紅磚表面不到十公分，眉心立刻擰了起來，「當時舊調壓所早就停用了，前幾任倉庫屋主嫌河底的陰冷穿堂風老從門縫往裡灌，索性叫泥水匠砌了一層紅磚堵死。可這兩天，這面牆摸上去卻跟剛熄火的窯壁一樣燙。」\n\n幸好今天不用軒人一個人硬搬那些吸滿濕氣的沉重木桶。隨行的兩名水務班年輕隊員早已捲起袖子，動作熟練地將空酒桶逐一滾開清出走道，接著抄起短柄鐵鎬，朝薄紅磚牆用力敲了下去。\n\n紅磚本就只砌了單層，加上底層濕氣長年侵蝕砂漿，不到十分鐘，牆面便坍出了一人高的缺口。灰塵與碎石灰在燈光裡細細揚落，缺口後方果然露出一扇鏽跡斑駁的半圓形生鐵門。門楣上糊著厚厚一層乾硬的灰褐河泥，班長拿硬毛刷反覆刮洗了好幾遍，這才刷出五個筆畫沉穩的古體凹字——**『河岸調壓所』**。\n\nEraser站在軒人身後半步，靜靜望著門楣上的刻痕。\n\n她今天穿著前幾天在灰鐵巷成衣鋪添置的淺燕麥色粗棉裙，外罩微立領的深灰褐色開襟外套。那頭淡粉紅色長髮用一條深藍髮帶束在腦後，頸間鬆鬆繞著淺灰細領巾，將領口內側那枚缺了一角的銀色五瓣花扣遮得不露半點痕跡。經過一週休養，她右手腕表層的淡紅熱痕早已退得乾乾淨淨，連繃帶都不用再纏，只平穩地拎著一盞輕巧的小鯨油燈。\n\n「妳以前見過這種設施嗎？」軒人壓低嗓音問，指節在牆縫滲出的微熱氣流裡輕輕收緊。\n\n「沒有來過這裡。」Eraser的視線停在門楣邊角那道幾乎被紅鏽吞沒的幾何紋章上，「但這枚工坊徽記跟舊鐘塔底座是一樣的，都是三百年前負責監控外環地下管網的節點。」\n\n班長舉起大鐵鉗，咬住門栓上那把早已鏽死的舊掛鎖，雙臂繃緊發力。喀嚓一聲，鎖梁應聲崩斷。\n\n生鐵門向內拉開的瞬間，一股濃稠滾燙的氣浪轟然撲上臉頰。潮濕水垢、陳年鐵鏽與刺鼻的硫磺煤渣氣味混雜在一起，嗆得離門最近的年輕隊員連咳了兩聲。\n\n軒人不動聲色地往斜前方挪了半步，將Eraser護在身後，低頭最後確認一遍隨身裝備。氣瓶靴的靴跟裡，昨晚剛換上三顆指針滿格的全新氣罐，踏扣清脆順手；腰間別著昨晚重新磨平鋒線的扁頭拆件短刀，帆布工具包裡塞著精鋼撬棍、滑輪組與短繩。出門前，千歲板著臉反覆叮囑過，今天只進去確認管線與翻查紀錄，絕不准逞強，更不准讓Eraser去碰任何沉重鐵件。\n\n班長將一捆三十公尺長的染紅粗麻繩遞到軒人手裡。\n\n「底下連著好幾條廢棄的洩洪暗道，我帶這兩名隊員守在門口跟後院通風井拉繩。每轉一個彎，就把紅繩扣進牆上的鐵環裡。下面要是有半點不對勁，連拉三下繩子，我們在外頭搖銅鈴接應。」\n\n「明白。只要拉繩沒有回訊，我們立刻退回門階，絕不往深處走。」\n\n軒人把染紅麻繩穿過腰帶側面的承重鐵環，順手連扯三下。門外的班長沉穩地回拉了三下，力道清晰紮實。確認完畢，軒人轉頭望向身旁的少女。\n\n「走吧。找到原始銅片圖跟閥門紀錄，拿到手就馬上上來。」\n\n「嗯。」Eraser點了點頭，右手穩穩提著備用小油燈，隨拎著玻璃鯨油燈的軒人一前一後踏入悶熱幽暗的石階。\n\n## ２\n\n石階一共二十八級。每往下走一步，空氣便沉重一分，彷彿正走進一座尚未冷卻的巨大蒸氣鍋爐。\n\n原本跟在後頭、打算下幾級台階幫忙把紅繩扣進第一道牆壁鐵環的水務班年輕隊員，才剛舉著手掌魔力供能的「制式感應提燈」踏下第五級石階，提燈頂端的感應晶石便驟然劇烈閃爍起來。底下七號支爐高壓廢火外溢，在封閉暗渠裡形成了極為強烈的魔力亂流，隊員手裡的感應提燈剛下樓就忽明忽暗、發出刺耳欲裂的共鳴鳴叫，緊接著「啪」地一聲徹底熄滅，連隊員掌心的魔力迴路都被逆流震得一陣發麻，不得不退回門階上方。\n\n反倒是身為「空值」、體內半點魔力也沒有的軒人，手裡那盞平時習慣攜帶、完全不靠半點魔力的玻璃鯨油燈，在這片狂暴的魔力干擾場裡連火苗都沒抖一下，昏黃卻溫定的火光穿透濃重熱霧，成了唯一能穩定照亮底下閥門室的光源。\n\n靴底剛落上最後一級石階，便濺起約莫五公分深的積水。尋常暗渠的積水在十月下旬早該凍得刺骨，此刻漫過鞋面的水流卻燙得反常，水面上浮著一層細密的暗紅煤灰，隨著波紋緩緩旋動。\n\n前方是一段弧形石砌長廊。穿過長廊盡頭，視野驟然開闊，呈現出一座寬敞的圓形地下閥門大廳。\n\n大廳正中央立著一座直徑三公尺的八角形青銅調壓盤，盤面插滿標記各街區管線的細小銅旗。調壓盤後方的石凳上，坐著一道半透明的淺青色人影。那是一名身著三百年前舊式工作服的值班員殘響，右手握著早已乾涸無墨的鐵筆，神情平靜而機械地低著頭，一遍又一遍在空白銅板上劃過同樣的軌跡——\n\n『西段水壓正常，三十分鐘後切換副管。』\n\n那種被永遠困在三百年前某個午後的微弱動作，讓悶熱的大廳反倒透出一股近乎虛無的冷清。\n\n軒人停在廊口，順手拿白粉筆在牆角畫了一道箭頭記號，低聲確認：「那就是以前留下來的殘響？」\n\n「嗯。只要地底的支爐還在運轉供能，當時刻在術式裡的日常動作就會一直重播。」Eraser從石凳旁繞過，目光在值班員虛影沾滿墨漬的袖口停留了半秒，隨即平靜移開，「他看不見我們，只要不擋在他原本巡檢的動線上，就不會觸發反應。」\n\n軒人點了點頭，將鯨油燈高高舉起，燈光沿著圓形岩壁掃過並列排開的七根巨型生鐵管道。\n\n光束照清管口閥門的那一刻，軒人背脊掠過一陣冰冷的戰慄。\n\n依照晚鐘亭那張舊管網圖所繪，左側六根需要一人合抱的生鐵主管，原本直通城外荒原的排渣池；唯獨最右側的七號管，是通往灰鐵巷地底的備用暖水與排水支管。\n\n眼前的構造卻徹底顛倒了過來。\n\n通往城外的一至六號巨型閥門，全數被套上了閃著冷光的新製精鋼扣鎖，管口甚至直接焊上兩指厚的封堵鐵板，焊縫邊緣亮得連半點鏽斑都沒有；反倒是通往灰鐵巷的七號主管，巨型手輪被人強行旋到了最底，管側還新接出三根粗大的黃銅彎管，將另外六條排渣管裡高壓滾燙的廢渣與暗紅黑火，全數硬生生導進灰鐵巷腳底這唯一一根管子裡。\n\n軒人胸口一沉，視線隨即移向大廳最裡端——那裡與他們走下來的倉庫入口正對，嵌著一扇隱蔽的低矮圓形鐵蓋，通往暗渠更深處的主維修幹道。\n\n鐵蓋邊緣的黃銅插銷上抹著新鮮發亮的機油。潮濕的黑灰石地上，清楚印著幾道雜亂而沉重的制式軍靴鞋印，一路筆直延伸至大廳右側的檔案櫃前。\n\n難怪倉庫紅磚確實封死了整整十年，這裡面卻像前幾天剛動過工一樣。第七分塔的工程隊根本沒有走地面倉庫，他們直接從暗渠深處那條只有白塔掌握鑰匙的維修幹道潛進來，悄無聲息地改裝了七號主管。\n\n就在軒人俯身檢視鞋印的瞬間，七號主管內部傳來一聲沉悶如雷的低鳴。過載的高壓廢火劇烈衝擊管壁，連帶震得大廳中央那座八角青銅調壓盤發出「喀噠」一聲巨顫。\n\n盤沿一排用來切換站內檢修幻影的木柄撥桿中，其中一根竟被震出卡槽，自行彈向另一側。軒人驀地回頭——他們來時那條平直的弧形石廊，在閃爍的暗紅微光裡竟硬生生疊上了一層半透明的下行石階幻影，輪廓清晰得幾近真實。\n\n軒人沒有半點慌亂，立刻半蹲下去，抓住腰間的染紅麻繩連拉三下。\n\n不到兩秒，門外便傳來三下清晰穩重的回扯力道。染紅麻繩筆直穿透了那層半透明的虛影石階底部，穩穩連著真實的通道。\n\n「出口沒變，是投影撥桿被管道震歪了。」Eraser已經走到調壓盤旁，伸出右手穩住那根褪色木柄，順著槽位推回標著『常開』的刻度，「以前檢修暗渠時，值班員會用幻影遮蔽封閉路段。現在底下的壓力震動太大，卡槽已經撐不住了。」\n\n虛影石階隨即消散，重新露出軒人剛才畫在牆角的白色粉筆箭頭。\n\n軒人從工具包裡摸出一根備用精鋼銷釘，乾脆俐落地楔進撥桿底部的縫隙卡死，又扯了一截白布條綁在木柄頂端當作記號。\n\n「這樣管子再怎麼晃，它都跳不出來了。」\n\n「可以去看檔案櫃了。」Eraser輕推試了試銷釘的緊度，轉身走向大廳右側。\n\n高大的生鐵檔案櫃鎖舌早已鬆脫，櫃門表面累積了十年的灰塵被戴著手套的手掌抹開一大片，顯然今年十月剛被人翻找過。上層紙帳大多受潮腐朽，唯獨底層防潮鐵格裡整齊壓著一串以細銅桿串起的原始黃銅銘板，旁邊還擺著一本套著防水油布、墨跡簇新的**《第七分塔・排渣調度手冊》**——多半是潛入改裝管線的工程監工大意遺留在現場的副冊。\n\n兩人將銘板與手冊拿到調壓盤上攤開。手冊最後一頁，只用刺眼的紅墨水記了三條批示：\n\n『十月十日：七號支爐底部的廢火池已滿。如果現在停爐清理，十月二十七日建城燈祭期間，上層貴族區將全面斷暖熄燈。』\n\n『十月十二日：分塔長榊原下令——不准停爐。將排往城外的六條大管全部焊死（以免冒出的黑煙被王都來的巡視官看見），所有滾燙廢火暫時改灌入灰鐵巷地底的舊水道，並往舊鐘塔方向投放測試片。』\n\n『十月二十七日（燈祭當晚十點）：趁上層施放煙火掩護，將七號閥門開到最大，把底下積了三十年的滾燙廢火一次灌進灰鐵巷西側三條街的地基下面。事後若有房屋塌陷，一律按「舊礦坑自然坍方」結案。』\n\n紙頁被軒人捏出了深深的指痕，骨節因過度用力而泛白發青。\n\n上面連半句咆哮或惡意嘲弄都沒有。只是像核銷一筆尋常耗損般，用最平淡的三行字判定灰鐵巷西側三條街幾百戶活人的家園，抵不上三天後上層區燈祭當晚那場不能熄燈的煙火。\n\n更讓軒人呼吸猛然停滯的，是最後那行字裡的六個字——**「舊礦坑自然坍方」**。\n\n九年前那個寒冷的十一月夜裡，他八歲，住在灰鐵巷外環的父母也是在一場突如其來的地底轟鳴與熱浪中喪生。當時白塔貼在廢墟街口的結案告示，一字不差，寫的正是「舊礦坑自然坍方」。\n\n軒人的手指微微發冷，下意識將手冊往前猛翻到夾層最前面的一頁舊交接表。\n\n那張泛黃的早期表格下方，大半截記錄已經被人粗暴地撕去了，只在斷裂的紙緣上方殘留著半行被紅線劃掉的陳年備註：\n\n**『舊曆九年前十一月十四日：灰鐵巷外環支管突發異常逆流（已依舊礦坑坍方預案封存結案）。調閱備查：第三分塔首席技師・賀蘭……［後頁撕毀］』**\n\n大廳裡悶熱難耐的空氣，彷彿在那一秒鐘被徹底抽空。\n\n舊曆九年前十一月十四日。那是他父母的忌日。\n\n原來九年前奪走父母性命、把整條外環舊街夷為平地的那場災難，從頭到尾根本不是什麼自然坍方，而是七號支爐早就發生過一次的管線逆流。那麼當年唯一在現場活下來的自己，還有這個在事故當天調閱過檔案、名叫「賀蘭」的第三分塔首席技師，究竟在裡面扮演了什麼角色？\n\n「還有這一塊。」\n\n一旁Eraser清冷的聲音將軒人從刺骨的寒意裡拉了回來。她沒有看那本新冊子，右手輕輕將那串三百年前古工坊留下的黃銅銘板翻至最後一片。\n\n銘板正面鑄著七號支爐的原始緊急停爐規程，下方刻著一枚端正的五瓣花徽記：\n\n**『當支爐核心失控、外圍排渣超出負荷時，應取回「零號」（Eraser），接入主控鐵箱執行全爐抹消。註記：零號的維持迴路與支爐底層相連，全爐抹消完畢的同時，零號亦將停止運作。』**\n\n軒人的瞳孔驟然收縮，猛地轉頭看向身旁的少女。\n\n如果照這塊古銘板上的老規矩，讓她去把整座失控的七號支爐抹消掉，連著支爐底層迴路的她自己也會當場停止運作。\n\n「……上面寫的是真的？」軒人的嗓音乾澀發緊。\n\nEraser隔著淺灰細領巾，右手輕輕按了按領口內側那枚銀色五瓣花扣，平靜地點了點頭：\n\n「是真的。我的花扣底線一直連在七號支爐下面。如果不先把這條底線分開就關掉整座支爐，我也會一起停下來。」\n\n就在軒人強壓下胸口翻湧的震動、伸手將黃銅銘板與那本夾著九年前殘頁的調度手冊一併塞進防水袋時——\n\n匡噹。\n\n大廳中央的八角青銅調壓盤猛然劇震，盤面上七支小銅旗同時齊刷刷倒向七號管道。\n\n緊接著，七號主管接口處炸開一聲刺耳欲裂的金屬撕裂聲。剛才翻動檔案櫃與銘板時微弱牽動了底座老化的壓力感應簧片，加上管內早已逼近爆裂臨界點，管道側面的排污檢修口瞬間炸裂。一大團裹挾著滾燙黑泥、碎裂生鐵與暗紅爐火的黏稠濁流轟然噴湧而出，重重砸落在他們來時的弧形廊口。\n\n## ３\n\n黑紅爐渣一觸積水，立刻激起大片嗆人的滾白蒸氣，同時宛如遭到強磁吸引般，將大廳角落廢棄的閥門手輪、斷裂鐵管與廢鋼索全數捲了過去。\n\n不到五秒，一頭長達三公尺、形似巨鱷、全身由交錯咬合的生鐵管與鋸齒閥門硬生生拼湊而成的**「排渣鐵顎獸」**已在廊口成型。牠沒有雙眼，吻部由兩扇半圓生鐵閘板構成，每一次開合都噴出滾燙黑水與刺鼻硫煙。\n\n更糟的是，排污口爆裂直接觸發了調壓所的自動防洪機制。\n\n弧形長廊入口上方傳來沉重的齒輪軋響，那道厚實無比的生鐵防水閘門開始緩緩自頂槽滑落。\n\n門外的班長聽見悶響，立刻拚命扯動紅繩，急促的銅鈴聲伴隨焦急的呼喊，穿過閘門上方巴掌大的觀察窗灌了進來：\n\n「軒人，快撤出來！上面的絞盤卡死了，防水門正在往下掉，我們在外頭拿扁鐵卡滑槽幫你們拖時間！」\n\n軒人一眼掃過整個戰場。\n\n走廊只有兩公尺寬，三公尺長的鐵顎獸把唯一退路堵得嚴嚴實實，尾端還連著一條碗口粗、從七號主管裂口持續輸能的暗紅火線。不先拆掉這東西，誰也別想穿過這十步長廊。\n\n「能直接抹掉管子上的裂口嗎？」軒人將防水袋緊緊捆實於胸前，右手抽出了扁頭拆件短刀。\n\n「不行。」Eraser視線緊鎖那根燒得發紅的七號主管，語速極快卻極穩，「那根管子現在連著整個第七區的地下蓄水廊。要是直接切斷主管爐火，壓力瞬間倒灌，頭頂的倉庫會整座炸開。只能切斷怪物跟管子相連的那根『臍帶火線』，再從閘門底下鑽出去。」\n\n鐵顎獸發出一聲震耳欲聾的鐵片摩擦嘶吼，拖著後端跳動的暗紅火線，張開鋸齒鐵閘般的巨顎猛撲而來。\n\n「往右閃，別沾到黑水！」\n\n軒人一把拉住Eraser的右臂，右腳乾脆俐落地踩下氣瓶靴靴跟的第一顆氣罐踏扣。\n\n嗤——\n\n高壓氣流貼著積水炸開，推著兩人沿圓形岩壁猛然橫移出去。鐵顎獸撲空，鐵鑄頭顱重重撞碎了八角青銅調壓盤的邊角；沉重的生鐵長尾順勢橫掃地面，喀嚓一聲，將連通門外的染紅麻繩死死壓斷在倒塌的鐵管底下。\n\n「火線接在牠肚子正中央的鐵管接口上。」Eraser在側移落地時已經看清底部構造，目光銳利，「可是牠伏得太低，腹部離水面不到十五公分，手伸不進去。」\n\n「太低——那就讓牠自己抬起來。」\n\n軒人仰頭鎖定大廳拱頂橫跨而過的檢修滑車軌道，右腳沒有半分遲疑，直接踩下靴跟的第二顆氣罐踏扣。\n\n三顆氣罐轉眼只剩最後一顆。\n\n猛烈的高壓推力瞬間將他送上岩壁大管的攀爬鐵梯。軒人借勢蹬壁躍起，左手甩出精鋼鉤索飛爪，鐵爪準確穿過拱頂滑車吊環扣死——整個人乘著擺盪弧度，在半空中朝鐵顎獸正上方疾掠過去。\n\n鐵顎獸察覺頭頂的破空風聲，猛然昂起沉重的前半身，兩扇鋸齒鐵顎張到極限，對準空中的軒人迎面咬落。\n\n隨著龐大身軀豎起，原本緊貼水面的腹底，連同正中央那圈燒得赤紅的接口，毫無遮掩地暴露在空氣中。\n\n重力拽著身體下墜。那頭怪物周身散發著極高濃度的爐火魔力場，一般體內帶有魔力的人只要靠近兩公尺內，自身的魔力迴路就會被狂暴的磁場牽引得氣血翻湧、頭暈目眩，連握緊武器都成問題；唯獨體內一片空白的「空值」軒人完全不受魔力場共鳴影響，除了撲面而來的灼熱硫磺臭氣外，雙眼與呼吸清明得沒有半分紊亂，這才能面不改色地踩著純機械氣瓶靴直接衝到怪物頭頂。\n\n就在兩扇鋸齒鐵顎於眼前急速合攏的剎那，軒人沒有退避，右手先是一扣，將鉤索尾端的快拆環死死鎖進腰帶承重環，憑空借住半空懸吊的拉力——騰出的雙手同時抽出工具包裡最粗的精鋼撬棍，橫舉於身前，精準塞進上下兩扇鋸齒鐵顎的咬合縫裡。\n\n喀嚓。\n\n狂暴的咬合力透過鋼身炸進掌心，撬棍當場彎出一道刺眼的弧度，卻硬生生把那張猙獰巨口卡死在半空。強烈的金屬反震瞬間撕裂了軒人的左手虎口，溫熱的血線順著棍身滑落。\n\n「Eraser，腹部正中央！」\n\n軒人雙腳用力蹬在怪物滾燙粗糙的下顎鐵殼上，順手彈開腰環鉤索翻身側滾落地——右肩來不及卸去衝擊，重重磕在濕滑的石板凸角上。八天前在舊鐘塔拉傷的舊痛剎那間撕扯開來，劇痛讓他的視野徹底黑了一瞬。\n\n另一側，早已趁隙繞到怪物側後方的Eraser沒有半秒停頓。\n\n怪物右側的排氣縫正不斷噴吐滾燙白汽與黑水，她順勢從相對清靜的左側切入，壓低重心，自然伸出靠向腹底的左手。白皙的五指穿過蒸騰的硫霧，穩穩按在了腹心鐵管接口的暗紅起筆點上。\n\n滋——\n\n純白微光自指縫綻放。那根碗口粗的『臍帶火線』應聲瓦解，轉眼間斷去大半。\n\n可就在火線即將徹底熄滅的最後半秒，後方七號主管內部積壓的壓力陡然失衡，一股濃稠如墨、泛著不祥暗紫微光的逆流底渣驟然從斷口反衝而出。\n\n一正一逆兩股狂暴爐火在接頭處轟然對撞。\n\n「小心逆流，快抽手——！」\n\n軒人忍著右肩刺痛翻身撲起，剛跨出半步，心臟便重重往下沉去——Eraser根本沒有退。連他都一眼看得出，只要這一刻鬆手，反衝的暗紫底渣會當場炸穿整條弧形長廊，將門外的水務班三人連同他們兩個一起埋進沸騰的暗河裡。\n\n少女緊抿著唇，不僅沒有撤回左手，反而將掌根往下重重壓實，硬生生把整股反衝過來的暗紫逆流全數按進了抹消白光裡。\n\n啪。\n\n一聲極輕、卻讓軒人呼吸驟停的脆響，從她深灰褐色開襟外套的左袖口底下傳了出來。\n\n那聲響清脆得像一片燒得過薄的白瓷，在超越極限的重壓下崩開了一道細縫。\n\n同一瞬間，鐵顎獸腹心的紅光徹底熄滅。失去支爐供能，這具龐然大物發出震耳欲聾的崩解巨響，化作一堆普通廢鐵砸進燙水裡，濺起漫天灰濁水花。\n\n走廊盡頭，那扇沉重的生鐵防水閘門距離地面只剩不到六十公分的低矮縫隙。門外傳來刺耳的金屬刮擦與班長嘶啞的呼喊——兩名水務班隊員把兩根厚扁鐵斜插進閘門兩側滑槽的齒條縫裡，靠著金屬咬死的阻力拚命拖慢下降速度，雙臂抖得幾乎脫力。\n\n「快爬出來！扁鐵快被齒輪咬斷了，撐不過五秒！」\n\n軒人一個跨步衝到Eraser身邊。少女的左手已經無力垂落身側，指尖微微發顫。他立刻克制住觸碰她左腕的衝動，改為穩穩托住她的右手肘，半護半帶衝向閘門。\n\n「妳先過去，外面有人接。」\n\nEraser沒有多言，俐落地側過身，用完好的右手撐著濕滑石面，從低矮的門縫下迅速滑出。門外的班長一把拉住她的外套後領，將她拽上安全的石階。\n\n軒人先將裝著銘板與手冊的防水袋甩過門縫，隨即伏低身子，靠著左肘與雙腿發力一蹬，貼著積水滑過門檻。\n\n就在氣瓶靴靴跟擦過門底的下一瞬，兩側齒條縫裡的厚扁鐵終於被齒輪硬生生絞彎彈飛。轟隆一聲悶響，生鐵防水閘門重重砸實在地，將後方翻滾蒸騰的黑霧與熱浪徹底封死在了地下大廳裡。\n\n## ４\n\n重新踏出河岸舊倉庫、見到秋日陽光時，班長和兩名年輕隊員正靠著紅磚牆大口喘氣。剛才弧形長廊裡全被沸水蒸出的濃白蒸氣堵滿了，外頭三人只聽見裡面傳來一陣震天價響的鐵管崩塌聲，誰也沒看清大廳裡究竟發生了什麼。\n\n軒人顧不上自己正滲血的左手虎口，也沒理會抽痛發麻的右肩，第一時間蹲到坐在石階上的Eraser面前，用自己的背影徹底擋住水務班兩名隊員的視線。\n\n少女安靜地用右手托著自己的左手肘，微低著頭，連半聲痛呼都沒有發出。\n\n軒人放輕力道，將她開襟外套的左袖口慢慢往上捲起一截。\n\n在明亮清冷的秋陽下，她白皙的左手腕內側赫然浮現出一道五公分多長的細縫，從掌根一直向上延伸過腕骨。那裡沒有流出一滴血，可每當她指尖微不可察地顫動一下，裂口邊緣的皮膚便彷彿兩片錯位的薄瓷彼此輕磨，從極細的縫隙間斷續透出幾點忽明忽暗的銀白微光。\n\n這跟八天前右手那點單純發紅發燙的表層熱痕截然不同。\n\n這是千歲嚴肅警告過的——結構裂痕。\n\n軒人的呼吸一下子沉到了胃底，伸出去想碰卻又不敢碰的手指微微發抖。\n\n「……痛不痛？」\n\n「痛。」\n\nEraser沒有敷衍，也沒有說什麼休息一晚就好，只是抬起那雙清澈平靜的眼眸看著他，坦坦白白吐出了一個字。\n\n「手指先不要動，一點都不要動。我們馬上回店裡讓千歲姊處理。」\n\n軒人迅速拉下袖口蓋住那道微弱銀光，解下脖子上的乾淨乾毛巾，仔細折疊成軟墊托住她的左小臂，這才回頭朝正在擦拭額頭灰汗的班長喊道：\n\n「班長，剛才我們撬排污口鐵管的時候，她的手被反彈的閥輪震裂了骨頭，我得馬上送回晚鐘亭讓千歲姊上夾板。底下的七號主管已經被第七分塔私自焊併了另外六條排渣管，三天後的建城燈祭當晚就會全面洩壓。手冊原件我先帶回去抄核，你們千萬別再讓任何人靠近河岸暗渠。」\n\n班長看了一眼被毛巾小心托住的手腕，半點沒有起疑，神情卻因後頭那句話頓時失了血色，重重點頭：「快去治傷。倉庫外頭的遮掩跟警戒交給我們水務班來處理。」\n\n兩人一路快步趕回晚鐘亭。千歲一眼看見軒人護著Eraser左臂進門的姿勢，臉上的神情瞬間繃緊。她右手鐵木手杖在木地板上重重一頓，乾脆俐落地把工作檯上的鐘錶零件全數掃進木盒，鋪上一層乾淨白布。\n\n接下來整整一小時，晚鐘亭裡安靜得只剩牆上擺鐘規律的滴答聲。\n\n千歲戴上雙層放大鏡，先輕聲徵得Eraser點頭同意，隨即用最纖細的銀鑷子在裂縫兩側搭起三道極微小的臨時導流銀橋，將裡頭崩斷的兩根副迴路重新接引穩固，最後取兩片包了軟羊皮的杉木夾板，將她的左手腕平直妥善地固定在完全不受力的角度。\n\n軒人從頭到尾筆直站在工作檯對面，手裡還死死攥著那個沾滿煤灰的防水袋。\n\n「袋子放下。」千歲頭也不抬地收拾銀鑷子。\n\n軒人這才把防水袋放到桌角。\n\n「坐旁邊凳子去。你杵在那裡擋光，擺著一張欠了誰三百金幣的臉，對誰都沒有幫助。」\n\n軒人僵硬地坐下，視線依舊鎖在Eraser左腕的夾板上：「千歲姊，她的手……以後還能修好嗎？」\n\n「主迴路沒傷著，崩斷的是旁邊分擔壓力的兩根副線。」千歲摘下放大鏡，語氣平穩而務實，轉向Eraser，「臨時銀橋能保住妳手指的觸感，但絕對不准再用左手抹消術式，也不能提任何重物。要徹底把這道裂口補實，必須找到三百年前古工坊原配的『古銀絲』。拿到線之前，這副夾板一步也不能拆。」\n\nEraser低頭端詳包得整齊結實的左手腕，用完好的右手輕輕碰了一下杉木夾板的邊緣。\n\n「右手還能拿湯匙和筆嗎？」\n\n「吃飯、寫字、提油燈都不礙事。真到了非動用抹消不可的時候，右手也只准碰極小範圍的東西，絕不准硬扛。」\n\n「那就好。」Eraser輕輕吐出一口氣，轉頭望向身旁滿臉自責的軒人，「在下面如果不壓住那股暗紫逆流，防水門後面的管段會當場炸開。是我自己決定不放手的，不是你沒拉住我。」\n\n軒人張了張嘴，胸口像塞了一團浸水的棉花，沉得發悶：「我知道是妳自己決定的……可要是我早兩秒發現七號管壓力不對，或者剛才直接先卡死閥門——」\n\n「硬砸閥門的話，你原本就傷過的右肩今天會整個廢掉。」Eraser直視著他的眼睛，神色認真得沒有半分動搖，「軒人，我們是搭檔。搭檔的意思，不是只有你擋在我前面；在你有危險的時候，我也可以自己決定要不要出手。」\n\n軒人一時怔在原地，說不出話。\n\n千歲走過來，毫不客氣地拉過軒人破皮滲血的左手，倒上殺菌藥酒再一圈圈勒緊紗布，力道重得軒人倒吸一口涼氣。\n\n「好了，別再鑽牛角尖了。」千歲打完繃帶結，手掌拍了拍他的肩膀，語氣帶著資深工匠特有的犀利與乾脆，「那孩子可比你想得通透多了。她自己選的路，你心疼歸心疼，別把人當成一碰就碎的玻璃擺飾。真覺得過意不去，這幾天就別讓她用左手沾半點活——現在去把那本手冊跟銅片圖整理出來。對了，把工作檯底下備用的直柄鐵撬棍換進你工具包裡，你原本那根都快被咬成魚鉤了。」\n\n軒人低頭看著左手虎口纏得整齊結實的紗布，沉默兩秒，緩緩呼出一口長氣。\n\n他起身從工具抽屜裡取出備用的直柄鐵撬棍收進帆布包，又順手拿出一枚厚實的大號木製書頁夾，穩穩夾在桌上那本翻開的《白央散步指南》頁角，推到Eraser面前。\n\n「壓住書頁，妳單手看書就不用拿左手按著了。」\n\nEraser盯著那枚把紙頁壓得平平整整的木夾，伸出右手試著翻過一頁，嘴角浮起一絲極淡卻柔和的弧度。\n\n「很方便。謝謝。」\n\n## ５\n\n整個下午，晚鐘亭的三個人都在燈下反覆比對那串原始銅片管網圖與《第七分塔・排渣調度手冊》。\n\n核對得越細，屋裡的空氣就越像灌了鉛般沉重。\n\n第七分塔長榊原不僅焊死了城外的六條排渣管，更從三天前——也就是十月二十一日起，藉口「籌備建城燈祭供暖檢修」，派工程隊暗中將支爐的備用排壓支線接進了東石橋、水街與灰鐵巷的承重地基裡。\n\n局面成了一道徹底封死的死結。\n\n如果現在貿然找人強行關死七號主閥，無處宣洩的高壓廢火會順著新接的備用支線劇烈倒灌，直接把東石橋和沿岸民宅掀上夜空；可若照黃銅銘板上的古法，讓Eraser接入主控鐵箱執行全爐抹消，與支爐共用維持迴路的她會當場停止運作。\n\n唯一能同時保住灰鐵巷與Eraser的活路，就藏在古工坊圖紙角落的註記裡——先找到三百年前遺留的**「舊分離匣」**與**「古銀絲」**，修補好她的左手腕並將胸口花扣改裝成獨立供能，再把新接進地基的支線逐一隔離，最後才能安全切斷主控鐵箱。\n\n傍晚時分，千歲將謄抄得條理分明的管線異常報告塞進封蠟信袋，交給匆匆趕來的水務班班長，託他走水務班的急件管道，直接送交城中心管網總站負責公共安全的督察官。\n\n暮色很快吞沒了灰鐵巷。\n\n抬頭越過黑漆漆的屋脊往山坡高處望去，上層區已經試點起了慶祝三天後建城燈祭的暖金色魔導燈彩，璀璨得宛如白晝；而在山腳下的灰鐵巷裡，幾盞老舊的黃銅魔導街燈在地底魔力亂流干擾下黯淡閃爍，濕冷的青石板縫正靜靜吐出一縷縷反常溫熱的白汽，將低矮狹窄的巷道籠罩在一層詭異的死寂中。\n\n剛入夜不到半小時，狹窄巷道的盡頭驟然傳來一陣極不尋常的聲響。\n\n那是從巷口由遠及近、整齊劃一且沉重得令人心悸的鐵釘軍靴踏地聲。\n\n咚、咚、咚、咚——\n\n刺眼雪亮的強光伴隨著高壓晶石特有的低沉嗡鳴，猛然映透了晚鐘亭的磨砂窗玻璃，將窗欞的漆黑倒影斜斜拉長在木地板上。巷道裡頓時響起粗暴的喝斥與制式魔導警棍敲擊石板的聲響，街上居民慌張關門落栓的動靜接連響起。\n\n軒人一個跨步貼到門側木百葉縫隙前，往外一瞥，全身的血瞬間涼了半截。\n\n灰鐵巷東西兩端竟然全被堵死了。十幾名身披白底黑邊短披風、手持高出力魔導探照提燈與制式魔導警棍的**第七分塔武裝稽查隊員**正快步逼近，刺眼雪亮的燈光帶著細密的高壓嗡鳴，將昏暗的窄巷照得慘白如晝，也映出一張張毫無感情的冷硬臉孔。為首那名肩掛黃銅徽章的稽查隊長高舉著一紙蓋了分塔大印的拘捕令，嗓音冷硬地響徹整條窄巷：\n\n「第七分塔武裝稽查隊執行緊急公務。此巷內『晚鐘亭』鐘錶鋪涉嫌私藏舊鐘塔機密器材『零號』，並於今日非法潛入河岸調壓所、竊取機密調度手冊。兩側巷口即刻全面封鎖，無關居民一律禁止外出，違者視同共犯處置。」\n\n軒人咬緊下顎，瞬間明白了破綻出在哪裡。\n\n第七分塔定期巡檢暗渠維修口的人一定已經發現密封調壓所被撬、遺落的副冊失竊；再加上白天水務班敲牆動靜不小，多半被河岸倉庫附近的分塔眼線盯上了，一路循線追查直接鎖死了晚鐘亭。\n\n屋裡的空氣瞬間凝結得令人窒息。\n\n千歲沒有發出半句慌亂的聲音。她緩緩撐著鐵木手杖站起身，空蕩蕩的左褲管微微一晃，整個人卻宛如一根深嵌進石基的鑄鐵支柱般橫在了前店櫃檯前。她手腕一轉，將手杖粗端握緊在掌心，朝軒人極輕微地抬了抬下巴，視線直指後屋堆滿雜物的小後門。\n\n軒人立刻會意，無聲抓起剛換好新撬棍的帆布工具包甩上左肩，將Eraser嚴實擋在身後，右手已經悄然按上腰間的拆件短刀。雖然後巷多半也被封住了，但只要千歲在前門拖住十秒，他就能帶著Eraser翻牆往河岸水溝方向拚出一條退路。\n\nEraser靜靜站在他身後半步，沒有發抖，完好的右手自然垂在身側，平靜地凝視著那扇隨時會被撞開的木門。\n\n沉重的軍靴踏上了店門前的兩級石階。高出力魔導探照提燈的慘白強光幾乎貼上窗玻璃，門外傳來隊長冷酷的命令：\n\n「破門搜查。反抗者就地壓制，不准手軟。」\n\n一隻裹著鐵護腕的手高高舉起，眼看就要砸向木門門栓——\n\n刺耳的鐵輪煞車聲與戰馬長嘶驟然撕裂了窄巷的夜空。\n\n一輛通體漆黑、沒有任何多餘紋飾卻掛著深紅外勤風燈的雙輪馬車，絲毫不減速地直衝進狹窄的灰鐵巷，逼得巷口舉著高出力魔導探照提燈的稽查隊員狼狽往兩側屋簷閃避，最後在晚鐘亭門口不到三步的位置硬生生橫停下來，鐵輪在青石板上擦出一連串刺眼火星。\n\n車門猛然推開。\n\n一名身材高挑修長、約莫十九歲的黑髮青年翻身下車，穩穩落在慘白探照強光與深紅車燈交錯的光影裡。他穿著一身剪裁俐落的深黑色外勤長外套，右手自然垂在腰側，左手則自始至終套著一隻漆黑皮手套；在緊束的袖口縫隙間，隱約露出一截宛如濃墨般攀附在蒼白皮膚上的詭異黑紋。\n\n「是什麼人，竟敢衝撞第七分塔稽查隊的封鎖線！」稽查隊長厲聲喝斥，制式魔導警棍橫指馬車，身後十餘名隊員立刻舉起武器圍攏上來。\n\n黑髮青年連眼皮都沒抬一下。面對十幾盞高出力魔導探照提燈與制式魔導警棍的合圍，他只從容伸出沒有戴手套的右手，自懷裡亮出一枚在強光下泛著冷冽金屬光澤的**管網總站紅色特務徽章**。\n\n「白塔管網總站特務外勤，真崎夜一。」\n\n他的聲音並不高亢，卻冷得像冬夜裡淬過寒霜的鋼鐵，硬生生壓住了整條巷子的躁動。\n\n「依《緊急管網條例》第十四條，河岸調壓所異常一案與所有相關圖冊證人，已由管網總站正式接管。第七分塔稽查隊全數人員立刻撤至巷口警戒線外，不得干擾總站辦案。」\n\n稽查隊長的表情瞬間僵住，握著制式魔導警棍的指關節泛白，嘴角卻仍硬撐著頂回一句，高舉起手中的分塔文書：「我們持有榊原分塔長親簽的武裝拘捕令，追回的是第七分塔遺失的機密器材『零號』與內務手冊，總站無權插手分塔內務。」\n\n真崎夜一那雙毫無溫度的灰色眼眸緩緩轉向隊長，停頓了一秒。\n\n「你們三天前向總站遞交的失物申報單上寫的是『青銅減壓器匣』，屬於管網公用調壓組件，管轄權歸屬總站。至於手冊——現在已經作為緊急管網安全證物登入總站卷宗。」夜一收起徽章，語調平直得聽不出半點情緒起伏，「你現在可以選擇繼續往前走一步。我會把你妨礙緊急管網搶險的紀錄，連同第七分塔私改排渣管的副本，今晚一併呈送中央監察院。你自己衡量後果吧。」\n\n巷子裡陷入一片死寂，只剩高出力魔導探照提燈與制式魔導警棍的高壓嗡鳴聲在夜風中迴盪。\n\n稽查隊長額角滲出一層冷汗。他死死盯著夜一收進懷裡的總站紅色特務徽章，視線又不由自主滑向那隻靜靜垂在黑大衣身側、透著說不出壓迫感的黑手套左手，終於從齒間壓出一聲極低沉的吐息，像硬生生把髒話吞了回去，揮手下令：\n\n「全隊後退至巷口警戒線外。盯緊這家店，誰也不准放出去。」\n\n十幾名分塔隊員沉著臉退開十步，高出力魔導探照提燈在巷口連成一道慘白刺眼的光牆，帶著冰冷的高壓嗡鳴將晚鐘亭團團鎖在中央。\n\n下一秒，真崎夜一轉過身，沒有敲門，直接推開了晚鐘亭的木門。\n\n夜風捲著門外魔導提燈發熱的微焦臭氧味與寒意灌進店內。夜一邁步走到櫃檯前，灰色的視線先冷冷掃過軒人腰間未拔出的短刀與纏著紗布的左手，再掠過千歲緊握鐵木手杖的右手，最後在Eraser左腕的杉木夾板上停頓了極短的半拍。\n\n啪。\n\n他手腕一壓，將一份蓋著刺眼鮮紅印信的**管網總站緊急傳喚令**直接拍在木櫃檯上。\n\n「哪一位是不破軒人？」夜一的語速冷靜而緊迫，沒有半句多餘寒暄，「第七分塔剛簽發了武裝拘捕令，指控你們私藏舊鐘塔失物並竊取調壓所機密手冊。總站半小時前收到了你們託水務班轉交的異常抄本，同時調出了三天前分塔申報遺失『零號』的舊案。我憑總站條例，只能在巷口壓住這批人十分鐘。」\n\n他抬起冰冷的灰眸，目光落在軒人與桌角的防水袋上。\n\n「把你們從下面帶出來的調度手冊和銅片圖收好，現在立刻上我的馬車，去總站當面見榊主任。過了十分鐘，分塔的人重新拿到副署令破門，屆時誰也保不住這家店。」\n\n——第四章完——\n", "mtime": 1795001401.7710454}, {"filename": "05_第五章_橋上的黑釘與白塔的算術.md", "content": "# 第五章　橋上的黑釘與白塔的算術\n\n## １\n\n門外巷口高出力魔導探照提燈的慘白強光映在磨砂玻璃上，伴隨著低沉的高壓嗡鳴，像一圈靜靜合攏過來的冰冷鐵網。\n\n軒人沒有立刻去拿櫃檯上那紙緊急傳喚令。他先越過真崎夜一的肩線往窗外瞥了一眼——十幾名第七分塔武裝稽查隊員正守在巷口警戒線外，泛著微光的制式魔導警棍橫在身前，視線死死鎖定晚鐘亭這扇木門。\n\n這顯然不是能靠講道理化解的場面。\n\n軒人伸手拿起那紙蓋著鮮紅鋼印的公文，低頭飛快掃過附在後頁的舊案抄本。最上方確實是三天前——十月二十一日——由第七分塔向鐵道與管網管理處遞交的『遺失物緊急回收令』，名目欄裡端正寫著**『古工坊遺留青銅減壓器匣（代號：零號）』**；而在公文最底端，剛加蓋了一道今晚的新鮮紅印：**『因河岸調壓所查獲管線異常併聯，原回收程序暫緩；通知發現人帶齊相關圖冊，即刻前往管網總站進行核對。』**\n\n軒人眼底沒有露出一絲波動，更沒有開口去點破那個『青銅匣』有多荒謬。他平靜地將公文折回原狀，伸手把桌上的《第七分塔・排渣調度手冊》原件、原始黃銅銘板連同抄錄圖面一併收進帆布工具包裡，拉緊帆布扣帶。\n\n真崎夜一冷眼看著他的動作，灰色的視線隨即越過櫃檯，緩緩掃過這間狹小的鐘錶鋪。\n\n工作檯上堆滿拆到一半的銅齒輪、游絲與舊暖爐閥片，根本不見半個三百年前的青銅大匣子。他的目光最終停在桌邊——那裡站著一名留著淡粉紅色長髮、用深藍髮帶束在腦後的少女。她穿著灰鐵巷常見的淺燕麥色素色粗棉裙與微立領開襟外套，淺灰細領巾將脖頸與領口遮得嚴嚴實實，左手腕上則牢牢固定著一副包了軟羊皮的杉木夾板。\n\n門外十幾雙分塔稽查隊的眼睛還在盯著這家店。一旦夜一離開、十分鐘時限一過，就算分塔的人不敢當街縱火，也絕不可能放過留在屋裡的人。軒人與千歲交換了一個極短的眼神，兩人瞬間達成無聲的共識——絕不能把已經落入分塔視線的她單獨留在晚鐘亭。\n\n「我跟她一起去。」軒人將帆布工具包甩上左肩，刻意避開還在隱隱作痛的右肩，語氣冷靜而果斷，「白天進河岸調壓所的時候，我這位遠親表妹也在場。這家店裡只有她認得三百年前古銅片上的舊標記，她左手腕也是白天幫我拉生鐵閥門時被反彈震裂的。巷口外頭全是第七分塔的人，我不可能把一個傷患單獨留在店裡——正好順路帶她去總站醫務室覆診。」\n\n夜一的視線在軒人與少女之間緩緩移過，停頓了足足兩秒。\n\n少女站在燈下，沒有半分慌張或退縮，只安靜地用完好的右手輕輕扶住左臂夾板，平靜地回望著他。\n\n從總站外勤的立場來看，把所有進過河岸調壓所的目擊者集中帶回看管，本來就比留一個在外頭落入分塔手裡乾淨得多。夜一沒有多問，也沒露出任何親近或探究的態度，只是極淡地點了點頭。\n\n「可以。所有目擊證人一併帶回總站核實，省得我跑第二趟。」他轉身朝門外微抬下巴，嗓音冷硬卻字字清晰，「記住一點——只要你們帶出來的手冊與證詞經得起核對，今天沒人能拿第七分塔編出來的假罪名扣人。」\n\n站在櫃檯內側的千歲一直沒有出聲。她拄著鐵木手杖慢步走過來，既沒泡茶，也沒像招呼熟客那樣寒暄半句，只板著臉從工作檯抽屜裡摸出一張剛草草寫就的薄紙，順手塞進Eraser的右手掌心。\n\n軒人眼角餘光瞥見了紙上的墨跡。千歲極有分寸，上頭連半個關於「迴路」或「銀橋」的字眼都沒寫，只有一句再普通不過的醫傷叮囑——**『左腕腕骨深裂，已上夾板固定，嚴禁任何受力或彎折』**。\n\n緊接著，千歲又從身後櫥櫃抓出一包用舊油紙紮緊的乾糧，裡頭塞著兩塊今早沒吃完的冷起司麵包，力道不輕地往軒人懷裡一推。\n\n「帶著，別等會兒在總站門檻上餓昏過去。」\n\n說完，這位少了一條左腿的女工匠抬起頭，隔著櫃檯筆直盯住門邊的真崎夜一，語調冷硬得像剛淬過火的生鐵。\n\n「聽清楚了，總站的特務外勤。店是我看門的，人是你帶走的。過了十分鐘要是分塔那些人敢破門，我自己會應付；可這兩個孩子今夜要在總站少了半根指頭，明天天亮之前，我就把這份調度手冊抄成兩百份，貼滿第七區每一面告示牆。」\n\n夜一迎上她銳利如刃的視線，神情絲毫未變，只低頭看了一眼懷錶。\n\n「十分鐘只剩不到七分。上車。」\n\n三人一前一後推門步入夜色。巷口高出力魔導探照提燈將石板路照得慘白如晝，第七分塔稽查隊長的視線像淬了毒的鐵釘般死死釘在他們背上，卻礙於夜一胸前那枚總站紅色特務徽章，硬是不敢越過警戒線半步。車門合攏，漆黑馬車在石板路上猛然一震，甩開巷口那片刺目的慘白強光，疾馳入夜。\n\n## ２\n\n漆黑馬車沿著河岸大道全速駛向城中心的管網總站，中途必須跨過橫貫大河的「東石橋」。\n\n車廂裡沒有點燈，只有窗外飛掠而過的黃銅魔導街燈，將冷白的光條一道道斜切過昏暗的廂壁。\n\n軒人坐在靠窗一側，讓Eraser坐在自己左手邊的內側位置，避免馬車顛簸時把她固定著夾板的左腕撞上車框。對面的長椅上，真崎夜一背脊筆直地靠著廂壁，視線微垂望著窗外漆黑的河面，從上車到現在沒有吐出半個字。\n\n車廂內的空氣緊繃得像拉滿的弓弦。\n\n軒人坐在暗處，目光幾次不受控制地掠過對面青年的膝頭。從巷口亮徽章到登車，夜一的右手始終俐落自如，唯獨那隻套著漆黑皮手套的左手一直平放不動；每當魔導街燈的光影斜斜掃過他緊束的深黑袖口，袖口縫隙下那截爬在蒼白腕骨上的墨黑紋路，便彷彿具有呼吸般，隨著車身震動極輕微地起伏了一線。\n\n軒人下意識多看了兩眼。\n\n對面的青年甚至沒有轉過頭，灰色的眼眸依舊鎖在窗外飛逝的河水上，嘴唇微啟，丟出冷冰冰的四個字：\n\n「少盯著看。」\n\n軒人背脊微僵，隨即沉著臉收回視線。車廂裡再次落進令人窒息的沉默，誰也沒有再多問半句。\n\n馬車又疾馳了不到十分鐘，前方的河風裡忽然捲來一股熟悉的刺鼻硫磺焦味。\n\n還沒正式駛上東石橋的引道，軒人已從前窗縫隙裡察覺了異狀——前方百餘步外的石橋中央，大片反常濃密的白霧正從青石路面底下洶湧翻騰起來，衝天而起的滾燙蒸氣將橋側的魔導路燈罩成一團慘白。橋頭已經亂成一團，對向幾輛馬車的拉車馬受驚人立嘶鳴，路人驚呼著往橋頭兩側狂奔逃離。\n\n「抓穩！」\n\n夜一冷聲吐出兩個字。幾乎在同一瞬間，車夫死命勒緊韁繩，鐵輪在濕滑的青石板上拖出刺耳的尖嘯，馬車剛衝上橋頭平臺便硬生生急停下來。\n\n軒人一把護住身旁的Eraser穩住重心，推開窗扇往外望去。\n\n前方三十公尺處的東石橋中段，厚實的青石橋面早已被地底衝出的高壓頂開了一道兩公尺寬的焦黑裂口。一根暗埋在橋墩下方的第七分塔備用排渣支管發生劇烈爆裂，滾燙黑泥、暗紅爐火與扭斷的鐵護欄絞作一團，已然在橋心凝聚成一頭長著四條生鐵巨爪、形似龐大蜈蚣的**「橋骸獸」**。\n\n那頭怪物前半身正連同背後的暗紅主火線一起，死死纏在一輛十人座公共載客馬車底部的「魔導減重輪軸」上。這類大型公車為了輔助跨橋爬坡，車廂底盤都嵌有減重魔導迴路；此刻迴路被高壓爐火強行侵蝕逆流，不僅徹底失去減重作用，還不時爆出刺眼的暗紅電弧，硬生生拖著恢復數噸死沉的車廂往斷裂橋欄外滑落。大半截車尾已經懸在下方翻湧的黑河之上，木質車架發出令人牙酸的擠壓斷裂聲，車內傳來乘客絕望的哭喊與拍窗聲。\n\n在軒人手掌按上車門把手的同一瞬，對面的真崎夜一已經推門躍了下去，深黑外勤長外套的下擺在濃霧裡劃出一道銳利的弧線。\n\n「所有行人退至橋頭警戒線後，不准靠近橋中段。」\n\n夜一的嗓音不高，卻像鐵錘敲在混亂的橋面上。他沒有抽刀，也沒有貿然衝向那頭火光閃爍的怪物，而是快步掠至公車前側，一把拉開嚇癱在馬蹄邊的公車車夫——緊接著，軒人清楚看見夜一抬起右腳，竟將掉在石板路中央、正把亮光直射向公車車底的一盞手提風燈直接踢進了路邊溝渠。\n\n風燈一滾落溝底，橋欄高處的黃銅魔導街燈立刻將整輛傾倒的公車與石橋基座投出一大片完整而濃黑的影子。\n\n夜一在十步外的濕石板上單膝跪落，右手一扯摘下左手那隻漆黑皮手套，露出五根蒼白修長的手指，隨即將整隻左掌直接按進身前的地面陰影裡。\n\n嗡——\n\n一陣低沉得幾乎令人耳膜發麻的共鳴順著石板傳開。\n\n軒人瞳孔驟縮。只見夜一左腕下那些原本安靜的墨黑紋路瞬間如活蛇般沿手背竄上指尖，直接貫入地面的黑影中，化作四道漆黑如鍛鐵的實質影釘，跨越十步距離從公車底部的陰影裡破地而出——喀嚓四聲，將正往河裡打滑的前輪軸與青石橋面死死釘在了一起。\n\n劇烈下滑的載客馬車猛然定格在半空。\n\n「車裡的人別往後門擠，全部往最前排移動。」夜一維持著左掌貼地的姿勢，額角青筋微浮，嗓音沉穩如鐵。\n\n可纏在後輪魔導減重輪軸上的橋骸獸仍在瘋狂向後拉扯，木車底盤咯吱作響。一名趕來的橋頭巡查員見狀，咬牙拔出腰間的「制式魔導切割器」衝到車尾側面，試圖切斷纏死輪軸的火線與鐵爪；不料切割器前端的魔導刃才剛靠近車尾半尺，就被高壓爐火與減重輪軸交織出的狂暴魔力逆流正面衝中，切割器握柄當場爆出一團刺眼火花徹底熄火，巡查員本人更被反震氣浪掀翻在地，虎口焦黑地摔退了好幾步。\n\n「把魔導器收起來，別靠近車底的逆流場！」夜一冷聲喝止。光靠釘住前軸顯然撐不了多久，可周遭高濃度的魔力逆流偏偏讓所有制式魔導救援工具一靠近就炸火花。\n\n軒人沒有半秒遲疑，抓起帆布工具包翻身躍下車廂，回頭低聲交代一句「待在橋頭暗處別過來」，便全速衝至搖搖欲墜的公車側翼。\n\n單膝跪地的夜一抬眼掃過他腰間與肩上完全沒有半點魔導紋路的工具包，直截了當開口：\n\n「會固定車體嗎？」\n\n「這正是我的專長。」\n\n「把前車轅鎖死在左邊花崗岩石柱上，別踩進後輪的紅光範圍。」\n\n「收到。」\n\n在這片足以讓任何魔導器械共鳴爆裂的逆流場邊緣，全場也只有軒人這雙完全不帶魔力的「空值」雙手，以及他包裡那套不嵌半顆晶石的純精鋼滑輪組，能在不引發魔力共鳴爆炸的情況下貼近架設支點。軒人伸手從工具包抽出二十公尺長的精鋼鋼索，面不改色地貼近竄動著暗紅殘弧的車架前端，三兩下穿過生鐵拖曳環，飛奔至橋側那根半人粗的花崗岩石柱旁連繞兩圈，掛上純精鋼雙輪滑輪組用力一扯鎖死。鋼索繃直發出低沉嗡鳴，瞬間替夜一分擔掉前輪軸一半的龐大拉力。\n\n這時，並沒有留在後方的Eraser也快步趕到了公車右側相對安全的石欄邊。她左手夾板穩穩收在胸前不動，冷靜掃過傾斜的車廂結構，清亮的嗓音直接穿過嘈雜傳進車內：\n\n「後門底下已經懸空是河面了，不能踩。把前排右側的木窗框整扇卸下來，從窗口爬出來。」\n\n「窗框變形了，推不開。」車裡一名穿工作服的壯碩男乘客拚命拿手肘撞著卡死的木窗。\n\n「窗框最上緣有兩枚老式橫移鐵扣，往左撥到底就能整塊卸掉。」Eraser精準報出車窗構造。\n\n軒人剛鎖死滑輪索，聞言一個跨步踩上歪斜的前輪踏板，右手拔出扁頭拆件短刀插進變形窗槽上沿，用厚實的刀背抵住卡死的鐵扣：「裡面的先生，數到三一起往外推——一、二、三。」\n\n喀啦。\n\n整扇木窗框應聲脫落彈出。軒人順手接住拋向路邊，與及時趕上橋頭的兩名巡查員裡應外合，將裡頭哭喊的婦人、孩童與工人一個接一個從窗口拉上安全路面。\n\n眼看第八名乘客剛被拉出車窗，另一名從對街匆忙趕來的巡查員為了看清河面下的怪物，竟扛起一盞高亮度魔導探照燈，直接衝到公車側面把燈門打了開來。\n\n刺目慘白的強光筆直打進公車車底，宛如一柄利刃，將夜一與前輪軸之間連成一片的濃黑陰影硬生生切開了一道雪亮的空白。\n\n啪。\n\n一聲宛如鋼弦崩斷的悶響炸開。夜一左臂上的黑紋猛然向後倒縮一截，喉間溢出一記壓抑的悶哼，按在石板上的五根指節瞬間褪得像白
