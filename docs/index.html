紙一樣毫無血色。失去影釘支撐的公車車身驟然向河面劇烈滑落了十幾公分。\n\n「把那盞大燈移開！」夜一咬緊下顎下令，冰冷的聲音第一次透出一絲緊繃。\n\n軒人就在旁邊，眼角餘光將剛才那一瞬間的變化看得清清楚楚——強光切斷黑影、夜一左手的黑紋同時倒縮，再加上剛才進場前夜一特地踢走那盞路中風燈的舉動，背後的規則剎那間在他腦海裡串聯成形。\n\n那隻左手的能力，必須藉由連成一片的影子才能咬住目標。\n\n軒人反應極快，一步跨過去直接接過巡查員手裡沉重的探照燈架。他根本沒有去關燈，反而順勢將燈頭用力一轉，穩穩卡進公車斜前方的石欄凹槽裡——刺眼的白光不再照向車底，而是從正前方斜斜壓射過去，反而將整輛公車投向夜一腳邊的影子拉得更黑、更長、更濃密。\n\n黑影重新連通的剎那，夜一左掌再度重重壓落。四道黑釘破影而出咬死前軸，下滑的公車瞬間穩穩定住。\n\n跪在十步外的夜一驀地抬頭，那雙灰眸裡掠過一絲極銳利的訝異，隨即冷聲確認：「鎖死那個角度，別讓任何人碰那盞燈。」\n\n「知道了。」軒人騰出手衝回窗口。\n\n此時第九名乘客剛翻出窗框，臉色慘白地回頭指著車廂最深處喊道：「最裡面還有一位老人家，車子歪倒的時候長椅翻過去壓住他的右腿了，爬不出來。」\n\n軒人踩上踏板探頭往裡一望。\n\n只見車廂最末排，一名滿頭白髮的老先生正被翻倒的沉重實木長椅死死壓著小腿；而在老先生背後不到二十公分處，橋骸獸前端兩條燒得暗紅發黑的生鐵外殼觸肢已經捅穿了後車板，焦糊濃煙滾滾湧入車廂，冰冷的鐵爪眼看就要抓上老先生的後背。\n\n「前窗還能撐多久？」軒人回頭低問。\n\n「最多一分鐘。看清退路再進去。」夜一額角已經滑下冷汗。\n\n軒人一眼掃過車廂頂部貫穿前後的黃銅扶手桿，伸手把肩上的帆布工具包摘下交給窗旁的Eraser，雙臂一拉黃銅桿，乾淨俐落地翻身鑽進了劇烈傾斜的車廂。\n\n## ３\n\n車廂木地板斜得像一道滑梯，四處散落著震碎的玻璃渣與滾燙黑煙。\n\n軒人左腳勾住前排座椅鐵腳穩住重心，俯身檢視壓在老先生右小腿上的實木長椅。長椅本身還沒起火，只是底部的固定鐵軸整個扭歪，死死卡進了地板縫隙裡。\n\n「老先生，我把長椅邊緣抬高一點，您順著左邊把腿抽出來。」\n\n老先生滿臉冷汗地點了點頭。\n\n軒人雙手扣緊長椅底緣，剛憋住一口氣往上一提——八天前在舊鐘塔拉傷、今天早上又在調壓所石板上重重磕過的右肩頓時炸開一陣撕裂般的劇痛。整條右臂瞬間痠軟脫力，險些讓沉重的木椅重新砸落下去。\n\n他下顎一緊，立刻放低重心，改用左膝頂住長椅下緣，憑藉腰腹與腿部蹬伸的力道，硬是將實木長椅向上頂開一道足夠的縫隙，幫老先生把受傷的右腿抽了出來。\n\n「抓緊我胸口的衣領，千萬別碰右肩。」軒人將老先生的一條手臂架上自己完好的左肩，半拖半護往前方窗口撤退。\n\n就在兩人剛退到車廂中段的瞬間，後方傳來一聲刺耳的木板碎裂聲。一條裹著厚重生鐵外殼、表面焦熱冒煙的觸肢猛然撞穿後壁，帶著一股嗆人焦臭，如沉重的鐵鞭般直抽向老先生後背。\n\n右肩痛得根本抬不起來。軒人沒有半點遲疑，立刻旋身將老先生嚴實護進懷裡，左手抽起腰間的扁頭拆件短刀往前一橫架擋——纏著紗布的左手虎口瞬間在握柄的緊繃裡崩裂滲血。他心裡十分清楚，這一下生鐵重擊光靠單手短刀根本擋不住，猛烈的反震力會連著他和老先生一起撞穿前車壁。\n\n就在鐵爪即將砸上刀背的剎那，車廂內側被探照燈拉得漆黑筆直的那片牆壁陰影驟然翻湧隆起。\n\n兩道漆黑如鐵的影釘破影而出，精準鉗住那條生鐵觸肢的活動關節，牢牢將它釘死在車廂中段的實木立柱上。\n\n「快出來！」窗外傳來夜一繃到極限的低聲催促。\n\n軒人借勢把老先生托舉上窗框，由外頭的巡查員與Eraser接穩扶落地面，自己隨即單手勾住窗沿翻身躍出車外。\n\n「巡查員立刻帶所有乘客撤回橋頭石亭後面，越遠越好，這輛車隨時會甩尾。」軒人雙腳剛踩實石板便高聲喊道。\n\n兩名巡查員早被眼前的險況嚇得臉色發白，連忙攙扶著老先生與另外九名乘客快步退向三十步外的橋頭石亭後方。橋頭原本就積著厚重的沸騰白霧，加上這輛龐大傾斜的載客車廂斜橫在路中央，當巡查員背對車尾拉起警戒繩時，整個橋頭方向已經徹底看不見車尾底下的死角。\n\n確認外圍清場完畢，夜一這才收回伸進車廂的影釘。\n\n「前軸有鋼索鎖死了，退開五步。」夜一緩緩站起身，指尖上的黑紋轉暗又亮，俐落地撤掉前軸影釘，轉手按向後方陰影，讓四道黑釘重新咬死公車的**後輪軸**，「你去石柱那邊收副索，我從側面把車尾拉偏十幾公分，把下面那東西的抓鉤扯脫。」\n\n軒人會意，奔回花崗岩石柱旁將滑輪副索緊緊纏繞柱角，雙腳抵緊石欄，用全身體重往後壓下。\n\n「鎖穩了，拉。」\n\n夜一左掌向外用力一扣，凍得發白的指節青筋浮現。釘住後軸的黑釘同時發力，硬是拖著沉重的車尾向左平移了十幾公分——\n\n可就在此時，異變突起。\n\n原本縮在後輪擋泥板內側的橋骸獸本體並沒有鬆口，反而被這一拉徹底撕開了遮蔽。一根足有手腕粗、連著橋墩破裂排渣管的**滾燙主火線**驟然被扯得筆直，暴露在車尾側面的空地上。失去外殼束縛的暗紅火線表面劇烈鼓脹，透出足以熔斷生鐵的刺眼白熾紅光，發出鍋爐爆炸前的尖銳嘯鳴。\n\n那是隨時會把整段東石橋炸成碎石的臨界火壓。\n\n夜一灰眸驟縮，額頭冷汗直落——他左手的負荷已經逼近極限，一旦鬆開影釘或再拉動分毫，那根主火線就會當場引爆。\n\n「退開，主火線要炸——！」\n\n夜一急促喝止的話音還卡在喉間，一道披著深灰褐色開襟外套的纖細身影，卻比他的警告更快一步掠了過去。\n\n是Eraser。\n\n她沒有絲毫猶豫，固定著杉木夾板的左手穩穩垂在身側分毫未動，快步貼近車尾，右手先扶住冰冷真實的車廂木板穩住重心，隨即朝那根嘶嘯膨脹的滾燙主火線探出了食指與中指。\n\n「住手——！」夜一的聲音陡然繃緊。就算白塔重裝冷卻班趕到現場，對付這種高壓主火線也得架起三門水砲持續降溫半小時才敢切斷；血肉之軀直接碰上去，整條手臂會在瞬間化為焦炭。\n\n下一秒，所有刺耳的嘯鳴同時截斷。\n\nEraser的兩根白皙手指，精準輕觸在主火線最核心的起筆點上。\n\n啪。\n\n一縷克制卻純粹的白光自指尖一閃而逝，彷彿一瞬間抽乾了空氣裡所有的灼熱與狂暴。\n\n沒有巨響，沒有火浪反撲，甚至沒有留下一絲餘溫。那根連精鋼都能燒融的暗紅主火線，竟在兩根手指落下的不到一秒之內寸寸瓦解熄滅，化作一捧冰冷得毫無溫度的細碎白灰，被河風一吹，安靜地散落在潮濕的青石板上。\n\n失去供能連接的橋骸獸發出一聲空轉般的低鳴，順著破裂橋洞縮回暗河深處；懸空的公車後輪隨即「匡噹」一聲平穩落回石橋路面，劇烈晃了兩下，徹底恢復靜止。\n\n遠處橋頭大霧裡，十名脫險的乘客還縮在石亭後大口喘氣，只當是特務外勤與工匠聯手把馬車拉了回來。\n\n而在車尾近旁，半跪在石板上的真崎夜一徹底僵住了。\n\n他低著頭，死死盯著飄落在自己靴尖前的那幾撮冰冷白灰，又猛然抬眼望向少女那隻連半點焦煙都沒沾上的白皙右手。就在此時，因為剛才疾步上前發力，Eraser頸間那條淺灰細領巾滑開了一道細縫，在魔導路燈冷白的光線下，恰好露出了別在微立領內側的半枚金屬物件——\n\n一枚右下角花瓣缺了一小角的銀色五瓣花扣。\n\n軒人心口猛然一緊。看著對面青年驟然收縮的灰眸，他幾乎能聽見所有零碎線索在對方眼底逐一咬合的聲響——\n\n舊鐘塔遺失的古工坊「零號」。第七分塔含糊其辭謊報的「青銅減壓器匣」。三百年古工坊獨有的五瓣花徽記。以及不需要任何冷卻、徒手一秒將活爐火直接抹成冰冷白灰的禁忌異能。\n\n真崎夜一臉上的血色迅速褪去，灰色的眼眸裡翻湧著極深的震駭，足足沉默了三秒都沒能吐出一個字。\n\n終於，他緩緩站起身，將手中那隻凍得毫無血色的左手收進漆黑皮手套裡，每一個動作都冷靜得令人發寒。他走近半步，將嗓音壓得極低，低得只有軒人與Eraser聽得見，語調卻凌厲如冰：\n\n「把領巾拉嚴實。」\n\nEraser靜靜伸出右手，將淺灰細領巾重新拉回下巴下方，遮住了那枚缺角花扣。\n\n「聽清楚了。」夜一盯著她的眼睛，眼底沒有半絲玩笑，「剛才那一手，絕不能在任何白塔正規魔導師、或是橋頭巡查員面前露出來。白塔研究了三百年怎麼壓制支爐逆流，從來沒有人能把成形的主火線直接抹成冰冷白灰。要是讓本塔那群研究官聽見半點風聲，他們會不惜掀翻整個總站，把妳直接鎖進內塔解剖室。」\n\n「我們知道。」軒人不動聲色地橫跨半步，將Eraser護在身後，右手悄然垂在刀柄旁，神情同樣冷硬如鐵，「在灰鐵巷的時候，這件事從頭到尾就沒讓外人見過。現在就看你打算怎麼處置了，特務外勤。」\n\n夜一深深看了軒人一眼，既沒點頭也沒否認，只彎腰撿起剛才Eraser放在車旁的帆布工具包，伸手拋進軒人懷裡。\n\n「你的包。」夜一頓了頓，視線冷冷掃過軒人微沉的右肩，「進車廂前右肩就帶著傷吧？剛才抬長椅的時候你右肩塌了下去，換左手抽刀時慢了半拍。哪裡受了傷動手前先說清楚，外頭接應的人要是算錯你出力的時機，會害所有人一起掉進這條河裡。」\n\n軒人接住工具包，肩頭還在隱隱抽痛，唇線抿緊，只低聲回了一句：「知道了。」\n\n夜一沒有多留一秒，轉身快步走向橋頭，用三言兩語冷靜交代完巡查隊長封橋搶修與護送乘客的事宜，隨即回過頭，朝漆黑馬車的方向微微偏首。\n\n「上車。直接去總站。」\n\n後半程的馬車裡，氣氛冷到了極點。\n\n車輪滾過石板大道，發出單調而沉悶的聲響。對面長椅上，真崎夜一重新坐回陰影裡，緩緩扣緊左手黑手套的金屬腕扣，整張臉隱在昏暗的光影中，讓人完全看不透他在想什麼。\n\n軒人靠在車壁上，纏著滲血紗布的左手悄悄搭在帆布包裡的短刀木柄上，全身神經繃到了極限；身旁的Eraser將右手輕放在膝頭，姿態安靜平直，淡粉紅色的長髮在窗外掠過的黃銅魔導街燈下泛起微弱的冷光。\n\n車廂正一路駛進白塔權力的中樞。而他們兩人誰也不知道，等會兒推開總站大門的那一刻，對面這個已經知曉真相的特務外勤，究竟會遵守承諾，還是會直接把她交給白塔。\n\n## ４\n\n管網總站座落在下層與中層交界的白石坡道上。\n\n推開沉重的雙開銅門，迎面而來的是與灰鐵巷截然不同的冰冷秩序。高挑空曠的白色石砌大廳裡燈火雪亮，卻亮得沒有半點溫度；靴底踩在打磨光滑的白石地磚上，每一步都敲出空洞而冷冽的回音。\n\n大廳西側的長椅上，十幾名剛被緊急撤離的河岸低窪街區住戶裹著灰毛毯瑟瑟發抖；東側牆壁前，幾名身穿筆挺灰制服的總站職員面無表情地撤下日常管網圖，換上印著刺眼紅線的強制疏散告示。整座建築就像一具精密而冷酷的國家機器，正以無人能夠抗拒的效率在深夜裡持續運轉。\n\n穿過大廳，通往內側核心辦公區的廊道口設著厚重的鐵欄哨卡。哨卡正中央立著一座鑲嵌感應晶石的「魔導感應安檢拱門」，側面連著一座精密的黃銅刻度儀表盤——在白央這座魔導都市裡，正常人類只要邁步走過拱門，頂端的感應晶石就會自動感應體內的基礎魔力亮起綠光，同時掃描是否夾帶未登記的活化魔導器。兩名佩帶制式短劍與制式魔導警棍的武裝駐站衛兵分立拱門兩側，目光冷峻地盯著來人。\n\n夜一冷著臉亮出紅色特務徽章，率先邁步穿過安檢拱門。拱門頂端的感應晶石立刻亮起一抹清晰的綠光，側面儀表指針平穩跳動了一格。緊隨其後的Eraser雖然刻意收斂了氣息，但她體內維持運作的獨立微弱魔力反應仍讓頂端晶石正常亮起了柔和的淡綠微光，順利通過了感應檢驗。\n\n唯獨當軒人邁步穿過安檢拱門時，頂端的感應晶石竟像一團空氣過去了一樣，半點光都沒亮，連側面儀表盤上的刻度指針都紋絲不動。\n\n守門的兩名武裝衛兵同時愣了一下。右側衛兵伸手敲了敲完全沒有反應的黃銅玻璃表殼，低頭看了一眼讀數徹頭徹尾為零的儀表盤，眉頭緊緊皺起，吐出兩個字：\n\n「……空值？」\n\n兩名衛兵對視一眼，隨即像看著什麼罕見的異類般驟然提高了戒備，右手雙雙按上腰間的制式魔導警棍，上前一步徹底攔住軒人的去路。\n\n「安檢拱門無魔力反應，無法透過共鳴排除攜帶物風險。」為首的衛兵眼神冷硬地盯著軒人肩上的帆布包，毫無通融餘地地指向旁邊的檢驗檯，「非總站編制人員進入核心辦公區，須核驗姓名，並接受人工搜查，暫時繳存所有純物理金屬刃具與重型工具。」\n\n軒人眉心微跳，看了身旁的夜一一眼。夜一的灰眸在拱門頂端那顆黯淡無光的晶石上極快地掠過一線，神色平靜，沒有替他說情，只淡淡吐出兩個字：「照規矩。」\n\n在兩名武裝衛兵戒備而冷漠的注視下，軒人只能打開帆布工具包接受人工搜查，親手將裡頭那根替換過、純物理的直柄鐵撬棍與腰間的扁頭拆件短刀一樣樣交上檢驗檯。衛兵逐一仔細檢查、登記編號並鎖進身後的鐵櫃，這才遞出一張薄薄的金屬寄存牌。\n\n踏過哨卡走進漫長的白石走廊時，軒人雙手空空如也。左手虎口的紗布滲著血絲，右肩沉重抽痛，身旁則是一名左腕裂開、正被兩座權力機構緊緊盯上的少女——那種手無寸鐵踏入龐大官僚機關腹地的壓迫感，沉甸甸地壓在胸口每一寸骨頭上。\n\n走廊盡頭的主任辦公室門外，同樣佇立著兩名全副武裝的待命衛兵。\n\n夜一抬手叩門兩下，推開厚重的實木大門，引著兩人走了進去。\n\n辦公室裡瀰漫著粉筆灰、舊羊皮紙與冷掉的黑咖啡氣味。站在巨幅鋪圖木桌後的總站主任姓榊，是個四十多歲、兩鬢斑白的資深工程官，深灰外套的袖口沾著白灰，鼻樑上架著一副細金屬框眼鏡，臉上每一道法令紋都像尺規刻出來般冷硬。\n\n聽見腳步聲，榊主任連場面話都省了，只對門外助手簡短吩咐加派搶險班支援東石橋，隨即抬起鏡片後的銳利目光，直接鎖定軒人。\n\n「東石橋的事，剛才巡查哨已經用傳聲筒報上來了。算你們反應快。」榊主任沒有請他們坐下，右手食指直接重重敲在桌上那份十月二十一日的舊公文上，「切入正題吧。第七分塔三天前申報遺失在舊鐘塔底層的『青銅減壓器匣』，你們進去過，東西藏在哪裡？」\n\n軒人沒有半點退縮，徑直踏前一步，將防水袋裡那本《第七分塔・排渣調度手冊》原件重重拍在木桌邊緣。\n\n「榊主任，那張回收單只是第七分塔長榊原用來掩人耳目的藉口。他們把城外一至六號排渣管全焊死了，三天後的十月二十七日晚上十點，他們打算趁上層區施放煙火，把累積三十年的廢渣一次灌進灰鐵巷西側三條街的地基裡。」\n\n榊主任臉上沒有半分意外，甚至連眉頭都沒挑一下。他隨手翻開桌上早已攤開的水務班抄本，語氣冷硬得像在宣讀一份例行報廢清單：\n\n「這點不用你提醒。傍晚收到水務班急件後，我已經派暗線下外圍檢修口核實過了。針對榊原私改管網的彈劾急件，一小時前已經發往王都中央監察院——但王都的監察使趕過來至少要五天，根本趕不上。」\n\n榊主任抬起頭，將桌上那張巨幅第七區管網圖調轉過來，推到軒人面前。地圖上，三道鮮血般刺眼的紅鉛筆粗線，無情地將河岸、水街與灰鐵巷西側整整三條街圈了起來。\n\n「加上今晚東石橋這一次突發爆管，底下的七號支爐撐不到十月二十七日燈祭了。」榊主任的手指重重壓在紅線邊緣，每個字都冷得像冰，「根據剛匯總的壓力讀數，支爐的極限最多只剩兩天——也就是後天，十月二十六日日落，燈祭前夜。總站已經正式啟動最高應急預案：從今晚起強制撤離紅線內所有居民，後天日落前，直接從城外埋設炸藥炸斷整條地下主幹道，把失控的爐渣硬生生封死在河岸這一側。」\n\n辦公室裡陷入一片死寂。\n\n軒人低頭盯著紅線框住的那片街區。染布坊、松井婆婆的烤餅攤、水務班倉庫、晚鐘亭斜對面的整片老屋——幾百戶居民世代生活的地方，全被這三道紅線劃成了必須捨棄的代價。\n\n「炸斷主幹道，紅線裡面的房子跟街區會怎麼樣？」軒人聽見自己的聲音乾澀發緊。\n\n「人會全部安全撤出來，但地基下方的蓄水廊會徹底坍塌，地面上大半民宅會報廢，水街跟灰鐵巷西側的水道也會永久廢棄。」榊主任隔著鏡片平靜地直視他，沒有一絲動搖，「我知道你住在那裡。但在沒有任何手段能安全關停主控鐵箱的前提下，犧牲三條空街的磚瓦，換幾千條活下來的人命——這是總站唯一成立的止損算式。」\n\n榊主任說完，右手已經順勢伸向桌角那枚決定封區起爆的黃銅官印。\n\n就在他指尖即將觸及印柄的那一秒——\n\n喀嚓。\n\n一聲清脆的金屬落鎖聲在眾人身後響起。\n\n真崎夜一不知何時已經轉過身，親手將那扇厚重的實木大門徹底合攏，順手撥下了沉重的黃銅內鎖，將門外的武裝衛兵完全隔絕在走廊上。\n\n榊主任動作一頓，皺眉抬眼：「夜一，你在做什麼？」\n\n真崎夜一轉過身，背對鎖死的大門，灰色的眼眸平直迎向自己的直屬上司，嗓音低沉而字字清晰：\n\n「主任。第七分塔在三天前的公文上撒了謊。舊鐘塔底下根本沒有什麼青銅減壓器匣——他們要找的古工坊『零號』不是死物，就是眼前這位小姐。剛才在東石橋上，我親眼看見她徒手伸出兩根手指，不到一秒就把支爐爆出來的主火線直接抹成了冰冷白灰。」\n\n啪嗒。\n\n榊主任指間夾著的那支紅鉛筆，就這樣直直脫手滑落，滾過地圖邊緣，掉在堅硬的白石地板上斷成了兩截。\n\n這位掌管全城地下命脈二十年的資深工程官緩緩直起身。他隔著鏡片死死盯住站在桌前的淡粉紅色長髮少女，臉上的表情先是劇烈的錯愕與震駭——可那股震駭竟然只停留了不到三秒鐘，隨即迅速冷卻、沉澱，化作一種比震怒更令人背脊發寒的冷酷理性。\n\n他沒有嘆息，沒有表現出半分同情，更沒有去撕掉那張舊回收令。\n\n相反地，榊主任動作沉穩地從桌角抽出那本厚重的硬殼法典——**《市政緊急動員法》**，用沾著粉筆灰的手指精準翻到其中一頁，攤平在軒人與Eraser面前。\n\n「三百年前的古工坊竟然真造出了能自己走動的活體『零號』……難怪榊原那傢伙只敢掩人耳目，向總站謊報成青銅匣。」\n\n榊主任抬起眼，眼神冷得像在丈量一塊金屬構件的承重極限，徑直鎖定了Eraser。\n\n「既然妳有辦法一秒抹滅高壓主火線，那剛才的算式，總站就必須重新驗算一遍。」\n\n他的嗓音在空曠冰冷的辦公室裡緩緩響起，沒有半點情緒起伏。\n\n「《市政緊急動員法》第七條：凡遇重大公共管網災變，管網總站有權緊急徵用轄區內一切具備處置效能的公私器材與古遺物。現在把兩樣東西放上天平——左邊，是一個左手受損、強制啟動後可能當場停止運作的古工坊遺物；右邊，是灰鐵巷與水街幾百棟民宅、數千名市民世代賴以維生的家業，外加整個第七區的地下基礎建設。」\n\n榊主任雙手撐在桌沿，身體微微前傾，在雪亮的吊燈下投出一片極具壓迫感的陰影。\n\n「黃銅銘板上寫得清清楚楚，『零號』原本就是為了緊急接入主控鐵箱而造的。如果妳現在無法向我證明強行接入主控鐵箱一定會失敗——依市政緊急法，我有權現在就叫門外的衛兵進來扣押妳，後天日落之前，直接送進七號支爐爐心。」\n\n辦公室裡的空氣瞬間凍結如冰。\n\n軒人全身肌肉猛然繃緊，幾乎在話音落地的同一瞬間便橫移半步，硬生生擋在榊主任與Eraser之間。可他的帆布包空空蕩蕩，鐵撬棍與短刀全被鎖在走廊外的衛兵鐵櫃裡；他赤手空拳、右肩撕裂、左手滲血，站在國家機器最冰冷的房間中央，面對著門外一呼即至的武裝衛兵。\n\n就在這連呼吸都快停滯的緊繃死寂之中——\n\n門邊響起了一記極輕微的皮靴挪動聲。\n\n真崎夜一沒有開口反駁上司，也沒有說出半句慷慨激昂的場面話。他只極短地側眼望了軒人一下——軒人胸口猛然一震，立刻記起不到一小時前，這個人在晚鐘亭門口親口立下的承諾。只要證詞經得起核對，今天沒人能拿分塔的假罪名扣人。\n\n黑衣青年沉默地往側邊跨了半步。\n\n他腳上那雙黑色外勤靴，穩穩踩進了龐大橡木書桌在燈下投出的那道濃黑陰影線裡。與此同時，垂在他身側那隻套著漆黑皮手套的左手微微一動，右手拇指搭上腕間，極緩慢、極清晰地——\n\n喀噠。\n\n他鬆開了黑手套的金屬腕扣。\n\n那聲微小的金屬彈響，在死寂的辦公室裡清脆得宛如刀刃出鞘。\n\n榊主任的目光極快地往門邊斜掃過去，從夜一踩進桌影的靴尖，緩緩移上那截已露出少許墨黑紋路的腕口。屋裡沒有誰看不懂這名總站王牌外勤無聲亮出的底牌——\n\n真敢開口叫門外衛兵進來強行押人，第一個被影釘釘死在走廊石板上的，會是總站自己的衛兵。\n\n榊主任壓在法典封面上的指節驀地收緊。那張平日總是冷硬如刻尺的臉龐沉了下去，鏡片底下的視線結了一層寒霜。\n\n就在整間辦公室瀕臨徹底決裂的邊緣，一直安靜站在軒人身後的Eraser卻輕輕拉了拉軒人的衣角，主動繞過他的肩膀，平靜地走到了書桌正前方。\n\n她沒有哭喊，沒有哀求，甚至連語調都沒有半絲起伏。\n\n她先用右手將千歲寫的那張傷勢紀錄輕輕按在《市政緊急動員法》翻開的條文上，隨即微抬左臂，將杉木夾板邊緣的布帶撥開了一點。在辦公桌雪亮的吊燈直射下，那道從掌根延伸進腕骨的細密瓷裂痕跡、以及裂口深處忽明忽暗跳動的破碎銀光，毫無保留地暴露在老工程官的眼皮底下。\n\n「主任，你的算式錯了。」\n\n少女的聲音清澈、平直，冷靜得幾乎比桌上的法典還要銳利。\n\n「我的左腕今天上午在河岸調壓所硬扛二次逆流時，已經出現了五公分多長的結構裂痕，裡面兩條分擔壓力的副迴路徹底崩斷，現在只靠晚鐘亭臨時搭的三道銀橋勉強支撐。如果不先用古銀絲修補左腕，後天把我強行塞進主控鐵箱，承受不了全爐壓力的雙手迴路會在十秒鐘內徹底崩斷。」\n\n她抬起雙眸，平靜地直視著榊主任。\n\n「那不是『以一件古遺物換回三條街』的等價交易。抹消程序在第十秒中斷，只會把整座七號支爐的失控壓力瞬間反彈出來，引發比現在猛烈十倍的二次全爐逆流——到時候塌的不是西側三條街，而是整個第七區連同半個中層區一起被炸上夜空。這場毫無勝算的賭注，總站承擔得起嗎？」\n\n榊主任的視線定格在那道雪亮燈光下泛著微弱銀光的薄瓷裂口上，又低頭重看了一遍紙上簡短卻精準的受力警語，嘴角兩側緊繃的肌肉微微抽動了一下。\n\n不必誰再多費口舌，在管網總站任職二十年的工程官一眼就能算出結構裂痕在滿載高壓下意味著什麼——那根本不是可承受的耗損，而是會直接引爆整座第七區的引信。原本以為能拿上天平稱重的籌碼，在冷酷的物理現實面前沒有任何價值。\n\n榊主任緩緩向後靠回椅背，沉重地吐出一口氣，目光落回鋪滿桌面的一疊急件卷宗上。\n\n就在他移開手肘的那一刻，一張剛才由助手順手放在桌角、墨跡還沒完全乾透的緊急巡邏通報露了出來。標題用紅筆圈得醒目：**『河岸舊堤防內側斷層於今晚出現異常蒸氣滲漏與殘響異動，疑似地層空腔鬆動』**。\n\n一直細心注視著桌面的Eraser，視線驀地停在那張急報的座標數字上。\n\n她立刻伸出右手食指，先點在剛才從調壓所帶出來的原始古銅片圖角落——那裡刻著一個雙重方匣的工坊圖記；隨即指尖順著河岸等高線往上一滑，精準落在了總站那張斷層急報的座標紅點上。\n\n「這不是普通的地層鬆動。」Eraser抬起眼，語速清晰篤定，「三百年前地陷沉進河岸堤防底下的『沉沒舊工坊』保管庫，入口就在這個斷層座標裡。平時通道完全封死進不去，但總站剛剛收到的斷層殘響異動，說明這兩天七號支爐外溢的高壓，正好把舊工坊外圍的『殘留通道』重新撐開了。」\n\n榊主任眼神微凝：「沉沒舊工坊？裡面有什麼？」\n\n「兩樣東西。」Eraser的指尖壓在雙重方匣標記上，「第一，能徹底修好我左腕結構裂痕、並把我領口花扣改成獨立供能的『古銀絲』；第二，三百年前古工坊留來分離管網迴路的『舊分離匣』。有了這兩樣東西，不必讓我陪葬，也能在外面把支線分段隔開，再安全關停主控鐵箱。」\n\n軒人立刻踏前一步，順勢接過話頭。面對這種只看損益比的老官僚，訴諸感情沒有意義，必須用他聽得懂的算術把條件釘實。\n\n「榊主任，我們不要您停止今晚的居民疏散，也不要您撤掉城外的炸藥部署。距離後天十月二十六日日落還有整整兩天。您只要批給我們明天早上五點到七點——就兩小時。讓我們趁著天亮前下河岸斷層，把『舊分離匣』和『古銀絲』取出來；下午就在外圍做一次實地隔離測試。」\n\n軒人直視著榊主任的眼睛，字句乾脆俐落：\n\n「如果明早七點我們空手出來，或者下午測試出半點差錯，後天日落一切照您的計畫炸斷主幹道，我們絕無二話。這兩小時不耽誤總站半點疏散與爆破進度，零成本、零額外風險，卻能替總站換一個保住三條街外加整座七號爐心的機會——這道算式無論怎麼核算，都是總站佔盡優勢。」\n\n辦公室裡靜得只剩下牆上掛鐘沉重而規律的滴答聲。\n\n榊主任沒有馬上回答。他先盯了軒人三秒，又轉頭看向仍站在桌影邊緣的真崎夜一。\n\n「夜一。拋開你的個人立場，從總站外勤的專業角度回答我——明天清晨五點，河岸舊斷層那個被殘響撐開的入口，你釘得住兩小時嗎？」\n\n真崎夜一這才緩緩抬腳，從書桌投下的陰影線裡退回半步，順手將黑手套的金屬腕扣重新「喀噠」一聲扣回原位。他邁步走近木桌，低頭審視地圖上標註的河岸斷層方位與日出方位角。\n\n「清晨五點到七點，太陽還沒越過東側山脊，現場光線角度最穩定。」夜一的語氣恢復了慣常的冷硬公允，「配合兩盞定角風燈，兩小時我釘得住。但我必須死守在斷層口維持固定，不能陪他們進去。」\n\n「兩小時，夠我們走一個來回。」軒人立刻接話。\n\n榊主任摘下細金屬框眼鏡，緩慢而用力地捏了捏泛酸的鼻樑。整整十秒鐘，這間高挑冰冷的辦公室裡沒有任何人出聲，彷彿全城的命運都在老工程官沉思的眉眼間被反覆稱量、驗算。\n\n終於，榊主任俯身撿起地上那半截摔斷的紅鉛筆，重新戴上眼鏡。\n\n他拉過三天前第七分塔遞交的那張『回收青銅減壓器匣（代號零號）』公文底單，手腕沉穩有力地劃下兩道貫穿整頁的鮮紅斜槓，隨即抓起桌旁的鋼印重重蓋下**『封存作廢』**四個大字，一把鎖進辦公桌最底層的生鐵抽屜裡。\n\n緊接著，他抽出一張全新的特別行動批文，飛快寫下時限與編號，蓋上總站主任印信推過桌面。\n\n「好。這份申請我批准了。」\n\n榊主任抬起頭，語氣絲毫沒有轉軟，反而更加冷峻威嚴。\n\n「紅線區疏散與城外爆破準備今晚照常推進，一分鐘都不准停。明天早上五點整，我派兩名信得過的總站資深巡查員，帶雙重安全繩、備用定角風燈與傳聲筒跟夜一去河岸斷層接應。記清楚了——只給你們兩小時，七點整無論拿沒拿到『舊分離匣』，都必須立刻撤出斷層。」\n\n話音微頓，榊主任目光銳利地掃過屋內另外三人，每一個字都像鐵釘般砸落下來。\n\n「另外，從這一秒起，『零號』的真實身分列為總站最高封口令。除了這間屋子裡的四個人和晚鐘亭的千歲之外，誰也不准對外吐露半個字。別誤會我是在發善心保妳——要是讓王都研究官或第七分塔知道『零號』是活的，這座爐子還沒停下來，上面派來的特使就會先衝進第七區把人搶走，我整個管網止損計畫會徹底崩盤。在十月二十六日日落之前，妳對外就只是晚鐘亭不破軒人的遠親表妹。明白嗎？」\n\n「明白。」軒人沉聲點頭。\n\n「明白。」Eraser也平靜應聲。\n\n臨出門前，榊主任將剛封存的『當事人現況確認』附聯推到桌邊，遞過一支沾墨鋼筆：「手續歸手續，既然暫時註銷了分塔的失物案，留個紀錄。」\n\nEraser伸出右手接過鋼筆。她在當事人姓名欄裡一筆一劃寫下工整的『Eraser』，接著移到現住址那一欄，停頓了半拍，穩穩寫下一行字——\n\n**『第七區灰鐵巷，晚鐘亭二樓』**\n\n走出主任辦公室，走廊外待命的武裝衛兵依舊面無表情。行經哨卡時，軒人遞上寄存牌，重新領回了自己冰涼沉手的直柄鐵撬棍與扁頭拆件短刀。將短刀重新插回腰鞘的那一刻，他緊繃了一整晚的背脊這才略微鬆開了幾分。\n\n## ５\n\n離開管網總站時，夜色已經深得像墨一樣濃。\n\n漆黑馬車再次駛上河岸大道。經過已經架起木柵封鎖線的東石橋橋頭時，車廂緩緩停下。\n\n真崎夜一推開車門，站在橋頭冷風裡回望車內的兩人。他臉上的表情依舊淡漠難測，灰色的眼眸在昏黃燈火下只留下一句簡短的交代：\n\n「我去橋下盯一下臨時支撐。明天早上五點整，河岸斷層北側的舊貨運門匯合。遲到一分鐘，勘查許可直接作廢。」\n\n「放心，我們四點半就會到。」軒人點頭。\n\n夜一沒有多說，抬手闔上車門，高挑漆黑的背影很快沒入了東石橋頭翻湧的白霧裡。\n\n馬車重新啟動，朝著灰鐵巷方向平穩駛去。少了對面那股令人神經緊繃的壓迫感，車廂裡這才真正安靜下來，只餘下從骨頭縫裡湧上來的深重疲憊。\n\n軒人靠進椅背，長長呼出一口氣，這才想起懷裡還揣著出門前千歲塞進來的油紙包。他伸手掏出來解開細麻繩，裡頭是兩塊早已冷透、卻仍散發著濃郁麥香與起司鹹味的硬皮麵包。\n\n他挑出完整一點的那一塊，遞到身旁的Eraser手裡。\n\n「墊墊肚子吧。今晚從總站裡走出來，感覺比在暗渠下面打兩頭鐵顎獸還要累。」\n\nEraser用右手接過冷麵包，低頭安靜地咬了一小口，細細嚼完才輕聲說：「今天如果不拿出左腕裂痕跟沉沒工坊，榊主任真的會叫門外的衛兵進來。」\n\n「是啊。但他最後還是照算術低了頭。」軒人彎了彎嘴角，咬下一大口硬皮麵包，目光望向窗外漆黑的河岸，「而且——那個叫夜一的傢伙，比我們想像中更守信用。」\n\n想起辦公室裡那記輕輕挪進桌影的腳步聲，以及那聲清脆解開的黑手套腕扣，軒人眼底掠過一絲複雜卻踏實的神色。那個總是冷冰冰的特務外勤從頭到尾沒說過半句好聽話，卻在最致命的關頭，無聲地替他們擋在了國家機器的刀口前面。\n\n車廂在夜色裡輕輕晃動。Eraser吃完半塊麵包，轉頭望著窗外一盞盞向後滑落的黯淡魔導路燈，淡粉紅色的長髮在微光裡顯得格外柔和。過了片刻，她忽然輕聲開口：\n\n「軒人，明天早上進到沉沒舊工坊裡面的時候，可能會看見很多以前留在那裡的『殘響』——就像今天調壓所那個值班員一樣，不停重複三百年前最後動作的虛影。」\n\n「嗯，我記得。只要不擋在原本的動線上就沒事。」\n\n「裡面有一個以前對我很好的副工匠長。」Eraser垂下眼簾，視線落在自己膝頭那副包著軟羊皮的杉木夾板上，聲音很輕，卻異常清楚，「如果明天我在裡面看著他發呆、停下來太久的話，你就直接叫我的名字，拉我走。不用因為怕我難過就一直等在原地。」\n\n軒人轉過頭，看著她被窗外黃銅魔導街燈映得明暗交錯的側臉，沉默了兩秒，鄭重地點了點頭。\n\n「好，到時候我一定叫妳，拉著妳往前走。」他停頓了一下，語氣微沉，「那作為交換，明天在下面不管遇到什麼要搬要扛的重物，妳也不准因為知道我右肩痛，就自己偷偷拿右手硬撐。我們扯平。」\n\nEraser微微抬起眼看了他一會兒，輕輕點頭。\n\n「好。」\n\n馬車緩緩轉進灰鐵巷口。巷道裡早已經沒有第七分塔稽查隊的高出力魔導探照提燈，只餘下總站疏散組留下的幾盞白色警戒風燈。\n\n軒人透過車窗最後往山坡高處看了一眼。遠在半山腰之上的上層區正燈火通明，璀璨的金黃燈彩連綿成片，提前慶祝著三天後的建城三百週年燈祭；而在車輪碾過的灰鐵巷深處，一層薄而滾燙的白霧正悄無聲息地貼著青石板蔓延開來，靜靜等待著距離現在不到幾個小時的清晨五點。\n\n——第五章完——\n", "mtime": 1795001484.7859192}, {"filename": "06_第六章_沉沒工坊的殘響與山坡上的紫星果.md", "content": "# 第六章　沉沒工坊的殘響與山坡上的紫星果\n\n## １\n\n天還沒亮透，河岸斷層邊緣的舊貨運門前，已經籠罩在一層白茫茫的晨霧裡。\n\n十月二十五日清晨五點，冷霧貼著河面緩緩翻湧，吸進肺裡帶著生鐵與濕泥的寒氣。兩名總站派來的巡查員站在門外，正低頭檢視貨運門上方原就架好的高處吊索絞盤，將雙路安全繩逐一穿過滑輪、拉緊試扣。兩人動作熟練俐落，臉上沒有多餘的表情，交談時嘴邊吐出筆直的白氣，目光時不時掠過站在霧裡的少年與少女，透著總站人員一貫不帶私情的戒備。\n\n然而，透過那扇半開的生鐵貨運門往裡望去，門內卻是一條被三百年前的夕陽染成暖橘色的古老石板街。\n\n門外是清晨五點的深秋冷霧，門內卻停駐在三百年前傍晚五點二十分的黃昏裡。\n\n真崎夜一將一塊厚重的黑帆布掛上貨運門左側的支架，讓門框與地面之間的陰影連成完整的一片。他摘下左手手套，將左掌平平按進黑布投下的陰影裡。腕間漆黑的紋路順著鐵框無聲爬行了一圈，原本在晨霧中微微浮動、像是隨時會散開的門內光景立刻定格下來，凝成一幅被釘在牆上的舊油畫。\n\n「入口已經釘住了。你們從這扇門進，也必須從這扇門出來。」夜一低頭瞥了一眼懷錶，「我最多能維持兩個小時，六點五十分之前必須回到白線外面。」\n\n軒人將左右兩條不同顏色的安全繩分別扣在腰帶兩側的鐵環上，往後輕拉三下。門外的兩名巡查員各自回拉確認，他這才拿起掛在胸前的方形魔導傳聲器，按下側邊純機械結構的通話鍵——總站配發的傳聲器內嵌獨立小魔石，不需要使用者自身注入魔力，只要壓下物理簧片就能接通迴路，是少數連「空值」的他也能順手操作的制式裝備：\n\n「聽得到嗎？」\n\n夜一瞥了一眼腳旁的接收盒：「講完話要把按鍵放開，不然收不到外面的聲音。」\n\n軒人連忙鬆開拇指。接收盒裡很快傳出夜一清晰而冷淡的嗓音：「現在通了。記住，每隔十分鐘報一次位置；要是傳聲器失聯，不要繼續往前走，立刻退回上一個能通話的轉角。」\n\nEraser站在軒人身旁。她穿著在灰鐵巷買的素色粗棉便服與微立領開襟外套，衣領扣得整整齊齊，淡粉紅色長髮用深藍色髮帶束在身後，左手腕依然固定著杉木夾板，右手則提著一只空布套；至於照明，因為沉沒工坊內部充滿高濃度的支爐外溢魔力，一般靠指尖魔力觸發的魔導提燈進去就會頻頻閃爍失靈，反倒是軒人平時因為「空值」點不亮魔導器而隨身攜帶的玻璃鯨油燈最不受干擾，千歲便另外替Eraser也準備了一只輕便的防風鯨油燈。今天她沒有帶那本舊書，布套裡只放著抄好的舊工坊平面圖，以及半截粗桿鉛筆。\n\n夜一指了指門檻下方用粉筆畫出的白線：\n\n「跨過這條線，裡面的街道就是支爐外溢魔力維持的『過去殘響』。不要隨便觸碰看起來像活人的影子，更不要跟著他們走進沒有安全繩的地方。」\n\n兩人點了點頭，並肩跨過了那道白線。\n\n## ２\n\n靴底踏上門內石板路的那一瞬間，河岸邊濕冷刺骨的晨霧彷彿被一道無形的界線切斷，迎面吹來的，是一陣帶著煤爐餘溫與烤麥餅香氣的乾燥晚風。\n\n暮色低垂，橘紅色的斜陽將石板縫拉出細長的影子，卻沒有絲毫屬於河谷的寒意。軒人低頭看去。靴底方才在門外沾上的河泥，在乾燥的石板上印出兩個清晰的深色腳印；往前走出兩步再回頭，那兩個泥印依然安靜地留在原處，沒有被三百年前的夕陽抹去。而身後門外的白霧已經縮成一個長方形的淺框，真崎夜一半跪在框內，單手按著黑布陰影，遠遠望去彷彿一幅剪影。\n\n「走右邊這條石階。」Eraser以右手提著鯨油燈，望向前方微微起伏的緩坡，「以前工坊的保管庫，在登記室下面。」\n\n街道兩旁有幾道人影正在活動。\n\n穿粗布圍裙的果販將紅蘋果一顆一顆排進木箱裡，每放到第三顆，他便停下來在圍裙上擦擦手；下一秒，木箱裡的蘋果無聲消散，他又低頭從第一顆重新擺起。對面二樓的木窗向外推開，一名婦人探出半身，朝街面喊著別把推車停在門前，話音剛落便扣上窗扇，過了十幾秒又以分毫不差的角度再次推開。\n\n若只看眼前這幅光景，這裡與灰鐵巷傍晚收攤前的街市幾乎沒有兩樣；可那些日復一日重複著同一截光陰的身影，既聽不見外來者的腳步，也永遠不會迎來真正的入夜。溫暖的橘色暮光反而將整條長街浸在一種近乎透明、無邊無際的寂靜裡。\n\nEraser沿著路側安靜前行。經過果販身旁一處空無一物的牆角時，她的腳步很自然地往外繞開了半步。\n\n軒人注意到這個細微的動作：「那裡以前放著什麼嗎？」\n\n「以前果販會把裝壞果子的空木箱放在那個角落。」Eraser低眼看向空蕩蕩的牆根，青石板邊緣確實留著一道被木箱反覆拖曳磨出的淺槽，「不是每天都有，只是以前走習慣了。」\n\n軒人沒有提醒她現在那裡空無一物可以直接走，只是順著她的步伐一同繞過了那個角落，接著蹲下身，用白粉筆在轉角牆根畫下第一個返回箭頭。\n\n穿過一條不長的石砌拱廊後，前方出現了一棟半嵌在山壁裡的二層石造建築。門楣上懸著一塊漆色斑駁的木牌，寫著『工坊器具登記室』。\n\n走到門檻外時，Eraser的腳步明顯放慢下來，右手指尖不自覺收緊了布套提把。\n\n軒人越過敞開的木門往屋裡看去。\n\n石桌後方坐著一名身穿古工坊制服、兩鬢微白的中年男人。他的左手袖口沾著一小塊黑墨，正拿起桌角的一方麻布，仔仔細細地將左手腕上的墨跡擦淨，再將麻布四邊對齊疊整齊，輕輕放回左邊的木托盤裡，這才伸手翻開桌上的紙卷。\n\n聽見門口的動靜，桌後的人影抬起頭，眼角浮起一抹溫和而略帶倦意的笑：\n\n『回來啦？東側的試作品先放進架子裡，晚點再清點。』\n\n說完，他又低下頭看起文件。過了約莫十秒，他左手腕上再度浮現出那塊黑墨；他又拿起麻布仔細擦拭一遍，疊好放回托盤，抬頭用完全相同的語氣說道：\n\n『回來啦？東側的試作品先放進架子裡，晚點再清點。』\n\n「他就是妳之前提過的……以前對妳很好的那位副工匠長？」軒人站在她身側，不自覺放輕了嗓音。\n\n「嗯。」Eraser的視線靜靜停在桌角那塊疊得方方正正的擦手布上，「這一段殘響是傍晚交班前的時候。白天他忙著改圖，擦完手會直接把布丟在桌邊；只有到了傍晚準備下班前，才會把布疊整齊放進托盤裡。」\n\n軒人輕輕點頭，沒有催促她，只抽出扁頭拆件短刀，在登記室門框下方的石壁上劃出一道極淺的短痕。\n\n等桌後的副工匠長在夕陽裡安靜地重複完第三遍擦手動作，門框上那道新劃出的刀痕依然清晰留在原處，沒有絲毫淡去。\n\n「這間屋子的牆壁跟石桌都是實體，只有桌面上的茶杯和人影是殘響。」軒人收起短刀，「我們去抽屜裡找開地下保管庫的門牌吧。」\n\nEraser跨過門檻，在石桌前停步。\n\n桌後的副工匠長恰好在這時抬起手，將一塊長方形的木牌往桌沿推了推：\n\n『下面的門用這塊牌子開。拿了什麼工具，記得在簿子上寫名字。』\n\n那塊半透明的木牌滑到桌邊便停了下來。Eraser沒有伸手觸碰桌上的虛影，只是順著軒人鯨油燈照亮的位置，伸出右手，緩緩拉開石桌下方的真實抽屜。\n\n抽屜裡積著一層細灰，裡頭靜靜躺著一塊右下角略有缺口的深色硬木門牌，旁邊壓著一本紙頁發黃、卻依然真實存留下來的羊皮領用簿。\n\nEraser拾起那塊沉甸甸的真門牌，指腹輕輕撫過邊緣磨圓的舊缺口，將它妥善收進外套口袋裡。\n\n## ３\n\n通往地下保管庫的石梯相當狹窄，只容一人側身下行。\n\n軒人走在前方，一邊將左側紅繩扣進石壁鐵環，一邊按住胸前的傳聲器回報位置：「我們到登記室下面的石梯了，兩條安全繩都正常。」\n\n傳聲器裡很快傳來夜一簡短冷靜的聲音：「入口穩定。先確認底下的門打得開，別在下面耽擱太久。」\n\n「收到。」\n\n走到石梯中段時，軒人轉過半身，抬高鯨油燈替身後的Eraser照亮台階，順口問道：\n\n「剛才上面那位副工匠長，以前常跟妳說話嗎？」\n\n「他不太擅長聊天，但每次我把撿回來的舊東西擦乾淨擺好，他都會幫我檢查一遍。」Eraser低頭望著腳下被踩得微微發亮的石階，「那本《白央散步指南》本來是旅客掉在山下的，封面破了一角，別人說沒用了要丟進爐子燒掉，是他撿回來擦乾淨交給我的。」\n\n「他人還真不錯。」\n\n「嗯。那時候我以為，沒有人來領的失物就只能銷毀。他告訴我，書跟壞掉的零件不一樣，只要還有人願意讀，留著就有用。」\n\n話音輕輕落下時，兩人正好走到了石梯盡頭。\n\n眼前是一扇低矮卻極為厚重的雙層精鋼保管門。門邊石壁上留著一條明顯高過軒人頭頂的陳年水痕，說明三百年前大崩落引來河水倒灌時，水位曾一路淹過這裡；幸好這扇嵌著厚重鉛條與石膏漆的古式密閉水門咬合緊密，歷經三百年浸蝕仍未滲入一滴河水，替門內完整守住了乾燥。\n\nEraser取出那塊深色硬木門牌，送進門側的長方形凹槽。\n\n門板深處響起一記沉悶的齒輪鬆動聲，整扇精鋼水門卻只往內挪開一指寬的縫隙，就被裡頭生鏽膨脹的防潮卡榫牢牢頂住；與此同時，順著那道窄縫往裡看去，門框內緣與精鋼門栓四周竟還殘留著一圈三百年前防範外人硬闖的「魔力感應防禦刻紋」，在幽暗中泛著微弱卻尚未失效的淡藍冷光。\n\n「主鎖是機械卡死，但門框內緣還留著防撬的魔力感應防禦刻紋。」Eraser退後半步判斷道，「一般有魔力的探索者或白塔技師只要伸手拿工具去撬門栓，體內散溢的活體魔力就會瞬間觸發防禦電弧。我的左手現在綁著夾板，沒辦法伸進去幫你抹消。」\n\n「防活體魔力的刻紋，那再加上機械卡死，對我們來說反而是好消息。」\n\n軒人蹲下身仔細察看門縫。換作城裡任何一名能點亮觸發式魔導器的正常人，此刻手掌一靠近門縫就會引爆防禦電弧；但軒人體內是徹頭徹尾的「空值」，當他伸出完好的左手、將扁頭拆件短刀貼上精鋼門栓時，門框上的魔力感應防禦刻紋根本偵測不到半點活體魔力反應，就像碰到一塊毫無生命的石頭般安靜，連一絲火花都沒冒出來。\n\n換作平時，他大可直接用右手揮動撬棍硬撬，將鏽死的門栓頂開；但今天出門前他答應過千歲和夜一，絕不拿昨天拉傷的右肩硬撐，便轉頭看向Eraser，指了指門框側面那根連動門牌凹槽的解鎖小拉桿：\n\n「Eraser，門邊那根小拉桿有門牌的權限保護，不會觸發刻紋，但得一直往下壓著，裡面的鎖簧才會縮回去。不需要很大力氣，妳用右手能按住嗎？」\n\nEraser走上前，伸出右手試著往下按了按：「這個很輕，可以。」\n\n「好，手一覺得酸就馬上跟我說。」\n\n一個是擁有古工坊最高權限的「零號」，一個是全身上下不帶半點魔力、連防禦刻紋都完全無視的「空值」。軒人讓她用右手穩穩壓住解鎖小拉桿，自己則以完好的左手將扁頭拆件短刀深深插進門栓縫隙，再將腰間備用短繩套在門環與右靴踏扣之間，在防禦刻紋毫無反應的沉寂中，藉著腰腿發力往後一蹬。\n\n喀啦。\n\n鏽死的門栓在純物理的巧勁下清脆彈開，從頭到尾連半點電弧都未曾亮起，沉重的精鋼水門便緩緩向內敞開。這對「零號」與「空值」的搭檔，彷彿天生就是為了打開這種誰也碰不得的古工坊死鎖而湊在一起的。門內沒有絲毫潮黴味，只湧出一股帶著陳年黃銅與乾燥油紙氣息的涼意。\n\n保管庫約莫十坪大小，四面鐵架上井然有序地排列著幾只以防潮油布包裹的扁平木箱。兩人對照抄來的平面圖編號，很快在最裡側標著『零號專用維護具』的第三層鐵架前停下腳步。\n\n軒人小心解開外層油布，將那只大小接近普通工具箱、外框由厚重黃銅打造的扁平匣子捧了下來，輕放在乾燥的石台上掀開上蓋。\n\n匣內分為上下兩層。上層放著一冊包覆油紙的舊圖冊，旁邊是一小卷泛著柔和月白微光的「古銀絲」；下層則嵌著一座結構精密清晰的「雙槽座」，左右兩側各排著一列精細的黃銅接線扣，正中央刻著一朵五瓣花凹槽——大小恰好能讓Eraser領口的花扣穩穩卡進去，將連向地底支爐的舊線與新接的供能線安全分開。\n\n「找到了，這就是『舊分離匣』和古銀絲。」軒人暗暗鬆了口氣，拾起那卷觸手柔軟微涼的古銀絲遞給Eraser，「有了這卷線，回去千歲姊就能幫妳把左腕的裂痕徹底修好了。」\n\nEraser用右手接過那卷細如髮絲的銀線，小心地收進布套裡。\n\n軒人正準備合上匣蓋，視線卻忽然停在鐵架最內側——那裡壓在一塊黃銅鎮紙底下的，是一張折疊得整整齊齊的散頁羊皮紙。\n\n那張羊皮紙的質地明顯比三百年前的古物新上許多。軒人將它緩緩展開，鯨油燈暖黃的光暈落在工整而略顯急迫的鋼筆字跡上，落款日期依照舊曆折算下來，正是九年前的十一月十四日。\n\n**『本月七號支爐首次發生異常逆流，波及灰鐵巷外環，暴漲的爐壓也短暫撐開了這座沉沒舊工坊的殘留通道。我趁著這道空隙從第三分塔潛入這裡，取走保管庫內的一枚「備用花瓣校準片」，即刻趕往灰鐵巷事故現場止損救人。』**\n\n**『我不想驚動沉睡在鐘樓底座裡的「零號」本體，因此將舊分離匣留在原位；只是，這枚備用花瓣校準片與零號領口的花扣本就是記憶同源、彼此共振的構造。在承受高負荷、強行抹消逆流爐火的瞬間，這股共振極可能連帶燒損並剝落沉睡本體領口花扣的對應一角——這絕不是我願意見到的代價。』**\n\n**『一旦動用這枚校準片，白塔本塔必定會察覺有人私取古工坊遺物，追兵很快就會追上來。所以在動身之前，我先在這裡留下這份絕筆。事成之後，我會帶著殘片一路北行，前往三號支爐城「霜鐘鎮」引開耳目與追兵。如果日後有人再度打開這座保管庫，請代我轉告零號——活下去，別讓自己淪為焚燒的薪柴。　——前第三分塔首席技師・賀蘭』**\n\n軒人捏著那張邊緣略微發脆的羊皮紙，站在鐵架前久久沒有出聲。\n\n九年前的十一月十四日。灰鐵巷外環。\n\n昨天在河岸舊調壓所翻見那頁被撕毀的舊交接表時，他只知道九年前父母遇難的那場「舊礦坑坍方」其實是七號支爐的首次逆流；直到此刻看見這封信，他才明白當年那名叫做賀蘭的首席技師，竟然在事發當晚潛入過這座沉沒工坊，取走了一枚與Eraser花扣同源共振的備用花瓣片趕去灰鐵巷救人。\n\n軒人下意識垂下眼，看了一眼自己握著羊皮紙、從十歲起就測不出半點魔力反應的左手。\n\n九年前那個火光與黑煙吞沒整條外環舊街的夜晚，住在事故中心的住戶裡，只有當時八歲的他一個人活了下來。他還記得自己醒來時躺在孤兒院的病床上，渾身上下連一點燒傷都沒有——只是從那以後，他的身體就變成了徹底的「空值」。\n\n難道九年前賀蘭技師帶著那片花瓣趕去灰鐵巷救下的人，跟那場事故裡唯一活下來的自己有關？\n\n「軒人？」Eraser走到他身旁，目光落在那張展開的羊皮紙上，「上面寫了什麼？」\n\n軒人深吸了一口氣，壓下心底那個還沒有確切答案的巨大疑問，指尖沿著紙面輕輕移過，將整份絕筆從頭到尾輕聲唸給她聽。\n\n唸完最後一個落款的名字時，保管庫裡靜得只聽見鯨油燈燈芯細微的劈啪聲。Eraser伸出右手，探進開襟外套領口內側，指腹輕輕碰觸那枚右下角花瓣缺了一小角的銀色花扣。淡粉色的眼眸裡，慢慢浮起一絲恍然。\n\n「原來我花扣上少掉的那一小角，還有想不起來的那段記憶，是九年前被這位技師拿去灰鐵巷救人時燒壞的。」\n\n她放下領口，抬頭看向神色有些出神的軒人：\n\n「你認識這位叫賀蘭的技師嗎？」\n\n「不認識。不過九年前那場灰鐵巷外環的事故發生時，我就住在那附近。」軒人沒有在還沒查清真相前貿然把自己的猜測說出口，只是將那張羊皮紙順著原本的折痕小心折回原樣，連同那冊包覆油紙的舊圖冊一併收進防水內袋，「等我們把這座七號支爐的麻煩徹底解決掉，以後有機會，我們就一起去北邊那個『霜鐘鎮』看看——說不定能查清楚九年前那晚到底發生了什麼，也能幫妳把少掉的那片花瓣找回來。」\n\n「好。」Eraser輕輕點了點頭。\n\n就在這時，胸前的傳聲器亮起微弱紅光，夜一略顯緊促的聲音從中傳了出來：\n\n「軒人，你們還在下面嗎？支爐早上的排氣周期提前了，裡面的街道殘響正在變淡，你們必須在二十分鐘內撤回門口。」\n\n「東西都拿到了，我們現在就原路上去。」\n\n軒人扣緊舊分離匣的黃銅搭扣，刻意避開受傷的右肩，將寬背帶斜跨過左肩，再把重量妥善分攤到腰帶的承重環上。\n\nEraser站在一旁看他調整背帶，開口提醒道：「爬石梯的時候如果覺得太重，就停下來喘口氣。不准再像昨天那樣硬撐著說快到了。」\n\n「放心，今天絕對聽指揮。」\n\n## ４\n\n回到一樓登記室時，屋外的夕陽已經褪淡了一層。整條石板街彷彿隔著一塊毛玻璃，遠處屋簷與巷道的輪廓正一點一點發虛、散開。\n\n石桌後面的副工匠長依然坐在那裡。他拿起麻布仔細擦去左手腕上的黑墨，把布四邊對齊疊整齊放回木托盤，接著抬起頭，露出那抹被三百年光陰靜靜鎖住的溫和笑意：\n\n『回來啦？東側的試作品先放進架子裡，晚點再清點。』\n\nEraser走上前，將那塊用完的硬木門牌放回石桌下方的真實抽屜，輕輕推合抽屜，卻沒有立刻轉身離開。\n\n軒人背著舊分離匣停在門檻外，想起昨晚回程馬車上她交代過的話，正要出聲喚她的名字，Eraser已經先一步望向桌後那道坐在夕陽裡的身影，輕聲開了口：\n\n「那本《白央散步指南》，我帶到地面上去了。」\n\n桌後的副工匠長恰好低頭翻過一頁文件：『拿了什麼工具，記得在簿子上寫名字。』\n\n那道跨越三百年的殘響聽不見她的聲音，也永遠不會給出新的回答。但Eraser依然看著他，右手在外套口袋裡輕輕握住晚鐘亭的房門鑰匙。她的嗓音清澈而安靜，沒有悲傷，也沒有一絲猶豫：\n\n「我現在住在灰鐵巷的一間修理鋪裡，換了新衣服，有自己的房間，也領到第一份工錢了。書上畫的那座山坡鐘塔還在。等修好了手，我會跟朋友一起上去看看，是不是真的看不見河口。」\n\n桌後的老人正好再度抬起頭，溫和地望向敞開的門外，在晚風吹入拱廊之前，說出另一段早已刻在石室光陰裡的囑咐：\n\n『別把門敞著，河邊晚上有風。』\n\n一陣微風穿過拱廊，將門內橘色的殘光吹得薄如蟬翼。軒人站在門外，輕輕喚了她一聲：「Eraser，我們該走了。」\n\n「嗯。」\n\nEraser最後看了一眼桌角那塊疊得方方正正的擦手布，朝那個永遠停留在黃昏下班前的身影微微欠身：\n\n「謝謝您的書。再見。」\n\n她轉身跨出門檻，經過軒人身旁時停下腳步，伸出右手握住登記室那扇真實的木門門把，輕輕把門帶上。\n\n木門扣緊的輕響落在空曠的拱廊裡，溫柔地隔開了屋內那場永遠不會迎來黑夜的黃昏。\n\n## ５\n\n走出拱廊後，石板街上的橘色殘響正從兩側朝中央飛快褪散。\n\n先前在街邊整理蘋果的果販已經消失，牆根底下露出了潮濕發黑的真實斷牆與荒草。兩人剛走到回程第一個轉彎路口，軒人胸前的傳聲器突然響起，夜一的聲音比剛才明顯緊繃了幾分：\n\n「加快腳步——不是叫你們跑，裡面的街道正在切換時段。右邊那條路不要踩過去。」\n\n軒人立刻低頭看去。右側通道不知何時已被一扇從殘牆裡浮現出的半透明月台閘門與滾燙蒸氣殘響徹底覆蓋，右側那條備用麻繩沒入翻湧的暗紅霧氣裡，完全看不出底下的石板是否已經塌空；唯有左側那條紅繩依然穩穩貼在真實的青石板上，一路指向出口。\n\n更棘手的是，兩側半透明的屋簷下開始湧出一群群提著舊式皮箱的虛影。人影聚攏在路口鐘柱底下，低聲而焦急地相互傳遞著河水暴漲與末班疏散車的消息。一名舉著小黃旗的引導員虛影步入路口中央，不斷揮旗催促眾人往左側架起的高台階移動——而那道虛假的高台階，正好壓住了左側紅繩的路徑。\n\n「別跟著人影走。」軒人迅速解開腰間右側那條沒入紅霧的備用繩，將它就近扣牢在路邊畫過白粉筆記號的真實鐵環上，接著蹲低身子確認紅繩的實際走向，「引導員指的木台階是假的。紅繩真正穿過去的地方，是他們腳邊那條約莫六十公分寬的石砌排水溝。」\n\nEraser看了一眼貼著真實牆根的石溝，先把裝著古銀絲的布套遞到前頭，自己側身沿著溝沿小心往前挪移。軒人暫時卸下肩上的舊分離匣，讓她在前頭扶住匣子一角，自己從後方緩緩推移。兩人沒有多說一句，順著彼此的節奏將沉重的黃銅匣子送過狹窄的石縫，再迅速將它重新斜背回左肩。\n\n頭頂那名引導員虛影的小黃旗幾乎擦著軒人的髮梢揮過：\n\n『請各位旅客往高處台階移動，不要在排水溝邊停留。』\n\n軒人壓低身子，屏除耳畔雜亂焦灼的人聲，帶著Eraser一路緊貼著真實石板上的紅繩，硬是從那片混亂的疏散殘響裡穿了出來。\n\n然而，就在距離生鐵貨運門只剩三十步遠的地方，原本連通門檻的那段真實石板路，卻因底下暗河水位驟漲而朝側面轟然坍塌，斷出一道整整三公尺寬的缺口。\n\n缺口下方不再是乾燥的舊街，而是渾濁翻滾、夾帶碎木的冰冷急流。\n\n而在缺口旁一處背風的石壁轉角下，或許因為上方山壁裂縫長年漏進了雨水與一線日光，竟悄悄長著一小片翠綠的野草；草葉之間，藏著一叢結滿深紫色小漿果的矮灌木——那是只有在舊時代山坡林間才能見到的「紫星果」。\n\n三十步外的貨運門外，夜一與兩名巡查員已經拉緊了左邊的主安全繩。\n\n「右邊路面塌了，別往邊緣踩。」夜一左手緊按著門框上的黑布陰影，額角滲出細密冷汗，朝門內揚聲喊道，「門頂的高處吊索絞盤已經掛上主繩了。軒人，先把你們那頭的滑索扣到高處牆環拉緊，匣子先吊過來，人再用吊環過河。」\n\n「明白，匣子先過去。」\n\n軒人仰頭確認缺口前那面真實石壁上嵌入的高處鐵環。他迅速將原本貼在石板地上的左路主安全繩解開拉高，穿過比人頭還高的牆壁鐵環，回頭與門外送進來的副繩扣緊成雙股滑索。外頭的兩名巡查員同步收緊貨運門上方原就架好的高處吊索絞盤，整條主繩立刻繃直，化作一道高懸於湍急水面之上的空中滑索。\n\n軒人卸下左肩的舊分離匣，牢牢扣上滑索的滑輪掛鉤，朝門外揮手示意。兩名巡查員合力拉動絞盤，沉重的黃銅匣子懸在半空平穩滑過三公尺寬的急流，安穩落進貨運門外的地面。\n\n趁著巡查員將空滑輪吊環送回來的兩分鐘空檔，軒人轉過頭，看見Eraser的目光在石壁轉角那叢深紫色漿果上靜靜停了片刻，便開口問道：\n\n「那個果子能吃嗎？」\n\n「能吃。叫紫星果，以前工坊的學徒很喜歡在山坡上摘。」Eraser望著草葉間沾著露水的深紫色小果實，語氣輕了下來，「很甜。」\n\n軒人彎下腰，挑了七、八顆乾淨飽滿的紫星果，用隨身乾淨手帕包妥放進她的布套裡，自己另留了一顆，抬手遞到她唇邊：「剛才走了一路，先吃一顆潤潤喉嚨。」\n\nEraser微微一怔，張嘴咬下那顆果子。清涼酸甜的汁水在舌尖化開，她輕輕瞇起淡粉色的眼眸，低頭看著自己留在轉角青草上的鞋印，聲音很輕：\n\n「以前在下面看書的時候，我以為這些東西早就絕種了。」\n\n「只要種子還在土裡，有陽光跟水，總會再長出來的。」\n\n滑輪滑過繩索的輕響打斷了短暫的靜謐，空吊環已順著高處滑索滑回兩人眼前。\n\n軒人替Eraser將腳踏繩環套妥，讓她用右手抓牢上方的防滑結：「妳先過去，外面兩個人接著，不用跳。」\n\nEraser點了點頭，穩穩踩實繩環。外頭的巡查員合力絞動高處絞盤，將她平穩吊過三公尺寬的湍急水面，輕輕放落在了貨運門外真實的青石板上。\n\n緊接著，軒人將自己的腰帶承重環扣上主繩。他低頭瞥了一眼靴跟——裡頭只剩昨天在舊調壓所用完兩顆後，留下的最後一顆氣罐。看準腳下石板邊緣即將徹底滑落急流的那一瞬間，他右腳往後一撤，乾脆俐落地踩下靴跟最後一顆氣罐的踏扣。\n\n「我過去了。」\n\n嗤——\n\n白霧炸開，高壓氣流推著他拔地而起，在半空中劃出一道俐落的弧線，一躍跨過三公尺寬的渾濁水面。雙腳落地時他順勢屈膝卸力，靴底在濕滑的青石板上往前滑出半步，不偏不倚停在夜一腳尖前不到二十公分處。\n\n「沒撞到你吧？」軒人站直身子，胸口微喘地笑問。\n\n夜一這才緩緩鬆開按在黑布陰影上的左手，垂眼看了一眼自己凍得毫無血色的指尖，沒多說什麼，只淡淡回了一句：「還差半步。」\n\n## ６\n\n清晨六點五十分準時撤出斷層入口後，兩人先隨真崎夜一與巡查員返回管網總站，依規定登記古匣編號、核對勘查紀錄，順道領取了補充裝備與全新的靴跟氣罐。等總站馬車將兩人連同舊分離匣送回晚鐘亭時，時間已是上午九點。\n\n一回到店裡，千歲立刻清出工作檯，花了整整一個半小時，用那卷三百年前原配的古銀絲，替Eraser左腕的結構裂痕做了一次從裡到外的正式修補。\n\n上午十點半，當最後一針細如髮絲的銀線穩穩接通副迴路時，Eraser試著輕輕動了動左手五指。雖然為了保險起見，左腕這幾天仍得戴著輕便護板固定、不能用來抹消術式或提舉重物，但先前那種彷彿瓷器錯位般的細密刺痛已經徹底消散，手指也能靈活地扶住茶杯或壓住紙角。\n\n「成了，再靜養上兩個禮拜，連護板都可以拿掉。」千歲鬆了口氣，取下眼前的細鑷，這才轉向工作檯上的舊分離匣與那冊舊圖冊。\n\n為了遵守榊主任的封口令，晚鐘亭整個上午都拉著門簾、掛著歇業木牌。千歲戴上放大鏡，對照舊圖冊上的原始結構圖反覆推敲，很快釐清了將Eraser領口花扣改成「獨立供能」的完整步驟——只要動用舊分離匣下層的雙槽座與中央五瓣花凹槽，先在花扣外側穩穩接上一枚獨立魔力環與小魔石，撐住她的日常運作，就能在不傷及意識與記憶的前提下，將連向七號支爐底層的那條舊底線徹底剪斷。\n\n「不過，我絕不會直接拿這孩子的身體當第一次試驗品。」\n\n千歲指節輕叩在舊分離匣的黃銅外框上，語氣沒有絲毫退讓的餘地：\n\n「今天下午，我們先去河岸那段已經清空居民的『舊貨運支架』，拿這只舊分離匣做一次局部管線隔離測試。一來驗證新舊管線分離的順序正不正確，二來確認舊分離匣在實際負荷下的穩定度。等下午測試穩穩過關了，明天一早再幫Eraser換上獨立魔力環。」\n\n臨近上午十一點，還沒到準備午餐的時間。趁著軒人與千歲在樓下忙著清點下午測試要帶的工具時，Eraser獨自走回二樓自己的房間。\n\n十月末的晨光斜斜穿過木窗欞，落在靠窗的小方桌上，也靜靜照亮了攤開在桌面的《白央散步指南》——書頁正停在畫著山坡鐘塔與烤栗子薄餅攤的那一幅插圖上。\n\n她拉開木椅坐下，從外套口袋裡取出那張第一天在舊鐘塔地下寫下自己名字的失物標籤牌，輕輕翻到空白的背面。\n\n她用右手拾起那半截粗桿鉛筆，微微俯下身，在紙牌背面一筆一劃寫下了幾個字。隨後，她輕輕吹去細碎的鉛筆灰，將這張失物標籤牌仔細夾進畫著山坡鐘塔的那一頁裡，安靜地合上了書本。\n\n——第六章完——\n", "mtime": 1795001561.104697}, {"filename": "07_第七章_不當英雄的方法.md", "content": "# 第七章　不當英雄的方法\n\n## １\n\n河岸試驗區的木圍欄外，貼著三張告示。\n\n第一張寫著管線檢修禁止入內，第二張寫著河道停航，第三張則是染布坊老闆娘自己用紅紙寫好貼上去的，通知熟客領取布匹改到西坡的臨時棚子。\n\n軒人提著舊分離匣，走過空蕩蕩的水街。前兩天還晾滿靛藍棉布的露台，如今拆得只剩下光禿禿的鐵架；最後幾戶居民正推著堆滿被褥與鍋碗的板車，在巡查員的引導下緩步往高處撤離區移動。街角麵包鋪的櫥窗空無一物，門板上那塊寫著『傍晚八折』的木牌還沒來得及取下，正孤零零地在河風裡輕輕晃動。\n\nEraser走在他身旁，視線從那塊打折木牌上掠過，腳步沒有停頓：\n\n「大家都在往上面搬。」\n\n「先搬上去比較安全。只要我們今天下午把隔離順序試出來，明天關掉底下的支爐，後天大家就能回來了。」\n\n兩人很快走到河岸邊的舊貨運支架前。\n\n那是一座橫跨排水渠的小型雙樑鐵架。上方的木踏板已經預先拆除，只留下兩根同時連結新舊管線的承重鐵樑，用來模擬明天切斷城市共用管網時的實際受力。\n\n總站的技師已在對岸架設好讀數板；千歲與Eraser留在木圍欄外的工作檯旁核對那冊舊圖冊；真崎夜一則守在靠街一側的石柱陰影裡，準備一旦支架失穩便立刻出手固定結構，掩護裡面的人撤離。\n\n動手之前，千歲舉著分工表，當著眾人的面逐項確認：\n\n「讀數超過警戒線，誰負責喊停？」\n\n「我。」對岸的總站技師舉手應聲。\n\n「誰負責拉下試驗總閘？」\n\n「我。」站在支架內側檢修台上的軒人回答。\n\n「記住，一旦發現圖紙上沒標註的額外爐火，立刻停手退回圍欄外，不准一邊硬撐一邊找原因。退路誰看？」\n\n「我。」夜一倚著石柱，簡短答道。\n\nEraser伸出右手，輕輕按住被河風掀起的舊圖冊紙頁，補了一句：\n\n「如果看見紅光不是順著銅管流動，而是往下面的石頭裡鑽，也要立刻停下來。」\n\n軒人點了點頭，按下胸前傳聲器確認通話正常，接著將舊分離匣扣上了貨運支架側面的檢修孔。\n\n## ２\n\n最初五分鐘的測試，順利得幾乎讓人產生今天能提早收工的錯覺。\n\n這座貨運支架分為上下兩層：上方是明面看得見的黃銅排氣管，下方則是墊在鐵樑底部的舊條石基座。\n\n舊分離匣接通後，對岸技師依序報出讀數。軒人照著預定計畫，先轉動左側旋鈕，將上方黃銅管裡的爐火關小一半，隨後準備拉下右側閘柄，把底下的舊線路一併切斷。\n\n支架上方的排氣呼嘯聲漸漸低沉下去，預先頂在鐵樑底部的兩根實心木柱穩穩承接了重量。\n\n對岸技師舉起綠旗，示意讀數完全落在安全區間內。\n\n「維持現狀，準備切斷最後一組底線。」傳聲器裡傳來千歲沉穩的聲音。\n\n軒人伸出左手，握住舊分離匣右側的第二根閘柄。\n\n就在他將閘柄拉下一半的那一秒，分離匣中央原本已經收斂下去的暗紅火光，毫無徵兆地猛然暴漲。\n\n軒人的手指倏地僵住。\n\n「等一下，有一股火流從下面倒灌回來了。」\n\n圍欄外的Eraser立刻抬眼：「從哪裡回來的？上面的黃銅管已經關了。」\n\n「不是從上面銅管來的，是從支架底下的石頭縫裡湧出來的。」\n\n對岸技師連忙俯身查驗貼在石堤下方的備用感溫片；靠街一側的夜一已經摘下黑手套，左掌無聲按進了石柱投下的陰影裡：\n\n「先把總閘關上。」\n\n軒人幾乎沒有猶豫，反手將第二根閘柄推回原位，狠狠拉下總閘。\n\n然而，理應熄滅的暗紅火光卻沒有半點退縮。因為方才先關閉了上方的黃銅管，管內無處宣洩的高壓爐火被迫全數往下衝，硬生生灌進石頭基座內部的陳年暗槽裡，順著排水渠底的石堤一路奔湧向下游。\n\n下一瞬，排水渠深處傳來一聲沉悶的低吼。\n\n石縫間猛然噴出一團滾燙刺鼻的白霧，翻湧的熱氣與紅光在濕滑渠壁邊緣迅速疊出一截虛假的木造走道。下游五十步外，兩名原本正在渠壁進行例行檢修的年輕檢查工被迎面撲來的燙霧嗆得睜不開眼，驚慌後退間一腳踩進了那截半透明的假木走道——腳下瞬間踩空，兩人連同手裡的記錄板一起滑跌下來，順著濕滑的石坡一路翻滾，重重摔進了貨運支架正下方的排水渠底。\n\n其中一名檢查工狼狽抬起頭，望見正上方發出刺耳金屬呻吟的龐大生鐵主樑，血色瞬間從臉上褪盡，整個人僵在原地動彈不得。\n\n「下面有人！」軒人呼吸一滯，脫口喊出聲。\n\n石柱旁的夜一立刻探身望向排水渠下。可他的視線被上方寬厚的承重鐵樑徹底遮蔽，從岸邊根本看不見渠底那兩名檢查工究竟落在哪個方位，視野裡只剩一片翻攪模糊的紅霧與滾燙白煙。\n\n「人在哪一側？報位置。」夜一對著傳聲器冷聲追問。\n\n偏偏就在這一瞬，支架底座的舊條石爆出一連串乾裂的脆響。\n\n碎石簌簌崩落，兩根臨時木柱猛然歪斜。檢修台旁控制捲揚齒輪的棘輪制動手把在龐大的下墜力道拉扯下猛地向前翻彈——重達數噸的生鐵主樑，朝著下方兩名檢查工的頭頂沉沉壓低了十幾公分。\n\n來不及思考。\n\n身體比念頭更快撲了出去。軒人雙手緊扣住那根冰冷的棘輪制動手把，將全身體重不顧一切地往後壓到底。\n\n只要手把不鬆開、底下的棘爪牢牢咬住捲揚齒輪的齒牙，靠著齒輪倍力就能硬把這根數噸重的主樑鎖在半空。可底座的石塊仍在不斷剝落崩塌，狂暴的震顫透過齒輪反傳上來，順著鐵柄一路狠狠撞進掌骨與小臂，震得他整個胸腔發麻，雙手指節彷彿隨時會被生生折斷。\n\n生鐵主樑下墜的勢頭，就這樣被他硬生生卡停了一瞬。\n\n渠底的兩名檢查工慌亂地試圖往渠壁爬。其中一人腳下一滑，踩進了爐火疊出的虛假木板，整條小腿直接沒入冰冷黑水；幸好同伴一把抓住他的衣領，兩人跌跌撞撞退到渠底右側一塊只有磨盤大的真實凸石上。\n\n「不要踩木板！站在右邊那塊黑石頭上不要動！」軒人喉嚨發緊，壓著聲音朝底下大喊。\n\n傳聲器裡，夜一的聲音第二次切了進來，比剛才更冷、更急：\n\n「軒人，回答我。他們在你的哪個方向？」\n\n棘輪制動手把在掌心瘋狂劇震，每一記金屬反衝都像拿鈍斧劈在骨頭上。昨天才剛重新包紮好的右肩與左手虎口瞬間裂開，滾燙的鮮血迅速浸透兩層白紗布，順著痙攣顫抖的指縫滴落到發燙的鐵柄上，滋地騰起一縷極淡的白煙。\n\n肺裡的空氣像是被一隻無形的手狠狠攥住，胸口悶得發痛。就在這幾乎令人窒息的瞬間，木圍欄外突然傳來鐵木手杖敲擊青石板的聲音。\n\n篤。篤。\n\n那聲響並不算大，卻像一根細冰針，筆直扎進他的耳膜。\n\n軒人抬起被汗水與血氣模糊的雙眼，看見千歲右手拄著手杖從工作檯後站起，快步朝木圍欄邊緣挪來，似乎想探身往下看清排水渠的線路。\n\n「別過來！」\n\n軒人吼了出來，聲音嘶啞得連自己都感到陌生。\n\n千歲停在圍欄邊。傳聲器裡，夜一第三次緊追不捨地喝問：「軒人，報位置！」\n\n「我還能拉得住……」軒人緊盯著千歲右手握著的手杖，以及那條空蕩蕩的左褲管，用力咬緊後槽牙，字句幾乎是從齒縫裡擠出來的，「這根手把我自己能撐住，你們誰都別靠近圍欄……」\n\n他看不見對岸瘋狂揮動的旗號，也聽不進技師與夜一在傳聲器裡的呼喊。\n\n在被劇痛、失血與窒息感吞沒的視野裡，頭頂這根發出尖嘯、沉沉下壓的生鐵主樑，與木圍欄邊的千歲，毫無縫隙地與三年前那個昏暗傍晚重疊在了一起。\n\n＊　　　＊　　　＊\n\n三年前，十四歲的軒人第一次獨自接下一件回收故障「魔導四輪搬貨車」的委託。\n\n那原本算不上什麼棘手的工作。一輛在倉庫裡失控原地打轉的重型魔導四輪搬貨車，車輪早被木楔卡死，只要卸下底盤下的魔導驅動盒就能推回店裡交差。在白央城裡，一般天生帶有微弱魔力的修繕學徒，只要伸手摸一下車底的輪軸外殼，就能憑皮膚自然感應到裡面還有沒有殘留的「魔力蓄壓」；但十四歲的軒人體內是徹頭徹尾的「空值」，手掌貼在冰冷的金屬外殼上什麼都感覺不到。\n\n那時的他又急著一個人把活幹完、想向千歲證明自己就算沒有魔力也能獨當一面，竟忘了先去拿千歲特地為他改裝的「物理外接測壓表」，只看到車體表面的警示紅光熄滅便以為安全無虞，直接拿扳手擰下了第二顆固定螺栓。\n\n下一瞬，輪軸內殘留的高壓魔力蓄壓猛然炸開，整輛魔導搬貨車朝前狂暴衝出。\n\n外套下襬捲進齒輪，他整個人被硬生生拖倒在堆滿生鐵輪圈的巨型貨架底下。被撞斷底柱的巨型生鐵貨架發出令人牙酸的金屬撕裂聲，當時的他也是像這樣拚命攥著一根支撐桿，天真地以為只要自己絕不鬆手就能頂住。\n\n千歲那天原本根本不需要去現場。她只是發現軒人匆忙出門時，把那只專為他做的「物理外接測壓表」與備用墊片落在了櫃檯上，順路替他送過去罷了。\n\n軒人只記得後領被人狠狠一扯，布料撕裂，自己整個人摔進貨架外的碎木片裡；下一秒，滿載生鐵輪圈的巨型生鐵貨架轟然砸落。\n\n在那一天之前，千歲走路是不需要手杖的。她的兩隻手永遠能同時拿著鑷子與焊槍。\n\n從那以後的三年裡，每當聽見鐵木手杖敲在石板上的篤篤聲，軒人心底便會有一個冰冷的念頭反覆響起——都是因為自己這具連殘留魔力都感覺不到的「空值」身體、都是因為當初的疏忽害千歲沒了左腿；下次再有什麼東西塌下來，就算把兩隻手都折在裡頭，也得自己一個人撐到底，絕不能再讓任何人踏前一步來替他挨這一下。\n\n＊　　　＊　　　＊\n\n「軒人。」\n\n一道清冷、澄澈而極具穿透力的聲音，筆直割開了棘輪刺耳的金屬摩擦聲。\n\n是Eraser。\n\n她靜靜站在木圍欄外側，守著約定沒有用受傷的左手觸碰任何物件，只是伸直右手，準確指向排水渠底下的某一點，一字一句清晰地對他說：\n\n「他們兩個在你的右下方，離二號排水口三步遠的凸石上！夜一被鐵樑擋住了看不見，只有你看得見，把位置告訴他！」\n\n軒人渾身一震，猛地眨掉刺進眼簾的汗水。\n\n三年前那座昏暗倉庫的幻影轟然碎散。眼前只有不斷剝落碎石的基座，以及渠底那兩名正貼著石頭、仰望向他的年輕檢查工。\n\n他狠狠吸進一口冰冷的河風，用沾滿鮮血的左手拇指重重按下胸前的傳聲器：\n\n「右下方。距離二號排水口三步遠的真實凸石上，有兩個人。旁邊冒出來的木地板是假的，不能踩。」\n\n岸邊的夜一在收到座標的同一秒鐘便出了手。\n\n「收到。別再往回硬扯手把，咬死現在的角度就行。」\n\n漆黑的紋路從夜一按住的石柱陰影下方驟然疾射而出，順著生鐵主樑投在渠壁上的斜影一路向下竄行，精準避開翻湧的假木走道，在距離那塊真實凸石不到半公尺的渠壁維修鐵梯兩側，瞬間凝成兩道穩固的黑色護欄。\n\n兩名檢查工看見渠壁旁憑空立起的黑色護欄，這才回過神，踩著實體鐵梯手腳並用地往上攀爬；對岸技師同步甩下救援繩，眾人合力將兩人拉上了安全的岸邊。\n\n然而，此刻站在檢修台上的軒人，雙臂已經抖得幾乎握不住制動手把。\n\n底座條石的裂縫越張越寬，棘輪齒牙發出瀕臨極限的金屬呻吟。手把每往前滑開幾公分，他右肩撕裂的傷口便像是連著骨膜被生生扯開。\n\n「……我這邊快撐不住了。」軒人對著傳聲器吐出了這句話。\n\n話音落下，傳聲器裡沒有任何一聲責備。\n\n千歲的聲音在下一秒俐落地傳了進來，冷靜而果決：\n\n「前面那根主樑不要救了。把制動手把根部的保險鎖片抽掉，讓整座支架往右邊的洩洪支渠裡倒。」\n\n「可是舊分離匣還扣在檢修孔上——」\n\n「夜一已經把人接上來了。你現在只管看你自己的退路。」\n\n夜一的聲音緊跟著響起：「兩個檢查工都上岸了。軒人，現在就拔鎖片，別等齒輪自己崩斷。」\n\n軒人低頭鎖定制動手把根部那枚因受力過度而咬死的保險鎖片。\n\n他沒有再用幾近脫力的右肩去硬扯，而是右腳踩實下方鐵踏板，用寬皮腰帶抵住手把暫時借力，左手反手抽出扁頭拆件短刀，反握刀身，拿沉重的刀柄朝鎖片側面狠狠一敲。\n\n喀噠。\n\n卡死的鎖片乾脆地彈脫開來。\n\n軒人立刻鬆手，順著預先拉緊的安全繩往後連退五步，翻身躍出檢修台。\n\n就在雙腳落回木圍欄外的同一毫秒，失去制動的貨運支架爆出一聲震動河岸的悶雷巨響，順著引導方向朝右側空無一人的洩洪支渠轟然傾倒，砸起漫天碎石與混著黑水的霧浪。而那只來不及卸下的舊分離匣，也跟著支架翻進兩根鐵樑交錯的縫隙裡，險險卡在積著黑水的渠底上方。\n\n## ３\n\n沒有一個人被壓在下面。\n\n兩名檢查工坐在圍欄外的青石上急促喘息，除了其中一人腳踝擦破了點皮之外，其餘連一點外傷都沒有。千歲依然穩穩站在工作檯旁，鐵木手杖握在右手裡，連一粒碎石都沒擦到她。\n\n軒人跌坐在圍欄外的泥地上，雙腿仍止不住地輕微發顫，一時竟站不起來。\n\n夜一走過來，在他面前蹲下身：\n\n「哪裡傷了？」\n\n「……右肩跟左手虎口。都是昨天留下的傷，又拉開了。」\n\n夜一掃了一眼他滲透紗布的暗紅血跡，側頭示意巡查員拿乾淨止血布過來。軒人呼吸仍有些急促，扭頭望向旁邊坍塌的洩洪支渠——那只舊分離匣正卡在兩根扭曲的鐵樑中間，黃銅外框被壓扁了一角，幸好沒有落進底下的黑水裡。\n\n「匣子……我現在下去取回來……」軒人撐著泥地想要起身。\n\n夜一伸出右手，一掌穩穩按在他左肩上，直接將他按回原地：\n\n「等技師確認鐵樑不會二次滑動再去拿。」\n\n「可是裡面的雙槽座很重要——」\n\n「我知道很重要。所以上面沒有再多壓一個你，等一下會比較好拿。」\n\n軒人張了張嘴，對上夜一那張沒有絲毫玩笑意味的冷臉，終究垂下肩膀，乖乖坐了回去。\n\n半小時後，確認殘骸徹底穩固，巡查員才架起滑輪將舊分離匣吊了上來。\n\n臨時工作棚裡亮起了總站制式的冷光魔導提燈。軒人左手纏著新換的白紗布，右手握著炭筆，在實驗記錄表第一頁逐字寫下今天下午的全部經過——包括看見千歲走向圍欄時驟然恐慌、企圖獨自硬撐制動手把，以及因此延誤整整十秒才向夜一報出檢查工位置的事，全數如實落筆，沒有替自己添上任何一句辯解。\n\n傍晚時分，河風轉冷。趕赴現場的榊主任掀開棚簾步入屋內，深色大衣上還帶著河岸的寒氣。他拿起桌上的實驗記錄表，從頭到尾安靜地看完。\n\n棚內瞬間沉寂下來，只剩下魔導提燈內核運轉的細微嗡鳴。\n\n榊主任的視線停在延誤報位十秒那一行，過了幾秒才緩緩抬起眼，鏡片後的目光冷得沒有一絲溫度。他沒有拍桌子，也沒有提高音量斥責，只將記錄表輕輕放回桌面，發出清脆而冰冷的一聲輕叩。\n\n「延誤報位十秒。」\n\n榊主任望著軒人，每一個字都平淡得像在宣讀一份冰冷的傷亡清單：\n\n「差點當場砸死兩名總站檢查工。昨晚我暫緩執行炸藥方案，是因為你們承諾能以零風險拿出驗證數據。結果第一場局部試驗，現場主要操作員就因為個人情緒失控卡死整整十秒——不破軒人，光是這十秒，明天進入核心的特別許可，我現在就可以當場吊銷。」\n\n棚內幾名巡查員下意識挺直背脊，連呼吸都不自覺放輕了。軒人喉頭發緊，雙手在膝上攥成拳，卻找不到任何一個能反駁的理由。\n\n榊主任伸手探進大衣內袋，緩慢抽出一支纖細的紅墨水鋼筆。燈光滑過暗紅筆身，他的目光平靜而近乎殘酷：\n\n「從今晚起全面維持清場，明天禁止再碰任何連結居民區的支架。明天日落準時執行炸藥切斷方案，犧牲外環三條街，保住其餘數千條人命——至少炸藥不會在關鍵時刻猶豫十秒。」\n\n冰冷的壓迫感幾乎將工作棚裡的空氣抽乾。\n\n就在榊主任的指尖抵上筆蓋、準備拔開紅鋼筆的那一瞬間，一道平靜清澈的聲音穩穩接住了他的話。\n\n「今天這場意外，把三百年來沒人查清的倒灌根源露出來了。」\n\n一直安靜坐在桌側擦拭舊圖冊封面的Eraser，將一張畫滿紅線的剖面底圖推到了桌案正中央，正好擋在榊主任那支紅鋼筆前方。\n\n棚內所有人的視線瞬間集中過去。\n\nEraser伸出右手食指，精準點在貨運支架底座與下游水閘之間那段石堤的剖面線條上：\n\n「三百年前砌這道石堤的時候，條石裡面也刻了一層排火的暗槽。剛才我們先關了上面的黃銅管，管子裡的高壓爐火無處可去，就全數往下擠進石頭暗槽裡，順著河堤一路衝向下游，逼出燙霧跟假走道，才害檢查工踩空。」\n\n千歲拿著放大鏡湊過去細看一眼，眉頭驟然鎖緊，隨即明白了過來：\n\n「難怪染布坊那天關了上層閥門還是壓不住火。原來上下順序徹底反了——先關上面的銅管，火就會往底下的石頭暗槽裡鑽。」\n\n「對。」Eraser迎向榊主任的視線，語氣平靜而堅定，「正確的順序只有一條：第一步，先用舊分離匣封住底下石頭的暗槽；第二步，再關掉上面的黃銅管；第三步，最後才拆開鐵架底座。只要先把底下的石頭暗槽堵死，上面的火就不會再往下亂竄。」\n\n千歲轉過身，手掌重重拍在旁邊那只外框壓歪一角的舊分離匣上，直視榊主任毫無溫度的目光，寸步不退：\n\n「匣子只是黃銅外框壓扁了一角，裡頭的雙槽座和接線扣完好無損，我今晚回店裡打上兩道鋼箍就能復原。榊主任，光靠畫幾張圖紙、點兩盞小燈，像你這樣只看損益的人肯定不會信——叫你的技師現在就去現場河堤，直接從石堤上敲一塊同批刻紋古條石樣本回晚鐘亭，再把總站庫存的三百年前河堤施工底圖調出來核對，確認石堤裡面沒有第二層暗槽。今晚當著你派來的人的面，我拿真古條石搭舊分離匣實測五次給你看。」\n\n榊主任眉頭極輕地動了一下，視線很快又轉回軒人身上：「就算順序找到了，進到核心裡面，誰敢保證你明天不會再卡死十秒？」\n\n軒人抬起頭，沒有避開那道審視的目光，右手平平按在桌角那份舊分工表上：\n\n「剛才延誤十秒是我的錯，我沒有任何理由替自己開脫。明天如果執行分離方案，水街、東石橋和舊站所有外圍支架與巡檢權，我全數交給總站技師班與外勤隊負責。我不再一個人硬扛外面的事，進核心之後也不會再把現場負重跟退路判斷同時抓在自己手裡。」\n\n魔導提燈的冷光輕輕閃動了一下。\n\n工作棚裡靜得能聽見河水流過斷石的微響。榊主任垂眼看著那張標清暗槽走向的紅線底圖，目光依序掃過神色鎮定的少女、態度強硬的千歲，以及纏著血紗布卻眼神筆直的軒人。他顯然正在腦海裡飛快重算眼前的代價與風險——強炸三條街的重建成本、數千名外環居民的善後，以及再給這幾個人最後一夜驗證的機率。\n\n過了漫長的十幾秒，榊主任喀噠一聲合上了紅鋼筆的筆蓋。\n\n「可以。」他的聲音依舊不帶絲毫溫度，「石樣立刻讓技師去敲，總站今晚派人全程盯場記錄。另外，外圍三處接點的實際切線與巡檢權立刻收歸總站調度。不破軒人，你明天只准負責核心開鎖，不許再越權去扛外面的支架。」\n\n榊主任站起身，高大的身影在燈下投出一道銳利的陰影，冷冷補上最後的條件：\n\n「但我把話說在前頭——今晚那五次古條石實測，只要冒出一絲倒灌火花，或是明早連她自己的獨立接口都沒法穩穩過關，我不會再聽任何解釋。明早立刻啟動炸藥部署，明天日落準時炸封。」\n\n話音落地，他轉身掀簾步入暮色，背影沒有一絲遲疑。\n\n回晚鐘亭的路上，夜色已經沉了下來。軒人手裡一直捏著那份實驗記錄副本，指尖無意識地把紙角折過去又攤開，折出了一道深深的白痕。\n\n走在身旁的夜一伸出右手，將他手裡那張快被揉爛的紙輕輕按平：\n\n「再看十遍，倒掉的架子也不會自己站起來。」\n\n「……我知道你要說什麼。」軒人低聲道。\n\n「你不知道。」夜一收回手，目光平視前方的石板路，「我要說的是，明天進到支爐裡面之後，絕對不能讓同一個人同時負責『承受重量』和『判斷撤退』。你今天扣住手把的時候，眼裡就只剩下那根鐵桿了，連身邊的人在喊什麼都聽不見。」\n\n軒人腳步微頓了半拍：「如果當時我第一秒就把位置報給你，下面的檢查工就連腳踝都不會擦傷了吧？」\n\n「可能會快幾秒。不過在看清下面位置之前，我也沒辦法出釘。」夜一語氣平淡，沒有絲毫安慰的意思，卻反而讓人的心跳沉靜下來，「你要改的是及時開口回報，不是把世上所有可能發生的意外都算成你一個人的罪過。」\n\n## ４\n\n回到晚鐘亭、送走夜一之後，千歲立刻升起小爐子，著手鍛打鋼箍加固舊分離匣的黃銅外框；戴著輕便護板的Eraser坐在燈下，用右手替她照順序整理明天要用的接線標記。\n\n軒人坐在水盆邊，想把左手虎口那圈被血浸透的舊繃帶揭下來重包。血痂早已乾結在紗布纖維裡，他才剛掀開一角，掌心便傳來一陣尖銳刺痛，手指不由得一縮，動作停在半空。\n\n一隻白皙的右手將一只盛滿溫水的粗陶碗，輕輕放到了他手邊的矮凳上。\n\n「先用水沾濕再拆。」Eraser站在他面前說，「千歲師傅第一天就教過了。」\n\n「……我記得。」\n\n「那你剛才乾著扯什麼？」\n\n軒人一時無言，只好乖乖把左手浸進溫水裡，等乾硬的紗布慢慢泡軟。\n\nEraser拉過一張小圓凳在他對面坐下，靜靜看著水盆裡散開幾縷極淡的紅絲，過了片刻才輕聲開口：\n\n「今天下午在支架上，你大聲叫千歲師傅不要過來的時候，我一開始以為是她腳下又有別的暗門打開了。」\n\n軒人垂著頭解開軟化的紗布：「……沒有暗門。」\n\n「後來我看見了。圍欄外面很安全，她只是想走近一點，幫你看清楚底下的線。」\n\n「嗯。」\n\nEraser沒有繼續往下追問，只將一卷乾淨的新紗布放在他手邊，便起身回到工作檯旁，繼續替千歲遞工具。\n\n等軒人重新包紮好左手，夜色已經很深了。隨行留守在店裡的總站技師早已將從河岸現場敲回來的同批刻紋古條石樣本搬進了屋內，同時帶來總站檔案室調出的三百年前河堤施工圖——圖面清楚標示著，整道石堤內部確實只有那一層聯通的排火暗槽。\n\n千歲將打好鋼箍、重新箍緊復原的舊分離匣擺上工作檯，把那塊刻著真實暗槽的古條石樣本接上模擬火路，上方架起銅管與兩盞標示壓力的魔導測燈，接著照著Eraser指明的順序——先封底下石槽、再關上面銅管、最後撤開底座——在總站技師緊盯不放的注視下，一步不差地反覆實測了五次。\n\n五次下來，每一次導流與切斷都乾淨俐落，刻紋古條石的暗槽裡連絲毫倒灌的火花都沒有冒出來。\n\n留守的總站技師這才鬆了口氣，將五次零火花的實測數據逐筆抄錄封存，連夜帶回總站向榊主任覆命，並約定明早由總站派覆核員前來做最後確認、領取簽字正本。\n\n送走技師，又等Eraser上二樓洗漱休息之後，軒人走到還在用油布擦拭扳手的千歲身旁：\n\n「千歲姊，我有點事想跟妳說。不是關於明天測試的事。」\n\n千歲擦拭扳手的手頓了一下，抬眼看他，下巴朝屋後輕輕一點：\n\n「那就幫我把高腳凳搬到後院去。屋裡一股機油跟焦鐵味，悶得很。」\n\n＊　　　＊　　　＊\n\n晚鐘亭的後院不大，只放得下兩張凳子與幾只接雨水的大木桶。\n\n軒人將高腳木凳擺在靠牆最平整的青石板上，伸手搖了兩下確認四條凳腳毫不晃動，這才在旁邊的矮石墩上坐下來。千歲坐上高腳凳，將那根伴隨她三年的鐵木手杖橫放在膝上，從圍裙口袋裡摸出一小張細砂紙，靜靜打磨起手杖握把邊緣一處極小的毛刺。\n\n「握把那裡磨手嗎？」軒人輕聲問。\n\n「這兩天走得多，虎口邊上有點刮拇指，磨圓一點比較順手。」\n\n高牆外頭的灰鐵巷深處，遠遠傳來上層區報時鐘塔低沉的整點鐘聲；餘韻慢慢融進秋夜裡，隨後只聽見夜巡警衛提著魔導提燈走過石板路的腳步聲由近及遠，四周再度歸於寂靜。\n\n軒人望著千歲膝蓋上那根磨得微亮的鐵木手杖，喉嚨動了動，終於把那句在心底壓了整整三年、今天下午又差點害死下面兩個人的話，毫無保留地說了出來：\n\n「今天下午在圍欄邊，我怕妳又因為我受傷。」\n\n千歲捏著細砂紙的手指停住了。\n\n「所以你就覺得，只要你一個人緊抓著那根制動手把不放、把所有重量都自己扛下來，我就不會受傷了？」千歲轉過頭看著他。\n\n軒人低下視線，纏著白紗布的雙手在膝蓋上緩緩收緊：\n\n「我不知道除了那樣還能怎麼做……三年前在倉庫裡，要是我的身體不是連殘留魔力都感應不到的『空值』，要是我沒有急著逞強表現、在擰螺栓之前先去拿妳替我做的物理外接測壓表檢查一遍，妳就不用衝進來推開我，妳的左腿也不會——」\n\n「不破軒人。」\n\n千歲連名帶姓地打斷了他。\n\n她將鐵木手杖穩穩靠回牆邊，抬起手指，平靜地點了點自己空蕩蕩的左腿膝蓋位置。她的聲音在秋夜的後院裡格外清澈，沒有刻意渲染的情緒起伏，卻字字沉甸甸地敲在人心上：\n\n「三年前那天，你漏看了魔導搬貨車輪軸裡的殘留魔力蓄壓。那不是因為你是『空值』，是因為你當時急著表現、忘了先插物理外接測壓表，沒守住基本規矩做錯了事。我後來罵過你，罰你把店裡所有的安全規程抄了二十遍，從那以後我也立下死規矩，店裡不管是誰，拆任何魔導器前都必須先插物理測壓表。」\n\n她望著抬起頭來的少年，眼底既沒有自憐，也沒有絲毫責怪：\n\n「這條腿確實沒了。下雨天會酸，高處爬不上去，搬重箱子得花錢請隔壁的工人搭手。這些都是實實在在的事，不需要你替我美化成什麼了不起的犧牲。但是軒人，我還活著，還在開這間晚鐘亭。」\n\n千歲重新捏起那張細砂紙，指尖輕點了一下靠在牆邊的手杖握把：\n\n「我每天想的是怎麼把工作檯的高度改得更順手，怎麼把這根手杖磨得不刮拇指，今天晚上燉湯要放幾根香腸，忙完了要早點關門睡覺。這些日子全是我自己一天一天過出來的——跟你能替我擋下多少危險，根本不是同一回事。」\n\n軒人的喉頭像是被什麼重物抵住了，眼眶無聲地發酸發熱。\n\n「你每次看見我拄著手杖走路，眼神裡都像只看得見三年前那個砸下來的生鐵貨架。」千歲看著他的眼睛，語氣平靜得近乎溫柔，「我不只剩下那一天，軒人。你也一樣。」\n\n大木桶裡的水面倒映著屋簷下搖晃的鯨油風燈。一陣微涼的夜風掠過院牆，水面上的燈影碎開，又在漣漪平復後慢慢聚攏。\n\n軒人垂下頭，盯著左手虎口上新換的白紗布，沉默了許久，才低啞著嗓子開了口：\n\n「……今天下午抓著手把的時候，我其實怕得要命。手根本使不上力氣，腦子裡一直在轉，萬一我鬆手了下面兩個人怎麼辦，萬一喊你們過來連你們也跟著掉下去怎麼辦。」\n\n「害怕手撐不住的時候，就開口喊人。」千歲把那小張細砂紙遞到他掌心，「你今天需要做的，就只是告訴夜一下面有兩個人、告訴我你的手快脫力了。我們這麼多人站在現場，不是為了在旁邊看你一個人當英雄的。」\n\n軒人伸手接過那張還殘留著千歲掌心餘溫的細砂紙，拿起靠在牆邊的鐵木手杖，低著頭，順著握把邊緣那處刮手的毛刺，一下、一下，極為專注地慢慢磨平。\n\n細碎的淺色木屑輕輕落在青石板上。\n\n「……磨好了，千歲姊。妳試試看還刮不刮手？」\n\n千歲接過手杖在右手裡轉了半圈，拇指撫過打磨圓滑的弧度，滿意地點了點頭：「順手多了。進屋吧，把明天的分工表改完就早點睡。」\n\n回到一樓燈下的工作檯前，軒人抽出了明天最終行動的分工草表。\n\n今天早上擬定這份表格時，他在『外圍巡檢』、『支架卸載』、『主控鐵箱拆鎖』和『後備接應』四個欄位後面，全都只填了『不破軒人』四個字。\n\n現在，他重新拾起炭筆，將外圍巡檢與支架卸載後面的『不破軒人』一條一條乾脆劃掉，改填上『總站技師班』與『水務班』；在『入口固定與緊急撤離』那一欄寫上『真崎夜一』；最後只在『主控鐵箱開鎖與隔板操作』後面留下自己的名字，旁邊並排工整地寫下了『Eraser』。\n\n停頓片刻，他在表格最下方的備註欄裡，一筆一劃補齊了三條撤退鐵則：\n\n**『一、任何一組人員負傷超限，立刻停手撤離。二、傳聲器失聯超過三十秒，不准繼續前進，原路退回上一個通話點。三、收到三聲撤退哨音，無條件優先撤人，工具與舊分離匣皆可當場棄置。』**\n\n炭筆輕輕擱回桌沿。窗外的秋夜無風，地底的爐火尚未熄滅，明天就要到來了。\n\n——第七章完——\n", "mtime": 1795001457.9049003}, {"filename": "08_第八章_燈祭前夜的荷包蛋.md", "content": "# 第八章　燈祭前夜的荷包蛋\n\n## １\n\n十月二十六日的早晨，軒人是被兩下規律而輕脆的敲門聲喚醒的。\n\n窗外的秋陽已經升過斜坡屋脊。隔著層層疊疊的灰瓦，遠方上層區白塔試敲鐘聲的清越餘韻隨風飄落，隱約混著高街石板路上馬車奔馳的轆轆車輪聲——從清晨起，滿載白金彩旗與煙火木箱的車隊就沒停過，整座高處城區正忙著迎接明天的建城三百週年燈祭。\n\n與高處的華美喧囂截然不同，樓下這間狹小工坊的廚房裡，此刻正順著木梯縫隙飄上來一股奇異的氣味——是剛熬好的早晨熱湯，混著某樣東西徹底燒焦的苦味，其間還夾雜著碗盤輕碰的細碎聲響。\n\n門板又以完全相同的節奏被輕敲了兩下。\n\n「你昨晚答應過，今天早上不會坐在床邊發呆。」門外傳來Eraser平靜無波的聲音。\n\n軒人低頭一看，才發現自己不知何時已經把右腳套進了氣瓶靴裡，左腳卻還光著腳掌，呆呆踩在微涼的木地板上。帆布工具包整齊靠在床尾椅腳旁，裡頭塞著昨晚重新打磨過刃口的扁頭拆件短刀。\n\n「我已經起來了。」他說。\n\n「你兩分鐘前也是這麼說的。」\n\n軒人忍不住失笑，彎腰將左腳氣瓶靴的靴帶拉緊扣牢，起身拉開房門。\n\nEraser正站在二樓走廊斜落進來的晨光裡。她穿著前幾天在灰鐵巷成衣鋪挑的素色粗棉裙與微立領開襟外套，淡粉紅色長髮以深藍髮帶收束在腦後，左腕依然固定著輕便的護板，右手則穩穩托著一只白瓷平盤。\n\n盤子正中央，靜靜躺著一顆邊緣焦黑捲曲、連蛋白外圈都泛成深褐色的荷包蛋。\n\n軒人盯著瓷盤看了兩秒：「……今天的早餐？」\n\n「只有第一顆油溫拉得太高。後面煎的兩顆我有看緊火候，已經端到樓下給你和千歲師傅了。」\n\n「那妳端著這顆上來，是打算賞給賴床的人當懲罰嗎？」\n\nEraser平靜地回望他一眼：「我自己煎壞的，當然我自己吃。只是順路端上來叫你起床。」\n\n話音剛落，她便用右手握著叉子，低頭對著荷包蛋焦脆發黑的邊緣咬下一小口。\n\n喀嚓一聲細響。她的眉尖幾乎在同時極輕地蹙了一下。\n\n軒人靠在門框邊，殘存的最後一絲睡意徹底散了：「很苦吧？」\n\n「很苦。」她坦率地點了點頭。\n\n「不能用妳的能力，讓它退回燒焦之前的狀態嗎？」\n\n「我的能力只能抹消術式，沒辦法抹消煎過頭的雞蛋。」Eraser把白瓷盤往懷裡收了半分，神色認真地看著他，「而且樓下留給你的那一顆，邊緣其實也有一點點焦。」\n\n「一點點焦總比啃木炭好多了。」軒人伸手接過她手裡的叉子，順手替她把最黑的那一角撥開，轉身邁向樓梯，「走吧，再不下去，千歲姊就要把完好的那兩顆全切進湯裡了。」\n\n下樓用完早餐，千歲將一樓工作檯上的雜物盡數清開，鋪上一塊潔淨的白棉布。\n\n兩盞測試用的魔導小術燈、昨晚從河岸現場敲回來的那塊刻著暗槽的古條石樣本，以及昨晚加打兩道鋼箍加固外框的舊分離匣，井然有序地排列在桌面中央。總站技師昨晚連夜帶回了五次零火花的實測數據，今早一開門，總站又派出一名專責覆核員上門進行最終現場複驗，並取走簽字正本。\n\n覆核員逐項核對過昨晚留底的五組紀錄，目光落在白布上的古條石與舊分離匣之間，沉聲要求千歲將左右兩盞小術燈正反對調位置，完整重跑一遍流程。\n\n千歲右手穩穩撐住鐵木手杖，左手俐落動手。先封死底下古條石的暗槽，再關閉上方銅管，最後卸開底座接頭。左側小術燈乾脆熄滅，右側燈火依舊平穩常亮；夾在中央的古條石毫無異動，暗槽內壁連一星半點倒灌的火花也沒有竄出。\n\n覆核員俯身細測石槽內壁與導線溫度，確認讀數分毫不差，這才在紀錄表最末一欄蓋下覆核印記，將簽字正本仔細折進公文夾，匆匆起身趕回總站向榊主任覆命。\n\n門外急促的腳步聲逐漸遠去。軒人走到店門前，反手插實厚木門栓，再將臨街的深灰厚布簾徹底拉攏。\n\n白晝的微光與外街喧響頓時被隔絕在外。狹小的工坊瞬間安靜下來，只剩工作檯上方那一盞冷光魔導檢修燈垂落光束，照亮鋪著白布的桌面。\n\nEraser拉開工作檯前的圓凳坐定，抬眼望向千歲：\n\n「接下來輪到我了嗎？」\n\n千歲轉過高腳木凳，先將桌上那只舊分離匣的上層黃銅隔蓋輕輕掀開，露出下層那組專為古工坊核心打造的雙槽座。她再從一旁的絨布盒裡夾起一枚剛打磨完成、鑲著拇指大小白色小魔石的淺銀色圓環，平放在Eraser眼前的白布上：\n\n「動手之前，我先把每一個步驟說清楚。並不是因為外頭那些人準備就緒了，妳就非得在今天動這個改裝不可。」\n\n千歲用尖頭鑷子點了點舊分離匣下層雙槽座中央那道五瓣花形狀的凹槽，再輕觸那枚獨立魔力環：\n\n「妳領口的花扣底下，有一根暗紅色的粗底線一路連向地底的七號支爐，所以支爐一停，妳也會跟著停擺。待會兒我們先把妳的花扣對準舊分離匣雙槽座中央的五瓣花凹槽固定穩妥，藉著雙槽座替妳接通這枚裝有小魔石的獨立魔力環；等新圓環平穩起轉之後，我再照著舊圖冊記載的次序，用古銀絲把維持妳身體機能的細銀線一根一根移過去，最後才用絕緣銀剪剪斷連往地底七號支爐的舊底線。」\n\n千歲抬起視線，目光平穩而沉靜地望進少女眼底：\n\n「整個過程絕不碰觸妳的記憶，妳也會一直保持清醒。中途只要覺得有一絲發悶、疼痛或發冷，隨時喊停，我們立刻照原路退回，絕不硬撐。」\n\nEraser垂下眼睫，右手食指的指腹隔空懸停在那枚沒有繁複雕花、打磨得光滑溫潤的淺銀色獨立魔力環上方。\n\n「記憶不會變少？」她輕聲確認。\n\n「半個字都不會少。」\n\n軒人拉開側邊抽屜，取出一只普通的黃銅機械懷錶，輕輕擱在Eraser一低頭就能望見的桌角。千歲瞥了他一眼：\n\n「擺個懷錶在這裡，是為了量每次移線的間隔，不是拿來盯著秒數催她繼續。」\n\n「我知道。」軒人把錶盤轉向少女，細小的秒針在靜謐的屋內吐出一聲聲清脆規律的滴答，「是讓她自己看著時間走，心裡有底。」\n\nEraser伸出右手食指，輕輕觸碰了一下懷錶微涼的黃銅外殼。\n\n「開始吧。」她抬起臉，淡粉色的眼眸澄澈而堅定，「我想把那條連著地底的舊線拆掉。」\n\n## ２\n\n軒人先幫千歲調好工作檯邊緣的托架高度，讓Eraser能以最不費力的姿態微微前傾，衣領恰好平貼在舊分離匣上方。\n\n當千歲雙手握穩絕緣鑷，將她領口那枚右下角缺了一小角的銀色五瓣花扣對準雙槽座中央的五瓣花凹槽、極輕極緩地嵌下去時，軒人下意識屏住了呼吸。\n\n喀噠。一聲細微而精準的咬合。\n\n凹槽兩側的微型絕緣壓扣順勢扣實，舊分離匣下層的雙槽座穩穩承接住花扣底座。那股平常偶爾會透過衣料滲出的低沉微震頓時被底座吸收大半，替千歲騰出了雙手精細作業的穩固支撐。\n\n千歲這才用專用薄片輕輕撬開五瓣花扣的外蓋。\n\n裡頭的內部構造比軒人想像的更加細密。十幾根纖細如蛛絲的古銀絲連向Eraser胸口，安靜地維持著她的呼吸與體溫；而在最底層，一根暗紅色的粗底線筆直穿透底座探向地底，每隔數秒，便隨著遙遠七號支爐的脈動傳來一陣低沉鈍重的震動。\n\n掀開花扣外蓋之後，那些裸露在空氣裡的十幾根古銀絲對外在的魔力波動極其敏感。千歲自己都必須拉開半臂距離、透過加長的絕緣鑷操作，因為就算是一般白塔的高階技師站在旁邊幫忙扶分離匣，常人體內自然散溢的微弱人體魔力也會干擾古銀絲的震動頻率；全白央城裡，唯獨身為「絕對魔力絕緣體」、體內處於徹底「空值」的軒人，能夠貼在距離她胸口不到半尺的地方，穩穩按住舊分離匣底座、舉著冷光鏡，卻不會對裸露在外的精密迴路造成哪怕一丁點干擾。\n\n千歲在動手移線前，看了一眼軒人穩穩壓在雙槽座邊框上的手掌，不禁感嘆了一句：\n\n「這活兒換成白塔本塔的技師來還真幫不上忙，全城也只有你這雙半點魔力都不沾的手，能湊這麼近替我按住底座。」\n\n「那我這雙連魔導燈都點不亮的手，今天也算排上頭號用場了。」軒人低聲應道，手腕穩如磐石，連半分晃動都沒有。\n\n千歲沒有急著碰那根暗紅粗底線。她先將鑲著白色小魔石的獨立魔力環嵌入雙槽座另一側的副槽，再用兩根柔韌的古銀絲在雙槽座之間架起穩定橋路。小魔石剛一接通，獨立魔力環內緣立刻亮起一抹柔和而極淡的銀白微光，雙槽座旁的壓力指針隨即平穩滑升至綠區中段。\n\n「新環起轉了。」千歲低聲報出一句，目光掠過攤在桌角泛黃的舊圖冊，鑷尖精準夾住第一根銀白細線的接頭，將它自舊底座平緩移上古銀絲接點，再轉接入獨立魔力環。\n\n軒人貼在距離Eraser胸口不到半尺的側面，左手舉著冷光鏡微調照明角度、腕側穩穩按實舊分離匣底座，右手備著炭筆，視線在魔力波動表與桌角懷錶之間來回移動；Eraser靜靜坐著，依約隨時口頭回報體感。\n\n「第一根，沒有感覺。」\n\n「第二根，指尖有點發涼，馬上散掉了。」\n\n當千歲移接第三根細線時，Eraser的眉心輕輕一攏：「胸口有一點悶。」\n\n千歲手裡的絕緣鑷瞬間凝住，連半毫米都沒再往裡送，果斷退回上一個接點：「這根線原本走得太緊，轉進新環後角度偏了一點。我多接一小段古銀絲放寬弧度，就不會扯到妳了。」\n\n軒人右手握著炭筆，在手邊的紀錄紙上如實寫下停頓的秒數與線位，沒有催促半個字。冷光魔導燈籠罩的工坊裡，只剩古銀絲細微的金屬摩擦聲，以及懷錶秒針一格一格走過的輕響。\n\n多接上一小段古銀絲重新轉接後，Eraser的右手指尖僅微涼了三秒便恢復暖意，胸口也沒再泛悶。\n\n一根，兩根，五根，十根。時間安靜流淌，窗簾邊縫滲入的秋日晨光緩緩移過桌角。\n\n等到最後一根維生細線穩妥落入獨立魔力環、雙槽座左右兩排指針悉數定格在平穩綠區的那一刻，千歲才換上絕緣銀剪，將冰冷的刃口緩緩合攏在最底層那根連往地底七號支爐的暗紅粗底線上。\n\n「準備好了？」她問。\n\n「好了。」Eraser的聲音極穩。\n\n喀嚓。\n\n一聲清脆俐落的剪響劃破寂靜。\n\n暗紅粗底線應聲而斷。頭頂的冷光魔導燈沒有閃爍，工作檯沒有絲毫震顫，雙槽座上的指針也平穩得沒有半分偏移。千歲鬆開五瓣花凹槽兩側的壓扣，將接妥獨立魔力環的花扣底座從舊分離匣裡輕輕托起。\n\nEraser依舊挺直背脊坐在圓凳上，左手安穩搭在固定護板上，右手平放膝頭。\n\n她垂下視線望著自己微微張開的掌心，隨即緩緩吸進一口氣，又輕輕吐出。\n\n「……那個一直從地底拉扯著我的聲音，消失了。」她抬起眼望向千歲，淡粉色眸子裡映著冷光魔導燈的燈影，透出一種前所未有的澄澈與輕盈，「現在是新的魔力環在運作嗎？」\n\n「對。從這一秒起，維持妳身體活動的魔力完全由花扣背面這枚獨立魔力環和小魔石供應。地底下那座支爐往後不管是停是拆，都再也不會牽連妳的性命。」千歲並未急著收工具，視線仍停在錶盤上，「先安靜坐著休息，也別急著測試能力，我們靜置觀察十分鐘。」\n\n軒人這才驚覺，自己握著炭筆的掌心早已沁出一層薄汗，筆尖在紀錄紙角落停駐太久，悄悄暈開一小團黑漬。\n\nEraser偏過臉望著他：「你剛才是不是一直憋著氣？」\n\n「哪有，我明明一直在呼吸。」\n\n「至少有半分鐘沒聽見你換氣。」\n\n「……我那是怕喘氣聲太大，吹歪千歲姊手裡的古銀絲。」\n\n十分鐘在安靜的滴答聲裡緩緩過去。魔力波動表的指針始終靜止在綠線正中，連半格都未曾晃動。軒人倒了半杯溫水遞過去，Eraser用右手接過抿了兩口，還小聲挑剔了一句今天的水好像比昨天燙了一點。千歲聽見反倒徹底放了心，笑著搖搖頭數落了一句「還真挑嘴」，隨手將淺銀色的獨立魔力環正式封入花扣底座，穩妥合上銀色五瓣花外蓋。\n\n從正面看去，那枚銀色五瓣花扣依舊保持著原本的模樣，右下角花瓣那道九年前留下的小缺角清晰如昔；唯有緊貼衣領的背面邊緣，多了一圈細緻柔和的新銀接縫。\n\n千歲遞過去一面小銅鏡：「自己照照看。看得出來有修補過的接縫，沒辦法跟三百年前剛出廠時一模一樣了。」\n\nEraser接過銅鏡仔細端詳了一會兒，右手食指順著背面光滑的新接縫輕輕描過一圈，轉過頭望向軒人：\n\n「會很難看嗎？」\n\n軒人湊近半步認真看了看：「收口焊得很平整，應該不會勾到外套毛線。」\n\n「我不是在問會不會勾衣服。」她把銅鏡輕輕放回桌面。\n\n一旁的千歲不輕不重地咳了一聲。軒人耳根微微一熱，連忙重新看向她領口那枚帶著新銀邊的花扣，坦率地改口：\n\n「看得出補了一圈新邊，但我覺得比以前更好看。」\n\nEraser低頭又掃了一眼銅鏡，伸手將微立領外套理平整：「那就這樣吧。」\n\n上午十點整，千歲收妥舊分離匣，在工作檯上換出三組不同負荷強度的模擬測試銅板，正式展開唯一一輪獨立供能的抹消上限實測。\n\n這一次不再連著地底支爐，全靠獨立魔力環裡那顆拇指大小的白色小魔石獨自運轉。\n\n第一塊測試板僅刻著普通的照明術式。Eraser右手食指輕輕觸及，刻紋便無聲化為一片空白，花扣外殼連絲毫溫熱都沒有泛起。第二塊模擬水閘強度的中負荷刻紋，她持續按壓了二十秒，指尖才泛起微微暖意，鬆手歇了兩分鐘便徹底消退。\n\n輪到第三塊模擬七號支爐主迴路的高負荷測試板時，千歲讓她每隔十秒回報一次掌心觸感；軒人則握緊懷錶站在桌旁，目不轉睛地盯著花扣正中央那顆圓潤白珠。\n\n「三十秒，手心微微發溫。」\n\n「五十秒，手腕內側開始發燙。」\n\n「七十秒，指節有點發緊。」\n\n屋內的空氣驟然繃緊。秒針一格一格跳過八十秒。當細長的指針剛踏上第八十五秒刻度線的瞬間，花扣正中央那顆雪白圓珠的最外圈，悄然浮現出一道清晰的鵝黃色細環。\n\n「停。」千歲幾乎在同一剎那出聲。\n\nEraser立刻收回右手。千歲夾起感溫銀箔貼在花扣背面讀出數值，隨即將降溫用的薄銅片按上外殼，轉過頭神色凝重地望著軒人：\n\n「把剛才那個顏色牢牢記在腦海裡。平常走路、說話，一顆小魔石足夠撐大半天，我也另外替她縫了個掛在外套內袋的小皮袋裝著備用小魔石，早晚換一顆就行。但動手抹消高強度爐火的時候，九十秒就是絕對不能碰觸的紅線——甚至不必等到九十秒，只要你看見白珠外圈一開始浮出鵝黃色，無論現場只差幾秒鐘，都必須立刻喊停收手。」\n\n千歲指了指感溫銀箔上尚未退散的熱紋，嗓音冷硬而清晰：\n\n「這種發熱會累積在花扣與手腕迴路本身，就算現場換上十顆新魔石也沒辦法重置，必須徹底靜置冷卻好幾個小時才能歸零。今天下午進了檢修站，絕對不會有第二輪九十秒的機會，聽明白了嗎？」\n\n「白珠一泛黃立刻收手，沿途零星動手的秒數也要全算進總額度裡。」軒人提筆將這條鐵律工整寫在行動手冊最上方，抬眼掃過桌上的冷卻計時器，「我會全程盯緊花扣的顏色。」\n\nEraser右手按了按外套內側那只備用小皮袋，輕聲問：「那如果半路上碰到很小一段殘留術式呢？」\n\n「能繞就繞，能交給軒人用工具拆就用工具拆。」千歲一邊替花扣降溫，一邊把規矩定死，「前面多抹消一秒，最後留給主控鐵箱的時間就少一秒。別當成逛市集順手掃除，看見哪裡閃紅光就隨便伸手去碰。」\n\n「我記住了。」Eraser認真點頭。\n\n## ３\n\n接近正午時分，榊主任與真崎夜一親自來到晚鐘亭。\n\n距離上午十點那輪上限實測已經過了將近兩個小時，花扣始終依規靜置冷卻，沒有再多作半分額外消耗。榊主任進門後先翻開桌上的實測讀數表，從頭到尾逐行核對感溫紀錄與魔力波動線，再俯身確認計時器與感溫銀箔上穩定歸零的冷卻讀數。\n\n合上記錄夾，他臉上沒有流露多餘的鬆懈或笑意，神情依舊冷峻務實。\n\n「獨立供能曲線平穩，九十秒高負荷紅線與冷卻條件皆已鎖進數據裡，最不穩定的變數算是有了解法。」榊主任抬起目光，將蓋過總站鋼印的正式行動令按上桌面，隨即攤開下午的最終現場部署圖，「按計畫執行。」\n\n他修長的指尖重重點在部署圖上的三個紅圈：\n\n「外圍隔離從昨晚便已同步展開。水街東口、東石橋頭、河岸舊調壓所這三處共用接點，由總站三組工程班分頭負責，嚴格依照你們昨晚和今早覆核通過的順序——先封底下石槽、再關上方銅管、最後拆鐵架底座——推進。大部分承重支架昨晚已換成實體木樁，今天日落前就能完成外圍切離。」\n\n指節順著圖紙往河岸上游滑動，停在那座半塌的「七號支爐舊檢修站」標記上。\n\n「麻煩留在支爐內部。七號支爐的主控鐵箱與主承重鐵架是三百年前留下的實體，但這幾天爐壓持續外溢，舊主架周圍已經翻湧出一整片重疊錯亂的舊礦道與管線殘響區。今早封鎖線合圍之前，有十二名住在河岸邊的居民和巡查工被突然張開的殘響通道捲了進去，目前仍受困在裡頭的舊車間與管道廊裡。」\n\n軒人垂眼看向一旁攤開的失聯名冊。紙面密密麻麻列著十二人的姓名、衣著特徵與最後目擊地點，最下方還預留著幾行空白欄。\n\n「只有這十二個人嗎？」軒人問。\n\n「這是街區居民與家屬已核實的十二人，但不排除還有沒登錄在本地名冊上的外地過路工匠。」榊主任的語氣低沉平直，「你們進場之後，第一步是把裡面所有活人找出來，沿著我們架在河岸三座真實石墩上的實體檢修橋送回岸邊；第二步，等外圍三組全部切離完畢、確認裡頭再沒半個活人，你們才准靠近主控鐵箱接上舊分離匣，用那九十秒額度徹底抹消箱內的三段失控指令。」\n\n靠在門邊的真崎夜一垂目將左手那只黑色薄手套的袖口理平，冷靜地接過話頭：\n\n「我守在舊檢修站外側的真實入口，以黑布和固定燈位替你們撐住通往岸邊的出口陰影。我必須留在外頭穩住入口結構，無法跟你們一起深入殘響區尋人。三條撤退信號記牢——外側連敲三聲銅鈴、傳聲器重複呼叫撤回、或是她的花扣白珠提前泛黃。觸發任何一條，當場停手撤離。」\n\n「明白。」軒人將三條撤退條件一字不漏地複述了一遍。\n\n送走榊主任與夜一後，他把加打鋼箍的舊分離匣調整成左肩斜背、腰帶雙扣分擔重量的背負方式，帶著Eraser在店內實地演練了三次短導線快拔與換位，直到兩人在狹窄空隙間錯身也不會扯到導線才停手。\n\n中午十二點多，趁總站工程班還在河岸進行最後一遍實體石墩載重測試，軒人與Eraser走去水街的撤離集合點吃午餐。\n\n抬頭朝山坡高處望去，半山腰與上層區的屋簷之間已懸滿慶祝明天燈祭的白金彩旗，在清透的秋日陽光裡獵獵翻飛；遠方高街大道上不時滑過塗著金漆的慶典花車與拉運煙火的馬車，明亮得宛如另一個無憂無慮的國度。\n\n然而山腳下的水街卻截然相反——空氣裡浮著搬遷揚起的塵灰，巷口拉起總站的臨時警示繩，水街的居民們正推著載滿家當的手推板車，一步步往西坡與高處撤離。空蕩蕩的魚市攤位排成一列，只剩木棚在地上投下冷清的斜影。\n\n兩人端著溫熱的木盒便當，坐在水街原本賣魚的空攤長凳上，借著魚販留下的舊木棚遮住午後陽光。\n\n對面染布坊門前停著兩輛大板車，老闆娘正指著一根比車斗長出一大截的晾布長橫桿，和兩名搬運工爭得面紅耳赤：\n\n「怎麼能說鋸就鋸？這根老木橫桿要是鋸斷了，搬去西坡臨時市場誰替我接回原樣？」\n\n「不鋸短，車子轉不過西邊那條窄巷啊，老闆娘。」\n\nEraser端著便當盒站起身走過去，蹲下身仔細看了一眼長橫桿中段包著鐵箍的接縫：\n\n「這裡原本就做著活接頭。不用鋸斷，只要把中間這兩顆對位螺絲擰下來，就能拆成兩截裝車。拆之前拿粉筆在側面畫一道對齊線，搬過去才不會裝反。」\n\n軒人也走上前看了一眼。他沒有自己蹲下去硬扳，而是向搬運工借了把長柄扳手，用纏著薄紗布的左手示範了一遍鬆開對位螺帽的卡角，隨即把扳手交還給兩名力氣充足的搬運工。不到五分鐘，長橫桿便俐落地拆成兩截，工整躺上板車。\n\n老闆娘長長吐出一口氣，可回頭望著搬空大半的店面，眉心又緊緊蹙了起來：「架子是運走了，可西坡的臨時市場連條引水溝都沒有，後面這幾十桶等著漂洗的布匹，該怎麼趕在燈祭結束後交貨啊。」\n\n軒人將便當盒暫放板車角，從外套口袋抽出一張空白的申請便條紙遞給她：\n\n「老闆娘，光對著搬運工先生發愁沒辦法解決問題。妳把每天需要的運水車趟數、臨時晾布架需要的場地空間，還有延誤交貨的布匹數量全寫在這張紙上，待會兒送去總站一樓後勤窗口，請辦事員蓋個收件章留底。今天未必能立刻撥下來，但留下一紙正式書面紀錄，總比口頭反映有用得多。」\n\n老闆娘微微一愣，接過紙筆先寫下染布坊的招牌名號，抬眼瞥見Eraser左腕的護板與軒人左手纏著的紗布，連忙擺手把兩人往回趕：\n\n「好了好了，你們兩個手上的傷都還沒好全，別站在這裡吸灰了，快回去坐下吃午餐吧，再拖下去便當都要涼透了。」\n\n兩人走回空魚攤的木棚下坐定。\n\nEraser用右手掀開便當盒的木蓋。裡頭裝著白米飯、燉得軟嫩的豆子，旁邊壓著一塊煎得金黃平整的厚蛋燒。她先夾起厚蛋燒咬下一口，細細嚼完，認真點頭：\n\n「比我早上煎的好吃。」\n\n「妳早上煎的那顆，原本就不能歸類在食物裡吧。」\n\n「只是邊緣黑了一點。」\n\n「中間也已經發黑了。」\n\n「……你不用把每件事都記得那麼清楚。」\n\n軒人低頭扒飯，嘴角忍不住揚起一抹笑意。才吃到一半，一輛堆滿鍋盆家具的手推板車嘎吱作響地從巷口經過。跟在板車後方的，正是灰鐵巷烤餅鋪的松井婆婆，還有鄰居家那個總愛拿根木枝到處比劃的小男孩——前幾天逛早市買餅時，他們早已熟稔得像同個街區的鄰居。\n\n小男孩今天沒有揮著木枝亂跑，雙臂緊緊抱著一只裝得圓鼓鼓的布袋，袋口斜插著一隻用藍紙摺的小風車。\n\n「是軒人哥哥，還有粉紅頭髮的姊姊。」\n\n小男孩一眼認出木棚下的兩人，扯著松井婆婆的衣袖快步跑了過來。\n\n松井婆婆走到棚下，目光先落在Eraser左腕的護板上，又掃過軒人手上的白紗布，眼角眉梢滿是熟人重逢的牽掛：「這兩天忙得都沒見你們晃去烤餅鋪，原來一直在外頭四處奔波。聽街口的巡查員說，我們這片先搬去山坡上的舊學舍暫住兩天，你們下午還要下河岸那邊的舊站嗎？」\n\n「還有人困在底下的通道裡，我們得去把人接出來。」軒人放下筷子點頭，放柔聲音叮囑道，「婆婆，去舊學舍要走南邊那條大坡道，別抄鐘樓後頭的小路，那邊的碎石還沒清乾淨。等這兩天忙完了，我們再去店裡吃剛出爐的熱烤餅。」\n\n「好，我等著替你們多留兩張剛出爐的芝麻烤餅。」松井婆婆笑著溫聲答應。\n\n小男孩先看了看軒人腳邊鼓脹的工具包，再低頭看看自己懷裡的大布袋，仰起臉小聲問道：\n\n「底下那些還沒出來的人，等一下也會搬去舊學舍跟我們一起住嗎？」\n\n「應該會吧，床位由總站那邊統一安排。」\n\n小男孩抿著嘴唇認真想了兩秒，隨即低頭伸出兩隻小小的手掌，使勁把自己懷裡圓鼓鼓的布袋往下壓扁了一些：\n\n「那我把我的袋子壓小一點，空出位子給他們。」\n\n松井婆婆笑著摸了摸孩子的頭頂，又向軒人與Eraser道了一聲務必保重，這才牽著孩子匯入撤離人流，順著青石坡道一步步朝高處走去。\n\n軒人目送那一高一矮的背影沒入坡道盡頭的陽光裡，這才低頭將便當盒裡最後一口米飯扒進嘴裡。\n\n從前他總以為，所謂解決災禍，就像故事書裡的勇者那樣孤身衝上去斬斷元凶，隔天太陽照常升起，街巷裡的一切就會自動復原。直到這兩天親眼看著整條水街的人拆橫桿、寫申請條、算運水車趟數、把小布袋壓扁一點替陌生人空出床位，他才真正明白——每一次動盪在日常裡撕開的裂口，從來都不是靠奇蹟癒合的，而是靠活著的普通人一點一滴親手縫補回去。\n\n「我還沒去過山坡上的舊學舍。」Eraser合上空便當盒，工整疊在他那一份上面。\n\n「等這邊的路修好了，再帶妳去看看。那邊操場視野開闊，站著就能望見整條河。」\n\n「山坡上的鐘塔也能望見。」她輕聲說。\n\n軒人側過臉，望著被秋日暖光鍍上一層淡金輪廓的少女側臉，微微一笑：\n\n「那就先去鐘塔，再去學舍。」\n\nEraser把筷子收進布套，唇角極輕地往上彎起一個弧度：\n\n「記得帶錢買薄餅。」\n\n## ４\n\n下午三點，出發前的最後一刻。\n\n真崎夜一已經把總站的雙輪馬車停在晚鐘亭巷口等候。店鋪的木門板關了一半，千歲把客人寄修的鐘錶器具全數搬上內室高架，坐回矮凳替軒人的氣瓶靴換上三顆全新的靴跟氣罐，再親手清點三枚硬木楔子逐一塞進他腰間工具袋、扣實搭扣，最後仔細拽試了兩遍腰帶上的雙重承重扣。\n\n「靴跟氣罐一共三顆，硬木楔子三枚，起跳前先看死落腳點。」千歲屈指輕敲了一下他的靴跟，「右肩絕對不准拿來吊人，救生繩全數掛在腰帶主環上；舊分離匣背在左肩，短導線只有在最後碰到主控鐵箱時才准插上Eraser的花扣。都記清楚了嗎？」\n\n「記清楚了。」\n\n「昨天你也是這麼說的。」\n\n「今天要是再犯，回來妳罰我抄一百遍安全規程。」\n\n千歲撇了撇嘴，將一卷新備妥的紅繩塞進他掌心。軒人背好工具包與舊分離匣，俯身確認Eraser領口花扣的冷卻讀數徹底歸零、中央白珠透著最純淨的雪白色，兩人這才一同扶著千歲登上巷口馬車，隨夜一駛往河岸上游的「七號支爐舊檢修站」。\n\n下午四點，十月二十六日的秋日漸漸西斜。\n\n遠方高踞山脊的白塔外牆，已搶在暮色降臨前點起試燈用的暖白魔導燈列，整齊璀璨地勾勒出高塔輪廓，彷彿正無聲預告著明天盛大的建城燈祭。\n\n然而河岸這邊卻像被切進了另一個冰冷而灼熱的世界。舊檢修站外圍已經架起三座由厚重精鋼樑串聯的實體檢修平台，平台下方掛著滑輪索道，河岸邊停靠著兩艘隨時待命的救援木艇；早已就位的榊主任正手持現場名冊，佇立在指揮棚前冷靜盯著水文讀數。\n\n順著實體平台望進檢修站大廳深處的那一瞬間，軒人的呼吸陡然收緊。\n\n原本應該空蕩荒廢的磚石大廳，此刻已被一層自地底支爐翻湧而出的暗紅濃霧徹底吞沒。濃霧深處，三百年前支爐初建時的多層礦車軌道、轉運車間與蒸汽廊橋層層疊疊地浮懸在半空緩緩輪轉；幾名身穿古式深藍工裝的虛影工匠推著裝滿礦石的鐵車，悄無聲息地從懸空軌道上滑掠而過。\n\n而在靠外側第一間半透明的值班室玻璃窗後，一名繫著當下水街圍裙的年輕婦人正拚命拍打窗面，朝岸邊的燈火用力揮手——正是今早失聯名冊上的十二名居民之一。\n\n「她在對我們揮手，看得見岸上的動靜，是活人。」\n\n軒人隔著十幾公尺的距離，朝窗後的婦人舉起右手，穩穩比了一個『留在原地』的手勢。窗後的婦人瞬間領會，連忙停下拍窗，順從地往屋裡退開半步。\n\n真崎夜一邁步走至平台最前端，將一塊厚重黑帆布固定在左側魔導燈架下方，隨即摘下左手黑色薄手套，將蒼白的掌心筆直按進地面的黑影裡。\n\n濃稠如墨的漆黑紋路順著平台邊緣疾竄而出，瞬間沿著地縫切上檢修站入口處那扇隨殘響劇烈震顫的鐵門下緣，將門框牢牢釘進真實的石墩基座裡，露出了底下寬敞平整的實體鐵板。\n\n「入口釘住了。」夜一的聲音低沉而平穩，「第一批人帶出來之後，直接順著這塊鐵板送上救援艇。」\n\n軒人將第一卷紅繩牢牢扣上腰帶主環，側過臉望向身旁的Eraser。\n\n「走吧。先把人接出來，再關爐子。」\n\n「好。」Eraser右手握緊短繩扣環，與他並肩踏上了通往暗紅濃霧深處的實體鐵板。\n\n——第八章完——\n", "mtime": 1795001504.9528966}, {"filename": "09_第九章_穿過沸騰的暗渠.md", "content": "# 第九章　穿過沸騰的暗渠\n\n## １\n\n踏進舊檢修站大門的那一瞬間，彷彿迎面撞開了鍛造爐的爐門。\n\n滾燙的蒸汽夾雜著濃重鐵鏽味劈臉撲來，灼得眼眶發酸；三百年前殘留的尖銳汽笛聲與滋滋作響的廣播雜音幾乎在同一秒灌滿耳膜，震得人太陽穴隱隱發脹。\n\n一道身穿古式深藍工裝的值班員虛影正立在入口鐵梯旁，僵硬地抬起右臂指向前方轉運通道，嘴裡機械而平直地一遍遍複誦著同一句指令：\n\n『爐壓檢修期間，請非當班人員盡速離開車間。』\n\n值班員的雙靴懸在半空。他腳下三百年前原本鋪設的木踏板早已腐朽塌盡，底下只剩暴漲奔湧的暗黑河水，拍擊著深鏽鐵樑捲起震耳欲聾的轟鳴。\n\n軒人沒有分神去看虛影，先單膝落地扣緊岸上工程班推進來的實體鐵踏板插銷，再伸手用力猛拉兩下綁在入口鉚釘上的第一卷紅繩。確認繩結牢靠得沒有半分滑移，他這才回過頭朝Eraser一點頭。\n\nEraser緊貼在他身後半步。她左肩斜背著舊分離匣的備用雙扣背帶，連往領口花扣的那根短導線仍安靜收在匣側卡槽裡，尚未接通。\n\n兩人一前一後踩上入口踏板。\n\n當軒人從值班員虛影身前大步跨過時，那道半透明的人影連眼皮都未曾抬動，毫無反應；可就在Eraser鞋尖剛踏上同一塊鐵板的剎那，值班員虛影竟猛地旋過半身，手臂筆直橫掃過來，硬生生攔在她胸前：\n\n『檢修人員請出示通行木牌。』\n\n一股灼熱猛烈的風壓隨著虛影抬臂橫切而過，將Eraser額前幾縷淡粉紅色碎髮吹得向後急揚。\n\n她立刻止步，低頭望了一眼胸前領緣那枚上午剛剛改妥獨立供能的銀色五瓣花扣，眼底瞬間浮現清明的判斷。\n\n「這座車間的舊檢哨只感應魔力波動。」她側過臉，對退回半步的軒人輕聲道，「體內沒有絲毫魔力的『空值』走過去，在它眼裡就像滾過一塊石頭，根本不會觸發警戒。以前我連著地底支爐的底線，它會把我辨識成車間內部的零件放行；上午剛換上獨立魔力環，身上帶著獨立運轉的魔力波動，它反倒把我當成擅闖的外人攔了下來。」\n\n軒人左手反握扁頭拆件短刀，試探性地往前一壓，想將那條攔路手臂撥開——虛影看著半透明，手臂周圍壓出來的滾燙氣牆卻硬得像燒紅的生鐵棍，猛地反震過來，震得他纏著薄紗布的左虎口一陣發麻。\n\n硬闖只會平白耗損體力。Eraser沒有後退，目光迅疾掃向右側三步外的礦石卸貨口。\n\n那裡同樣立著一名古裝搬運工的虛影，正機械地重複著彎腰扛起長木箱、轉身推過鐵軌、淡去重來的循環。每當搬運工彎腰把木箱放落地面，他身後那根真實的承重鐵樑便會騰出兩秒鐘的空檔。\n\n「從右邊卸貨口繞過去，別跟他耗。」Eraser語氣果決。\n\n軒人立刻回身，朝大門外側的真崎夜一比出右移手勢。門外的夜一掌心微微一偏，釘住門檻的黑影便順著鐵板邊緣向右無聲滑開半步，恰好替實體踏板咬穩卸貨口邊緣。\n\n搬運工虛影俯身卸箱。就是現在。\n\n軒人左手果斷攥緊Eraser完好的右腕，兩人同時屈膝蓄力，踩準那轉瞬即逝的兩秒縫隙一前一後躍過狹窄鐵樑，靴底清脆落地，穩穩踩進車間內側真實的磚石走廊。\n\n「進來了，兩人。」軒人按下領口傳聲器低聲回報。\n\n傳聲器滋滋響了一聲，傳出榊主任冷靜的指示：「收到。不要看車間牆上的舊計數牌，每找到一個活人就回報一組衣著特徵。」\n\n話音未落，剛才在玻璃窗後拍窗求救的那名水街年輕婦人已經從值班室裡跌跌撞撞衝了出來。她右腳跑丟了一隻布鞋，剛踩上走廊中段，頭頂上方的虛影滑軌驟然爆出一陣刺耳的鐵輪尖嘯——一隻裝滿赤紅礦渣的懸空吊籃破開濃霧疾掠而來。婦人顯然被困了一上午早已摸熟規律，反應極快地一把抱住身旁鐵柱蹲身縮頭，任由漫天灼熱火星自頭頂刮過，這才起身踉蹌撲向他們。\n\n「外面的橋真的通了嗎？」婦人緊緊攥住軒人拉進來的紅繩，嗓音早已被熱氣燻得沙啞。\n\n「通了，貼著這條紅繩往外走就能直接上岸邊救援艇。」軒人騰出右手從外套口袋抽出失聯名冊飛快核對，「太太，妳們這一區總共有幾個人？」\n\n「這邊四個，最裡頭鐵工具櫃旁邊還卡著一位老先生。」婦人回頭急喊了一聲。\n\n值班室角落隨即陸續鑽出三道活人身影：一名體格魁梧、穿著連身碼頭工裝的男子，以及兩名緊緊抱著空菜籃和帆布書包的年輕學徒。而在最內側那座覆滿厚鏽的鐵工具櫃旁，一名六十多歲的老人正雙手緊撐著櫃門把手，右腿僵直在原地，額角疼得沁滿冷汗。\n\n軒人目光飛快掃過名冊上的姓名與衣著。五個人，全數吻合那份十二人失聯名單。\n\n「Eraser，妳先帶能走動的四個人貼牆退到入口踏板邊。我過去把老先生拉出來。」\n\nEraser並未急著領人動身，先仰頭緊盯走廊上方滑軌默數了三秒節奏。那隻懸空礦石吊籃每隔十秒鐘沿軌道掠過一次，傾瀉的滾燙火星全數灑在走廊正中。\n\n她完全沒有動用抹消能力，右手筆直指向左側潮濕的石牆根，語氣沉穩清亮地向婦人與兩名學徒交代：\n\n「貼緊左邊釘著鉚釘的石牆根前進。只要頭頂滑軌一亮紅光就立刻停腳蹲低，等吊籃劃過去再起身走，火星燙不到牆根。」\n\n婦人急忙點頭，一手拉住兩個發抖的年輕學徒照做。\n\n軒人幾大步跨到鐵工具櫃旁單膝蹲下。他壓低防風鯨油燈往暗處一照，立刻看清了癥結——老先生的右腳並不是單純扭傷，而是工具櫃底下那根隨著車間廣播反覆執行「開合鎖定」的折疊生鐵桿，牢牢鉗住了他厚皮靴的靴跟。每當頭頂廣播重新播送一次，鐵桿便重重向下咬實一下，把厚靴跟壓得嘎吱作響。\n\n「老先生，這隻靴子保不住了。」軒人反手拔出腰間的扁頭拆件短刀。\n\n「先保住我這把老骨頭的腳踝，還管什麼破靴子。」老人疼得倒吸冷氣，額角青筋直跳。\n\n軒人左手原本下意識探向腰袋裡那三枚留作備用的硬木楔子，指尖剛觸到木頭邊緣便猛地一頓，隨即改了主意——絕緣硬木楔必須留給更深處的關鍵鎖扣與蓄力彈簧，絕不能浪費在這根生鐵轉軸上。他反手從工具包側袋抽出一把厚實沉重的備用生鐵扳手，雙目死鎖鐵桿根部。\n\n廣播的尾音剛落。折疊鐵桿喀噠向上彈起幾公分，露出一道轉瞬即逝的兩秒空隙。\n\n軒人左手疾探，將厚實的生鐵扳手整根橫插進鐵桿根部的轉軸縫裡牢牢卡緊；右手幾乎在同時揮落扁頭拆件短刀，順著皮靴側面最薄的車縫線俐落一刀劃開厚牛皮，緊跟著雙掌合抱老先生的小腿往後一抽。\n\n喀嚓一聲刺耳的金鐵悶響。\n\n折疊鐵桿重重砸落，硬是把那把生鐵扳手壓出一道深白凹痕、折彎了一截，連同那隻空皮靴一起死死鉗在縫裡。老先生只穿著厚襪的右腳已順利脫困，連腳踝骨都沒傷著半分。\n\n「再晚來十分鐘，我這把老骨頭都快拿鐵鎚自己砸靴子了。」老人長長呼出一口濁氣。\n\n軒人剛想半蹲起身、避開受傷的右肩改用左側背起老先生，身旁忽地大步跨來一道高大身影。剛才那名穿著連身工裝的魁梧碼頭工人已將空菜籃塞回學徒懷裡，折返過來時目光不經意掠過軒人右肩衣料下隱約透出的繃帶邊緣，沒多說什麼便俯身架起老先生右臂，將大半重量穩穩扛上自己厚實的肩膀：\n\n「少年，你只管在前頭開路、盯緊頭頂。背個人而已，我這身力氣還綽綽有餘。」\n\n「那就拜託大叔了，到入口踏板只要二十步。」\n\n五名受困者踩準Eraser報出的十秒空檔，貼著真實石牆一路快跑，順利退抵入口的實體鐵板。岸邊兩名救援員迅速接過老先生扣進滑索吊椅，五人接連沿鋼索安全滑返對岸。\n\n傳聲器裡很快響起榊主任俐落的點名回音：「第一批五人全數上岸，皆在失聯名單內。一名年長者右腳踝表皮擦傷，已交由岸邊醫護處置。」\n\nEraser站在入口內側，目送空吊椅滑回扣牢，這才側過頭望著軒人：\n\n「你右肩剛才使力了嗎？」\n\n「沒有，那位碼頭大叔直接把人扛過去了。」軒人甩了甩微酸的左手腕，順手拍拍腰袋確認三枚硬木楔子全數完好無缺，「不過再往裡走，要是又遇上動不了的傷患，得改用滑輪拉，絕不能逞強硬背。」\n\n「嗯。」\n\n兩人重新掛上第二卷紅繩，肩並肩穿過翻湧的滾燙白霧，朝車間中段的二號熔煉廊全速推進。\n\n## ２\n\n二號熔煉廊的實際方位比三百年前的舊圖偏移了半個彎。\n\n兩人合力推開一道半敞的厚重防火門，靴底觸感驟然一變——堅實粗糙的石板在此戛然而止，眼前取而代之的是懸空架設的網格鐵板。下方暗渠沸騰的水氣裹挾著刺鼻硫磺味滾滾上湧，狹窄長廊裡並列立著六座古舊冷卻水槽，數名身穿古式工裝的工匠虛影正雙手端著長柄鐵杓，一遍遍將水槽裡滾沸的虛影熱水機械地傾進排水溝。\n\n就在第三座冷卻水槽後方的死角裡，六道身穿深灰市政制服與粗布工裝的身影緊縮在一堆翻倒的空鐵桶後面。一捕捉到軒人手裡防風鯨油燈的暖黃光束，裡頭立刻有人拚命揮手低喊：\n\n「這邊。我們全在這裡。」\n\n軒人並未貿然踏上鐵網，穩穩停在防火門側的真實石樑上，高舉左手比出三根手指：\n\n「看得清我舉了幾根手指嗎？」\n\n「三根！我們是活人，不是那些半透明的影子！」為首一名年輕技術員急切大喊，「腳下別踩正中央那塊泛紅光的網格板，那塊鐵板每過一分鐘就會往下翻開一次！」\n\n能即時回答新問題、又知道提醒機關規律，確定是活人無誤。軒人快步沿著邊緣真實樑筋繞進死角，同時掏出失聯名冊逐一清點——四名穿粗布工裝的年輕檢修工，加上兩名穿深灰市政制服、原本負責抄錄水壓的市政文書，正好六名受困市政人員，與名冊上的資料分毫不差。\n\n可剛靠近第三座冷卻水槽，軒人心口隨即一沉。\n\n剛才領頭答話的那名年輕技術員，右前臂正被一輛側翻的半透明礦渣推車鐵欄桿重重壓在水槽厚沿上，表皮已被灼出一圈觸目驚心的暗紅；而在他身旁，另一名年輕檢修工正捂著明顯腫脹的左腳踝靠坐在鐵桶邊——逃跑閃避翻板時一腳踩滑，把腳踝嚴重扭傷了。\n\n那幾名市政檢修工腰間其實都帶著制式的魔導千斤頂與切割鉗，水槽腳邊還散落著兩具已經焦黑變形的器械。只是這條二號熔煉廊裡充滿了高濃度的支爐外溢魔力紅霧，任何需要注入魔力啟動的工具一打開開關，就會瞬間與紅霧劇烈共鳴、燙得冒煙甚至反噬灼傷使用者的手掌，害他們空有滿身制式裝備卻束手無策；反倒是軒人為了配合自己「空值」體質而常年帶在身上的那套純機械滑輪組、不吃魔力的精鋼撬棍、靠腳跟撞針擊發的純機械氣瓶靴，以及那把磨得順手的扁頭拆件短刀，在這片讓所有魔導器徹底癱瘓的沸騰暗渠裡，成了唯一能救命的利器。\n\n「先分點水喝，千萬別硬拔手臂。」軒人解下腰間鋁製水壺，遞給一旁那名三十多歲、雙手微微發抖卻仍強撐著照料傷員的市政女文書，「除了你們六位，再往裡面還有其他人嗎？」\n\n「有。」扭傷腳踝的檢修工接過女文書遞來的鋁壺急灌了一口，顫抖的手指朝二號熔煉廊最盡頭那扇緊閉的實心小鐵門指去，「剛才通道突然變樣、大家往外跑的時候，水街送飯的那個十二歲小女孩嚇懵了跑錯方向，一頭鑽進最前面那間備品小鐵室裡；有個背著折疊木工尺的外地大叔聽見女孩哭，回頭衝進去救她，結果鐵門『匡噹』一聲從外頭反扣上了，兩個人全被關在裡面。」\n\n軒人與Eraser迅疾交換了一個眼神。\n\n水街送飯的十二歲女孩，正是本地名冊上最後的第十二人；而那個背著木工尺折返救人的外地大叔，果然印證了榊主任的判斷——是沒有登錄在本地名冊上的外地過路工匠。\n\n軒人立刻按下領口傳聲器，將這裡尋獲六名市政人員、以及最前端備品小鐵室還有兩人受困的座標簡明報回岸邊。\n\n就在他拇指鬆開按鍵的同一瞬間——\n\n咯吱吱。\n\n壓在年輕技術員右臂上的半透明礦渣推車毫無徵兆地劇烈震顫。車輪沿著斜傾的水槽鐵沿硬是再向下滑移了幾公分，暗紅滾燙的鐵欄桿眼看就要將技術員的前臂骨頭硬生生壓斷。\n\n技術員疼得猛吸一口冷氣，臉色瞬間褪得毫無血色。\n\n軒人反手拉出腰帶備用扣環牢牢勾住推車把手往後猛拽，靴底在網格鐵板上蹬出細碎火星。但這輛礦渣推車本就是一段尚未跑完的傾倒殘響，根本不存在實體剎車銷可供撬開；越往後硬拉，紅光裡那股機械式的反推力道反而壓得更重。\n\nEraser快步蹲至推車側面細看兩秒，右手抬起輕觸領口花扣——中央白珠依然透著純淨雪白。\n\n她湊近軒人耳畔，在翻騰的蒸汽嘶鳴下用僅供兩人聽清的氣音飛快開口：\n\n「這輛推車跟整條長廊的鐵網連在同一段殘響裡，不能整輛抹消，不然大家腳下的路會一併消失。但我可以只抹掉壓在他手臂上這十公分長的一小截欄桿，開出抽手的空隙。大約三秒。」\n\n「動手。我替妳擋住後面的視線。」\n\n軒人沒有半秒遲疑，跨前一步寬身側立，刻意敞開寬大的厚帆布工裝外套，連同左肩斜背的舊分離匣一起，將後方其餘五名市政人員的視線徹底擋住。與此同時，他左手亮出扁頭拆件短刀卡進推車欄桿縫隙，嗓音沉亮地喊道：\n\n「全都把臉轉開閉緊眼睛，後面的人退開半步別往前湊。我拿短刀硬撬這根帶火的鐵欄，小心崩出火星燙傷眼睛。」\n\n年輕技術員幾乎是本能地緊閉雙眼，猛地把臉扭向水槽內側；後方的五名市政人員也連忙抬起手肘緊緊護住面龐。\n\n軒人手腕一翻，故意拿短刀厚背朝身邊的空鐵桶用力敲出「噹、噹」兩記刺耳脆響。\n\n就在金屬撞擊聲炸裂的同一瞬，隱身在他肩影背後的Eraser探出右手，纖細的食指與中指筆直穿過翻湧熱氣，穩穩按上那截泛著刺目紅光的欄桿接點。\n\n滋。\n\n一秒。兩秒。三秒。\n\n沒有半點驚動旁人的炫目閃光，那截暗紅滾燙的鐵欄桿中段無聲融開了一道約莫十公分寬的純白缺口。\n\n「抽手！」軒人壓低嗓音出聲。\n\n他沉腰借力將技術員往後一帶，年輕人猛地將右前臂自那道純白空隙裡抽脫出來。幾乎就在手腕脫離的下一瞬，Eraser迅疾收回右手退回軒人肩後；那截斷開的暗紅欄桿虛影轟然合攏，匡噹一聲重重砸落水槽鐵沿，激起一大片翻騰的滾燙水霧。\n\n年輕技術員睜開眼，試著轉了轉沒有骨折、僅表皮燙紅的右前臂，滿眼震撼地盯著軒人手裡那把樸素的扁頭短刀：「你這手藝也太厲害了，連那種泛著紅光的詭異推車都能用刀撬開。」\n\n「只是運氣好，剛好卡對了接縫而已。」軒人隨口帶過，趁後頭五人連忙圍上來攙扶傷員的空檔，迅速垂眼檢查Eraser的右手與領口，壓低聲音追問，「花扣怎麼樣？」\n\n「白珠沒有變色。」Eraser輕聲回應，「指尖也不痛。」\n\n軒人退至防火門框旁，抬腕看過機械錶秒數，背對眾人按下傳聲器壓低嗓音向岸邊的千歲回報：「千歲姊，剛才為了救壓傷手臂的人動手了三秒，旁人沒看見，花扣白珠也沒泛黃。」\n\n傳聲器裡立刻傳來千歲俐落清晰的紀錄聲：「記下了。累計三秒，還剩八十七秒餘裕。後面能用工具硬拆的就用工具，別再零星消耗她的額度。」\n\n話音剛落，一行人正帶著六名市政人員退回二號熔煉廊入口的防火門前，頭頂與腳下卻在同時爆出一陣令人牙酸的鋼筋撕裂聲。\n\n轟隆。\n\n原本連接一號車間的那段三公尺長鐵走道，在剛才推車撞擊水槽引發的餘震裡徹底崩塌斷裂，扭曲的碎鐵板翻滾著墜進下方奔湧的沸騰暗渠，轉眼被厚重白霧吞沒。\n\n防火門檻外，赫然裂開了一道三公尺寬、足有一層樓深的斷層碎石坑。只有他們進來時牽過來的那條紅繩，依然孤零零地緊繃在翻騰熱霧之中，遙遙連向對岸一號車間牆壁上的真實鐵環。\n\n六名市政人員裡有兩人帶傷——一個右前臂剛脫困使不上勁、另一個左腳踝腫得根本無法著地——別說護送傷患，就算換成四肢健全的普通人，也不可能徒手抓著一根細麻繩盪過三公尺寬的沸騰深坑。\n\n軒人箭步跨到門框旁，急按傳聲器呼叫：「夜一，二號熔煉廊出口的走道塌了，跟一號車間之間裂開三公尺寬、一層樓深的斷口。紅繩還連著對面鐵環。」\n\n「我看得見這頭的紅繩在晃，但光影被牆擋死，我看不見你們那邊的門框，影釘沒辦法往那頭伸。」夜一的回應沉靜而迅疾，「一號車間真實鐵環後方我有四名工程班隊員守著。你們身上帶了滑輪，能自己架起一道索橋嗎？」\n\n軒人反手按上腰際那兩具千歲塞給他的重型鋼滑輪——原本一具預留給舊分離匣吊運，另一具正好能掛人員吊帶。\n\n「能架。」軒人偏頭看向身旁的Eraser，「這邊門框底下能確認真實承重點嗎？」\n\nEraser上前貼近防火門右側，抽過短刀以刀柄俐落敲碎表層泛著紅霧的浮灰，露出底下沉暗深鏽的厚重古鋼樑與鉚釘孔：「這根是三百年前的原車間主樑，是真的。但鋼索必須繞過整根橫樑，不能只掛在鉚釘孔邊緣。」\n\n軒人沒有多作猶豫，立刻將重型鋼索一端兜過粗實主樑拉緊打實死結，再解下左肩背負的舊分離匣暫交給Eraser護住，自己緊攥鋼索另一端往門內退開兩大步。\n\n隔著翻湧白霧望過去，對岸牆壁上的真實鐵環比這邊門檻略低十幾公分。更棘手的是，三公尺斷口正中央還懸著一扇每隔五秒便左右橫滑一次的半透明虛影鐵門，滑移時掀起的灼熱氣壓足以把半空裡的人直接掃下暗渠。\n\n「等那扇虛影鐵門往左滑開那一拍，我直接跳過去把滑輪鎖進對面鐵環。」\n\n軒人右腳往後一撤，腳跟精準磕響氣瓶靴的第一顆靴跟氣罐踏扣。\n\n五、四、三、二、一。\n\n暗紅色的虛影鐵門向左猛然滑開。\n\n軒人一步踩死門檻邊緣，壓下靴跟。\n\n砰——一記短促暴烈的高壓氣爆自靴底炸響。\n\n強勁的推力瞬間奪去雙腳的重力，整個人如離弦之箭凌空射出。滾燙的蒸汽貼著雙頰呼嘯掠過，下方一層樓深的暗渠白霧在視野邊緣急速飛退，短暫的失重感讓胃部猛地一提。\n\n然而身體剛越過斷口中段，軒人的呼吸陡然一滯——起跳那側的破敗門檻竟然在發力瞬間細微下沉了幾公分，硬是把整條拋物線的落點壓低了一截。\n\n半空無處借力，胸口眼看就要迎面撞上對岸堅硬的鐵沿。\n\n沒有多餘的思考時間。軒人腰腹暴收、雙膝猛地朝胸前曲起，趕在軀幹撞擊前硬是將兩隻靴底往前一送，精準蹬實對岸鐵板下緣的鋼邊；與此同時，對岸緊盯紅繩的工程班隊員同時發力，將連在他腰際的安全繩往後猛拉繃緊。\n\n咚。\n\n沉悶的撞擊聲在鋼板上震開。軒人順著安全繩的拉力翻滾躍上對岸鐵板，左膝蓋避無可避地結實磕上鋒利鐵沿——一股尖銳的白熱劇痛瞬間炸裂，眼前猛然泛白了半秒，深灰褲管應聲撕開滲出鮮紅血漬。可他雙手十指依然像鐵鉗般牢牢扣死牆上的真實鐵環，身軀連一公分都沒往坑底滑落。\n\n「站穩了，別再往後拉。」軒人咬牙吸進一口滾燙空氣，聲音有些發緊。\n\n他連揉一下劇痛左膝的空檔都沒留，單膝跪在鐵環邊飛快將鋼索穿入重型滑輪、拉緊打扣，緊接著架起上下平行的承重索與扶手索。他先把自己的全身重量掛上去用力試拉了兩下，確認兩端主樑紋絲不晃，這才朝對岸蒸氣裡等待的Eraser重重揮手。\n\n對岸的Eraser與兩名未受傷的檢修工迅速聯手，替第一位撤離者扣牢寬腰套。\n\n排在最前頭的，正是剛才那名三十多歲的市政女文書。當她站到崩裂的門檻邊沿、垂眼望見腳下一層樓深的暗紅碎石坑與底下沸騰咆哮的黑水時，臉上的血色瞬間褪得一乾二淨。她的雙膝不受控制地發軟後退了半步，嘴唇劇烈打顫，連完整的句子都拼湊不出來：\n\n「太高了……我只要一跨出去就會掉下去，我不敢……」\n\n後方熔煉廊深處驟然傳來礦渣推車撞碎冷卻水槽的巨響。那些原本只在原地反覆舀水的古裝工匠虛影，竟端著冒煙的長柄鐵杓一步步朝防火門逼近，走廊裡殘存的安全時間只剩最後幾分鐘。\n\nEraser沒有從背後推促她，也沒有拔高嗓音催喊。她平穩地向前一步，用完好的右手輕輕托起上方那道粗實扶手索，穩妥放進女文書冰涼濕黏的掌心裡，再覆上自己的手背陪她一同握緊，將那份沉穩的體溫傳過去：\n\n「不用自己跳。先把寬腰套扣牢，人先坐到門檻邊緣就行——現在我們先只做到坐下這一步。」\n\n女文書雙膝仍在發顫，抬眼望進少女澄澈無波的淡粉色眼眸，咬緊嘴唇順著她的節奏在冰涼的鐵門檻上坐穩，可兩條小腿依舊緊緊蜷縮在門內，不敢往外伸出半分。\n\n對岸的軒人單膝蹲低身形，刻意讓自己的視線與門檻上的女文書保持齊平。他沒有高喊什麼鼓舞的口號，只是抬手指了指自己腰間那只磕得微微發凹的鋁製水壺：\n\n「女士，剛才在水槽後面，是妳一路幫那兩位受傷的同事分水喝的吧？水壺現在掛在我腰上，裡頭還留著小半壺涼水。別往下看，就盯著我腰上這只水壺——我們先滑過來喝一口水，好不好？」\n\n女文書微微一怔。她順著聲音抬起眼，撞進對岸少年安穩而篤定的視線裡，胸口那陣急促紊亂的喘息竟奇蹟般放緩了一拍。\n\nEraser靜靜等著，直到感覺到掌心下她緊繃的雙肩不再劇烈顫抖，這才貼近她耳側，隨著她的呼吸緩緩數拍：\n\n「聽著我的節奏。吸氣，吐氣——我數到三。妳手裡的扶手索別放開，只要把兩隻腳往前輕輕一伸，腰上這條寬皮帶就會牢牢接住妳。一、二、三。」\n\n女文書緊閉雙眼，把心一橫，順著最後一聲輕數將雙腳筆直伸出了門檻。\n\n滑輪喀噠一聲穩穩吃住體重。軒人與身後工程班隊員同步均勻收繩，女文書短促地驚呼了一聲，十指緊緊扣住上方扶手索，不過兩三個呼吸的工夫便平穩滑越三公尺深坑，鞋底結實踩上軒人身前的實體鐵板。\n\n「到了，腳底下全是真鐵板。」軒人俐落替她解開腰套扣環。\n\n女文書睜開眼，先伸手摸了一把腳下堅硬冰涼的鐵板，緊接著忽然揪住軒人的衣袖，壓抑不住地無聲哭了出來。\n\n「想哭等會兒再哭，先退到後面石柱邊喝口水，把落腳位騰給下一個人。」軒人把鋁製水壺塞進她掌心。\n\n女文書胡亂抹開臉上的淚水用力點頭，自己扶著牆根退進安全處。有了第一位跨出的示範，剩餘五名市政人員的撤離瞬間變得俐落流暢——左腳踝扭傷的檢修工優先被吊過對岸，另一名市政文書與兩名檢修工緊隨其後；至於右前臂剛脫困的那名年輕技術員，也沒有逞強去拉繩子，反而一越過斷口便主動坐進安全區，用雙腳穩穩抵住滑輪底座，幫工程班壓直走繩防止纏結。\n\n不到三分鐘，六名受困的市政人員全數安全越過斷口。\n\n最後輪到Eraser自己。她先將舊分離匣扣上滑輪平穩送過對岸，再刻意避開打著護板的左腕，以右手將腰套牢牢扣緊在身前，握穩扶手索朝對岸的軒人輕輕一點頭。\n\n軒人與工程班隊員同時均勻收繩。就在Eraser滑抵對岸邊沿的那一刻，軒人踏前半步，探出左手穩穩接住她的腰套扣環收住前衝的慣性，讓她的雙腳輕巧平穩地落回實體鐵板正中央。\n\n「左手護板剛才磕到了嗎？」軒人垂眼替她鬆開扣環。\n\n「沒有。倒是你的左膝蓋。」Eraser的目光筆直落在他撕裂滲血的褲管口，「剛才落地撞在鐵沿上了。」\n\n軒人低頭瞄了一眼，彎曲伸直了兩下膝關節：「只擦破一層皮，骨頭跟關節都沒事，照樣跑得動。」\n\n傳聲器裡緊接著傳來榊主任俐落的通報聲：\n\n「第二批六名市政人員全部確認上岸，累計獲救十一人。名冊上還差最後那名十二歲送飯女孩，以及你們剛剛追加通報的一名背木工尺的外地工匠。」\n\n話音剛落，整座二號熔煉廊外側那些不停閃爍的半透明虛影工燈，竟無預警地接連暗滅了一大片，連空氣中壓迫皮膚的灼熱紅霧都肉眼可見地稀薄了幾分。\n\n「水街東口與東石橋頭兩處的底下石槽均已封實，上方銅管全部關閉。」榊主任的聲音裡難得透出一絲俐落而克制的振奮，「河岸舊調壓所組正在拆除最後一處鐵架底座。注意，主控鐵箱本身的失控指令還沒截斷，你們一救出最後兩個人，立刻準備就位接箱。」\n\n## ３\n\n岸邊防風魔導提燈暖黃的光暈下，先後獲救的十一個人正披著厚毛毯、捧著熱水碗慢慢緩氣。\n\n而在一號車間通往最前部舊主架的實體大鋼樑旁，兩名總站工程班隊員正滿頭大汗地將手臂粗的實體鋼索與重型鐵夾牢牢鎖上入口門框，徹底接替下那份硬撐了大半個小時的結構負荷。\n\n軒人與Eraser沿著滑索返抵中段、剛繞過粗重主樑，腳步卻不約而同地微微一頓。\n\n不遠處，真崎夜一正背靠著一根冰冷鐵柱微微低頭，安靜地調整著呼吸。\n\n頭頂高出力魔導探照燈慘白的光束垂直灑落下來。軒人的目光定格在他垂在身側的那隻左手上——沒有手套遮掩的五根修長手指，此刻竟然失去了所有血色，指節泛著一層近乎凍傷般的青白寒意，彷彿剛從冰窟裡抽出來一般；連他試圖微微舒展指尖時，關節都顯出幾分僵硬滯澀。\n\n察覺到兩人的腳步與落在手背上的視線，夜一抬起眼，灰色的眸子平靜如寒潭。\n\n他沒有解釋半個字，也沒露出一絲示弱或疲態，只是神色如常地從黑大衣口袋裡抽出那隻薄手套，修長的右手平穩地捏住袖口，將那五根凍得發白的手指一根一根套回黑布裡，徹底藏進衣袖陰影之下。\n\n「給我兩分鐘換位。」夜一微轉了轉套回手套的左腕，嗓音淡得聽不出半分波動，「門框已經用鋼索鎖死了，用不著我再拿影子硬撐。我直接前移到最前面備品小鐵室附近那根真實大樑下接應你們。」\n\n說完，他微微頷首，轉身融進實體鋼樑內側的暗影裡，無聲朝更深處移去。\n\n軒人收回目光，沒有多問，趁這兩分鐘空檔單膝蹲下，最後清點了一遍全身裝備。\n\n氣瓶靴裡的靴跟氣罐還剩兩顆；腰袋裡的三枚硬木楔子一枚未動，依然整齊留著三枚；扁頭拆件短刀的刀尖剛才卡推車欄桿時又崩了一小粒，但刃口依舊堪用。右肩絕不可提重、左虎口舊傷隔著紗布微微滲出一絲紅血、左膝蓋剛磕破皮；抬起頭望向身旁，Eraser領口那枚五瓣花扣的中央白珠依然透著純淨雪白，高負荷抹消額度還留有足足八十七秒。\n\n兩人確認完畢，踩著舊主架側面的真實工字鋼樑朝最深處推進。\n\n越接近最前方那座低沉嗡鳴的主控鐵箱，周圍來回搬運礦石的工匠虛影便越密集，留給活人落腳的實體通道也收縮得越發狹窄。走到通往備品小鐵室前最後一段不到一公尺寬的懸空鋼道時，望著眼前每隔幾秒便交錯滑過的滾燙蒸汽管虛影，軒人的腳步忍不住停了下來：\n\n「Eraser，前面那間備品小鐵室是純機械鎖，裡頭沒有需要妳抹消的術式。要不妳先留在這根大樑後頭等我？我一個人過去撬開門把那兩個人帶出來就行，免得這條窄道太擠，虛影撞傷妳完好的右手。」\n\nEraser腳步一停，偏過臉靜靜望著他：\n\n「那如果你過去撬門的時候，身後這排蒸汽管虛影換了位置把退路封死，誰幫你辨認腳下哪一塊鋼板才是真的？」\n\n「我可以用粉筆在真鋼板上畫記號——」\n\n「粉筆畫在半空重疊的假地板上，虛影一錯位，記號也會跟著消失。」Eraser語氣平靜，眼神卻寸步不讓，「反過來，如果現在我叫你留在這根柱子後面養你右肩和左膝的傷，由我自己拎著撬棍過去開門，你會點頭嗎？」\n\n軒人張了張嘴：「那怎麼行，妳左手還固定著護板，單手怎麼撐得住撬開變形厚鐵門的力道。」\n\n「所以我們兩個各自想出來的『把對方留在安全處』方案，都有漏洞。」\n\nEraser筆直望進他的眼底，清亮的聲音在翻騰蒸汽裡格外清晰：\n\n「昨晚我們在分工表上清清楚楚寫好了，一起進去，一起出來。不要因為怕對方受傷，就臨時替對方改決定。前面真有過不去的險處我們當場商量，只要任何一個人喊停，就立刻一起退回去。」\n\n軒人愣了兩秒。迎著少女清澈篤定的淡粉色雙眸，心底那股總想獨自攬下所有危險的壞習慣頓時散了個乾淨，他忍不住低聲笑了出來：\n\n「……妳說得對，我又犯了一個人硬扛的壞習慣。走吧，我們一起過去。」\n\n兩人踩準蒸汽管交錯的兩秒縫隙，一前一後俐落掠過不到一公尺寬的懸空窄道。\n\n備品小鐵室是一間直接焊在舊主架前端的實體小鐵房。外門鐵皮被連日震動擠壓得微微扭曲變形，門把外側還裝著一截泛著暗紅餘熱的自動閉門彈簧桿，裡頭緊緊壓縮著隨時會暴彈反甩的強大張力。\n\n軒人蹲在門前，沒有急著插刀撬縫，先舉起短刀刀柄在厚鐵門上用力敲出『兩長一短、兩長一短』的新節奏：\n\n「裡面有人嗎？聽得見活人說話的話，照我剛才的節奏敲回來。」\n\n不到兩秒，厚鐵門內側便傳來清晰的『兩長一短』回響，緊跟著是一道沉穩微喘的中年男聲：「在。我和這個女孩都沒受重傷，就是門從外頭卡死了推不開。」\n\n「是活人，不是重複錄音的殘響。」\n\n軒人這才俯低身軀，目光銳利地審視門側那根紅光隱隱、緊繃如滿弓的自動閉門彈簧桿。\n\n三年前在倉庫裡漏看輪軸蓄力的血淋淋教訓，他此刻記得分毫不差。\n\n還沒碰觸變形的門栓半分，他先掀開腰袋，精準抽出兩枚硬木楔子，穩穩敲進閉門彈簧的壓縮槽裡咬死彈片——腰袋裡如今只剩下最後一枚硬木楔子。緊接著他拉出備用短鋼索，將整根彈簧筒繞了整整三圈，死死捆緊在旁邊的真實角鋼支架上，伸手用力扳試了兩下確認蓄力徹底鎖死，再示意Eraser退到門扇彈開的半徑之外，這才反手探出扁頭拆件短刀，對準變形門栓猛地一挑。\n\n匡噹。\n\n厚鐵門乾脆彈開二十公分。蓄滿力道的閉門彈簧剛一掙動，便被兩枚硬木楔子與三圈短鋼索牢牢壓死在原位，連半分反彈的餘地都沒有，沒有傷到任何人。\n\n可門才剛拉開，一團滾滾沸騰的暗紅管道虛影恰巧從門檻下方翻湧上來，瞬間吞沒了正門前方的半片踏板。\n\n小鐵室裡頭，一名左腳明顯腫起、手裡緊握著一把折疊木工尺的中年木匠正護著牆角的小女孩——那個十二歲、懷裡到現在還緊抱著一只空送飯食盒的小女孩。\n\n中年木匠只探頭掃過門外翻湧的紅霧，立刻俐落抬手指向小鐵室頭頂那扇用四顆蝴蝶螺帽固定的方形鐵蓋：\n\n「少年，別硬走正門。我是外地來幫人丈量門窗的木匠，剛才關在裡頭把整間屋子摸透了——掀開這間備品室的頂蓋，上去就直接踩在舊主架最頂端那根真實的工字大樑上，從上面走完全碰不到底下的紅霧。」\n\n軒人舉燈仰頭一照。屋頂確實是一扇純機械咬合的檢修通風蓋，四周鉚釘真實厚重。\n\n他踩著屋角兩隻翻扣的結實空鐵桶翻身躍起，雙手奮力擰下那四顆鏽緊的蝴蝶螺帽，一把推開沉重頂蓋。夾雜著外頭河面氣息的清涼冷風瞬間從上方灌進悶熱的小屋。軒人接過岸邊放過來的獨立安全腰套，先替嚇得發抖的送飯小女孩扣牢，再與木匠合力，將小女孩與扭傷左腳的木匠一先一後托上頭頂寬闊的工字大樑。\n\n只要順著這根真實的工字大樑往外走出十幾步，就是工程班架好的安全平台。\n\n然而就在小女孩剛剛站上工字大樑、正要邁步往外走的那一剎那，她不經意偏頭往腳下瞥了一眼。\n\n下方十幾公尺深處，奔騰咆哮的暗黑河水正炸開滾白浪花，猛烈拍擊著石墩。\n\n十二歲女孩臉上的血色瞬間消褪，雙腿一軟，沾了水氣的布鞋鞋底毫無徵兆地從微濕的窄樑邊緣滑了出去——整個人一腳踏空，朝深淵直墜下去。\n\n呼吸都在這一秒凝止。\n\n近在咫尺的軒人腦中警鈴大作，千歲臨行前的死命令卻已化作刻進骨血的本能——絕不能用受傷的右肩去硬拉下墜的活人。不及細想，他雙腳分開狠踏實工字樑面，重心壓低到底，反手一把撈過小女孩連著的安全腰套繩，在自己腰帶主承重環裡迅疾扣繞鎖死，靠整個腰胯與下盤硬扛住這股驟然襲來的猛墜衝擊。\n\n幾乎就在小女孩靴尖懸空下墜的同一剎那——\n\n早已前移到距離備品室僅有十幾步遠的那根真實大樑柱下、早就摘掉黑手套戒備多時的真崎夜一，單腳踏實柱腳，蒼白的左掌朝工字樑側面凌空一翻。\n\n一道濃墨般的漆黑長影自樑柱陰影中疾刺而出，瞬間橫跨這十幾步距離，精準而平穩地橫托在工字樑下沿小女孩滑空的雙腳底下，輕巧地將她向外滑脫的勢頭往樑面內側一推。與此同時，岸上早已繃緊神經的四名巡查員同時低喊，雙臂同步發力猛收滑輪索。\n\n腰帶主環的穩拉、十幾步外黑影的及時托舉、加上岸邊滑輪的收緊——三股力道在同一秒無縫銜接。小女孩僅離樑下墜了不到半公尺，便被眾人齊力穩穩拽回工字大樑內側，平平安安滑上了安全平台。\n\n五分鐘後，懷抱空食盒的送飯小女孩與左腳扭傷的外地木匠，雙雙踏上了岸邊搖晃卻溫暖的救援木艇。\n\n岸邊燈光下，等得雙眼通紅的女孩父親衝破警戒線，一把將女兒緊緊擁進懷裡失聲痛哭；外地木匠拍了拍肩上的鐵灰，朝著河岸上空這片紅霧遠遠舉起手裡的折疊木工尺揮了兩下。\n\n榊主任站在指揮棚前，手持炭筆在失聯名冊最後一格工整劃下勾號，隨即按下總頻道傳聲器，清亮沉穩的聲音傳遍整條河岸：\n\n「第十二名已知失聯者、以及第十三名外地過路工匠，全數確認安全上岸。目前七號支爐舊檢修站內已無任何受困平民，僅剩內側作業人員兩名——不破軒人、Eraser。」\n\n檢修站最深處。\n\n軒人與Eraser並肩坐在舊主架前端的實體檢修平台上，輪流喝下一口鋁壺裡最後殘存的微涼清水，慢慢讓胸口狂跳的呼吸平復下來。\n\n岸邊點名表最下方，屬於他們兩人的那兩格撤出欄依然空著。\n\n而在兩人眼前不到十步遠的暗紅霧氣深處，那座統御了整條第七支爐整整三百年的「主控鐵箱」，正隨著箱底巨型傳動輪軸的沉重轉動，發出一陣陣悶雷般低沉而執拗的嗡鳴。\n\n——第九章完——\n", "mtime": 1795001666.159697}, {"filename": "10_第十章_我不是勇者.md", "content": "# 第十章　我不是勇者\n\n## １\n\n這座地下支爐並不知道，它原本要供暖的舊時代早已結束了。\n\n主控鐵箱上方的紅色指示燈依然亮著。每隔半分鐘，箱頂那塊顯示運作狀態的黃銅翻牌便會「喀噠」翻過一面，平穩地停在『維持運轉・等待交接』的位置上。\n\n軒人沒有因為那十三名受困者都已平安上岸，就直接衝過去開箱。\n\n他先將岸邊巡查員遞來的車間結構核對圖攤在膝上，與Eraser一同沿著主鐵架的最前端又走了一遍。舊工具間、司機值班席、存放備用魔石的窄鐵櫃——每一扇可能藏著人的小門，兩人都親自拉開、舉起防風鯨油燈向內照看，並敲出『兩長一短』的新節奏反覆確認。\n\n值班席的鐵椅上，只剩一雙早已乾硬脆化的厚革隔熱手套；操作台旁的鐵夾扣著一塊空白的黃銅交接牌。半透明的值班員虛影仍握著操縱桿，嘴裡低念著三百年前的壓力讀數，沒有因兩人的腳步聲而轉過頭來。\n\n軒人蹲下身確認過座椅底下最後一處死角，在核對圖的末格劃下勾號，按下傳聲器：\n\n「前部死角全部清查完畢，沒有發現其他活人。所有受困人員均已在岸上。」\n\n岸邊的榊主任核對完內外兩份名單，隨即應聲：「收到。允許接近主控鐵箱。」\n\nEraser站在值班席旁，順手將旁邊一扇半敞的實體檢修小鐵門闔上扣緊，免得凸出的門角待會撤退時勾住衣擺：\n\n「前面就是了。」\n\n主控鐵箱比軒人預想的更為龐大。那並非能隨手提走的鐵盒，而是直接焊死在主鐵架正中央、幾乎與肩同高的厚重黑鐵方箱。兩根粗大的導流管沿底座向後延伸，箱體側面焊著一塊僅容兩名維修工並肩站立的實體窄鐵台；窄台正下方，一組巨型傳動輪軸仍在持續運轉，震動順著鐵骨不斷傳上腳底。\n\n岸上工程班預先架設的四根新鋼索已牢牢扣進主鐵架的吊耳，另一端繞過河岸的三座真實石墩，將主架穩穩拉在檢修平台觸手可及的位置。\n\n傳聲器裡傳來千歲的叮囑：\n\n「先找主控鐵箱背面的檢修小蓋。別去拆整面外殼，底下的傳動輪軸還沒停。」\n\n軒人對照著舊圖冊上的標示，在主控鐵箱背向值班席的一側找到一塊巴掌大的六角小鐵蓋。四顆固定螺絲鏽蝕頗深，所幸螺帽邊緣還留著足以咬住扳手的稜角。\n\n他解開左肩舊分離匣外層的防雨帆布套，將匣子平放在窄台上。Eraser站在他左側，暫時還沒把短導線接上花扣，只是先將匣子的接頭轉向自己右手最順手的角度。\n\n就在軒人以左手握住扳手、才將第一顆螺絲轉鬆半圈的瞬間——\n\n岸邊陡然傳來一聲急促的呼喊。\n\n幾乎在同一拍，主控鐵箱底下的傳動輪軸驟然暴衝加速。牽制主架西側的那根承重鋼索迸出尖銳刺耳的金屬刮擦聲，軒人腳下的實體窄台猛地朝河面方向傾斜了幾公分。\n\n噹、噹、噹。\n\n岸邊的警戒銅鈴連響三聲，急促而清亮。\n\n軒人連半秒遲疑都沒有，當場鬆開手裡只差半圈就能卸下的螺絲，左手反手扣緊舊分離匣的提把：\n\n「退！」\n\n他讓Eraser先踏上後方寬闊的真實工字樑，自己緊貼在後。兩人沿著剛才確認過的退路迅速撤回中段的檢修平台，沒有停在原地去賭那三聲鈴響是不是誤報。\n\n「內側已退回安全平台。舊分離匣未接通，還沒開始。」軒人按下傳聲器回報。\n\n守在平台前端的真崎夜一抬起右手，指向右側的備用踏板：\n\n「靠右邊站。西側這根副樑要換支撐點。」\n\n待兩人退至右側踏板站穩，夜一這才鬆開按在西側副樑陰影上的左手。失去壓制的副樑立刻向下一沉，隨即被岸上放下的第二道備用鋼索穩穩接住，停在不會撞及主架的安全高度。\n\n軒人回頭望了眼剛才站立的窄鐵台。隨著副樑下沉，窄台的角度已偏往另一側——方才他若貪快多留三秒把那顆螺絲卸完，此刻兩人恐怕已經掛在傾斜的鐵板上隨風搖晃了。\n\n傳聲器裡響起榊主任簡明冷靜的說明：\n\n「河岸調壓所組剛才卸下了最後一段新供能管，主鐵架失去外部壓制，開始動用殘存動力試圖啟動返程輪軸。主樑載重並未超標，但側向受力改變了，剛才已讓下方的施工員全數撤出。」\n\n千歲的聲音緊跟著插了進來：\n\n「不能讓底下的大輪子一邊拖著平台走、你們一邊在上面接線。得先把窄台下面那根紅色的『離合拉桿』拔出來，讓大輪子跟鐵架脫開空轉，把那股扯力卸掉。」\n\n軒人俯身朝窄台下方探去。\n\n主控鐵箱底座與傳動輪軸之間，果然橫著一根漆著暗紅防鏽漆的L形生鐵拉桿。只要將它向外抽到底，底下的巨型傳動大輪便會與主架脫離咬合；屆時大輪轉得再瘋狂，也不會再拉扯平台。\n\n問題在於，那根紅色離合拉桿深嵌在主架下方的凹槽裡，四周全是高速往復抽送的粗重連桿；更致命的是，主控鐵箱正下方正是整座七號支爐三百年魔力亂流最狂暴的風眼。普通人類或白塔技師只要垂降到那裡，體內的魔力迴路就會被高壓亂流攪得劇烈逆流，撐不到十秒就會昏厥墜河；現場所有人之中，唯獨體內沒有半條魔力迴路可以被共鳴的「空值」軒人能夠下去。可此刻底下的傳動大輪正在失控暴走，震得整根主樑與檢修平台劇烈顫抖，金屬結構發出令人牙酸的哀鳴。人若是懸吊在晃動不止的鐵架下方作業，只要平台再猛地偏移一點，身體便會直接被捲進輪軸裡。\n\n軒人剛抓起腰後的絕緣長撬棍，身旁的真崎夜一已向前踏出一步。他扯下左手的黑皮手套塞進口袋，單膝重重跪落於檢修平台邊緣那片厚實的真實陰影裡。\n\n「下面輪子轉得太快，我抓不住拉桿。」夜一抬起灰色的雙眼，語速冷靜而極快，「但我可以把這段主樑跟平台釘死，給你三十秒不會亂晃的落點。你敢下去拔嗎？」\n\n軒人拍了拍腰帶兩側的雙重承重鐵環，掂了掂掌中微涼的絕緣長撬棍：\n\n「只要上面不亂晃，我敢。」\n\n「好。動作快，別讓我撐太久。」\n\n話音未落，夜一的左掌重重壓進了平台邊緣的陰影之中。\n\n嗡。\n\n濃得化不開的漆黑影釘自陰影裡驟然爆發，沿著真實鋼樑的輪廓疾射而出，宛如鐵鑄的暗楔般深深咬進震顫的主樑節點與平台支腳。劇烈顛簸的鐵架發出一聲沉悶的低響，原本不斷往西側滑移的狂暴震顫，竟在眨眼間被壓平了八成，窄台下方那根紅色拉桿的位置隨即穩了下來。\n\n夜一咬緊牙關，左手腕蒼白皮膚下的漆黑紋路繃得微微泛青，額角瞬間沁出一層冷汗，卻沒吐出半句多餘的字。\n\nEraser快步來到平台邊緣，借著燈光朝下迅速掃過拉桿根部的結構，抬頭朝軒人報出細節：\n\n「拉桿左邊有一片半圓形的生鏽鐵卡扣壓著。要先往上挑開卡扣，拉桿才能往外拔。」\n\n「記住了。挑開左邊卡扣，再往外拔。」\n\n軒人向岸上工程班打出俐落的手勢。四名工程隊員立刻合力拉緊繫在他腰帶兩側的雙重安全腰索。軒人沒有逞勇直接跳落，而是坐上平台邊緣，確認雙索已確實承接住全身重量、雙肘貼緊腰側避開受傷的右肩後，順著滑輪穩穩垂降到了主架下方。\n\n轟隆翻湧的黑色河水就在靴底兩公尺處咆哮。\n\n高速狂轉的巨型傳動大輪與粗鐵連桿幾乎擦著額角掠過，掀起的滾燙機油熱風撲面而來，嗆得鼻腔發辣，飛濺的細碎鐵屑打在臉頰上陣陣生疼。齒輪咬合與連桿撞擊的銳響就在耳膜邊炸開，連牙關都跟著微微發麻。四周足以令尋常術師與技師瞬間迴路逆流昏厥的高壓魔力亂流，穿過軒人沒有半條魔力迴路的「空值」軀體時卻無法激起絲毫共鳴；在這座狂暴的魔力風眼裡，他只會感受到物理上的熱風與震動，雙手依然能穩如磐石地握住絕緣長撬棍，準備挑開生鏽卡扣、拔出紅色離合拉桿並塞入最後一枚硬木楔。\n\n唯有頭頂的鋼樑穩若定錨，連一絲晃動也沒有。夜一正用盡全力替他死死釘住這短短三十秒的空間。\n\n軒人屏息盯死往復抽送的鐵連桿，在心底默數節拍。\n\n一拍、兩拍——\n\n就在粗壯連桿向下掠過凹槽、前方閃出窄窄空隙的那一瞬間，軒人手腕一送，將絕緣長撬棍的扁頭精準探進拉桿左側，雙手抵緊鐵架立柱找準支點，沉腰發力向上猛撬。\n\n鏗。\n\n鏽死在凹槽裡的半圓形鐵卡扣發出銳響，被撬棍強行頂開，向上跳起了一截。\n\n連桿的下一輪迴掃已在頭頂帶出破風聲。軒人不等氣息換完，左手順勢換握撬棍中段，將棍身卡入L形拉桿的彎折處，壓低腰身，將全身體重連同左臂力道一併向外猛推——受傷的右肩沒有勉強發力，全憑撬棍的槓桿與雙重腰索的張力向外施勁。\n\n咯吱——喀嚓、匡啷。\n\n沉重而清脆的齒輪脫鉤聲撕開了滾燙的熱風。\n\n紅色離合拉桿猛地向外滑出一整截。下一秒，整座主鐵架驀然一輕；底座下那組瘋狂拖曳鋼索的巨型傳動大輪徹底脫離咬合，在空洞的鐵腹中發出尖銳嘯聲，進入毫無阻力的空轉。壓在主樑、檢修平台與岸邊石墩上的駭人前衝拉力，瞬間卸得乾乾淨淨。\n\n軒人沒有急著喊人收繩。趁著身體還懸在觸手可及的高度，他立刻騰出左手，從腰袋裡摸出最後一枚硬木楔子——先前在備品室門外已經用掉兩枚，這是身上僅剩的最後一枚。\n\n他摸準方才挑開的鐵卡扣底部縫隙，將硬木楔子死死塞入卡緊，反手用撬棍尾端連敲兩下砸實，再順手抽下腰間短皮帶，繞著支架與拉桿紮了個緊密的死結，徹底封死拉桿因餘震彈回的可能。\n\n「拉桿拔到底了，卡扣也用最後一枚木楔卡死了。拉我上去。」\n\n岸上絞盤飛快轉動，穩穩將軒人拉回檢修平台。\n\n他靴底剛踏實鐵板，單膝跪在平台邊緣的夜一便立刻抽回了按進陰影裡的左手。那五根手指僵直失血，蒼白得彷彿剛從冰水裡抽出來一般，指節正抑制不住地細微發抖。夜一扶著膝蓋起身，眼神卻平靜無波，彷彿剛才承受的負荷與自己毫無干係，只是默不作聲地將凍得發青的左手插回外套口袋：\n\n「主樑已經不會再偏了。接下來的事，交給你們。」\n\n## ２\n\n趁著工程班進行最後一次鋼索覆檢的空檔，對岸的榊主任步上離河畔最近的高台，舉起傳聲器朝平台上的兩人開口：\n\n「不破軒人，Eraser。現在十三名受困者都已安全上岸，主架的傳動輪軸也已經卸開。你們此刻仍然可以選擇撤回岸上，改採原定的『外部炸藥切斷方案』。」\n\n軒人抬起頭，隔著翻湧的河水望向對岸的街區。\n\n暮色已經垂落。水街與灰鐵巷一帶的魔導路燈熄滅了大半，只有幾名留守的工程員正抱著厚木板加固堤防。隨著外圍三組卸除水閘供能，河道水位比一小時前明顯退落了不少。\n\n「如果現在改用炸藥切斷方案，水街和灰鐵巷那邊會怎麼樣？」軒人對著傳聲器問。\n\n榊主任沒有粉飾，聲音依然平直而務實：\n\n「人都不會有事。但為了確保支爐的殘留指令不再順著石造基座爬進城裡，我們必須把河堤內側連著蓄水廊的三排舊地基一併爆破。停水、封橋與居民安置的時間會拉長到半年以上，水街臨河的那兩排老房子也保不住。事後總站會負責重建，不會讓這條街的居民無家可歸——這是最壞情況下的底線。」\n\n軒人聽完，沒有代任何人下決定，只是側過頭看向身旁的Eraser。\n\nEraser沒有望向對岸的屋舍，也沒有因為眾人奔波了一整天就賭氣說非上不可。她先抬起自己的右手，五指緩緩張開又收攏，逐一確認每個指節的靈活度，接著低頭看了一眼領口那枚銀色五瓣花扣。\n\n中央的白珠依舊純白澄澈，早上改裝完成的獨立魔力環沒有半點發熱。\n\n「剛才等你們換支撐、拔離合拉桿的時候，我沒有動用能力，不算在九十秒裡面。」她抬起臉，平靜地對著傳聲器說，「我的右手現在很穩。只要主控鐵箱打開之後，裡面的線路跟舊圖冊上畫的一樣，我就能做完。」\n\n傳聲器裡傳來千歲的聲音：\n\n「記住，九十秒只是理論上限，不是叫妳非撐滿九十秒不可。打開箱子後先看能不能分成三段，每做完一段就停下來核對讀數。就算中途叫停退回來，也不算誰違約。」\n\n軒人也低頭看了看自己的雙手與雙腿。\n\n左手虎口雖纏著紗布，握緊扳手與壓下隔板扣柄的力道卻還綽綽有餘；右肩只要不去硬提重物就不會讓拉傷惡化；左膝蓋磨破了皮，蹲起依然俐落；靴跟裡還留著兩顆氣罐，而腰袋裡最後一枚硬木楔子，此刻正牢牢卡在腳下的離合拉桿裡。當他把能做的事與做不到的事一條條劃清界線之後，心頭反倒不再有昨日那股混濁的焦躁。\n\n「我可以走到主控鐵箱旁邊，能開蓋、能壓隔板。重物交給外面的滑輪吊，不讓右肩去扛。」軒人說。\n\nEraser輕輕點頭：「我想過去打開看看。如果裡面的接點跟圖紙不符，我們就馬上退回來。」\n\n對岸的榊主任沉默了兩秒，乾脆地應道：\n\n「批准。外圍撤離路線與救援艇原地待命。內外任何一組只要出現異常，我會立刻下令中止。」\n\n軒人重新挎起舊分離匣的寬背帶。Eraser走到他左手邊，伸出右手替他將微微歪斜的匣身扶正：\n\n「剛才螺絲只差半圈的時候，謝謝你馬上停下來了。」\n\n軒人望向那塊已被工程班重新校平的窄鐵台：「本來就該停。」\n\n「該停，還是可以說謝謝。」\n\n軒人有些不好意思地摸了摸鼻尖，將左肩的背帶往自己身側收緊些許，替她騰出更寬敞的落腳處。兩人並肩重新踏上主鐵架，走回主控鐵箱旁。\n\n## ３\n\n軒人先俯身往窄台下方看了一眼。方才塞進紅色離合拉桿鐵卡扣底部的最後一枚硬木楔子與短皮帶依舊咬得牢不可動，底下空轉的巨型輪軸沒有把半點拉扯傳上主架。\n\n確認無誤後，他這才直起身，用左手握住扳手，逐一卸下六角檢修小鐵蓋上剩餘的四顆螺絲。\n\nEraser站在他的左前方，以右手穩穩托住鬆脫的鐵蓋，免得它滑進底下的輪軸之間。\n\n小鐵蓋掀開的瞬間，箱內沒有刺眼強光，也沒有彈出任何險惡的機關。\n\n厚重的黑鐵腹腔內，整齊排列著三組古工坊制式的黃銅接點，左右兩側還掛著昔日供技師掃灰用的小銅刷；而在接點正中央的防潮厚玻璃罩裡，靜靜封存著一卷歷經三百年光澤暗沉、字跡與孔位卻依舊清晰可辨的黃銅打孔壓痕記錄帶。\n\n軒人舉起防風鯨油燈湊近玻璃罩。\n\n溫暖微黃的火光映上暗沉的銅面，清晰照出了三百年前幾名技師留下的層層壓痕：有人在最初的供暖區域代號上用力劃下兩道深槓，補壓了一行『西側地陷，管路中斷』；緊接著下方則刻著一列極為工整的字句：『支爐轉入最低維持功率，保留自動巡檢，待地面接應人員抵達後辦理停爐移交』。\n\n而在最末那格標著『移交簽收人』的方框裡，銅面平整光滑，半個字也沒有。\n\n記錄帶旁連著一枚仍靠微弱殘餘動力驅動的機械鋼印。就在兩人凝視玻璃罩的當下，那枚鋼印極輕微地「喀噠」落下了一次，在空白簽收格的邊緣又添上一道淺淺的新刻痕：**『交接未完成・維持運轉』**。\n\n整整三百年間，這枚盲目的鋼印就這樣日復一日地在黃銅帶上反覆落下，壓出同一句沒有回音的等待，等著一個再也沒走下台階的人。\n\n軒人望著那片空白的簽收欄，胸口無聲地沉了下去。\n\n「原來當年造這座爐子的人，並不是為了困住誰才設下不肯停機的指令。」軒人低聲道。\n\n「嗯。」Eraser隔著厚玻璃凝望那卷黯淡的黃銅帶，「他們知道外面的路斷了，只想把爐火留在不會炸開的最低出力，等上面的人下來交接。只是負責下來簽字的那個人，後來再也沒有回來過。」\n\n就像舊鐘塔底下那些無人領取的雨傘與八音盒一樣。\n\n有些東西遲遲不肯停下，並非懷著什麼毀滅世界的惡意，不過是三百年前的一場地陷，讓那個說好要回來關門的人迷了路。\n\n軒人從工具袋裡取出總站配發的感光留影板，貼近厚玻璃對準那段黃銅記錄帶按下快門，小心收進胸前的防水袋裡：\n\n「這段紀錄我們拍下來帶出去交給總站歸檔。至於還沒辦完的停爐交接——今天我們幫他辦完。」\n\n他將舊分離匣底部的卡扣牢牢鎖上窄台的實體鐵環，抽出匣內三條主長線，依照舊圖冊上的幾何標記，精準接入主控鐵箱內部的三組黃銅接點。\n\n舊分離匣立刻將箱內原本糾纏不清的迴路，清清楚楚地分理到三個獨立插槽裡：\n\n第一槽，是「管幻影的線」，連著整座車間裡所有的虛影與防衛機關；\n第二槽，是「連向城裡的管線」，通往水街與東石橋底下的舊石槽；\n最深處的第三槽，則是「底下不肯熄的主火種」，只要壓力驟降便會強行重新點火。\n\n「先把管幻影的線抹掉，周圍這些車間虛影和吊籃就會全部消失。」Eraser盯著三個插槽說，「我們腳下踩著的主鐵架是真的，但旁邊那些半透明的鐵板就都不能再碰了。」\n\n「接著切斷連向城裡的管線，最後徹底熄滅底下不肯熄的主火種。」軒人左手握緊舊分離匣側面的三枚精鋼隔板扣柄，低頭再次確認她胸前短導線的快拆扣，「有這座幾乎齊肩的厚重黑鐵箱擋著，對岸的人只會以為我們是在用舊分離匣關爐子，看不見妳的手。每抹掉一個插槽，我就立刻壓下對應的隔板鎖死，絕不讓消掉的火倒灌回來。」\n\n這時，遠處河岸舊調壓所的方向傳來兩聲清亮的哨音。兩名沾滿泥水的總站技師從暗渠口翻出，朝高台上的榊主任高高揮動綠旗。\n\n傳聲器裡隨即響起榊主任沉穩明確的指令：\n\n「外圍三組底下石槽全部封死確認。」\n「三組上層銅管關閉確認。」\n「鐵架底座全部拆開，下方施工人員全數撤出安全線外。內側可以開始。」\n\n千歲的聲音緊接著傳來，沒有半點催逼，只有始終如一的冷靜：\n\n「軒人，那個角度看得到她的花扣白珠嗎？」\n\n軒人將防風鯨油燈掛上窄台左前方的鐵鉤，暖黃燈光正好照亮Eraser的領口：「看得很清楚。」\n\n「Eraser，現在右手感覺怎麼樣？」\n\n「手指能完全張開，不麻也不痛。左手固定著沒動。」\n\n「好，身體維持讀數很穩定。我這邊開始計時，剛才在二號廊用掉的三秒已經扣掉了，現在剩八十七秒。」\n\nEraser輕輕應了一聲。\n\n伸出手前，她最後抬起眼，望向不遠處值班席上那個仍在重複抬手看錶的工匠虛影，又望了一眼入口處那個仍在向空氣索要通行牌的值班員。\n\n「這一次停下來，他們就不會再出來了。」她輕聲說。\n\n軒人沒有說什麼寬慰的空話。那些留在水氣裡的殘影聽不見新的回答，也無法像她一樣走出地底，去買打折的起司麵包、去挑一條深藍色的髮帶。\n\n「他們已經加了三百年的班了。」軒人握緊冰冷的隔板扣柄，聲音放得很輕，「至於工坊裡那些真正值得記住的事，妳已經記在腦子裡帶出來了。」\n\nEraser垂下眼望著自己的右手指尖，微微點了點頭：\n\n「說得也是。」\n\n她深吸一口氣，抬起右手，將指腹穩穩按上第一層插槽——那條「管幻影的線」的起筆接點。\n\n## ４\n\n滋——\n\n一道純白如雪的光痕順著Eraser的指尖流進了主控鐵箱。\n\n車間裡最先褪去的，是聲音。\n\n叮叮噹噹翻動工具的雜響、礦石吊籃擦過軌道的軋聲、廣播裡一遍又一遍催促無關人員離場的重複通告，從最外圍的值班室開始，如退潮般被迅速抽離。\n\n懸於半空的虛影車廂沒有爆炸，只是安靜地散去了輪廓。值班席上那個緊握操縱桿長達三百年的模糊人影，在河風裡化作細碎的白點飄散，只餘下那雙真實而乾硬的舊手套，依然孤零零地平放在空無一人的鐵椅中央。\n\n傳聲器裡隱約夾進一聲對岸觀察哨向總站的急報——遠岸的哨兵望見暮色中的主控鐵箱後方接連湧出純白光流、車間虛影隨之大片崩散，只當是那只三百年前的古物『舊分離匣』啟動了淨化程序，絲毫無人察覺在齊肩高的黑鐵箱背後，真正止住這座古爐的，不過是少女的一隻右手。\n\nEraser的右手穩穩覆在第一槽上，手背肌膚底下的細密紋路亮起柔和白光，呼吸均勻綿長，固定著的左手穩穩垂在身側，未曾抬起半分。\n\n傳聲器裡傳來千歲冷靜的報數：「十九秒。第一層讀數歸零，隔開。」\n\n軒人左手果斷壓下第一枚精鋼扣柄。\n\n喀嚓。\n\n第一片絕緣隔板重重插落槽底，將外層接點徹底封死。\n\n「第一段完成。」軒人報出進度。\n\nEraser收回右手，向右平移幾公分，五指按上第二層插槽——「連向城裡的管線」。\n\n嗡——\n\n整座主控鐵箱彷彿被地底潛伏的龐然巨物猛地向下一扯。厚重黑鐵發出低沉刺耳的震鳴，腳下窄台劇烈顛簸，滾燙白霧自底座接縫噴湧而出。早有防備的軒人雙腳分立、靴底死死抵住主架鉚釘，腰間雙索瞬間繃成直線，穩住了重心。\n\n白光灌入第二層插槽。四周與水街、東石橋重疊的虛假廊道與暗紅蒸汽管，在同一剎那寸寸裂開，碎作漫天白雪。\n\n河谷真正的夜色、毫無遮蔽的湍急河水、對岸架起高出力魔導探照燈與防風魔導提燈的真實堤岸，一口氣全數撲進視野之中。清冽涼爽的秋夜河風終於毫無阻礙地灌上窄台，吹起Eraser頰邊淡粉色的碎髮。她沒有分心騰手，軒人立刻伸出左手輕輕幫她撥開擋在眼前的髮絲，隨即把掌心按回第二枚扣柄上。\n\n主控鐵箱底下，失去外圍阻力的巨型傳動輪軸空轉得越發尖銳；但因方才在夜一釘死主樑的三十秒裡，那根紅色離合拉桿已被軒人徹底抽離、又用最後一枚硬木楔鎖死了卡扣，狂暴的空轉沒有對主架造成半點牽扯。\n\n「四十六秒！中間那層到底了，扣隔板！」千歲的聲音自傳聲器裡響起。\n\n軒人毫不遲疑地壓下第二枚精鋼扣柄。\n\n喀嚓。\n\n第二片隔板重重落鎖。所有外接管線與借來的通道徹底斷絕，兩人此刻就站在河心三座真實石墩撐起的斑駁舊鐵架上，四周再無半塊虛假的地板。\n\nEraser的右手撤離第二層插槽時，指尖幾不可察地輕顫了一下。\n\n軒人立刻垂眼看向她領口的花扣——白珠依舊純白，尚未變色。\n\n「手還能繼續嗎？」他的聲音壓得很穩。\n\n「能繼續。」Eraser答道。\n\n只剩最深處的第三層插槽了。\n\n那條「底下不肯熄的主火種」彷彿察覺所有外圍通道俱斷，槽底深處的暗紅刻紋驟然暴閃，發狂般試圖繞過隔板重新點燃。滾燙熱浪迎面撲來，烤得軒人連睫毛都發了乾。\n\nEraser沒有退後半步，伸出右手，將五指直接按上了第三層最深處的起筆原點。\n\n匡、匡、匡。\n\n主控鐵箱頂部那塊黃銅狀態翻牌突然失控般劇烈翻撞起來，黑鐵腹腔深處擠出斷斷續續、如同齒輪卡死般的古老提示音：\n\n『交接未確認……不得停機……維持最低爐壓……』\n\n純白光痕沿著深處的暗紅刻紋，一分一毫地硬壓進去。每一秒都繃得像拉至極限的弓弦。汗珠沿著軒人的額角滑落，左手虎口再次崩開的鮮血滲透紗布，濕黏地貼上了冰冷的精鋼扣柄。\n\n第六十秒。\n\n箱底積蓄了三百年的最後一股高溫反衝沿著插槽猛然頂上。Eraser的肩膀往前一震，軒人立刻以左前臂死死抵住舊分離匣的邊框穩住機身，手掌卻極力克制著，沒有去碰觸她正在施術的右手。\n\n啪。\n\n一聲極輕、卻在兩人耳畔清晰無比的脆響。\n\n在Eraser白皙的右手背上，順著既有的迴路紋理，赫然裂開了一道細微的紅痕。\n\n軒人的呼吸才剛收緊，Eraser便遵守約定，搶在他開口前清清楚楚地報出了狀況：\n\n「手痛。不是左腕，是右手背裂開了一點。」\n\n「我看見了。白珠還沒變色。」軒人一眨不眨地緊盯著她領口的花扣，同時對著傳聲器大聲回報，「千歲姊，她右手背出了道細裂，白珠還是白的。」\n\n傳聲器另一端的千歲沒有要她勉強撐下去，只盯著讀數表飛快報數：\n\n「六十八秒。最後那道主火種已經斷了八成，接點沒有漏電。再看五秒，只要白珠外圈一發黃，不管斷沒斷完都立刻拉開。」\n\n七十秒。\n\n七十一秒。\n\n七十二秒。\n\n主控鐵箱深處猛地迸出一聲「錚」的崩響——那是緊繃了三百年的主發條徹底斷裂的聲音。整座黑鐵方箱向前劇烈一震，軒人左膝猛地一沉，腰間安全索隨即繃緊接住兩人的重量；他沾滿血汗的左手卻始終死死扣在第三枚隔板扣柄上，一步未退。\n\n就在第七十四秒跳動的同一剎那——\n\n防風鯨油燈的微光映照下，Eraser領口那枚五瓣花扣中央的白珠最外緣，浮現出了一抹極淡的鵝黃。\n\n「變色了，停手！」\n\n軒人的聲音剛落，Eraser的五指沒有半拍遲疑，乾脆地彈離插槽；而在同一瞬間，軒人將左臂僅剩的全部力氣都壓上了最後一片精鋼隔板。\n\n喀嚓。\n\n三片絕緣隔板全數鎖死。\n\n剛被白光抹去起筆點的最後一道暗紅火紋，被第三片隔板徹底斬斷退路，撞上冷鋼後再也沒能合攏。鐵箱腹中最後一枚小齒輪孤零零地空轉兩圈，緩緩靜止。箱頂那塊不停翻撞的黃銅狀態翻牌失去了支撐，「啪」地一聲翻倒，露出了完全空白的背面。\n\n玻璃罩裡那枚敲了三百年的機械鋼印，也終於懸停在了半空，再沒有落下來。\n\n## ５\n\n喧囂徹底退盡之後，軒人最先聽見的，是自己粗重而微顫的呼吸聲。\n\n緊接著，是腳下嘩啦流淌的真實河水聲。\n\n秋夜的風很涼，帶著濕潤泥土與水草的氣味。原來這條大河一直都在這裡安靜地流著，只是過去三百年間，它的水聲始終被那座不肯停下的舊支爐壓在了底下。\n\nEraser將右手垂回身側，五指因方才的熱負荷而微微蜷曲，暫時無法完全張開。她低頭看著已不再發熱的花扣，以左手尚能活動的兩根手指配合下巴，親手按開了胸前短導線的快拆扣，將維持自身運轉的獨立魔力環完好地留在領口。\n\n「右手不能再用了。」她轉過臉對軒人說，「不過身上沒有不舒服，自己走得動。」\n\n「知道了，右手一點都不用再動了。」\n\n傳聲器裡傳來千歲長長吐出一口氣的聲音，語速比剛才快了幾分：\n\n「最後一道重啟連接確認切斷，支爐核心讀數徹底歸零，沒有往任何一條新管線倒灌。這次抹消用了七十四秒，加上前面的三秒一共七十七秒，沒有超過九十秒紅線。不過她的右手背已經有熱損傷了，絕對不准再碰任何術式，馬上帶人回來。」\n\n軒人望著眼前這座終於沉寂下來的黑鐵方箱。三片精鋼隔板牢牢鎖在槽位裡，箱內的紅光已徹底熄滅，不見半點殘光。\n\nEraser站在他身側，靜靜凝視那塊翻到空白面的黃銅牌片刻：\n\n「這次真的停了。」\n\n「嗯，停了。」\n\n軒人鬆開握著扣柄的左手，這才發覺掌心幾乎被冷汗與虎口滲出的血黏在鐵柄上。他原本想將鎖在窄台上的舊分離匣提起來帶走，才剛往上提起一點，便感覺到匣底的三片隔板已與主控鐵箱內的黃銅接點死死咬合——若此刻強行拔出，剛才隔開的三段死迴路極可能重新碰接。\n\n軒人立刻收手，對著傳聲器回報狀況。\n\n千歲只回了一句話：「匣子留著。」\n\n「那三根主長線要不要拆——」\n\n「長線也留著，只要把連著她花扣的那根短線拆下來就行。整隻匣子就留在上面當永久隔板，等明天水流平緩了，總站自然會派人慢慢封存。人先給我回來。」\n\n軒人望著那只冒險從沉沒舊工坊帶出、昨晚又徹夜修繕的舊分離匣，這一回沒有半分猶豫。他乾脆地取來備用短繩，將匣子緊緊繫牢在窄台上免得滑落河中，隨即轉身替Eraser扣妥岸上遞來的第二條安全腰索。\n\n「走平台回去，還是坐滑輪吊椅？」軒人問她。\n\nEraser低頭看了看自己的雙腳：「走平台就行，我的腳沒有受傷。只是右手握不住扶手繩。」\n\n「那我們把兩條腰索並在一起，妳走我前面半步，岸上收繩，我在後面扶著妳的腰帶環。」\n\n兩人順著真實的工字樑一步一步往回走。\n\n當半透明的虛影車廂與假地板全數散去，眼前的路反倒比來時明晰得多。哪裡是鉚釘、哪裡是鋼樑、哪裡是河面，清清楚楚，再也不必提防踩下去會跌進三百年前的另一處角落。\n\n行至中段那根剛換過支撐的副樑前，真崎夜一仍站在外側護欄旁等他們。他左臂的黑紋已經褪去，雙手靜靜插在外套口袋裡：\n\n「這一段現在靠的是下面的實心鋼索，不用再靠我的影子了。直接走過來吧。」\n\n軒人點頭致意，陪著Eraser平穩走過副樑，踏上通往岸邊的實體鐵階梯。\n\n階梯底下，救援木艇的船夫一直將船頭頂在石墩旁等候，兩名救援員立在船首伸出了手。\n\nEraser先走下最後一級台階，卻在跨上船板前停住腳步，轉身安靜地等著軒人。\n\n軒人原本出於習慣，差點脫口說出「妳先上船坐好不用等我」，可望進她在暮色餘暉裡靜靜凝視自己的眼眸，他將那句話嚥了回去，邁步走到她身旁，與她同一拍踏上了救援艇的木板。\n\n船身隨著兩人的重量微沉，隨即被平緩的河水溫柔托住。船夫撐起長木篙，木艇緩緩駛離了主鐵架的陰影。\n\n軒人坐在船艙長椅上，回頭望向河心那座支撐了三百年的舊支爐主架。\n\n褪去暗紅濃霧與虛影之後，留在河面上的不過是一副鏽跡斑斑、用了太久也壞了太久的普通鐵架。主控鐵箱頂端那塊空白的黃銅翻牌靜靜立在晚風裡，再也不會替任何人催促下一班交接了。\n\n木艇靠岸時，天際最後一道橘紅色的晚霞恰好灑落在灰鐵巷的屋頂上。\n\n榊主任站在岸邊的登記桌後，桌上的點名冊被河風拂得微微翻動，紙角壓著一顆拆下來的六角螺帽。\n\n軒人與Eraser走上河岸，救援員替兩人解開腰間安全索，引領他們來到登記桌前。\n\n「不破軒人。」榊主任提筆，念出內側作業欄的第一個名字。\n\n「在。」軒人應道。\n\n榊主任低頭望向最後一欄，念出了那個今天早晨由她自己親手填下的名字：\n\n「Eraser。」\n\n少女立在溫暖的岸邊燈火裡，望向對面正拄著手杖朝自己微笑的千歲，清脆而清晰地答道：\n\n「在這裡。」\n\n——第十章完——\n", "mtime": 1795001671.7568276}, {"filename": "11_第十一章_明天也營業.md", "content": "# 第十一章　明天也營業\n\n## １\n\n晚鐘亭沒有在隔天——十月二十七日建城燈祭當天——就急著開門做生意。\n\n遠處高台上層區的慶典鐘聲順著秋風隱約飄落下來時，千歲才剛把店門板拉上一半，在門外掛起一塊親手寫的木牌：**『店休三日，暫停收件』**，底下又添了兩行小字，註明先前寄放且已修妥的器具可由側窗領取。她沒有去叫還在樓上沉睡的軒人起來代筆。\n\n軒人這一覺一路睡到了接近正午。\n\n醒來時，最先飄進鼻息的是樓下廚房傳來的煎蛋與烤麵包香氣，緊接著才是右肩、左虎口與左膝同時湧上來的陣陣痠痛。前幾日在緊繃狀態下無暇顧及的拉傷與擦傷，一旦徹底鬆懈下來，便全都清晰地浮上了表面。\n\n他扶著床沿慢慢坐起身，正準備將腳探進拖鞋裡，房門便被人輕輕敲響了兩下。\n\n「醒了嗎？」門外傳來Eraser的聲音。\n\n「醒了。」\n\n「千歲師傅說，等你完全清醒了再下樓吃飯，不用急。」\n\n「她今天早上煎什麼？」\n\n「雞蛋。」\n\n軒人頓了一拍，隔著門板試探著問：「……沒有煎成黑炭吧？」\n\n門外安靜了一口氣的時間。\n\n「今天不是我煎的。」Eraser的語氣聽不出起伏，卻在轉身下樓前補上一句，「不過這句話，我會記著的。」\n\n走廊傳來她平穩下樓的腳步聲，沒有因為他還沒開門就一直守在門外等著。軒人坐在床邊失笑，等右肩那股抽痛緩了過去，才慢條斯理地起身換好衣服。不必趕在某道水閘墜落前衝出門，也不必提防誰會在半路被虛影捲走。雖然還帶著一點不真實的陌生感，樓下的煎蛋卻依然是熱的。\n\n走下木梯時，秋日正午清透的陽光正從敞開的窗櫺斜照進店內。\n\nEraser坐在餐桌靠窗的一側。她右手背貼著千歲昨晚新換的散熱銀絲護布，左腕的杉木夾板已拆去一半，換成兩片更為輕巧的軟皮固定墊。她面前的湯碗穩穩嵌在特製的防滑木托裡，旁側擺著一支握柄加粗的湯匙，即使手指不必費力收攏也能輕鬆握穩。\n\n軒人拉開對面的椅子坐下，目光落在那支湯匙上：「早上新改的？」\n\n「千歲師傅做了三種粗細，讓我自己試。」Eraser以左手輕扶碗沿，右手握住粗柄湯匙示範了一下，「這支最不會滑掉。」\n\n千歲從爐邊盛出最後一份煎蛋，端到軒人面前：\n\n「吃完飯把左膝的褲管捲起來給我看。這禮拜不准接外勤，也不准去後院搬那些廢鐵箱。」\n\n「那原本排在明後天的幾單修理活怎麼辦？」\n\n「能延期的我都讓人去通知過了，急著用的便轉給西街的老鐵匠。」千歲有些無奈地瞥了他一眼，「總不能因為我們店裡坐著兩個傷號，就要求全灰鐵巷的人都把壞掉的茶壺留到你能跑為止吧？」\n\n軒人摸了摸鼻尖，乖乖拿起筷子開始吃飯。\n\nEraser瓷碟裡的黑麥麵包已經切成容易入口的小方塊，唯獨碟緣留著一小塊切得歪歪扭扭的麵包角。她察覺軒人的視線，開口說：\n\n「那一塊是我早上試著用左手切的。後面的才請千歲師傅幫忙。」\n\n「剛拆掉木板，慢慢來就行。」\n\n「我沒有急。我的意思是，那一塊你可以吃。」\n\n軒人微愣，隨即笑著將那塊切歪的麵包角夾進自己碗裡。邊角雖然歪斜了些，入口依舊滿是溫厚的麥香，與切得方正的麵包塊並無半點差別。\n\n用過飯，千歲沒有立刻把餐桌收拾回工作檯，而是取出一只裝著備用小魔石的木盒，將接下來的手部養護計畫工整地寫在紙上，推到Eraser面前讓她親自過目：\n\n「妳胸口那枚花扣背面的獨立魔力環非常穩定，往後只需每天早晚更換一顆普通小魔石就能正常生活。記得在覺得疲累之前提前說，不要等魔石耗盡才換。」\n\nEraser輕輕點頭。\n\n「至於右手背昨天裂開的那道熱損傷，我已用絕緣銀絲將『大負荷抹消通路』暫時隔開；左腕的固定墊再戴一個禮拜就能卸下，先恢復日常動作，別拿它代替右手去搬重物。」千歲停下筆，抬眼望向她，「再往後，有些深層線路若要重新接回高負荷狀態，得花上好幾個月慢慢調養。不過就算養好了，我也不建議妳再照從前那種不顧自己死活的方式使用。」\n\nEraser凝望著木盒裡那幾顆溫潤的白色小魔石，沉默片刻後輕輕搖了搖頭：\n\n「不用接回以前那樣了。」\n\n千歲靜靜看著她。\n\n「就算以後無法一口氣抹掉整座支爐也沒關係。」Eraser以左手尚能活動的指尖輕壓住紙頁邊角，聲音平靜而清澈，「往後若要動用能力，我要先清楚自己的手能承受多少，在裂開之前就停下來。比起恢復大範圍的抹消，我想先學會自己換花扣裡的小魔石，還有怎麼使用店裡的普通工具。」\n\n「那就把『自己換魔石』和『認識普通工具』列在第一項。」\n\n千歲唇角微微彎起，露出溫和的笑意，提筆將清單上的順序改了過來，又意有所指地瞥了一眼旁邊的軒人：「而且妳領口這枚獨立魔力環平時輸出的微弱供能不會觸發抹消，剛好夠點亮日常魔導器具的啟動感應紋。等妳學會用店裡的普通工具，以後軒人這個連感應燈都按不亮的『空值』修完東西，就不用每次都隔著半間屋子喊我過來幫他通電試機了。」\n\n軒人坐在一旁望著這幅光景，忽地想起十來天前初次在舊鐘塔底座遇見她時的模樣。那時的她，甚至打算任由河水漫上來、獨自躺回石台上沉睡過去；而此刻，她正坐在秋日的陽光裡，與千歲認真商量著如何照護自己的雙手、如何親手替自己更換魔石。\n\n## ２\n\n隔日下午，也就是十月二十八日，榊主任親自帶著一份厚重的事故結案與工程核查紀錄來到了晚鐘亭。\n\n公開的結案報告中，詳盡記載了第七分塔長榊原私自焊死城外排渣管、隱瞞支爐過載的始末，以及總站如何與晚鐘亭協力、憑藉古工坊遺留的『舊分離匣』完成外圍隔離與內側停爐的全部時序。報告將切斷支爐的功績全數歸於那只業已焊死封存的舊分離匣，對Eraser的非人真身與徒手抹消能力未曾提及半句。榊原與分塔幾名涉案主管則已被押送往王都中央監察院候審。\n\n晚鐘亭需要核對簽署的，是他們親自參與的那一段。\n\n軒人坐在櫃檯後方一頁一頁細讀。三天前下午進行貨運支架測試時，他延誤十秒報出檢查工位置的疏失並未被刻意抹去，其後則如實記載著更正後的隔離步驟，以及隔日在車間內救出十三名受困者的經過——沒有因為結局圓滿，便將先前的教訓當作未曾發生。軒人在制動手把結構那欄補了一行附註，工整簽下自己的名字。\n\nEraser的部分則由她親自核實。因右手背仍包著護布不便書寫長句，她便口述請千歲代筆，再逐行細看確認，不讓軒人憑記憶替自己代填哪裡作痛、哪裡無恙。\n\n文件的末頁，夾著最初那張『回收青銅減壓器匣一件』的舊委託底單。\n\n紙面正中已蓋上醒目的註銷紅印，旁側附著一行正式批註：**『經查，原申報之青銅減壓器匣已隨舊分離匣一併封存結案，即刻註銷。相關人員之勘查、救援、器材損耗及醫療支出，另案分項核發。』**\n\n「這張註銷底單交由你們留存。」榊主任點了點背面的結案編號，「總站檔案庫裡的紀錄已全數變更為器材封存。今後無論哪個部門調閱查核，都不會再有人上門找什麼『零號』或青銅減壓器匣了。」\n\n軒人凝望那張紙頁，懸在心頭許久的重擔終於徹底卸了下來。他填妥簽收欄，將紙收進店裡『已結案』檔案冊的最後一頁。\n\nEraser伸出左手，輕輕碰了碰那本檔案冊的封皮：「這本以後還會拿出來看嗎？」\n\n「年底對帳的時候或許會翻一下吧。」\n\n「那不要放在最上面。」\n\n軒人依著她的意思，將那張舊底單壓到了整本冊子的最底層。\n\n第二份文件載明著實實在在的報酬與補償。那並非足以讓整座城鎮忘卻損失的鉅額金幣，而是將外勤勘查費、高危救援津貼、舊分離匣修復耗材與徵用補償，連同兩人的醫藥費逐項列得清清楚楚。\n\nEraser領到了專屬自己的一袋銀幣，並未因借住於晚鐘亭，便與軒人的那份混作一處交給千歲。\n\n榊主任請她在領取人欄簽名。她拿起千歲備妥的粗桿鉛筆，以左手一筆一筆緩慢寫下自己的名字。由於改用左手，字跡比她第一天以右手寫下的略顯歪斜，但她落完最後一筆便平靜放下鉛筆，沒有為了好看而擦掉重來。\n\n將文件收進公事包前，榊主任又從夾層抽出一張蓋著管網總站鋼印的硬紙，推至櫃檯中央。\n\n軒人低頭望去，抬頭印著『外環管線災後遺孤證明』幾個工整黑字。他略顯意外地抬起目光——這位向來只講程序與代價的主任，並不像是會私下替人打點戶籍的人。\n\n榊主任沒有迴避他的視線。她臉上依舊沒有絲毫多餘的溫情，口吻平淡冷靜得宛如在核對一份尋常的損益清冊：\n\n「把妳登記為外環災後遺孤、落戶在晚鐘亭名下當個普通店員，外面就沒有人能循線追查到古工坊『零號』還活著。讓妳安穩留在我們看得到的地方，比落進本塔研究官或軍部手裡引發二次災難，代價要小得多。」\n\n這番冷峻到底的算術，反倒讓千歲與軒人都踏實了幾分。比起口頭上空泛好聽的承諾，一份算得清清楚楚的風險與代價顯然更值得信賴。\n\nEraser安靜注視著那張蓋有鋼印的證明，點頭道：「我明白了。我不會亂跑，也不會在大街上隨意動用能力。」\n\n「那這份代價就算划算。」榊主任拎起公事包，朝三人微微點頭，隨即轉身離開了晚鐘亭。\n\n待店門上的黃銅小鈴晃完最後一記清響，軒人看著Eraser把銀幣仔細裝進隨身小布袋，剛想脫口說「這禮拜的房租不用急著今天交——」，Eraser已先抬起眼望向了他。\n\n軒人立刻將後半句嚥了回去，改口道：「房租的期限是妳跟千歲姊談的，妳自己問她。」\n\n千歲坐在旁側的工作檯後，頭也沒抬地說：\n\n「房租照原訂的週期算。養傷這幾天的工錢怎麼折抵我們另外再談，不需要你們兩個站在櫃檯前面互相替對方省錢。還有，也別因為覺得住店裡過意不去，就搶著做粗活——我現在店裡養著兩個不能提重物的傷號，最不需要的就是有人硬搬箱子搬到一半砸在腳面上。」\n\n軒人默默收回剛伸向地上空文件箱的左手：「……那個箱子其實是空的。」\n\n「空的也可以留著，等手腳俐落的人來收。」千歲頭也不回地應道。\n\n＊　　　＊　　　＊\n\n店休滿三日後的隔天——十月三十日一早，晚鐘亭重新卸下一半門板，將門口的木牌換作『養傷期間，僅收小件』，開始接回輕便的日常修繕。\n\n軒人暫不接高處外勤，只守在櫃檯後方整理零件與報價，將卸下的螺絲依尺寸分放進小木盤。Eraser則坐在他身旁的椅子上，先傾聽客人描述器具哪裡出了毛病，以她那雙能辨識微弱殘留術式的眼睛做初步檢視，再拿粗桿筆把客人平日使用的頻率與預計取件時間記在收件單上。\n\n她寫字還不算快，遇上較長的句子便會請對方稍微說慢些。灰鐵巷的鄰居們沒有一個人因她落筆稍慢而露出一絲不耐。\n\n第一件交到她面前的，是一口靠底座感應紋發熱、切斷開關後卻依然燙得無法端走的雙耳魔導湯鍋。\n\nEraser沒有貿然伸手觸碰滾燙的鍋底，而是先請客人指出平時按哪處感應紋控溫，請軒人取來隔熱木架墊妥，自己這才俯身細看鍋底的刻紋：\n\n「不是整口鍋的術式壞了。是散熱口旁邊那片補漏的銅皮貼偏了一點，把原本排熱的迴路擋住了。只要把那片銅皮拆下來重新焊正，裡面聚著的熱氣就能自行散掉。」\n\n千歲走過來瞄了一眼，點頭贊許：「判斷得很準。這點小活現在就能處理，妳來告訴客人要收多少工錢。」\n\n軒人接過雙耳魔導湯鍋，只花了幾分鐘便用純物理手藝將那片補漏銅皮拆下、重新對準散熱口焊得嚴絲合縫。他依然是那個手指按在感應紋上連一盞小燈都點不亮的「空值」，但把補漏銅皮修好之後，他不再需要像以前那樣尷尬地喊千歲或請客人自己試機——他只要自然地把修好的湯鍋往旁邊一推，坐在他身旁的Eraser便伸出已經拆掉護板、帶著獨立魔力環微弱供能的左手，輕輕在鍋底啟動感應紋上一碰，替他完成最後一步「通電試機」。\n\n底座的溫控光紋應聲平穩亮起，聚積的悶熱隨即順著散熱口散去。\n\nEraser對照價目表，認真地將三枚銅幣的焊補費告知客人。目送客人滿意地笑著端鍋離去，她低頭望著桌上的銅幣，神情還透著些許新奇：\n\n「這樣就算是幫上忙了嗎？」\n\n「當然算，而且幫了大忙。」千歲走回工作檯，「不然以前軒人獨自看店時，有好幾回悶著頭把東西修好了，才發覺客人根本不是要那樣用的。」\n\n「那都是兩年前的舊事了。」軒人小聲抗議。\n\n「去年冬天也有一回。」千歲毫不留情地戳破了他。\n\n當天午後，千歲與軒人帶著榊主任送來的『外環管線災後遺孤證明』，陪著Eraser前往灰鐵巷街口的市政辦事處辦理正式的居住登記。\n\n為了不在市政名冊留下古工坊代號招來疑竇，千歲在親屬擔保欄將她登記為自家遠房晚輩，名義上正好與對外說法一致，算作軒人的遠親表妹；戶籍姓名依讀音寫成當地常見的**『伊蕾莎（Eraser）』**，年齡記為十六歲。外環灰鐵巷本就是各地工匠聚居的區域，異色長髮與略帶生疏的口音屢見不鮮，窗口的辦事員核過總站鋼印的遺孤證明後，一句多餘的話也沒問，俐落地落下了入冊印。\n\n當那塊蓋著市政鋼印、刻著『住址：第七區灰鐵巷晚鐘亭』的住戶木牌遞入Eraser掌中時，她立在辦事處門外的屋簷下，將薄薄的木牌翻到背面，又翻回正面，靜靜凝視了片刻，才珍重地收進隨身小布袋裡。\n\n千歲腿腳不便，辦妥手續便先行回店照看爐火；軒人與Eraser回程時順道繞過西坡的臨時市場，探望了染布坊的老闆娘。\n\n多虧四天前成功從內部關閉主控鐵箱，水街與灰鐵巷免於動用炸藥爆破，絕大多數屋舍得以完好保存；只是為了徹底清出地基底下殘留的舊支爐管線，水街仍須停水封路兩個禮拜。總站依循軒人先前替老闆娘寫的申請單，在臨時市場南側劃出了一塊通水車的空地，兩名工人正協助把那根拆成兩截的晾布橫桿重新架好。\n\n老闆娘一眼看見兩人，彎身從櫃檯下抱出一疊洗得潔淨、還散著淡淡皂角清香的布袋與工具布遞給軒人：\n\n「你們上個禮拜送來洗補的工具布和布袋，前幾天水壓亂成一團耽擱了，這兩日接上水車總算洗淨補妥。灰是全洗掉了，不過有一條沾到血印的留了一道淺痕，先跟你們說一聲。」\n\n軒人接過來低頭一看，擺在最上頭的，正是第一天他借給Eraser裝《白央散步指南》的那只斜背小布袋。袋角原本磨破的缺口，已被老闆娘以細密緊實的針腳仔細補好。\n\nEraser看見那只布袋，伸手輕撫補妥的袋角：\n\n「這個袋子，我還沒還你。」\n\n「妳裝書還用得上，先留著用吧。」軒人說。\n\n「那我跟你買下來。」\n\n軒人微怔。一旁的染布坊老闆娘看了兩人一眼，忍著笑轉過身去抖床單，假裝自己手邊忙得脫不開身。\n\n「本來就是店裡的舊袋子，哪用得著買……」軒人話說一半，忽地想起自己第一天在舊鐘塔下確實講過『袋子得還我』，便順勢改口，「那就照舊布袋的價錢，算兩枚銅幣吧，修補過的地方不算新的。」\n\nEraser從隨身小布袋裡數出兩枚銅幣，穩穩放進軒人掌心，這才接過那只補好袋角的斜背布袋，將《白央散步指南》裝進去，自己調妥了背帶長度。\n\n走回晚鐘亭的路上，軒人望著她背著那只縫有深色補線的小布袋走在秋陽下的背影，忍不住多看了兩眼。\n\n「怎麼了？」Eraser回過頭問。\n\n「補袋角的線跟原來的布顏色不太一樣。」\n\n「看得出補過，但我覺得不難看。」\n\n她將先前改裝完花扣時他稱讚過的那句話，一字不差地還給了他，說完便轉回頭繼續邁步。軒人站在原地怔了一秒，隨即笑著快步追了上去。\n\n## ３\n\n停爐後的第二個禮拜、初入十一月的週四，Eraser頭一回不靠千歲從旁協助，親手完成了花扣背面小魔石的更換。\n\n她先將備用小魔石卡進花扣背面的副槽接住供能，再以已經卸掉固定墊、恢復靈巧的左手轉開主槽護蓋，對準上面的刻痕記號，不偏不倚地替換下耗盡的舊魔石。頭一次轉動時方向略微偏了一格，她自己看清刻痕後退回重對了一回，從頭到尾連呼吸都沒有亂。\n\n正在樓下整理貨架的軒人聽見下樓的腳步聲，抬頭問：「換好了？」\n\n「換好了。千歲師傅說再練兩次就能更熟練。」\n\n軒人順手將她常用的圓凳從桌下拉出來。Eraser落座喝了口水——此刻她已能用左手穩穩扶住水杯側面，不再需要防滑木托了。\n\n午後，千歲發現後院高架上的備用銅線見了底，吩咐軒人去拿一卷新的。\n\n裝著銅線的木箱擱在兩公尺高的貨架頂層，重量超過軒人右肩目前能負荷的限度。軒人立在架前仰頭打量了兩秒，沒有像從前那樣搬來凳子勉強去搬，而是走到前店門口，花了兩枚銅幣請一名恰巧推著空車經過的碼頭搬運工進來，協助將木箱安穩地移到地上，還不忘叮囑對方別碰著右邊那箱尚未卸掉發條的舊轉輪。\n\n正在工作檯後修錶的千歲聽見後院的動靜，抬眼望了一下，什麼也沒說，唇角卻幾不可察地彎起些許，低頭繼續修著手裡的錶。\n\n軒人從地上的木箱取出所需的銅線，心底竟湧上一股格外的踏實。\n\n原來把話說明、向旁人開口求助，天既不會塌下來，店裡的活計也一樣能順順利利地做完。\n\n週五傍晚，真崎夜一來了一趟晚鐘亭。\n\n他這回沒穿白塔特務的制服外套，也沒攜帶任何公文，只單手拎著一只長條木盒。\n\n舊主架被總站工程隊移入岸邊的安全船塢後，技師們才小心拆下了留在上面的舊分離匣。因匣內三片隔板已與死迴路徹底咬死，必須作為事故證物永久封存，總站便將軒人遺留在現場的幾件普通工具清點送還。\n\n軒人的開口扳手找回了一把，扁頭拆件短刀則已由他自己磨平了崩口，雖比原來短了一小截，拿來削木屑或拆小鎖仍舊順手。\n\n夜一站於櫃檯前，靜候軒人簽完器材交接單。他左手的黑色皮手套並未戴上，腕部肌膚底下那道原本躁動不安的漆黑紋路如今安安靜靜地沉伏著，五指活動自如。\n\n「總站那邊已將先前的封站安全檔案全數覆核了一遍。」夜一點了點交接單最底端新印出的一欄，「自這個月起，所有外勤單底下都增列了一欄『現場實測差異』。今後不會再有人光憑一張數十年前寫著『封鎖完成』的舊紙，便派人下去送死了。」\n\nEraser垂眼看著新表格上的那一欄，輕輕點頭：「這樣很有用。」\n\n夜一收妥簽好字的單據，從懷裡取出一封未蓋公章的普通牛皮紙信封，輕放在櫃檯邊角：\n\n「另外，還有一件不必今天答覆的民間委託。」\n\n軒人低頭望去，信封角落以工整墨水寫著『霜鐘鎮・古工坊地窖』幾個字。\n\n「上個月，往北十五公里外的鄰鎮『霜鐘鎮』在清理一處廢棄的舊工坊地窖時，掘出了一批沒有落款的校準銅板，還有幾件正散發微弱共鳴的古式器具。」夜一語調平靜，「霜鐘鎮鎮長並不知曉這批器物的來歷，只照外環規定向總站報備，順便遞來一封民間修繕詢價的委託信，想找熟稔舊時代管線的工匠下個月過去看看。」\n\n說到此處，夜一停頓半拍，灰色的眼眸落在信封上：\n\n「我調閱總站舊檔，比對了附帶的銅板拓片。上面那手字跡，跟九年前失蹤的前第三分塔首席技師、賀蘭一模一樣。檔案裡記載，那名技師當年正是帶著一枚古工坊的花瓣片失去了蹤影。」\n\n話音甫落，櫃檯後方驟然靜了一瞬。\n\n軒人的呼吸猛地一窒，近乎本能地側首看向身旁的Eraser；而Eraser搭在桌沿的指尖亦停住了，淡粉色的眼眸微微睜大，與軒人飛快交換了一個唯獨兩人明白的眼神。\n\n賀蘭。古工坊的花瓣片。\n\n沉沒舊工坊裡那封只留給他們的九年前絕筆，兩人從未對任何外人透露過半字。夜一顯然對其中隱情毫不知情，見兩人神色微動也未多加探問，只是語氣如常地補充：\n\n「那裡沒有失控的支爐，也不需要拆誰的街，只是單純的民間修繕詢價。我查對完舊檔，覺得你們晚鐘亭比總站那些只懂照章封存的文書更合適檢視這批東西，便順道把信帶過來了。去或不去，等你們手腳的傷全養妥了再回信即可。」\n\n軒人壓下心頭翻湧的思緒，沒有急著伸手拆信，而是看了一眼Eraser，點頭道：\n\n「先放著吧。等我們今天下班看完信裡的細節，再商量接不接。」\n\n夜一彷彿早已料到他會如此作答，將信封往櫃檯內側輕推了些許：\n\n「我只是順路帶話，不是來催工的。」\n\n說完，他轉身步向店門。\n\n就在夜一抬起右手搭上黃銅門把的那一瞬間，他的視線不經意地回頭掠過了櫃檯上的牛皮紙信封——目光恰好落在了『霜鐘鎮・古工坊地窖』那行墨字之上。\n\n那一刻，站在櫃檯後的軒人看得清清楚楚。\n\n垂在夜一身側那隻沒戴手套的左手，腕部蒼白皮膚下那道原已沉寂多時的漆黑紋路，竟在那一瞬微不可察地起伏了一下，宛如某種蟄伏於暗處的東西，聽見了來自遙遠北方的低鳴。\n\n夜一沒有低頭去看自己的手腕，更未留下半句解釋。\n\n他只是略微收住腳步，在半開的門框邊側過半張臉，淡淡落下一句：\n\n「那批古器具，我也有點想確認的東西。等你們養好傷、決定要過去的時候，提前兩天通知我。」\n\n話音落下，他拉開店門，邁步融入了暮色漸沉的街市人流之中。\n\n木門輕輕闔上，門楣的黃銅小鈴晃過兩記便恢復安靜。軒人望著空蕩的門口怔了一秒，這才收回視線，看著Eraser將那封來自霜鐘鎮的詢價信收進『待回覆』的木夾裡。\n\n她沒有立刻去核對帳目，而是轉過身面對軒人：\n\n「後天早上，你有事嗎？」\n\n「後天是禮拜天，店裡沒排外勤。」\n\n「我是問你這個人有沒有事，不是問外勤表。」\n\n軒人想了想，搖頭：「沒有事。」\n\nEraser伸出左手，輕點了點桌角那本《白央散步指南》：\n\n「我的左手已經能拿東西了，你的膝蓋昨天千歲師傅也說可以爬坡了。後天早上，我想去山坡上的那座鐘塔。你要一起去嗎？」\n\n她問得一如往常般認真，神情卻與商討工作委託時不太一樣。軒人說不清那絲微妙的區別落在何處，只知道自己連半秒也沒動過去翻別份清單的念頭。\n\n「要。」他點頭，「一起去。」\n\n## ４\n\n到了約定的禮拜天早晨，軒人在一樓店門口沒等上多久，Eraser便背著那只補好袋角的小布袋走下了木梯。\n\n她在灰鐵巷買的那件素色微立領外套洗得乾乾淨淨，領口那枚銀色五瓣花扣在晨光裡泛著溫潤微光，右下角的缺口與背面淺銀色的新接環都坦然留在原處，沒有再像先前那樣藏進衣領內側。一頭淡粉紅色的長髮用染布坊老闆娘送的深藍髮帶束在腦後，唯獨右耳旁還滑落了一小綹碎髮沒能收妥。\n\n路過走廊的小鏡子時，她停下腳步，試著用左手將那綹碎髮攏回髮帶裡，試了兩回卻都輕輕滑了出來。\n\n軒人站在旁邊靜靜等著。\n\nEraser從鏡面裡看見他：「幫我按一下右邊這一束。」\n\n軒人走上前，伸出左手替她輕輕扶住髮結的位置。這回不必由他代
